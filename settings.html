  <script>
    // 初始化
    document.addEventListener('DOMContentLoaded', function () {
      App.initTheme();
      initToggles();
      initPerfMode();
      // demo 模式：退出登录改为重置演示数据
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        var item = document.querySelector('.settings-item[onclick="showLogoutConfirm()"] .settings-item-title');
        if (item) item.textContent = '重置演示数据';
      }
      // 灰度「一键体验」会话：显示退出产品体验入口
      try {
        if (localStorage.getItem('campus_trial') === '1') {
          var g = document.getElementById('trialExitGroup');
          if (g) g.style.display = '';
        }
      } catch (e) {}
    });

    // ---- 退出灰度产品体验 ----
    function exitTrial() {
      App.showModal({
        title: '退出产品体验',
        desc: '将结束本次 2 小时体验会话并返回灰度入口。产品内的演示操作记录会保留在本机，下次体验仍可见。',
        icon: 'warning',
        confirmText: '退出体验',
        cancelText: '再逛会儿',
        onConfirm: function () {
          // 通知后端清除 exp_session Cookie（失败也继续本地清理）
          var done = function () {
            try {
              localStorage.removeItem('campus_trial');
              localStorage.removeItem('campus_mode_override');
              localStorage.removeItem('campus_jwt_token');
              localStorage.removeItem('gray_feedback_token');
            } catch (e) {}
            location.href = '/gray/';
          };
          if (typeof ApiClient !== 'undefined' && ApiClient.trialLogout) {
            ApiClient.trialLogout().then(done).catch(done);
          } else {
            done();
          }
        }
      });
    }

    // ---- 性能模式初始化 ----
    function initPerfMode() {
      var mode = Storage.getSettings().perfMode || 'auto';
      highlightPerfOption(mode);
      updatePerfTierDesc(mode);
    }

    // ---- 通知开关 ----
    function initToggles() {
      var settings = Storage.getSettings();
      setToggleState('togglePickup', settings.notifyPickup !== false);
      setToggleState('toggleMessage', settings.notifyMessage !== false);
      setToggleState('toggleSound', settings.notifySound !== false);
      highlightThemeOption(settings.theme || 'auto');
    }

    function setToggleState(id, on) {
      var el = document.getElementById(id);
      if (el) {
        if (on) el.classList.add('active');
        else el.classList.remove('active');
      }
    }

    function toggleNotify(type) {
      var settings = Storage.getSettings();
      var key = 'notify' + type.charAt(0).toUpperCase() + type.slice(1);
      settings[key] = !settings[key];
      Storage.saveSettings(settings);
      setToggleState('toggle' + type.charAt(0).toUpperCase() + type.slice(1), settings[key]);

      // 如果打开了通知，请求浏览器通知权限
      if (settings[key] && (type === 'pickup' || type === 'message')) {
        App.requestNotificationPermission();
      }
    }

    // ---- 主题切换 ----
    function setTheme(theme) {
      App.setTheme(theme);
      highlightThemeOption(theme);
    }

    function highlightThemeOption(theme) {
      document.querySelectorAll('.theme-option').forEach(function (el) {
        if (el.dataset.theme === theme) el.classList.add('active');
        else el.classList.remove('active');
      });
    }

    // ---- 性能模式（自动 / 省电 / 高性能）----
    var PERF_MODE_DESC = {
      auto:  '根据设备能力自动调整 3D 地图画质、动画与扫码频率',
      saver: '降低地图画质、动画与摄像头分析频率，优先续航',
      perf:  '更高 3D 画质与动画效果（不超过浏览器/系统限制）',
    };
    var PERF_TIER_NAME = { high: '高性能档', medium: '均衡档', low: '省电档' };

    function setPerfMode(mode) {
      var settings = Storage.getSettings();
      settings.perfMode = mode;
      Storage.saveSettings(settings);
      highlightPerfOption(mode);
      updatePerfTierDesc(mode);
      // 通知 perf.js 立即切换档位（3D 地图等页面下次读取即生效）
      if (typeof Perf !== 'undefined' && Perf.setMode) Perf.setMode(mode);
      App.toast(mode === 'auto' ? '已恢复自动性能模式' : (mode === 'saver' ? '已切换省电模式' : '已切换高性能模式'));
    }

    function highlightPerfOption(mode) {
      document.querySelectorAll('.theme-option[data-perf]').forEach(function (el) {
        if (el.dataset.perf === mode) el.classList.add('active');
        else el.classList.remove('active');
      });
    }

    function updatePerfTierDesc(mode) {
      var desc = document.getElementById('perfTierDesc');
      if (!desc) return;
      var text = PERF_MODE_DESC[mode] || PERF_MODE_DESC.auto;
      if (typeof Perf !== 'undefined' && Perf.caps) {
        text += '。设备评估：' + (PERF_TIER_NAME[Perf.autoLevel] || Perf.autoLevel) +
          '（' + Perf.caps.cpuCores + ' 核 CPU' +
          (Perf.caps.webgl2 ? ' · WebGL2' : (Perf.caps.webgl ? ' · WebGL' : '')) +
          (Perf.caps.webgpu ? ' · WebGPU 可用' : '') + '）';
      }
      desc.textContent = text;
    }

    // ---- 退出登录 ----
    function showChangePasswordTip() {
      App.showModal({
        title: '修改密码',
        desc: '<div style="text-align:left;line-height:1.8;font-size:14px;">' +
          '当前登录方式为<b>手机号 + 短信验证码</b>，无需设置密码。<br><br>' +
          '每次登录时通过短信验证码验证身份，更加安全便捷。' +
          '</div>',
        confirmText: '知道了'
      });
    }

    function showLogoutConfirm() {
      // demo 模式：退出登录改为“重置演示数据”
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        App.showModal({
          title: '重置演示数据',
          desc: '将清空您在本浏览器中的演示操作记录（取件、订单等），恢复初始演示数据。不会影响其他访问者。',
          icon: 'warning',
          confirmText: '确认重置',
          cancelText: '取消',
          onConfirm: function () {
            var settings = Storage.getSettings();
            Storage.resetAll();
            Storage.saveSettings(settings);
            location.href = 'index.html';
          }
        });
        return;
      }
      App.showModal({
        title: '退出登录',
        desc: '确定要退出登录吗？退出后需要重新验证身份。',
        icon: 'warning',
        confirmText: '确认退出',
        cancelText: '取消',
        onConfirm: function () {
          if (typeof ApiClient !== 'undefined' && ApiClient.getToken()) {
            ApiClient.logout();
          }
          // 清除用户数据和快递数据，但保留设置（主题/通知）
          var settings = Storage.getSettings();
          Storage.resetAll();
          Storage.saveSettings(settings);
          location.href = 'login.html';
        }
      });
    }

    // ---- 关于 / 协议 ----
    function showAbout() {
      App.showModal({
        title: '关于校园取件',
        desc: '<div style="text-align:center;line-height:2;">' +
          '<div style="font-size:18px;font-weight:700;">校园取件 v1.0.0</div>' +
          '<div style="font-size:13px;color:var(--color-text-sub);">便捷的校园快递管理助手</div>' +
          '<div style="font-size:12px;color:var(--color-text-hint);margin-top:8px;">' +
            '版本：1.0.0<br>构建日期：2026.09</div>' +
          '</div>',
        confirmText: '知道了'
      });
    }

    function showAgreement() {
      App.showModal({
        title: '用户协议',
        desc: '<div style="text-align:left;font-size:13px;line-height:1.8;max-height:50vh;overflow-y:auto;">' +
          '<b>一、服务说明</b><br>' +
          '校园取件是一款校园快递管理工具，为在校学生提供快递查询、取件提醒、地图导航等服务。<br><br>' +
          '<b>二、用户责任</b><br>' +
          '用户应妥善保管自己的账号信息，不得将账号转借他人使用。因账号泄露造成的损失由用户自行承担。<br><br>' +
          '<b>三、数据使用</b><br>' +
          '本应用仅收集必要的快递信息用于提供服务，不会向第三方泄露用户隐私数据。<br><br>' +
          '<b>四、免责声明</b><br>' +
          '快递信息来源于第三方平台，仅供参考。如信息有误，请以快递公司官方数据为准。<br><br>' +
          '<b>五、协议更新</b><br>' +
          '本协议可能会不定期更新，更新后将在应用内公示。继续使用即表示同意更新后的协议。' +
          '</div>',
        confirmText: '我知道了',
        confirmStyle: 'btn-primary'

    }

    function showPrivacy() {
      App.showModal({
        title: '隐私政策',
        desc: '<div style="text-align:left;font-size:13px;line-height:1.8;max-height:50vh;overflow-y:auto;">' +
          '<b>我们收集的信息</b><br>' +
          '· 手机号：用于登录验证和快递查询<br>' +
          '· 位置信息：用于地图导航和附近取件点推荐（可选）<br>' +
          '· 相机权限：用于扫码取件（可选）<br><br>' +
          '<b>信息存储与安全</b><br>' +
          '您的数据存储在本地设备和加密的服务器中，我们采取严格的安全措施保护您的隐私。<br><br>' +
          '<b>信息共享</b><br>' +
          '未经您的同意，我们不会将您的个人信息分享给任何第三方。法律强制要求的情况除外。<br><br>' +
          '<b>您的权利</b><br>' +
          '您可以随时查看、修改或删除您的个人数据，也可以注销账号。' +
          '</div>',
        confirmText: '我知道了',
        confirmStyle: 'btn-primary'
      });
    }

    function showOpensource() {
      App.showModal({
        title: '开源许可',
        desc: '<div style="text-align:left;font-size:13px;line-height:1.8;max-height:50vh;overflow-y:auto;">' +
          '本应用使用了以下开源软件：<br><br>' +
          '<b>Express</b> — MIT License<br>' +
          '基于 Node.js 的 Web 应用框架<br><br>' +
          '<b>jsonwebtoken</b> — MIT License<br>' +
          'JSON Web Token 实现<br><br>' +
          '<b>jsQR</b> — Apache License 2.0<br>' +
          'JavaScript 二维码识别库<br><br>' +
          '<b>Tailscale</b> — BSD License<br>' +
          '虚拟局域网工具<br><br>' +
          '感谢所有开源贡献者。' +
          '</div>',
        confirmText: '知道了'
      });
    }
  </script>
</body>
