<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>扫码取件 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== Scan Page Styles ===== */
    .scan-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 8px;
    }
    .scan-tool-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text);
      transition: background 0.2s, color 0.2s, transform 0.15s;
      border: none;
    }
    .scan-tool-btn:active { background: rgba(30, 41, 59, 0.18); transform: scale(0.92); }
    .scan-tool-btn svg { width: 22px; height: 22px; }
    .scan-tool-btn.active { color: #F59E0B; background: var(--color-warning-light); }

    .scan-area {
      background: #1E293B;
      border-radius: 16px;
      min-height: 50vh;
      margin: 0 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scan-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(37,99,235,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .scan-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #1E293B;
    }

    .scan-tip {
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      text-align: center;
      margin-bottom: 24px;
      padding: 0 24px;
      line-height: 1.5;
      position: relative;
      z-index: 2;
    }

    .scan-frame {
      width: 240px;
      height: 240px;
      position: relative;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s;
    }

    /* OCR 识别成功：绿色识别框 */
    .scan-frame--success .scan-corner { border-color: #10B981; box-shadow: 0 0 10px rgba(16,185,129,0.8); }
    .scan-frame--success { transform: scale(1.05); }
    .scan-frame--success .scan-line { background: #fff; box-shadow: 0 0 12px #10B981; }

    .scan-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid #fff;
    }
    .scan-corner--tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .scan-corner--tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .scan-corner--bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .scan-corner--br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    .scan-line {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 2px;
      background: #10B981;
      box-shadow: 0 0 8px #10B981, 0 0 16px rgba(16, 185, 129, 0.5);
      animation: scanLine 2.5s ease-in-out infinite;
      top: 4px;
      border-radius: 2px;
      will-change: transform;   /* GPU 合成层：动画不触发 Layout/Paint */
    }
    @keyframes scanLine {
      0% { transform: translateY(0); }
      50% { transform: translateY(230px); }
      100% { transform: translateY(0); }
    }

    .scan-engine-hint {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 2;
    }

    .scan-bottom {
      padding: 24px 16px 16px;
      text-align: center;
    }
    .manual-link {
      color: var(--color-primary);
      font-size: 14px;
      text-decoration: underline;
      padding: 10px 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .manual-link:active { opacity: 0.6; }
    .manual-link svg { width: 16px; height: 16px; }

    /* Permission Denied View */
    .permission-denied {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px 24px;
      text-align: center;
    }
    .permission-denied-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--color-danger-light);
      color: var(--color-danger);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .permission-denied-icon svg { width: 40px; height: 40px; }
    .permission-denied-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 8px;
    }
    .permission-denied-desc {
      font-size: 14px;
      color: var(--color-text-sub);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .permission-denied-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Success Overlay */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #10B981, #059669);
      z-index: 500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .success-overlay.show {
      display: flex;
      animation: fadeIn 0.3s;
    }
    .success-overlay-icon {
      width: 80px;
      height: 80px;
      color: #fff;
      margin-bottom: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.5s 0.15s both;
    }
    .success-overlay-icon svg { width: 44px; height: 44px; }
    .success-overlay-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
      animation: fadeInUp 0.4s 0.3s both;
    }
    .success-overlay-info {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 32px;
      width: 100%;
      max-width: 300px;
      animation: fadeInUp 0.4s 0.45s both;
    }
    .success-overlay-info-row {
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 14px;
      padding: 5px 0;
    }
    .success-overlay-info-label { opacity: 0.8; }
    .success-overlay-info-value { font-weight: 600; }
    .success-overlay-btn {
      background: #fff;
      color: #059669;
      padding: 14px 48px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      animation: fadeInUp 0.4s 0.6s both;
    }
    .success-overlay-btn:active { transform: scale(0.96); }

    /* Manual Input */
    .manual-input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      font-size: 16px;
      font-family: var(--font-mono);
      text-align: center;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--color-surface-alt);
      color: var(--color-text);
      box-sizing: border-box;
    }
    .manual-input-field:focus { border-color: var(--color-primary); background: var(--color-surface); }
    .manual-input-field::placeholder { color: var(--color-text-hint); font-family: var(--font-body); letter-spacing: 0; font-size: 14px; }
    .manual-input-hint {
      font-size: 12px;
      color: var(--color-text-hint);
      text-align: center;
      margin-top: 10px;
    }

    /* ===== 模式切换按钮（沉浸式平滑过渡） ===== */
    .mode-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.2);
      color: var(--color-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-tap-highlight-color: transparent;
    }
    .mode-switch:active { transform: scale(0.94); }
    .mode-switch svg { width: 14px; height: 14px; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
    /* 导入模式高亮 */
    .mode-switch.mode-import {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
      color: #B45309;
    }
    .mode-switch.mode-import svg { transform: rotate(180deg); }

    /* 模式提示横幅 */
    .mode-banner {
      margin: 0 16px 8px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      background: rgba(37, 99, 235, 0.06);
      color: var(--color-primary);
      border: 1px dashed rgba(37, 99, 235, 0.25);
      transition: background 0.35s, color 0.35s, border-color 0.35s;
    }
    .mode-banner.mode-import {
      background: rgba(245, 158, 11, 0.08);
      color: #B45309;
      border-color: rgba(245, 158, 11, 0.35);
    }

    /* ===== 底部抽屉（导入确认） ===== */
    .import-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--color-surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.18);
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      z-index: 450;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0.16, 1);
      max-height: 86vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .import-sheet.show { transform: translateY(0); }
    .import-sheet-grabber {
      width: 36px; height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    .import-sheet-title {
      font-size: 16px; font-weight: 700;
      color: var(--color-text);
      text-align: center;
      margin-bottom: 4px;
    }
    .import-sheet-sub {
      font-size: 12px; color: var(--color-text-sub);
      text-align: center; margin-bottom: 18px;
    }
    .import-field-label {
      font-size: 12px; color: var(--color-text-sub);
      margin: 12px 0 8px;
    }
    .import-code-display {
      background: var(--color-surface-alt);
      border: 1.5px dashed var(--color-primary);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 2px;
    }
    .chip-row {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--color-surface-alt);
      color: var(--color-text-sub);
      font-size: 13px;
      border: 1px solid var(--color-border-light);
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:active { transform: scale(0.94); }
    .chip.selected {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
    .import-submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      margin-top: 22px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      -webkit-tap-highlight-color: transparent;
    }
    .import-submit-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }
    .import-sheet-close {
      position: absolute;
      top: 14px; right: 16px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--color-surface-alt);
      color: var(--color-text-sub);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.2s;
    }
    .import-sheet-close:active { transform: scale(0.9); background: var(--color-border-light); }
    .import-sheet-close svg { width: 14px; height: 14px; }

    /* 抽屉遮罩 */
    .import-mask {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 440;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .import-mask.show { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body data-page="scan">
  <div class="app-shell">
    <header class="app-header">
      <div class="header-left"></div>
      <div class="header-title">扫码取件</div>
      <div class="header-right"></div>
    </header>
    <main class="app-content">
      <!-- Scan View：真实摄像头扫码 -->
      <div id="scanView" class="hidden">
        <div class="scan-toolbar anim-fade-in-up stagger-1">
          <button class="scan-tool-btn" id="flashBtn" onclick="toggleFlash()" aria-label="闪光灯">
            <svg id="flashIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </button>
          <!-- 模式切换按钮：取件模式 ↔ 导入本地模式（平滑过渡） -->
          <button class="mode-switch" id="modeSwitch" onclick="toggleScanMode()" aria-label="切换扫码模式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span id="modeLabel">取件模式</span>
          </button>
          <button class="scan-tool-btn" onclick="openAlbum()" aria-label="相册识别">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>

        <!-- 模式提示横幅 -->
        <div class="mode-banner anim-fade-in-up" id="modeBanner">
          <span id="modeBannerText">当前为「取件模式」：扫描已到站快递的取件码完成取件</span>
        </div>

        <div class="scan-area anim-fade-in-up stagger-2">
          <video id="scanVideo" class="scan-video" autoplay muted playsinline></video>
          <div class="scan-tip" id="scanTip">正在启动摄像头…</div>
          <div class="scan-frame" id="scanFrame">
            <div class="scan-corner scan-corner--tl"></div>
            <div class="scan-corner scan-corner--tr"></div>
            <div class="scan-corner scan-corner--bl"></div>
            <div class="scan-corner scan-corner--br"></div>
            <div class="scan-line"></div>
          </div>
          <div class="scan-engine-hint" id="engineHint"></div>
        </div>

        <div class="scan-bottom anim-fade-in-up stagger-3">
          <a href="javascript:void(0)" class="manual-link" onclick="showManualInput()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20v14H2z"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
            手动输入取件码
          </a>
        </div>
      </div>

      <!-- Permission Denied View -->
      <div id="deniedView" class="hidden">
        <div class="permission-denied anim-fade-in-up">
          <div class="permission-denied-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4.5a2.5 2.5 0 0 1 5 0v3"/><path d="M18 8H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2z"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </div>
          <div class="permission-denied-title">需要相机权限才能扫码取件</div>
          <div class="permission-denied-desc" id="deniedDesc">请在浏览器权限弹窗中允许访问相机，<br>或在系统设置中开启相机权限</div>
          <div class="permission-denied-actions">
            <button class="btn btn-primary btn-lg" onclick="retryCamera()">重新尝试</button>
            <button class="btn btn-outline" onclick="goToSettings()">如何开启权限</button>
            <a href="javascript:void(0)" class="manual-link" onclick="showManualInput()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20v14H2z"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
              手动输入取件码
            </a>
          </div>
        </div>
      </div>
    </main>
    <!-- 固定 tab bar —— 以下代码完全不可修改 -->
    <nav class="tab-bar">
      <a href="index.html" class="tab-item" data-nav="home">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1m-6 0h6"/></svg>
        <span class="tab-label">首页</span>
      </a>
      <a href="packages.html" class="tab-item" data-nav="packages">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span class="tab-label">快递</span>
      </a>
      <a href="scan.html" class="tab-item tab-item--center" data-nav="scan">
        <div class="tab-scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </div>
        <span class="tab-label">扫码</span>
      </a>
      <a href="food.html" class="tab-item" data-nav="food">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        <span class="tab-label">外卖</span>
      </a>
      <a href="profile.html" class="tab-item" data-nav="profile">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>

  <!-- Success Overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-overlay-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-overlay-title" id="successOverlayTitle">取件成功</div>
    <div class="success-overlay-info" id="successOverlayInfo">
      <div class="success-overlay-info-row"><span class="success-overlay-info-label">快递公司</span><span class="success-overlay-info-value" id="successCompany"></span></div>
      <div class="success-overlay-info-row"><span class="success-overlay-info-label">运单号</span><span class="success-overlay-info-value" id="successTracking"></span></div>
      <div class="success-overlay-info-row"><span class="success-overlay-info-label">取件码</span><span class="success-overlay-info-value" id="successCode"></span></div>
      <div class="success-overlay-info-row"><span class="success-overlay-info-label">取件点</span><span class="success-overlay-info-value" id="successPoint"></span></div>
    </div>

  <!-- 隐藏元素：jsQR 解码画布 / 相册选择 -->
  <canvas id="scanCanvas" style="display:none;"></canvas>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="perf.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script src="libs/qr-scanner/jsQR.js"></script>
  <script src="libs/tesseract/tesseract.min.js"></script>
  <script>
    // ================= 真实本地摄像头扫码 + OCR 取件码识别 =================
    // 权限：navigator.mediaDevices.getUserMedia（需要 localhost / https 环境）
    // 二维码：优先浏览器原生 BarcodeDetector，回退本地 libs/qr-scanner/jsQR.js
    // OCR：本地 libs/tesseract/（Tesseract.js），仅识别扫描框内数字，不上传任何图片

    // 灰度模式：已通过真实手机号登录的非 demo 用户 → 扫码结果走后端校验
    // 普通用户（demo / local）→ 仅本地匹配，不调后端
    function isGrayScan() {
      try {
        if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) return false;
        if (typeof ApiClient === 'undefined') return false;
        return ApiClient.isLoggedIn();
      } catch (e) { return false; }
    }

    // 灰度用户：调用后端 scanVerify 校验候选取件码归属
    // 返回 { ok, allowPickup, packageId, message }
    async function grayVerifyPickupCode(code, packageId) {
      try {
        var r = await ApiClient.scanVerify(code, packageId);
        if (r.code === 0 && r.data) {
          return { ok: true, allowPickup: r.data.allowPickup, packageId: r.data.packageId, message: r.data.message || '' };
        }
        return { ok: false, allowPickup: false, message: r.message || '该取件码不属于当前用户，请重新扫描' };
      } catch (e) {
        return { ok: false, allowPickup: false, message: '校验失败，请稍后重试' };
      }
    }

    // 灰度用户：调用后端 scanConfirm 确认取件
    async function grayConfirmPickup(packageId) {
      try {
        var r = await ApiClient.scanConfirm(packageId);
        return { ok: r.code === 0, message: r.message, status: r.data ? r.data.status : '' };
      } catch (e) {
        return { ok: false, message: '取件失败，请稍后重试' };
      }
    }

    var SCAN = {
      stream: null,
      video: null,
      canvas: null,
      ctx: null,
      detector: null,          // BarcodeDetector 实例
      useNativeDetector: false,
      scanning: false,         // 识别循环是否运行
      busy: false,             // 单帧解码进行中
      lastScanAt: 0,
      torchOn: false,
      scanInterval: 250,       // 二维码分析间隔（ms，按性能档位调整）
      ocrInterval: 3200,       // OCR 分析间隔（ms，按性能档位调整）
      ocrWorker: null,         // Tesseract 本地 worker（懒加载，独立线程运行）
      ocrReady: false,
      ocrLoading: false,
      ocrBusy: false,
      lastOcrAt: 0,
      lastOcrText: '',
      ocrPipe: undefined,      // ocr-worker.js：预处理 Worker（二值化/放大不占主线程）
      ocrPend: {},             // 待响应的预处理请求
      ocrSeq: 0,
      // 新增：扫码模式 —— 'pickup' 取件模式（原流程）| 'import' 导入本地模式（新功能）
      mode: 'pickup',
      // 导入抽屉的选择状态
      importSelectedCompany: null,
      importSelectedPoint: null,
      importSelectedColor: '#64748B',
      importSelectedShort: '其他',
      importSelectedType: 'station',
      importCode: '',
    };

    document.addEventListener('DOMContentLoaded', function () {
      SCAN.video = document.getElementById('scanVideo');
      SCAN.canvas = document.getElementById('scanCanvas');
      SCAN.ctx = SCAN.canvas.getContext('2d', { willReadFrequently: true });

      // 性能档位：扫码 / OCR 分析频率按设备等级调整（perf.js），避免低配设备发热
      try {
        var tier = Perf.tier();
        SCAN.scanInterval = tier.scanInterval;
        SCAN.ocrInterval = tier.ocrInterval;
      } catch (e) { /* perf.js 不可用时使用默认值 */ }

      // demo 模式：展示可体验的演示取件码，方便外部用户快速上手
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        try {
          var pending = Storage.getPackages().filter(function (p) { return p.status === 'pending' && p.pickupCode; });
          var codes = pending.slice(0, 3).map(function (p) { return p.pickupCode; });
          if (codes.length) {
            var tip = document.createElement('div');
            tip.style.cssText = 'margin-top:10px;font-size:12px;color:var(--color-text-sub);line-height:1.8;';
            tip.innerHTML = '演示提示：点「手动输入取件码」，输入 <b style="color:var(--color-primary);">' +
              codes.join('</b> / <b style="color:var(--color-primary);">') + '</b> 即可体验完整取件流程';
            var bottom = document.querySelector('.scan-bottom');
            if (bottom) bottom.appendChild(tip);
          }
        } catch (e) { /* Storage 不可用时忽略 */ }
      }

      startCamera();
    });

    // ---------- 1. 摄像头 ----------
    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showDeniedView(deniedHintText('当前浏览器不支持摄像头调用'));
        return;
      }
      document.getElementById('scanTip').textContent = '正在启动摄像头…';
      try {
        SCAN.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
      } catch (err) {
        var reason = (err && err.name === 'NotFoundError') ? '未检测到可用摄像头设备' : null;
        showDeniedView(deniedHintText(reason));
        return;
      }
      SCAN.video.srcObject = SCAN.stream;
      try { await SCAN.video.play(); } catch (e) { /* autoplay 由 muted+playsinline 保证 */ }
      showScanView();
      document.getElementById('scanTip').textContent = '将取件码对准扫描框，支持二维码与面单数字';
      initDetector();
      startDetectLoop();
    }

    function retryCamera() {
      stopCamera();
      startCamera();
    }

    function stopCamera() {
      pauseScan();
      if (SCAN.stream) {
        SCAN.stream.getTracks().forEach(function (t) { t.stop(); });
        SCAN.stream = null;
      }
      SCAN.video.srcObject = null;
      SCAN.torchOn = false;
      var btn = document.getElementById('flashBtn');
      if (btn) btn.classList.remove('active');
    }

    // ---------- 2. 二维码识别引擎 ----------
    function initDetector() {
      if ('BarcodeDetector' in window) {
        try {
          SCAN.detector = new BarcodeDetector({ formats: ['qr_code'] });
          SCAN.useNativeDetector = true;
          updateEngineHint();
          return;
        } catch (e) { /* 初始化失败则回退 */ }
      }
      SCAN.useNativeDetector = false;
      updateEngineHint();
    }

    function updateEngineHint() {
      var qrPart = SCAN.useNativeDetector ? 'BarcodeDetector' : (typeof jsQR === 'function' ? '本地 jsQR' : '二维码不可用');
      var el = document.getElementById('engineHint');
      if (typeof Tesseract === 'undefined') {
        // 浏览器不支持本地 OCR：明确提示手动输入
        el.textContent = '当前浏览器暂不支持自动识别，请手动输入取件码';
        el.style.fontSize = '12px';
        el.style.color = 'rgba(255,255,255,0.78)';
        el.style.padding = '0 16px';
        el.style.lineHeight = '1.5';
      } else {
        var ocrPart = '本地 Tesseract OCR';
        el.textContent = '识别引擎：' + qrPart + ' + ' + ocrPart + '（完全离线）';
      }
    }

    function startDetectLoop() {
      SCAN.scanning = true;
      requestAnimationFrame(detectFrame);
    }

    function pauseScan() { SCAN.scanning = false; }

    function resumeScan() {
      if (!SCAN.stream) { retryCamera(); return; }
      startDetectLoop();
    }

    function detectFrame(ts) {
      if (!SCAN.scanning) return;
      // 二维码：按档位节流分析（约 200–350ms 一帧），不逐帧识别
      if (ts - SCAN.lastScanAt >= SCAN.scanInterval && SCAN.video.readyState >= 2 && !SCAN.busy) {
        SCAN.lastScanAt = ts;
        detectOnce().then(function (text) {
          if (text) onDecoded(text, 'qr');   // 识别成功 → onDecoded 内立即 pauseScan 停止分析
        });
      }
      // OCR：按档位节流（3.2s / 5s，低配更省电），仅在没有二维码解码进行中时
      if (ts - SCAN.lastOcrAt >= SCAN.ocrInterval && SCAN.video.readyState >= 2 && !SCAN.busy) {
        SCAN.lastOcrAt = ts;
        runOcrFrame();
      }
      requestAnimationFrame(detectFrame);
    }

    async function detectOnce() {
      if (SCAN.busy) return null;
      SCAN.busy = true;
      try {
        if (SCAN.useNativeDetector && SCAN.detector) {
          // 只截取扫描框区域送检，不处理整张摄像头画面
          var region = cropScanFrame(480);
          if (!region) return null;
          var codes = await SCAN.detector.detect(region);
          if (codes && codes.length > 0 && codes[0].rawValue) return codes[0].rawValue;
          return null;
        }
        return detectWithJsQR();
      } catch (e) {
        return null;
      } finally {
        SCAN.busy = false;
      }
    }

    // 截取扫描框映射到视频源的区域，缩放到 maxSide 内（降低 CPU/GPU 压力）
    function cropScanFrame(maxSide) {
      var v = SCAN.video;
      var vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) return null;
      var r = computeScanRegion(vw, vh);
      if (r.w < 10 || r.h < 10) return null;
      var scale = Math.min(1, maxSide / Math.max(r.w, r.h));
      var c = SCAN.canvas;
      c.width = Math.max(1, Math.round(r.w * scale));
      c.height = Math.max(1, Math.round(r.h * scale));
      SCAN.ctx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
      return c;
    }

    // jsQR：在扫描框截取区域内做本地解码
    function detectWithJsQR() {
      if (typeof jsQR !== 'function') return null;
      var c = cropScanFrame(480);
      if (!c) return null;
      var img = SCAN.ctx.getImageData(0, 0, c.width, c.height);
      var result = jsQR(img.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      return result && result.data ? result.data : null;
    }

    // 屏幕上的扫描框（object-fit: cover 显示）→ 视频源像素坐标
    function computeScanRegion(vw, vh) {
      var v = SCAN.video;
      var vr = v.getBoundingClientRect();
      var fr = document.getElementById('scanFrame').getBoundingClientRect();
      var scale = Math.max(vr.width / vw, vr.height / vh);
      var dispW = vw * scale, dispH = vh * scale;
      var offX = (dispW - vr.width) / 2, offY = (dispH - vr.height) / 2;
      var pad = fr.width * 0.5;
      var sx = (fr.left - vr.left - pad + offX) / scale;
      var sy = (fr.top - vr.top - pad + offY) / scale;
      var sw = (fr.width + pad * 2) / scale;
      var sh = (fr.height + pad * 2) / scale;
      sx = Math.max(0, Math.min(vw - 2, sx));
      sy = Math.max(0, Math.min(vh - 2, sy));
      return { x: sx, y: sy, w: Math.min(sw, vw - sx), h: Math.min(sh, vh - sy) };
    }

    // ---------- 2.5 本地 OCR 引擎（Tesseract.js，文件全部在 libs/tesseract/） ----------
    // 仅识别扫描框区域，限制字符集为数字/字母/短横线，降低误识别与耗时
    async function ensureOcrWorker() {
      if (SCAN.ocrReady) return true;
      if (typeof Tesseract === 'undefined') return false;
      if (SCAN.ocrLoading) return false;
      SCAN.ocrLoading = true;
      document.getElementById('scanTip').textContent = '正在启动本地 OCR 引擎…';
      try {
        var worker = Tesseract.createWorker({
          workerPath: 'libs/tesseract/worker.min.js',
          corePath: 'libs/tesseract/core',
          langPath: 'libs/tesseract/lang',
          logger: function () {},
        });
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        // 限定识别范围：数字、大写字母、短横线、冒号（取件码字符集）
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-: ',
          tessedit_pageseg_mode: '6',
        });
        SCAN.ocrWorker = worker;
        SCAN.ocrReady = true;
        document.getElementById('scanTip').textContent = '将取件码对准扫描框，支持二维码与面单数字';
        return true;
      } catch (e) {
        SCAN.ocrLoading = false;
        document.getElementById('scanTip').textContent = '当前浏览器暂不支持自动识别，请手动输入取件码';
        return false;
      }
    }

    // 抓取扫描框区域（仅 drawImage，重活交给 Worker / 识别交给 Tesseract 独立线程）
    function captureOcrCanvas() {
      var v = SCAN.video;
      var vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) return null;
      var r = computeScanRegion(vw, vh);
      if (r.w < 40 || r.h < 40) return null;
      var c = document.createElement('canvas');
      c.width = r.w;
      c.height = r.h;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
      return c;
    }

    // ---------- 2.6 OCR 预处理 Worker（ocr-worker.js） ----------
    // 流水线：Camera → 截取扫描区域 → ImageBitmap → Worker（灰度+二值化+放大）→ 回传
    //         → Tesseract（内部独立线程）OCR → 提取取件码
    // 主线程只做小图 drawImage，识别与预处理均不阻塞动画/点击。
    // 降级：不支持 Worker / OffscreenCanvas / ImageBitmap 时回退主线程同步预处理。
    function ensureOcrPipe() {
      if (SCAN.ocrPipe === undefined) {
        try { SCAN.ocrPipe = new Worker('ocr-worker.js'); } catch (e) { SCAN.ocrPipe = null; }
        if (SCAN.ocrPipe) {
          SCAN.ocrPend = {};
          SCAN.ocrPipe.onmessage = function (ev) {
            var m = ev.data || {};
            var cb = SCAN.ocrPend[m.id];
            if (!cb) return;
            delete SCAN.ocrPend[m.id];
            clearTimeout(cb.timer);
            cb.resolve(m.type === 'binarized' ? m.bitmap : null);
          };
          SCAN.ocrPipe.onerror = function () {
            // Worker 异常：终止并永久回退同步路径
            try { SCAN.ocrPipe.terminate(); } catch (e) {}
            SCAN.ocrPipe = null;
            Object.keys(SCAN.ocrPend).forEach(function (k) {
              clearTimeout(SCAN.ocrPend[k].timer);
              SCAN.ocrPend[k].resolve(null);
            });
            SCAN.ocrPend = {};
          };
        }
      }
      return SCAN.ocrPipe;
    }

    function preprocessViaWorker(source, scale, threshold) {
      return new Promise(function (resolve) {
        var w = ensureOcrPipe();
        if (!w || typeof createImageBitmap !== 'function' || typeof OffscreenCanvas === 'undefined') { resolve(null); return; }
        var id = ++SCAN.ocrSeq;
        var timer = setTimeout(function () {  // 3s 超时 → 回退同步
          if (SCAN.ocrPend[id]) { SCAN.ocrPend[id].resolve(null); delete SCAN.ocrPend[id]; }
        }, 3000);
        SCAN.ocrPend[id] = { resolve: resolve, timer: timer };
        createImageBitmap(source).then(function (bmp) {
          if (!SCAN.ocrPipe) { if (bmp.close) bmp.close(); resolve(null); return; }
          w.postMessage({ type: 'binarize', id: id, bitmap: bmp, scale: scale, threshold: threshold }, [bmp]);
        }).catch(function () {
          if (SCAN.ocrPend[id]) { clearTimeout(SCAN.ocrPend[id].timer); SCAN.ocrPend[id].resolve(null); delete SCAN.ocrPend[id]; }
        });
      });
    }

    // Worker 回传的 ImageBitmap → canvas（Tesseract 识别输入）
    function bitmapToCanvas(bitmap) {
      if (!bitmap) return null;
      var c = document.createElement('canvas');
      c.width = bitmap.width; c.height = bitmap.height;
      c.getContext('2d').drawImage(bitmap, 0, 0);
      if (bitmap.close) bitmap.close();
      return c;
    }

    // 同步回退：放大 + 灰度 + 二值化（主线程，仅在 Worker 不可用时）
    function binarizeCanvasSync(src, scale, threshold) {
      var ow = Math.max(1, Math.round(src.width * scale));
      var oh = Math.max(1, Math.round(src.height * scale));
      var c = document.createElement('canvas');
      c.width = ow; c.height = oh;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(src, 0, 0, ow, oh);
      var img = ctx.getImageData(0, 0, ow, oh);
      var d = img.data;
      for (var i = 0; i < d.length; i += 4) {
        var g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        g = g < threshold ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = g;
      }
      ctx.putImageData(img, 0, 0);
      return c;
    }

    // 统一预处理入口：Worker 优先，失败回退同步
    async function preprocessForOcr(source, scale, threshold) {
      var bmp = await preprocessViaWorker(source, scale, threshold);
      var c = bitmapToCanvas(bmp);
      return c || binarizeCanvasSync(source, scale, threshold);
    }

    async function runOcrFrame() {
      if (SCAN.ocrBusy || !SCAN.scanning) return;
      SCAN.ocrBusy = true;
      try {
        var ok = await ensureOcrWorker();
        if (!ok || !SCAN.scanning) return;
        var c = captureOcrCanvas();
        if (!c) return;
        var processed = await preprocessForOcr(c, 2, 128);   // 放大 2 倍 + 二值化增强
        var result = await SCAN.ocrWorker.recognize(processed);
        var text = result && result.data && result.data.text ? result.data.text : '';
        if (text && text.replace(/\s/g, '').length >= 3) {
          onOcrText(text);
        }
      } catch (e) { /* 单帧失败忽略 */ } finally {
        SCAN.ocrBusy = false;
      }
    }

    // OCR 文本 → 提取取件码 → 匹配本地快递库
    async function onOcrText(text) {
      if (SCAN.lastOcrText === text) return; // 同文本去重
      SCAN.lastOcrText = text;
      // 导入本地模式：OCR 提取到取件码 → 直接打开导入抽屉
      if (SCAN.mode === 'import') {
        var code = extractPickupCode(text);
        if (code && /^\d+-\d+-\d+$/.test(code)) {
          pauseScan();
          if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
          flashSuccessFrame();
          openImportSheet(code);
        } else if (code) {
          App.toast('识别到 ' + code + '，请确认是否为取件码', 2200);
        }
        return;
      }
      // 取件模式（原流程）：OCR 文本匹配本地快递库
      var result = API.resolveScanText(text);
      if (result.status === 'pending' && result.pkg) {
        pauseScan();
        if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
        flashSuccessFrame();
        // 灰度模式：本地匹配后必须再走后端校验
        if (isGrayScan()) {
          var v = await grayVerifyPickupCode(result.pkg.pickupCode, result.pkg.id);
          if (!v.ok || !v.allowPickup) {
            App.toast(v.message || '该取件码不属于当前用户', 2400);
            resumeScan();
            return;
          }
        }
        showPickupConfirm(result.pkg);
      } else if (result.status === 'notfound') {
        // 识别到了文字但没匹配上：轻提示一次，不弹窗打断
        var c = result.candidates && result.candidates[0];
        if (c) App.toast('识别到 ' + c + '，未匹配到快递', 2200);
      }
      // empty：无有效文字，静默继续
    }

    // 绿色识别框闪烁
    function flashSuccessFrame() {
      var frame = document.getElementById('scanFrame');
      frame.classList.add('scan-frame--success');
      setTimeout(function () { frame.classList.remove('scan-frame--success'); }, 1200);
    }

    // ---------- 3. 扫码结果 → 本地快递数据 ----------
    async function onDecoded(text) {
      pauseScan();
      if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
      flashSuccessFrame();
      // 导入本地模式：不走 API.resolveScanCode，直接提取取件码 → 打开导入抽屉
      if (SCAN.mode === 'import') {
        var code = extractPickupCode(text);
        if (code) {
          openImportSheet(code);
        } else {
          showScanFailed('未识别到取件码，请重新扫描或手动输入');
        }
        return;
      }
      // 取件模式（原流程）
      var result = API.resolveScanCode(text);
      if (result.status === 'pending' && result.pkg) {
        // 灰度模式：本地匹配后必须再走后端校验，避免使用他人取件码
        if (isGrayScan()) {
          App.showLoading();
          var v = await grayVerifyPickupCode(result.pkg.pickupCode, result.pkg.id);
          App.hideLoading();
          if (!v.ok || !v.allowPickup) {
            showScanFailed(v.message || '该取件码不属于当前用户，请重新扫描');
            return;
          }
        }
        showPickupConfirm(result.pkg);
      } else {
        showScanFailed(result.message || '未识别到快递二维码');
      }
    }

    // 从扫码原文中提取取件码（支持纯数字-数字-数字 / JSON / 纯文本）
    function extractPickupCode(raw) {
      if (!raw) return '';
      var text = String(raw).trim();
      // JSON 形式：{"qrCode":"8-3-267","pickupCode":"8-3-267"}
      if (text.charAt(0) === '{') {
        try {
          var obj = JSON.parse(text);
          if (obj && typeof obj === 'object') {
            return obj.qrCode || obj.pickupCode || obj.code || '';
          }
        } catch (e) { /* 非法 JSON，按纯文本处理 */ }
      }
      // 纯取件码（如 8-3-267 / 9-2-345）
      if (/^\d+-\d+-\d+$/.test(text)) return text;
      // 从文本中提取第一个 数字-数字-数字 模式
      var m = text.match(/\d+-\d+-\d+/);
      if (m) return m[0];
      // 兜底：4 位以上纯数字/字母组合
      m = text.match(/[A-Z0-9-]{4,}/);
      return m ? m[0] : text;
    }

    function showScanFailed(message) {
      App.showModal({
        title: '未识别到快递二维码',
        icon: 'error',
        desc: message,
        actions: [
          { label: '手动输入', style: 'btn-outline', onClick: function () { showManualInput(); } },
          { label: '重新扫描', style: 'btn-primary', onClick: function () { resumeScan(); } },
        ],
        onCancel: function () { resumeScan(); },
      });
    }

    function showPickupConfirm(pkg) {
      App.showModal({
        title: '发现快递',
        icon: 'success',
        desc: '<div style="text-align:center;line-height:1.8;">' +
          '<div style="font-weight:600;color:#1E293B;font-size:15px;">' + pkg.company + ' ' + pkg.trackingNo + '</div>' +
          '<div style="margin-top:6px;">取件码: <span style="font-family:monospace;font-weight:700;color:#2563EB;">' + pkg.pickupCode + '</span></div>' +
          '<div>取件点: ' + pkg.pickupPoint + '</div>' +
          '</div>',
        confirmText: '确认取件',
        cancelText: '取消',
        onConfirm: async function () {
          App.showLoading();
          try {
            // 灰度模式：走后端 scanConfirm；本地/demo 模式走 API.confirmPickup
            var success = false;
            var failMsg = '';
            if (isGrayScan()) {
              var r = await grayConfirmPickup(pkg.id);
              success = r.ok;
              failMsg = r.message;
            } else {
              var res = await API.confirmPickup(pkg.id);
              success = !!(res.data && res.data.success);
              failMsg = res.data && res.data.message;
            }
            App.hideLoading();
            if (success) {
              stopCamera();
              showSuccessOverlay(pkg);
            } else {
              App.showModal({ title: '取件失败', icon: 'error', desc: failMsg || '取件失败', confirmText: '知道了' });
              resumeScan();
            }
          } catch (e) {
            App.hideLoading();
            App.toast('操作失败，请稍后重试');
            resumeScan();
          }
        },
        onCancel: function () { resumeScan(); },
      });
    }

    function showSuccessOverlay(pkg) {
      var overlay = document.getElementById('successOverlay');
      document.getElementById('successCompany').textContent = pkg.company;
      document.getElementById('successTracking').textContent = pkg.trackingNo;
      document.getElementById('successCode').textContent = pkg.pickupCode;
      document.getElementById('successPoint').textContent = pkg.pickupPoint;
      overlay.classList.add('show');
    }

    // ---------- 4. 闪光灯（真实 torch 能力，不支持时明确提示） ----------
    function getVideoTrack() {
      if (!SCAN.stream) return null;
      var tracks = SCAN.stream.getVideoTracks();
      return tracks.length ? tracks[0] : null;
    }

    async function toggleFlash() {
      var track = getVideoTrack();
      if (!track) { App.toast('摄像头未启动'); return; }
      var caps = track.getCapabilities ? track.getCapabilities() : null;
      if (!caps || !caps.torch) { App.toast('当前设备不支持闪光灯'); return; }
      try {
        SCAN.torchOn = !SCAN.torchOn;
        await track.applyConstraints({ advanced: [{ torch: SCAN.torchOn }] });
        document.getElementById('flashBtn').classList.toggle('active', SCAN.torchOn);
        App.toast(SCAN.torchOn ? '闪光灯已开启' : '闪光灯已关闭');
      } catch (e) {
        SCAN.torchOn = false;
        App.toast('当前设备不支持闪光灯');
      }
    }

    // ---------- 5. 相册图片识别（本地解码，不上传） ----------
    function openAlbum() {
      var input = document.getElementById('albumInput');
      input.value = '';
      input.click();
    }

    function handleAlbumChange(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      App.showLoading();
      decodeImageFile(file).then(function (text) {
        if (text) { App.hideLoading(); onDecoded(text); return null; }
        // 二维码未命中 → 尝试本地 OCR 识别图片中的取件码
        return ocrImageFile(file);
      }).then(function (ocrText) {
        App.hideLoading();
        if (ocrText) {
          var result = API.resolveScanText(ocrText);
          if (result.status === 'pending' && result.pkg) { flashSuccessFrame(); showPickupConfirm(result.pkg); return; }
          showScanFailed(result.message || '未识别到取件码');
        } else {
          showScanFailed('未能从所选图片中识别到二维码或取件码');
        }
      }).catch(function () {
        App.hideLoading();
        App.toast('图片识别失败，请更换图片');
      });
    }

    // 相册图片 OCR（本地 Tesseract，不上传；预处理走 Worker）
    async function ocrImageFile(file) {
      var ok = await ensureOcrWorker();
      if (!ok) return null;
      var src = await loadImageSource(file);
      try {
        var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
        var scale = Math.min(2, 900 / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * scale);
        c.height = Math.round(h * scale);
        var ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(src, 0, 0, c.width, c.height);
        var processed = await preprocessForOcr(c, 1, 140);   // 二值化增强（Worker 优先）
        var result = await SCAN.ocrWorker.recognize(processed);
        return result && result.data && result.data.text ? result.data.text : null;
      } finally {
        if (src.close) src.close();
      }
    }

    function loadImageSource(file) {
      if (typeof createImageBitmap === 'function') return createImageBitmap(file);
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { resolve(img); URL.revokeObjectURL(url); };
        img.onerror = function () { reject(new Error('image load error')); URL.revokeObjectURL(url); };
        img.src = url;
      });
    }

    async function decodeImageFile(file) {
      var src = await loadImageSource(file);
      try {
        if (SCAN.useNativeDetector && SCAN.detector) {
          var codes = await SCAN.detector.detect(src);
          if (codes && codes.length > 0 && codes[0].rawValue) return codes[0].rawValue;
          return null;
        }
        if (typeof jsQR !== 'function') return null;
        var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
        var scale = Math.min(1, 640 / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * scale));
        c.height = Math.max(1, Math.round(h * scale));
        var ctx = c.getContext('2d');
        ctx.drawImage(src, 0, 0, c.width, c.height);
        var img = ctx.getImageData(0, 0, c.width, c.height);
        var r = jsQR(img.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
        return r && r.data ? r.data : null;
      } finally {
        if (src.close) src.close();
      }
    }

    // ---------- 6. 视图切换 ----------
    function showScanView() {
      var scanView = document.getElementById('scanView');
      var deniedView = document.getElementById('deniedView');
      deniedView.classList.add('hidden');
      scanView.classList.remove('hidden');
      scanView.querySelectorAll('.anim-fade-in-up').forEach(function (el) {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
    }

    function showDeniedView(descHtml) {
      var scanView = document.getElementById('scanView');
      var deniedView = document.getElementById('deniedView');
      stopCamera();
      scanView.classList.add('hidden');
      if (descHtml) document.getElementById('deniedDesc').innerHTML = descHtml;
      deniedView.classList.remove('hidden');
    }

    function deniedHintText(reason) {
      var html = '';
      if (reason) {
        html += reason + '<br>';
      } else {
        html += '请在浏览器权限弹窗中允许访问相机，<br>或在系统设置中开启相机权限<br>';
      }
      if (location.protocol === 'file:') {
        html += '<span style="display:inline-block;margin-top:8px;color:var(--color-warning);">提示：当前以本地文件方式打开，浏览器禁止调用摄像头。<br>请运行 <b>backend/start-backend.cmd</b>（或在 backend 目录执行 npm start），然后访问<br>https://localhost:3000/scan.html</span>';
      }
      return html;
    }

    function goToSettings() {
      App.showModal({
        title: '如何开启相机权限',
        desc: '<div style="text-align:left;line-height:1.9;font-size:13px;">' +
          '1. 点击地址栏左侧的锁形/相机图标<br>' +
          '2. 将「摄像头 / Camera」权限设为允许<br>' +
          '3. 刷新页面后重新扫码<br><br>' +
          'Windows 系统权限：设置 → 隐私和安全性 → 相机<br>' +
          '确保允许桌面应用访问相机' +
          '</div>',
        confirmText: '知道了',
        onConfirm: function () { App.closeModal(); },
      });
    }

    // ---------- 7. 手动输入取件码 ----------
    function showManualInput() {
      App.showModal({
        title: '手动输入取件码',
        desc: '<div style="text-align:left;">' +
          '<input type="text" class="manual-input-field" id="manualCodeInput" placeholder="请输入取件码，如 8-3-267" autocomplete="off" />' +
          '<div class="manual-input-hint">取件码可在快递到达通知短信中查看</div>' +
          '</div>',
        confirmText: '确认取件',
        cancelText: '取消',
        onConfirm: function () {
          var input = document.getElementById('manualCodeInput');
          var code = input ? input.value.trim() : '';
          if (!code) {
            App.toast('请输入取件码');
            return;
          }
          handleManualScan(code);
        },
        onCancel: function () { resumeScan(); },
      });
      setTimeout(function () {
        var input = document.getElementById('manualCodeInput');
        if (input) input.focus();
      }, 350);
    }

    async function handleManualScan(code) {
      // 导入本地模式：手动输入直接进入导入抽屉
      if (SCAN.mode === 'import') {
        flashSuccessFrame();
        openImportSheet(code);
        return;
      }
      // 取件模式（原流程）
      var result = API.resolveScanCode(code);
      if (result.status === 'pending' && result.pkg) {
        // 灰度模式：手动输入同样必须走后端校验
        if (isGrayScan()) {
          App.showLoading();
          var v = await grayVerifyPickupCode(result.pkg.pickupCode, result.pkg.id);
          App.hideLoading();
          if (!v.ok || !v.allowPickup) {
            showScanFailed(v.message || '该取件码不属于当前用户，请重新输入');
            return;
          }
        }
        showPickupConfirm(result.pkg);
      } else {
        showScanFailed(result.message || '未识别到快递二维码');
      }
    }

    // ---------- 3.5 模式切换 + 导入本地抽屉（新功能） ----------
    // 按钮平滑过渡：mode-switch / mode-banner 通过 CSS transition 平滑变色
    function toggleScanMode() {
      SCAN.mode = (SCAN.mode === 'pickup') ? 'import' : 'pickup';
      var btn = document.getElementById('modeSwitch');
      var label = document.getElementById('modeLabel');
      var banner = document.getElementById('modeBanner');
      var bannerText = document.getElementById('modeBannerText');
      var tip = document.getElementById('scanTip');
      if (SCAN.mode === 'import') {
        btn.classList.add('mode-import');
        label.textContent = '导入模式';
        banner.classList.add('mode-import');
        bannerText.textContent = '当前为「导入模式」：扫描快递架上的取件码标签，将快递导入本地列表';
        tip.textContent = '将快递架上的取件码标签对准扫描框';
      } else {
        btn.classList.remove('mode-import');
        label.textContent = '取件模式';
        banner.classList.remove('mode-import');
        bannerText.textContent = '当前为「取件模式」：扫描已到站快递的取件码完成取件';
        tip.textContent = '将取件码对准扫描框，支持二维码与面单数字';
      }
    }

    // 打开导入抽屉（从底部滑入，沉浸式过渡）
    function openImportSheet(code) {
      SCAN.importCode = code;
      document.getElementById('importCodeDisplay').textContent = code;
      // 重置选择
      SCAN.importSelectedCompany = null;
      SCAN.importSelectedPoint = null;
      var companyChips = document.querySelectorAll('#companyChips .chip');
      companyChips.forEach(function (c) { c.classList.remove('selected'); });
      var pointChips = document.querySelectorAll('#pointChips .chip');
      pointChips.forEach(function (c) { c.classList.remove('selected'); });
      // 默认选中顺丰 + 涵江校园驿站
      var defaultCompany = document.querySelector('#companyChips .chip[data-company="顺丰"]');
      if (defaultCompany) selectChip(defaultCompany, 'company');
      var defaultPoint = document.querySelector('#pointChips .chip[data-point="涵江校园驿站"]');
      if (defaultPoint) selectChip(defaultPoint, 'point');
      // 停止摄像头避免抽屉滚动时画面干扰
      pauseScan();
      // 显示遮罩 + 抽屉（CSS 过渡自动平滑滑入）
      document.getElementById('importMask').classList.add('show');
      document.getElementById('importSheet').classList.add('show');
    }

    function closeImportSheet() {
      document.getElementById('importMask').classList.remove('show');
      document.getElementById('importSheet').classList.remove('show');
      // 抽屉关闭后恢复扫码循环
      setTimeout(function () {
        if (SCAN.stream && !document.getElementById('successOverlay').classList.contains('show')) {
          resumeScan();
        }
      }, 350);
    }

    // 选择快递公司/取件点 chip
    function selectChip(el, type) {
      var container = el.parentElement;
      var siblings = container.querySelectorAll('.chip');
      siblings.forEach(function (s) { s.classList.remove('selected'); });
      el.classList.add('selected');
      if (type === 'company') {
        SCAN.importSelectedCompany = el.getAttribute('data-company');
        SCAN.importSelectedShort = el.getAttribute('data-short') || SCAN.importSelectedCompany;
        SCAN.importSelectedColor = el.getAttribute('data-color') || '#64748B';
      } else if (type === 'point') {
        SCAN.importSelectedPoint = el.getAttribute('data-point');
        SCAN.importSelectedType = el.getAttribute('data-type') || 'station';
      }
    }
    window.selectChip = selectChip;
    window.toggleScanMode = toggleScanMode;
    window.closeImportSheet = closeImportSheet;
    window.openImportSheet = openImportSheet;
    window.submitImportLocal = submitImportLocal;

    // 提交导入本地 —— 调用 Storage.addLocalPackage，不走云端
    function submitImportLocal() {
      if (!SCAN.importCode) {
        App.toast('取件码为空，请重新扫描');
        return;
      }
      if (!SCAN.importSelectedCompany) {
        App.toast('请选择快递公司');
        return;
      }
      if (!SCAN.importSelectedPoint) {
        App.toast('请选择取件点');
        return;
      }
      var result = Storage.addLocalPackage({
        pickupCode: SCAN.importCode,
        company: SCAN.importSelectedCompany,
        shortName: SCAN.importSelectedShort,
        logoColor: SCAN.importSelectedColor,
        pickupPoint: SCAN.importSelectedPoint,
        type: SCAN.importSelectedType,
        sender: '扫描导入',
      });
      if (result.success) {
        // 关闭抽屉 → 显示沉浸式成功 overlay
        document.getElementById('importMask').classList.remove('show');
        document.getElementById('importSheet').classList.remove('show');
        stopCamera();
        showImportSuccessOverlay(result.pkg);
      } else {
        App.showModal({
          title: '导入失败',
          icon: 'warning',
          desc: result.message || '导入失败，请稍后重试',
          confirmText: '知道了',
          onConfirm: function () { App.closeModal(); closeImportSheet(); },
        });
      }
    }

    // 导入成功的沉浸式 overlay（复用 success-overlay 结构，但标题改为"已导入本地"）
    function showImportSuccessOverlay(pkg) {
      var overlay = document.getElementById('successOverlay');
      document.getElementById('successOverlayTitle').textContent = '已导入本地';
      document.getElementById('successCompany').textContent = pkg.company;
      document.getElementById('successTracking').textContent = pkg.trackingNo;
      document.getElementById('successCode').textContent = pkg.pickupCode;
      document.getElementById('successPoint').textContent = pkg.pickupPoint;
      var btn = document.getElementById('successOverlayBtn');
      btn.textContent = '去查看快递';
      btn.onclick = function () { location.href = 'packages.html'; };
      overlay.classList.add('show');
    }

    // 页面离开时释放摄像头
    window.addEventListener('pagehide', stopCamera);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && !document.getElementById('successOverlay').classList.contains('show')) {
        // 后台挂起时保持流但暂停识别循环，避免浪费 CPU
        pauseScan();
      } else if (!document.hidden && SCAN.stream && !SCAN.scanning && !document.getElementById('successOverlay').classList.contains('show')) {
        // 页面被系统权限弹窗等遮挡后恢复时，无需自动恢复（用户可通过重试/取消恢复）
      }
    });
  </script>
