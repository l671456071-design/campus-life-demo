<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>扫码取件 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== 全屏沉浸式扫码 ===== */
    .scan-stage { position:fixed; inset:0; background:#0F172A; overflow:hidden; z-index:1; }
    .scan-stage.hidden { display:none; }
    .scan-video {
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; background:#0F172A;
    }

    /* 沉浸式透明导航（左上退出 + 简洁标题） */
    .scan-nav {
      position:absolute; top:0; left:0; right:0; z-index:8;
      display:flex; align-items:center; gap:10px;
      padding:calc(env(safe-area-inset-top) + 8px) 14px 16px;
      background:linear-gradient(to bottom, rgba(2,6,23,.62), rgba(2,6,23,0));
    }
    .scan-nav-side { display:flex; gap:8px; align-items:center; }
    .scan-nav-title { flex:1; text-align:center; color:#fff; font-size:16px; font-weight:600; letter-spacing:.5px; }
    .scan-nav-btn {
      width:40px; height:40px; border-radius:50%;
      background:rgba(15,23,42,.42);
      -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
      border:none; color:#fff;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s, transform .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .scan-nav-btn:active { transform:scale(.92); }
    .scan-nav-btn svg { width:22px; height:22px; }
    .scan-nav-btn.active { color:#34D399; background:rgba(16,185,129,.24); }

    /* 识别区：屏幕垂直居中偏上，与底部操作条留出安全留白，不被遮挡 */
    .scan-center {
      position:absolute; left:0; right:0; top:38%; transform:translateY(-50%);
      display:flex; flex-direction:column; align-items:center; z-index:3; padding:0 24px;
    }
    .scan-frame {
      width:min(64vw,240px); height:min(64vw,240px);
      position:relative; border-radius:14px;
      box-shadow:0 0 0 9999px rgba(2,6,23,.52);  /* 四周压暗、中心透明 */
      -webkit-tap-highlight-color:transparent;
      transition:transform .25s;
    }

    /* 四角：2px 白色圆角（全站统一 14px 圆角规范）；边框静态，呼吸效果交给 ::after 只动 opacity（GPU 合成层，避免 box-shadow 动画逐帧重绘掉帧） */
    .scan-corner {
      position:absolute; width:24px; height:24px;
      border:2px solid #fff;
      z-index:2;
    }
    .scan-corner::after {
      content:''; position:absolute; inset:-3px; border-radius:inherit;
      box-shadow:0 0 10px rgba(52,211,153,.9), 0 0 22px rgba(52,211,153,.4);
      opacity:.3; pointer-events:none;
      animation:cornerGlow 1.5s ease-in-out infinite;
      will-change:opacity;
    }
    .scan-corner--tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:14px 0 0 0; }
    .scan-corner--tl::after { animation-delay:0s; }
    .scan-corner--tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 14px 0 0; }
    .scan-corner--tr::after { animation-delay:.18s; }
    .scan-corner--br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 14px 0; }
    .scan-corner--br::after { animation-delay:.36s; }
    .scan-corner--bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 14px; }
    .scan-corner--bl::after { animation-delay:.54s; }
    @keyframes cornerGlow {
      0%, 100% { opacity:.25; }
      50% { opacity:1; }
    }

    /* 扫描线：整条横线只做 translate3d 位移（独立合成层，不触发重排重绘），2.4s 往返 */
    .scan-beam {
      position:absolute; left:9%; right:9%; top:0; height:2.5px;
      border-radius:2px; z-index:1; pointer-events:none;
      background:linear-gradient(90deg, rgba(52,211,153,0), rgba(52,211,153,.95) 18%, #fff 50%, rgba(52,211,153,.95) 82%, rgba(52,211,153,0));
      box-shadow:0 0 10px rgba(52,211,153,.75), 0 0 24px rgba(52,211,153,.35);
      will-change:transform;
      transform:translate3d(0,4px,0);
      animation:beamMove 2.4s ease-in-out .3s infinite alternate;
    }
    @keyframes beamMove {
      from { transform:translate3d(0,4px,0); }
      to   { transform:translate3d(0,calc(min(64vw,240px) - 7px),0); }
    }
    /* 识别暂停 / 成功：立即停住动画并淡出，省 GPU */
    .scan-frame.is-paused .scan-beam,
    .scan-frame--success .scan-beam { animation-play-state:paused; opacity:0; }
    .scan-frame--success .scan-corner::after { animation:none; opacity:1; }

    /* 识别成功：四角变绿 + 框内 0.3s 对勾缩放 */
    .scan-frame--success { transform:scale(1.05); }
    .scan-frame--success .scan-corner {
      border-color:#34D399; animation:none;
      box-shadow:0 0 16px rgba(52,211,153,.9);
    }
    .scan-check {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none;
    }
    .scan-check svg {
      width:58%; height:58%; color:#34D399;
      filter:drop-shadow(0 0 10px rgba(52,211,153,.95));
      transform:scale(.3);
    }
    .scan-frame--success .scan-check { opacity:1; }
    .scan-frame--success .scan-check svg {
      animation:checkPop .3s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes checkPop { to { transform:scale(1); } }

    .scan-tip {
      color:rgba(255,255,255,.88); font-size:13px; text-align:center;
      margin-top:18px; padding:0 12px; line-height:1.5;
      text-shadow:0 1px 4px rgba(0,0,0,.5);
      position:relative; z-index:2;
    }
    /* 矮屏设备：压缩识别区间距、隐藏冗余模式横幅，保证与底部操作条不重叠 */
    @media (max-height:700px) {
      .scan-center { top:36%; }
      .scan-tip { margin-top:13px; font-size:12.5px; }
      .mode-switch { margin-top:10px; padding:6px 12px; }
      .mode-banner { display:none; }
      .scan-hint { margin-top:10px; padding:8px 14px; }
    }

    /* 模式切换：玻璃胶囊 */
    .mode-switch {
      display:inline-flex; align-items:center; gap:6px;
      margin-top:14px; padding:7px 14px; border-radius:999px;
      background:rgba(255,255,255,.12);
      -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.24); color:#fff;
      font-size:12.5px; font-weight:600;
      transition:background .35s, border-color .35s, transform .25s;
      -webkit-tap-highlight-color:transparent;
    }
    .mode-switch:active { transform:scale(.94); }
    .mode-switch svg { width:14px; height:14px; transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
    .mode-switch.mode-import {
      background:rgba(16,185,129,.24); border-color:rgba(52,211,153,.5); color:#A7F3D0;
    }
    .mode-switch.mode-import svg { transform:rotate(180deg); }

    /* 模式提示横幅：浮于扫描框下的玻璃小条 */
    .mode-banner {
      margin-top:10px; max-width:86%;
      padding:7px 13px; border-radius:10px;
      font-size:12px; line-height:1.5; text-align:center;
      background:rgba(15,23,42,.5);
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      color:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.12);
      transition:background .35s, color .35s, border-color .35s;
    }
    .mode-banner.mode-import {
      background:rgba(6,78,59,.55); color:#A7F3D0; border-color:rgba(52,211,153,.35);
    }

    /* 停留 3s 未识别：浮现的半透明提示条（自动消失） */
    .scan-hint {
      margin-top:14px;
      display:inline-flex; align-items:center; gap:5px;
      background:rgba(15,23,42,.72);
      -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.12); color:#E2E8F0;
      font-size:13px; padding:9px 16px; border-radius:999px;
      opacity:0; transform:translateY(6px); pointer-events:none;
      transition:opacity .3s, transform .3s;
    }
    .scan-hint.show { opacity:1; transform:none; pointer-events:auto; }
    .scan-hint b { color:#93C5FD; font-weight:600; }
    .scan-hint:active { opacity:.85; }

    /* 旧引擎标识：不再常驻展示（3s 慢提示兜底） */
    .scan-engine-hint { display:none !important; }

    /* 底部操作区：半透明深色底条做层级隔离，双按钮横排，与取景框保持安全留白 */
    .scan-actions {
      position:absolute; left:0; right:0; z-index:6;
      bottom:calc(72px + env(safe-area-inset-bottom));
      display:flex; flex-direction:column; gap:9px;
      padding:12px 16px 13px;
      background:rgba(8,15,32,.6);
      -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
      border-top:1px solid rgba(255,255,255,.1);
    }
    .scan-act-row { display:flex; gap:12px; }
    .scan-act-btn {
      flex:1; min-width:0;
      display:inline-flex; align-items:center; justify-content:center; gap:7px;
      font-size:14px; font-weight:600; font-family:inherit;
      padding:12px 10px; border-radius:14px;
      transition:transform .15s, background .2s;
      -webkit-tap-highlight-color:transparent; white-space:nowrap;
    }
    .scan-act-btn:active { transform:scale(.97); }
    .scan-act-btn svg { width:17px; height:17px; flex-shrink:0; }
    .scan-act-btn.primary {
      background:#fff; color:#0F172A; border:1px solid rgba(255,255,255,.6);
      box-shadow:0 6px 18px rgba(0,0,0,.28);
    }
    .scan-act-btn.ghost {
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.26); color:#fff;
    }
    .scan-demo-tip { font-size:11.5px; color:rgba(255,255,255,.72); line-height:1.6; text-align:center; }
    .scan-demo-tip b { color:#93C5FD; }

    /* 扫码页局部压缩底部 Tab，减少垂直占用（不改全局 tab-bar 结构） */
    body[data-page="scan"] .tab-bar {
      height:54px; bottom:10px; padding:4px 8px; border-radius:27px;
      box-shadow:0 8px 28px rgba(0,0,0,.18);
    }
    body[data-page="scan"] .tab-item { height:46px; }
    body[data-page="scan"] .tab-item .tab-icon { width:20px; height:20px; }
    body[data-page="scan"] .tab-item .tab-label { font-size:9.5px; }
    body[data-page="scan"] .tab-scan-btn { width:46px; height:46px; margin-top:-22px; }

    /* 无相机权限页的文字链接 */
    .manual-link {
      color:var(--color-primary);
      font-size:14px;
      text-decoration:underline;
      padding:10px 12px;
      display:inline-flex;
      align-items:center;
      gap:4px;
      -webkit-tap-highlight-color:transparent;
    }
    .manual-link:active { opacity:.6; }
    .manual-link svg { width:16px; height:16px; }

    /* Permission Denied View */
    .permission-denied {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:80vh; padding:40px 24px; text-align:center;
    }
    .permission-denied-icon {
      width:80px; height:80px; border-radius:50%;
      background:var(--color-danger-light); color:var(--color-danger);
      display:flex; align-items:center; justify-content:center; margin-bottom:20px;
    }
    .permission-denied-icon svg { width:40px; height:40px; }
    .permission-denied-title { font-size:18px; font-weight:600; color:var(--color-text); margin-bottom:8px; }
    .permission-denied-desc { font-size:14px; color:var(--color-text-sub); margin-bottom:28px; line-height:1.6; }
    .permission-denied-actions { display:flex; flex-direction:column; align-items:center; gap:16px; }

    /* Success Overlay */
    .success-overlay {
      position:fixed; inset:0;
      background:linear-gradient(135deg,#10B981,#059669);
      z-index:500; display:none;
      flex-direction:column; align-items:center; justify-content:center;
      padding:24px; text-align:center;
    }
    .success-overlay.show { display:flex; animation:fadeIn .3s; }
    .success-overlay-icon {
      width:80px; height:80px; color:#fff; margin-bottom:20px;
      border-radius:50%; background:rgba(255,255,255,.2);
      display:flex; align-items:center; justify-content:center;
      animation:popIn .5s .15s both;
    }
    .success-overlay-icon svg { width:44px; height:44px; }
    .success-overlay-title { font-size:24px; font-weight:700; color:#fff; margin-bottom:20px; animation:fadeInUp .4s .3s both; }
    .success-overlay-info {
      background:rgba(255,255,255,.15); border-radius:12px;
      padding:16px 20px; margin-bottom:32px; width:100%; max-width:300px;
      animation:fadeInUp .4s .45s both;
    }
    .success-overlay-info-row { display:flex; justify-content:space-between; color:#fff; font-size:14px; padding:5px 0; }
    .success-overlay-info-label { opacity:.8; }
    .success-overlay-info-value { font-weight:600; }
    .success-overlay-btn {
      background:#fff; color:#059669; padding:14px 48px; border-radius:12px;
      font-size:16px; font-weight:700; border:none; cursor:pointer;
      animation:fadeInUp .4s .6s both;
    }
    .success-overlay-btn:active { transform:scale(.96); }

    /* Manual Input */
    .manual-input-field {
      width:100%; padding:14px 16px;
      border:1.5px solid var(--color-border); border-radius:12px;
      font-size:16px; font-family:var(--font-mono); text-align:center;
      letter-spacing:1px; outline:none; transition:border-color .2s;
      background:var(--color-surface-alt); color:var(--color-text); box-sizing:border-box;
    }
    .manual-input-field:focus { border-color:var(--color-primary); background:var(--color-surface); }
    .manual-input-field::placeholder { color:var(--color-text-hint); font-family:var(--font-body); letter-spacing:0; font-size:14px; }
    .manual-input-hint { font-size:12px; color:var(--color-text-hint); text-align:center; margin-top:10px; }

    /* ===== 底部抽屉（导入确认） ===== */
    .import-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--color-surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.18);
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      z-index: 450;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0.16, 1);
      max-height: 86vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .import-sheet.show { transform: translateY(0); }
    .import-sheet-grabber {
      width: 36px; height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    .import-sheet-title {
      font-size: 16px; font-weight: 700;
      color: var(--color-text);
      text-align: center;
      margin-bottom: 4px;
    }
    .import-sheet-sub {
      font-size: 12px; color: var(--color-text-sub);
      text-align: center; margin-bottom: 18px;
    }
    .import-field-label {
      font-size: 12px; color: var(--color-text-sub);
      margin: 12px 0 8px;
    }
    .import-code-display {
      background: var(--color-surface-alt);
      border: 1.5px dashed var(--color-primary);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 2px;
    }
    .chip-row {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--color-surface-alt);
      color: var(--color-text-sub);
      font-size: 13px;
      border: 1px solid var(--color-border-light);
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:active { transform: scale(0.94); }
    .chip.selected {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
    .import-submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      margin-top: 22px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      -webkit-tap-highlight-color: transparent;
    }
    .import-submit-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }
    .import-sheet-close {
      position: absolute;
      top: 14px; right: 16px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--color-surface-alt);
      color: var(--color-text-sub);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.2s;
    }
    .import-sheet-close:active { transform: scale(0.9); background: var(--color-border-light); }
    .import-sheet-close svg { width: 14px; height: 14px; }

    /* 抽屉遮罩 */
    .import-mask {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 440;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .import-mask.show { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body data-page="scan">
  <div class="app-shell">
    <main class="app-content" style="padding-top:0;">
      <!-- 全屏沉浸式扫码舞台 -->
      <div id="scanView" class="scan-stage hidden">
        <video id="scanVideo" class="scan-video" autoplay muted playsinline></video>

        <!-- 沉浸式透明导航：左上退出 + 简洁标题 -->
        <div class="scan-nav">
          <a href="index.html" class="scan-nav-btn" aria-label="退出扫码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
          <div class="scan-nav-title">扫码取件</div>
          <div class="scan-nav-side">
            <button class="scan-nav-btn" id="flashBtn" onclick="toggleFlash()" aria-label="闪光灯">
              <svg id="flashIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </button>
          </div>
        </div>

        <!-- 识别区：扫描框居中上移 -->
        <div class="scan-center anim-fade-in-up">
          <div class="scan-frame" id="scanFrame">
            <div class="scan-beam"></div>
            <div class="scan-corner scan-corner--tl"></div>
            <div class="scan-corner scan-corner--tr"></div>
            <div class="scan-corner scan-corner--bl"></div>
            <div class="scan-corner scan-corner--br"></div>
            <div class="scan-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>
          <div class="scan-tip" id="scanTip">正在启动摄像头…</div>
          <!-- 模式切换：取件模式 ↔ 导入本地模式 -->
          <button class="mode-switch" id="modeSwitch" onclick="toggleScanMode()" aria-label="切换扫码模式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span id="modeLabel">取件模式</span>
          </button>
          <div class="mode-banner" id="modeBanner">
            <span id="modeBannerText">当前为「取件模式」：扫描已到站快递的取件码完成取件</span>
          </div>
          <!-- 停留 3s 未识别成功时浮现（自动消失） -->
          <button type="button" class="scan-hint" id="slowHint" onclick="showManualInput()">
            暂时没有识别到？<b>手动输入取件码</b>
          </button>
        </div>

        <!-- 底部操作区：深色底条层级隔离，双按钮横排，安全留白不压取景框 -->
        <div class="scan-actions">
          <div class="scan-act-row">
            <button type="button" class="scan-act-btn primary" onclick="showManualInput()">

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>

  <!-- jsQR / Tesseract 体积大（合计数百 KB + wasm），改为相机出画后空闲异步注入，杜绝 3-5s 白屏；
       代码内对两个全局均有 typeof 防护，加载完成后会自动重扫引擎 -->
  <script>
    // ================= 真实本地摄像头扫码 + OCR 取件码识别 =================
    // 权限：navigator.mediaDevices.getUserMedia（需要 localhost / https 环境）
    // 二维码：优先浏览器原生 BarcodeDetector，回退本地 libs/qr-scanner/jsQR.js
    // OCR：本地 libs/tesseract/（Tesseract.js），仅识别扫描框内数字，不上传任何图片

    // 灰度模式：已通过真实手机号登录的非 demo 用户 → 扫码结果走后端校验
    // 普通用户（demo / local）→ 仅本地匹配，不调后端
    function isGrayScan() {
      try {
        if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) return false;
        if (typeof ApiClient === 'undefined') return false;
        return ApiClient.isLoggedIn();
      } catch (e) { return false; }
    }

    // 灰度用户：调用后端 scanVerify 校验候选取件码归属
    // 返回 { ok, allowPickup, packageId, message }
    async function grayVerifyPickupCode(code, packageId) {
      try {
        var r = await ApiClient.scanVerify(code, packageId);
        if (r.code === 0 && r.data) {
          return { ok: true, allowPickup: r.data.allowPickup, packageId: r.data.packageId, message: r.data.message || '' };
        }
        return { ok: false, allowPickup: false, message: r.message || '该取件码不属于当前用户，请重新扫描' };
      } catch (e) {
        return { ok: false, allowPickup: false, message: '校验失败，请稍后重试' };
      }
    }

    // 灰度用户：调用后端 scanConfirm 确认取件
    async function grayConfirmPickup(packageId) {
      try {
        var r = await ApiClient.scanConfirm(packageId);
        return { ok: r.code === 0, message: r.message, status: r.data ? r.data.status : '' };
      } catch (e) {
        return { ok: false, message: '取件失败，请稍后重试' };
      }
    }

    var SCAN = {
      stream: null,
      video: null,
      canvas: null,
      ctx: null,
      detector: null,          // BarcodeDetector 实例
      useNativeDetector: false,
      scanning: false,         // 识别循环是否运行
      loopGen: 0,              // 帧循环代际：暂停/重启 +1，旧回调自动失效（防双循环卡顿）
      busy: false,             // 单帧解码进行中
      lastScanAt: 0,
      torchOn: false,
      scanInterval: 500,       // 二维码分析间隔（ms）：统一节流 500ms，低配不发热
      ocrInterval: 3200,       // OCR 分析间隔（ms，按性能档位调整）
      ocrWorker: null,         // Tesseract 本地 worker（懒加载，独立线程运行）
      ocrReady: false,
      ocrLoading: false,
      ocrBusy: false,
      lastOcrAt: 0,
      lastOcrText: '',
      ocrRound: 0,             // OCR 轮次：奇数轮全框（远）、偶数轮中心放大（近）交替识别
      ocrPipe: undefined,      // ocr-worker.js：预处理 Worker（二值化/放大不占主线程）
      ocrPend: {},             // 待响应的预处理请求
      ocrSeq: 0,
      // 新增：扫码模式 —— 'pickup' 取件模式（原流程）| 'import' 导入本地模式（新功能）
      mode: 'pickup',
      // 导入抽屉的选择状态
      importSelectedCompany: null,
      importSelectedPoint: null,
      importSelectedColor: '#64748B',
      importSelectedShort: '其他',
      importSelectedType: 'station',
      importCode: '',
      slowTimer: null,
      slowHideTimer: null,
    };

    document.addEventListener('DOMContentLoaded', function () {
      SCAN.video = document.getElementById('scanVideo');
      SCAN.canvas = document.getElementById('scanCanvas');
      SCAN.ctx = SCAN.canvas.getContext('2d', { willReadFrequently: true });

      // 性能档位：扫码 / OCR 分析频率按设备等级调整（perf.js），避免低配设备发热
      try {
        var tier = Perf.tier();
        SCAN.scanInterval = tier.scanInterval;
        SCAN.ocrInterval = tier.ocrInterval;
      } catch (e) { /* perf.js 不可用时使用默认值 */ }

      // demo 模式：展示可体验的演示取件码，方便外部用户快速上手
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        try {
          var pending = Storage.getPackages().filter(function (p) { return p.status === 'pending' && p.pickupCode; });
          var codes = pending.slice(0, 3).map(function (p) { return p.pickupCode; });
          if (codes.length) {
            var tip = document.createElement('div');
            tip.className = 'scan-demo-tip';
            tip.innerHTML = '演示提示：点「手动输入取件码」，输入 <b>' +
              codes.join('</b> / <b>') + '</b> 即可体验完整取件流程';
            var bottom = document.querySelector('.scan-actions');
            if (bottom) bottom.appendChild(tip);
          }
        } catch (e) { /* Storage 不可用时忽略 */ }
      }

      // 页面切后台：暂停识别循环与慢提示，回前台自动恢复（省电、防后台空转发热）
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          pauseScan();
        } else if (SCAN.stream) {
          // 成功覆盖层停留期间不自动恢复，避免对勾页扫描线空转
          var ov = document.getElementById('successOverlay');
          if (ov && ov.classList.contains('show')) return;
          resumeScan();
        }
      });

      startCamera();
    });

    // ---------- 0.5 识别引擎异步加载（不阻塞相机首帧，消除 3-5s 白屏） ----------
    // jsQR 与 Tesseract（含 wasm/语言包）合计数百 KB：等相机出画后再利用空闲时段串行注入，
    // 全部失败静默——用户仍可手动输入取件码。单例 Promise，多处调用共享同一次加载。
    var _enginesPromise = null;
    function idleCallback(cb, timeout) {
      if (window.requestIdleCallback) {
        window.requestIdleCallback(cb, { timeout: timeout || 1500 });
      } else {
        setTimeout(cb, Math.max(120, (timeout || 1500) / 2));
      }
    }
    function loadLib(src) {
      return new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = function () { resolve(true); };
        s.onerror = function () { resolve(false); };
        document.head.appendChild(s);
      });
    }
    function enginesReady() {
      if (_enginesPromise) return _enginesPromise;
      _enginesPromise = new Promise(function (resolve) {
        idleCallback(function () {
          loadLib('libs/qr-scanner/jsQR.js').then(function (ok) {
            if (ok) { initDetector(); updateEngineHint(); }
            idleCallback(function () {
              loadLib('libs/tesseract/tesseract.min.js').then(function () {
                updateEngineHint();
                resolve();
              });
            }, 500);
          });
        }, 300);
      });
      return _enginesPromise;
    }
    // 相机稳定出画 1.2s 后，空闲拉脚本并预建 OCR worker（用户无感知，首次识别零等待）
    function scheduleEnginePreload() {
      setTimeout(function () {
        if (document.visibilityState !== 'visible') return;
        enginesReady().then(function () {
          if (SCAN.scanning && !SCAN.ocrReady && !SCAN.ocrLoading) ensureOcrWorker();
        });
      }, 1200);
    }

    // ---------- 1. 摄像头（兼容 Safari/华为/小米/OPPO/Chrome 等浏览器） ----------
    function cameraGetUserMedia(constraints) {
      // 标准 API（Chrome / Edge / Safari 14.3+ / 主流国产浏览器内核）
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }
      // 旧版 WebView 前缀兜底（老款安卓系统浏览器）
      var legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
      if (legacy) {
        return new Promise(function (resolve, reject) {
          legacy.call(navigator, constraints, resolve, reject);
        });
      }
      return Promise.reject(new Error('NO_MEDIA_API'));
    }

    function attachVideoStream(stream) {
      var v = SCAN.video;
      try {
        v.srcObject = stream;
      } catch (e) {
        // 极旧内核只支持 createObjectURL
        v.src = (window.URL && URL.createObjectURL) ? URL.createObjectURL(stream) : stream;
      }
    }

    async function startCamera() {
      if (!navigator.mediaDevices && !(navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia)) {
        showDeniedView(deniedHintText('当前浏览器不支持摄像头调用'));
        return;
      }
      document.getElementById('scanTip').textContent = '正在启动摄像头…';
      try {
        // 低配设备降分辨率采集（960x540），减少取流/绘制开销；中高配仍用 720p 保证识别率
        var idealW = 1280, idealH = 720;
        try { if (Perf.tierKey && Perf.tierKey() === 'low') { idealW = 960; idealH = 540; } } catch (e0) {}
        SCAN.stream = await cameraGetUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: idealW }, height: { ideal: idealH } },
          audio: false,
        });
      } catch (err) {
        var reason = (err && err.name === 'NotFoundError') ? '未检测到可用摄像头设备' : null;
        showDeniedView(deniedHintText(reason));
        return;
      }
      attachVideoStream(SCAN.stream);
      try { await SCAN.video.play(); } catch (e) { /* autoplay 由 muted+playsinline 保证 */ }
      showScanView();
      document.getElementById('scanTip').textContent = '将取件码对准扫描框，支持二维码与面单数字';
      initDetector();
      startDetectLoop();
      startSlowHints();
      setBeamPaused(false);
      scheduleEnginePreload();
    }

    function retryCamera() {
      stopCamera();
      startCamera();
    }

    function stopCamera() {
      pauseScan();
      if (SCAN.stream) {
        SCAN.stream.getTracks().forEach(function (t) { t.stop(); });
        SCAN.stream = null;
      }
      try { SCAN.video.srcObject = null; } catch (e) { SCAN.video.removeAttribute('src'); }
      // 同步释放 OCR worker / 预处理 worker，防止反复进出页面内存堆积（越用越卡）
      if (SCAN.ocrWorker) {
        try { SCAN.ocrWorker.terminate(); } catch (e) {}
        SCAN.ocrWorker = null;
        SCAN.ocrReady = false;
        SCAN.ocrLoading = false;
      }
      if (SCAN.ocrPipe) {
        try { SCAN.ocrPipe.terminate(); } catch (e) {}
        SCAN.ocrPipe = null;
      }
      SCAN.torchOn = false;
      var btn = document.getElementById('flashBtn');
      if (btn) btn.classList.remove('active');
    }

    // 扫描线动画随识别循环暂停/恢复（纯 class 切换，不动 JS 节奏）
    function setBeamPaused(paused) {
      var f = document.getElementById('scanFrame');
      if (f) f.classList.toggle('is-paused', !!paused);
    }

    // ---------- 1.5 停留 3s 未识别：半透明提示条浮现，自动消失，之后周期性轻提醒 ----------
    function startSlowHints() {
      stopSlowHints();
      SCAN.slowTimer = setTimeout(showSlowHint, 3000);
    }
    function showSlowHint() {
      if (!SCAN.scanning) return;
      var el = document.getElementById('slowHint');
      if (!el) return;
      el.classList.add('show');
      SCAN.slowHideTimer = setTimeout(function () { el.classList.remove('show'); }, 3500);
      SCAN.slowTimer = setTimeout(showSlowHint, 12000);
    }
    function stopSlowHints() {
      clearTimeout(SCAN.slowTimer);
      clearTimeout(SCAN.slowHideTimer);
      var el = document.getElementById('slowHint');
      if (el) el.classList.remove('show');
    }

    // ---------- 2. 二维码识别引擎 ----------
    function initDetector() {
      if ('BarcodeDetector' in window) {
        try {
          SCAN.detector = new BarcodeDetector({ formats: ['qr_code'] });
          SCAN.useNativeDetector = true;
          updateEngineHint();
          return;
        } catch (e) { /* 初始化失败则回退 */ }
      }
      SCAN.useNativeDetector = false;
      updateEngineHint();
    }

    function updateEngineHint() {
      var qrPart = SCAN.useNativeDetector ? 'BarcodeDetector' : (typeof jsQR === 'function' ? '本地 jsQR' : '二维码引擎准备中');
      var el = document.getElementById('engineHint');
      if (typeof Tesseract === 'undefined') {
        // 引擎正在后台异步加载：不白屏、不吓用户，先出相机画面
        el.textContent = '识别引擎后台准备中，可先扫码或手动输入';
        el.style.fontSize = '12px';
        el.style.color = 'rgba(255,255,255,0.78)';
        el.style.padding = '0 16px';
        el.style.lineHeight = '1.5';
      } else {
        var ocrPart = '本地 Tesseract OCR';
        el.textContent = '识别引擎：' + qrPart + ' + ' + ocrPart + '（完全离线）';
      }
    }

    function startDetectLoop() {
      SCAN.scanning = true;
      scheduleDetect();
    }

    // 帧调度：优先 requestVideoFrameCallback（有新视频帧才算，省电且不掉帧），
    // 不支持时回退 requestAnimationFrame 节流循环
    function scheduleDetect() {
      if (!SCAN.scanning) return;
      var gen = SCAN.loopGen;
      var v = SCAN.video;
      if (v && typeof v.requestVideoFrameCallback === 'function') {
        v.requestVideoFrameCallback(function () {
          // 代际过期（期间发生过暂停/重启）则直接丢弃，避免出现两条识别链抢 CPU 造成卡顿
          if (!SCAN.scanning || gen !== SCAN.loopGen) return;
          detectFrame(performance.now());
        });
      } else {
        requestAnimationFrame(function (ts) {
          if (!SCAN.scanning || gen !== SCAN.loopGen) return;
          detectFrame(ts);
        });
      }
    }

    function pauseScan() {
      SCAN.loopGen++;
      SCAN.scanning = false;
      stopSlowHints();
      setBeamPaused(true);
    }

    function resumeScan() {
      if (!SCAN.stream) { retryCamera(); return; }
      if (SCAN.scanning) return; // 已在跑：绝不重复起链
      // 重置调度时间戳：恢复后立刻分析一帧，而不是补齐暂停期间欠下的 OCR/解码
      SCAN.lastScanAt = 0;
      SCAN.lastOcrAt = 0;
      setBeamPaused(false);
      startDetectLoop();
      startSlowHints();
    }

    // 切换模式时的软重启：丢弃在途帧回调，下一帧重新起链，避免切号瞬间掉帧卡顿
    function softRestartLoop() {
      pauseScan();
      requestAnimationFrame(function () {
        if (SCAN.stream) resumeScan();
      });
    }

    function detectFrame(ts) {
      if (!SCAN.scanning) return;
      // 二维码：按档位节流分析（约 200–350ms 一帧），不逐帧识别
      if (ts - SCAN.lastScanAt >= SCAN.scanInterval && SCAN.video.readyState >= 2 && !SCAN.busy) {
        SCAN.lastScanAt = ts;
        detectOnce().then(function (text) {
          if (text) onDecoded(text, 'qr');   // 识别成功 → onDecoded 内立即 pauseScan 停止分析
        });
      }
      // OCR：按档位节流（3.2s / 5s，低配更省电），仅在没有二维码解码进行中时
      if (ts - SCAN.lastOcrAt >= SCAN.ocrInterval && SCAN.video.readyState >= 2 && !SCAN.busy) {
        SCAN.lastOcrAt = ts;
        runOcrFrame();
      }
      scheduleDetect();
    }

    async function detectOnce() {
      if (SCAN.busy) return null;
      SCAN.busy = true;
      try {
        if (SCAN.useNativeDetector && SCAN.detector) {
          // 只截取扫描框区域送检，不处理整张摄像头画面
          var region = cropScanFrame(480);
          if (!region) return null;
          var codes = await SCAN.detector.detect(region);
          if (codes && codes.length > 0 && codes[0].rawValue) return codes[0].rawValue;
          return null;
        }
        return detectWithJsQR();
      } catch (e) {
        return null;
      } finally {
        SCAN.busy = false;
      }
    }

    // 截取扫描框映射到视频源的区域，缩放到 maxSide 内（降低 CPU/GPU 压力）
    function cropScanFrame(maxSide) {
      var v = SCAN.video;
      var vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) return null;
      var r = computeScanRegion(vw, vh);
      if (r.w < 10 || r.h < 10) return null;
      var scale = Math.min(1, maxSide / Math.max(r.w, r.h));
      var c = SCAN.canvas;
      c.width = Math.max(1, Math.round(r.w * scale));
      c.height = Math.max(1, Math.round(r.h * scale));
      SCAN.ctx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
      return c;
    }

    // jsQR：在扫描框截取区域内做本地解码
    function detectWithJsQR() {
      if (typeof jsQR !== 'function') return null;
      var c = cropScanFrame(480);
      if (!c) return null;
      var img = SCAN.ctx.getImageData(0, 0, c.width, c.height);
      var result = jsQR(img.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      return result && result.data ? result.data : null;
    }

    // 屏幕上的扫描框（object-fit: cover 显示）→ 视频源像素坐标
    function computeScanRegion(vw, vh) {
      var v = SCAN.video;
      var vr = v.getBoundingClientRect();
      var fr = document.getElementById('scanFrame').getBoundingClientRect();
      var scale = Math.max(vr.width / vw, vr.height / vh);
      var dispW = vw * scale, dispH = vh * scale;
      var offX = (dispW - vr.width) / 2, offY = (dispH - vr.height) / 2;
      var pad = fr.width * 0.5;
      var sx = (fr.left - vr.left - pad + offX) / scale;
      var sy = (fr.top - vr.top - pad + offY) / scale;
      var sw = (fr.width + pad * 2) / scale;
      var sh = (fr.height + pad * 2) / scale;
      sx = Math.max(0, Math.min(vw - 2, sx));
      sy = Math.max(0, Math.min(vh - 2, sy));
      return { x: sx, y: sy, w: Math.min(sw, vw - sx), h: Math.min(sh, vh - sy) };
    }

    // ---------- 2.5 本地 OCR 引擎（Tesseract.js，文件全部在 libs/tesseract/） ----------
    // 仅识别扫描框区域，限制字符集为数字/字母/短横线，降低误识别与耗时
    async function ensureOcrWorker() {
      if (SCAN.ocrReady) return true;
      if (SCAN.ocrLoading) return false;
      // 引擎脚本改为空闲异步注入：未到位时先等加载（不阻塞 UI），加载失败则放弃 OCR
      if (typeof Tesseract === 'undefined') {
        var tipEl = document.getElementById('scanTip');
        if (tipEl) tipEl.textContent = '本地识别引擎准备中…';
        await enginesReady();
        if (SCAN.ocrReady) return true;
        if (SCAN.ocrLoading) return false;
        if (typeof Tesseract === 'undefined') return false;
      }
      SCAN.ocrLoading = true;
      document.getElementById('scanTip').textContent = '正在启动本地 OCR 引擎…';
      try {
        var worker = Tesseract.createWorker({
          workerPath: 'libs/tesseract/worker.min.js',
          corePath: 'libs/tesseract/core',
          langPath: 'libs/tesseract/lang',
          logger: function () {},
        });
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        // 限定识别范围：数字、大写字母、短横线、冒号（取件码字符集）
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-: ',
          tessedit_pageseg_mode: '6',
        });
        SCAN.ocrWorker = worker;
        SCAN.ocrReady = true;
        document.getElementById('scanTip').textContent = '将取件码对准扫描框，支持二维码与面单数字';
        return true;
      } catch (e) {
        SCAN.ocrLoading = false;
        // 不弹常驻提示：3s 慢提示会引导用户手动输入
        return false;
      }
    }

    // 抓取扫描框区域（仅 drawImage，重活交给 Worker / 识别交给 Tesseract 独立线程）
    // zoom: 1 = 扫描框原区域（远距离，覆盖面大）；2 = 中心 60% 再裁剪（近距离，取件码字更大）
    function captureOcrCanvas(zoom) {
      var v = SCAN.video;
      var vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) return null;
      var r = computeScanRegion(vw, vh);
      if (r.w < 40 || r.h < 40) return null;
      if (zoom === 2) {
        var cw = r.w * 0.6, ch = r.h * 0.6;
        r = { x: r.x + (r.w - cw) / 2, y: r.y + (r.h - ch) / 2, w: cw, h: ch };
        if (r.w < 40 || r.h < 40) return null;
      }
      var c = document.createElement('canvas');
      c.width = Math.round(r.w);
      c.height = Math.round(r.h);
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
      return c;
    }

    // ---------- 2.6 OCR 预处理 Worker（ocr-worker.js） ----------
    // 流水线：Camera → 截取扫描区域 → ImageBitmap → Worker（灰度+二值化+放大）→ 回传
    //         → Tesseract（内部独立线程）OCR → 提取取件码
    // 主线程只做小图 drawImage，识别与预处理均不阻塞动画/点击。
    // 降级：不支持 Worker / OffscreenCanvas / ImageBitmap 时回退主线程同步预处理。
    function ensureOcrPipe() {
      if (SCAN.ocrPipe === undefined) {
        try { SCAN.ocrPipe = new Worker('ocr-worker.js'); } catch (e) { SCAN.ocrPipe = null; }
        if (SCAN.ocrPipe) {
          SCAN.ocrPend = {};
          SCAN.ocrPipe.onmessage = function (ev) {
            var m = ev.data || {};
            var cb = SCAN.ocrPend[m.id];
            if (!cb) return;
            delete SCAN.ocrPend[m.id];
            clearTimeout(cb.timer);
            cb.resolve(m.type === 'binarized' ? m.bitmap : null);
          };
          SCAN.ocrPipe.onerror = function () {
            // Worker 异常：终止并永久回退同步路径
            try { SCAN.ocrPipe.terminate(); } catch (e) {}
            SCAN.ocrPipe = null;
            Object.keys(SCAN.ocrPend).forEach(function (k) {
              clearTimeout(SCAN.ocrPend[k].timer);
              SCAN.ocrPend[k].resolve(null);
            });
            SCAN.ocrPend = {};
          };
        }
      }
      return SCAN.ocrPipe;
    }

    function preprocessViaWorker(source, scale, threshold) {
      return new Promise(function (resolve) {
        var w = ensureOcrPipe();
        if (!w || typeof createImageBitmap !== 'function' || typeof OffscreenCanvas === 'undefined') { resolve(null); return; }
        var id = ++SCAN.ocrSeq;
        var timer = setTimeout(function () {  // 3s 超时 → 回退同步
          if (SCAN.ocrPend[id]) { SCAN.ocrPend[id].resolve(null); delete SCAN.ocrPend[id]; }
        }, 3000);
        SCAN.ocrPend[id] = { resolve: resolve, timer: timer };
        createImageBitmap(source).then(function (bmp) {
          if (!SCAN.ocrPipe) { if (bmp.close) bmp.close(); resolve(null); return; }
          w.postMessage({ type: 'binarize', id: id, bitmap: bmp, scale: scale, threshold: threshold }, [bmp]);
        }).catch(function () {
          if (SCAN.ocrPend[id]) { clearTimeout(SCAN.ocrPend[id].timer); SCAN.ocrPend[id].resolve(null); delete SCAN.ocrPend[id]; }
        });
      });
    }

    // Worker 回传的 ImageBitmap → canvas（Tesseract 识别输入）
    function bitmapToCanvas(bitmap) {
      if (!bitmap) return null;
      var c = document.createElement('canvas');
      c.width = bitmap.width; c.height = bitmap.height;
      c.getContext('2d').drawImage(bitmap, 0, 0);
      if (bitmap.close) bitmap.close();
      return c;
    }

    // 同步回退：放大 + 灰度 + 二值化（主线程，仅在 Worker 不可用时）
    function binarizeCanvasSync(src, scale, threshold) {
      var ow = Math.max(1, Math.round(src.width * scale));
      var oh = Math.max(1, Math.round(src.height * scale));
      var c = document.createElement('canvas');
      c.width = ow; c.height = oh;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(src, 0, 0, ow, oh);
      var img = ctx.getImageData(0, 0, ow, oh);
      var d = img.data;
      for (var i = 0; i < d.length; i += 4) {
        var g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        g = g < threshold ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = g;
      }
      ctx.putImageData(img, 0, 0);
      return c;
    }

    // 统一预处理入口：Worker 优先，失败回退同步
    async function preprocessForOcr(source, scale, threshold) {
      var bmp = await preprocessViaWorker(source, scale, threshold);
      var c = bitmapToCanvas(bmp);
      return c || binarizeCanvasSync(source, scale, threshold);
    }

    async function runOcrFrame() {
      if (SCAN.ocrBusy || !SCAN.scanning) return;
      SCAN.ocrBusy = true;
      try {
        var ok = await ensureOcrWorker();
        if (!ok || !SCAN.scanning) return;
        // 远近交替识别：奇数轮全框（远距离整面单扫描），偶数轮中心 60% 放大 3 倍
        // （近距离拍取件码时字更大、二值化后更清晰），大幅提升远近两种距离的命中效率
        SCAN.ocrRound = (SCAN.ocrRound || 0) + 1;
        var near = SCAN.ocrRound % 2 === 0;
        var c = captureOcrCanvas(near ? 2 : 1);
        if (!c) return;
        var processed = await preprocessForOcr(c, near ? 3 : 2, 128);   // 放大 2/3 倍 + 二值化增强
        var result = await SCAN.ocrWorker.recognize(processed);
        var text = result && result.data && result.data.text ? result.data.text : '';
        if (text && text.replace(/\s/g, '').length >= 3) {
          onOcrText(text);
        }
      } catch (e) { /* 单帧失败忽略 */ } finally {
        SCAN.ocrBusy = false;
      }
    }

    // OCR 文本 → 提取取件码 → 匹配本地快递库
    async function onOcrText(text) {
      if (SCAN.lastOcrText === text) return; // 同文本去重
      SCAN.lastOcrText = text;
      // 导入本地模式：OCR 提取到取件码 → 直接打开导入抽屉
      if (SCAN.mode === 'import') {
        var code = extractPickupCode(text);
        if (code && /^\d+-\d+-\d+$/.test(code)) {
          pauseScan();
          if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
          flashSuccessFrame();
          openImportSheet(code);
        } else if (code) {
          App.toast('识别到 ' + code + '，请确认是否为取件码', 2200);
        }
        return;
      }
      // 取件模式（原流程）：OCR 文本匹配本地快递库
      var result = API.resolveScanText(text);
      if (result.status === 'pending' && result.pkg) {
        pauseScan();
        if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
        flashSuccessFrame();
        // 灰度模式：本地匹配后必须再走后端校验
        if (isGrayScan()) {
          var v = await grayVerifyPickupCode(result.pkg.pickupCode, result.pkg.id);
          if (!v.ok || !v.allowPickup) {
            App.toast(v.message || '该取件码不属于当前用户', 2400);
            resumeScan();
            return;
          }
        }
        showPickupConfirm(result.pkg);
      } else if (result.status === 'notfound') {
        // 识别到了文字但没匹配上：轻提示一次，不弹窗打断
        var c = result.candidates && result.candidates[0];
        if (c) App.toast('识别到 ' + c + '，未匹配到快递', 2200);
      }
      // empty：无有效文字，静默继续
    }

    // 绿色识别框 + 框内对勾（0.3s）
    function flashSuccessFrame() {
      var frame = document.getElementById('scanFrame');
      frame.classList.add('scan-frame--success');
      setTimeout(function () { frame.classList.remove('scan-frame--success'); }, 800);
    }

    // ---------- 3. 扫码结果 → 本地快递数据 ----------
    async function onDecoded(text) {
      pauseScan();
      if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
      flashSuccessFrame();
      // 导入本地模式：不走 API.resolveScanCode，直接提取取件码 → 打开导入抽屉
      if (SCAN.mode === 'import') {
        var code = extractPickupCode(text);
        if (code) {
          openImportSheet(code);
        } else {
          showScanFailed('未识别到取件码，请重新扫描或手动输入');
        }
        return;
      }
      // 取件模式（原流程）
      var result = API.resolveScanCode(text);
      if (result.status === 'pending' && result.pkg) {
        // 灰度模式：本地匹配后必须再走后端校验，避免使用他人取件码
        if (isGrayScan()) {
          App.showLoading();
          var v = await grayVerifyPickupCode(result.pkg.pickupCode, result.pkg.id);
          App.hideLoading();
          if (!v.ok || !v.allowPickup) {
            showScanFailed(v.message || '该取件码不属于当前用户，请重新扫描');
            return;
          }
        }
        showPickupConfirm(result.pkg);
      } else {
        showScanFailed(result.message || '未识别到快递二维码');
      }
    }

    // 从扫码原文中提取取件码（支持纯数字-数字-数字 / JSON / 纯文本）
    function extractPickupCode(raw) {
      if (!raw) return '';
      var text = String(raw).trim();
      // JSON 形式：{"qrCode":"8-3-267","pickupCode":"8-3-267"}
      if (text.charAt(0) === '{') {
        try {
          var obj = JSON.parse(text);
          if (obj && typeof obj === 'object') {
            return obj.qrCode || obj.pickupCode || obj.code || '';
          }
        } catch (e) { /* 非法 JSON，按纯文本处理 */ }
      }
      // 纯取件码（如 8-3-267 / 9-2-345）
      if (/^\d+-\d+-\d+$/.test(text)) return text;
      // 从文本中提取第一个 数字-数字-数字 模式
      var m = text.match(/\d+-\d+-\d+/);
      if (m) return m[0];
      // 兜底：4 位以上纯数字/字母组合
      m = text.match(/[A-Z0-9-]{4,}/);
      return m ? m[0] : text;
    }

    function showScanFailed(message) {
      App.showModal({
        title: '未识别到快递二维码',
        icon: 'error',
        desc: message,
        actions: [
          { label: '手动输入', style: 'btn-outline', onClick: function () { showManualInput(); } },
          { label: '重新扫描', style: 'btn-primary', onClick: function () { resumeScan(); } },
        ],
        onCancel: function () { resumeScan(); },
      });
    }

    function showPickupConfirm(pkg) {
      App.showModal({
        title: '发现快递',
        icon: 'success',
        desc: '<div style="text-align:center;line-height:1.8;">' +
          '<div style="font-weight:600;color:#1E293B;font-size:15px;">' + pkg.company + ' ' + pkg.trackingNo + '</div>' +
          '<div style="margin-top:6px;">取件码: <span style="font-family:monospace;font-weight:700;color:#2563EB;">' + pkg.pickupCode + '</span></div>' +
          '<div>取件点: ' + pkg.pickupPoint + '</div>' +
          '</div>',
        confirmText: '确认取件',
        cancelText: '取消',
        onConfirm: async function () {
          App.showLoading();
          try {
            // 灰度模式：走后端 scanConfirm；本地/demo 模式走 API.confirmPickup
            var success = false;
            var failMsg = '';
            if (isGrayScan()) {
              var r = await grayConfirmPickup(pkg.id);
              success = r.ok;
              failMsg = r.message;
            } else {
              var res = await API.confirmPickup(pkg.id);
              success = !!(res.data && res.data.success);
              failMsg = res.data && res.data.message;
            }
            App.hideLoading();
            if (success) {
              stopCamera();
              showSuccessOverlay(pkg);
            } else {
              App.showModal({ title: '取件失败', icon: 'error', desc: failMsg || '取件失败', confirmText: '知道了' });
              resumeScan();
            }
          } catch (e) {
            App.hideLoading();
            App.toast('操作失败，请稍后重试');
            resumeScan();
          }
        },
        onCancel: function () { resumeScan(); },
      });
    }

    function showSuccessOverlay(pkg) {
      var overlay = document.getElementById('successOverlay');
      document.getElementById('successCompany').textContent = pkg.company;
      document.getElementById('successTracking').textContent = pkg.trackingNo;
      document.getElementById('successCode').textContent = pkg.pickupCode;
      document.getElementById('successPoint').textContent = pkg.pickupPoint;
      overlay.classList.add('show');
    }

    // ---------- 4. 闪光灯（真实 torch 能力，不支持时明确提示） ----------
    function getVideoTrack() {
      if (!SCAN.stream) return null;
      var tracks = SCAN.stream.getVideoTracks();
      return tracks.length ? tracks[0] : null;
    }

    async function toggleFlash() {
      var track = getVideoTrack();
      if (!track) { App.toast('摄像头未启动'); return; }
      var caps = track.getCapabilities ? track.getCapabilities() : null;
      if (!caps || !caps.torch) { App.toast('当前设备不支持闪光灯'); return; }
      try {
        SCAN.torchOn = !SCAN.torchOn;
        await track.applyConstraints({ advanced: [{ torch: SCAN.torchOn }] });
        document.getElementById('flashBtn').classList.toggle('active', SCAN.torchOn);
        App.toast(SCAN.torchOn ? '闪光灯已开启' : '闪光灯已关闭');
      } catch (e) {
        SCAN.torchOn = false;
        App.toast('当前设备不支持闪光灯');
      }
    }

    // ---------- 5. 相册图片识别（本地解码，不上传） ----------
    function openAlbum() {
      var input = document.getElementById('albumInput');
      input.value = '';
      input.click();
    }

    function handleAlbumChange(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      App.showLoading();
      decodeImageFile(file).then(function (text) {
        if (text) { App.hideLoading(); onDecoded(text); return null; }
        // 二维码未命中 → 尝试本地 OCR 识别图片中的取件码
        return ocrImageFile(file);
      }).then(function (ocrText) {
        App.hideLoading();
        if (ocrText) {
          var result = API.resolveScanText(ocrText);
          if (result.status === 'pending' && result.pkg) { flashSuccessFrame(); showPickupConfirm(result.pkg); return; }
          showScanFailed(result.message || '未识别到取件码');
        } else {
          showScanFailed('未能从所选图片中识别到二维码或取件码');
        }
      }).catch(function () {
        App.hideLoading();
        App.toast('图片识别失败，请更换图片');
      });
    }

    // 相册图片 OCR（本地 Tesseract，不上传；预处理走 Worker）
    async function ocrImageFile(file) {
      var ok = await ensureOcrWorker();
      if (!ok) return null;
      var src = await loadImageSource(file);
      try {
        var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
        var scale = Math.min(2, 900 / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * scale);
        c.height = Math.round(h * scale);
        var ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(src, 0, 0, c.width, c.height);
        var processed = await preprocessForOcr(c, 1, 140);   // 二值化增强（Worker 优先）
        var result = await SCAN.ocrWorker.recognize(processed);
        return result && result.data && result.data.text ? result.data.text : null;
      } finally {
        if (src.close) src.close();
      }
    }

    function loadImageSource(file) {
      if (typeof createImageBitmap === 'function') return createImageBitmap(file);
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { resolve(img); URL.revokeObjectURL(url); };
        img.onerror = function () { reject(new Error('image load error')); URL.revokeObjectURL(url); };
        img.src = url;
      });
    }

    async function decodeImageFile(file) {
      var src = await loadImageSource(file);
      try {
        if (SCAN.useNativeDetector && SCAN.detector) {
          var codes = await SCAN.detector.detect(src);
          if (codes && codes.length > 0 && codes[0].rawValue) return codes[0].rawValue;
          return null;
        }
        if (typeof jsQR !== 'function') return null;
        var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
        var scale = Math.min(1, 640 / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * scale));
        c.height = Math.max(1, Math.round(h * scale));
        var ctx = c.getContext('2d');
        ctx.drawImage(src, 0, 0, c.width, c.height);
        var img = ctx.getImageData(0, 0, c.width, c.height);
        var r = jsQR(img.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
        return r && r.data ? r.data : null;
      } finally {
        if (src.close) src.close();
      }
    }

    // ---------- 6. 视图切换 ----------
    function showScanView() {
      var scanView = document.getElementById('scanView');
      var deniedView = document.getElementById('deniedView');
      deniedView.classList.add('hidden');
      scanView.classList.remove('hidden');
      scanView.querySelectorAll('.anim-fade-in-up').forEach(function (el) {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
    }

    function showDeniedView(descHtml) {
      var scanView = document.getElementById('scanView');
      var deniedView = document.getElementById('deniedView');
      stopCamera();
      scanView.classList.add('hidden');
      if (descHtml) document.getElementById('deniedDesc').innerHTML = descHtml;
      deniedView.classList.remove('hidden');
    }

    function deniedHintText(reason) {
      var html = '';
      if (reason) {
        html += reason + '<br>';
      } else {
        html += '请在浏览器权限弹窗中允许访问相机，<br>或在系统设置中开启相机权限<br>';
      }
      if (location.protocol === 'file:') {
        html += '<span style="display:inline-block;margin-top:8px;color:var(--color-warning);">提示：当前以本地文件方式打开，浏览器禁止调用摄像头。<br>请运行 <b>backend/start-backend.cmd</b>（或在 backend 目录执行 npm start），然后访问<br>https://localhost:3000/scan.html</span>';
      }
      return html;
    }

    function goToSettings() {
      App.showModal({
        title: '如何开启相机权限',
        desc: '<div style="text-align:left;line-height:1.9;font-size:13px;">' +
          '1. 点击地址栏左侧的锁形/相机图标<br>' +
          '2. 将「摄像头 / Camera」权限设为允许<br>' +
          '3. 刷新页面后重新扫码<br><br>' +
          'Windows 系统权限：设置 → 隐私和安全性 → 相机<br>' +
          '确保允许桌面应用访问相机' +
          '</div>',
        confirmText: '知道了',
        onConfirm: function () { App.closeModal(); },
      });
    }

    // ---------- 7. 手动输入取件码 ----------
    function showManualInput() {
      App.showModal({
        title: '手动输入取件码',
        desc: '<div style="text-align:left;">' +
          '<input type="text" class="manual-input-field" id="manualCodeInput" placeholder="请输入取件码，如 8-3-267" autocomplete="off" />' +
          '<div class="manual-input-hint">取件码可在快递到达通知短信中查看</div>' +
          '</div>',
        confirmText: '确认取件',
        cancelText: '取消',
        onConfirm: function () {
          var input = document.getElementById('manualCodeInput');
          var code = input ? input.value.trim() : '';
          if (!code) {
            App.toast('请输入取件码');
            return;
          }
          handleManualScan(code);
        },
        onCancel: function () { resumeScan(); },
      });
      setTimeout(function () {
        var input = document.getElementById('manualCodeInput');
        if (input) input.focus();
      }, 350);
    }

    async function handleManualScan(code) {
      // 导入本地模式：手动输入直接进入导入抽屉
      if (SCAN.mode === 'import') {
        flashSuccessFrame();
        openImportSheet(code);
        return;
      }
      // 取件模式（原流程）
      var result = API.resolveScanCode(code);
      if (result.status === 'pending' && result.pkg) {
        // 灰度模式：手动输入同样必须走后端校验
        if (isGrayScan()) {
          App.showLoading();
          var v = await grayVerifyPickupCode(result.pkg.pickupCode, result.pkg.id);
          App.hideLoading();
          if (!v.ok || !v.allowPickup) {
            showScanFailed(v.message || '该取件码不属于当前用户，请重新输入');
            return;
          }
        }
        showPickupConfirm(result.pkg);
      } else {
        showScanFailed(result.message || '未识别到快递二维码');
      }
    }

    // ---------- 3.5 模式切换 + 导入本地抽屉（新功能） ----------
    // 按钮平滑过渡：mode-switch / mode-banner 通过 CSS transition 平滑变色
    function toggleScanMode() {
      SCAN.mode = (SCAN.mode === 'pickup') ? 'import' : 'pickup';
      var btn = document.getElementById('modeSwitch');
      var label = document.getElementById('modeLabel');
      var banner = document.getElementById('modeBanner');
      var bannerText = document.getElementById('modeBannerText');
      var tip = document.getElementById('scanTip');
      if (SCAN.mode === 'import') {
        btn.classList.add('mode-import');
        label.textContent = '导入模式';
        banner.classList.add('mode-import');
        bannerText.textContent = '当前为「导入模式」：扫描快递架上的取件码标签，将快递导入本地列表';
        tip.textContent = '将快递架上的取件码标签对准扫描框';
      } else {
        btn.classList.remove('mode-import');
        label.textContent = '取件模式';
        banner.classList.remove('mode-import');
        bannerText.textContent = '当前为「取件模式」：扫描已到站快递的取件码完成取件';
        tip.textContent = '将取件码对准扫描框，支持二维码与面单数字';
      }
      // 清掉上一模式遗留的 OCR 文案与节流时间戳，软重启识别链，防止切换瞬间卡顿/误触发
      SCAN.lastOcrText = '';
      SCAN.lastScanAt = 0;
      SCAN.lastOcrAt = 0;
      stopSlowHints();
      if (SCAN.stream && !document.getElementById('importSheet').classList.contains('show')) {
        softRestartLoop();
      }
    }

    // 打开导入抽屉（从底部滑入，沉浸式过渡）
    function openImportSheet(code) {
      SCAN.importCode = code;
      document.getElementById('importCodeDisplay').textContent = code;
      // 重置选择
      SCAN.importSelectedCompany = null;
      SCAN.importSelectedPoint = null;
      var companyChips = document.querySelectorAll('#companyChips .chip');
      companyChips.forEach(function (c) { c.classList.remove('selected'); });
      var pointChips = document.querySelectorAll('#pointChips .chip');
      pointChips.forEach(function (c) { c.classList.remove('selected'); });
      // 默认选中顺丰 + 涵江校园驿站
      var defaultCompany = document.querySelector('#companyChips .chip[data-company="顺丰"]');
      if (defaultCompany) selectChip(defaultCompany, 'company');
      var defaultPoint = document.querySelector('#pointChips .chip[data-point="涵江校园驿站"]');
      if (defaultPoint) selectChip(defaultPoint, 'point');
      // 停止摄像头避免抽屉滚动时画面干扰
      pauseScan();
      // 显示遮罩 + 抽屉（CSS 过渡自动平滑滑入）
      document.getElementById('importMask').classList.add('show');
      document.getElementById('importSheet').classList.add('show');
    }

    function closeImportSheet() {
      document.getElementById('importMask').classList.remove('show');
      document.getElementById('importSheet').classList.remove('show');
      // 抽屉关闭后恢复扫码循环
      setTimeout(function () {
        if (SCAN.stream && !document.getElementById('successOverlay').classList.contains('show')) {
          resumeScan();
        }
      }, 350);
    }

    // 选择快递公司/取件点 chip
    function selectChip(el, type) {
      var container = el.parentElement;
      var siblings = container.querySelectorAll('.chip');
      siblings.forEach(function (s) { s.classList.remove('selected'); });
      el.classList.add('selected');
      if (type === 'company') {
        SCAN.importSelectedCompany = el.getAttribute('data-company');
        SCAN.importSelectedShort = el.getAttribute('data-short') || SCAN.importSelectedCompany;
        SCAN.importSelectedColor = el.getAttribute('data-color') || '#64748B';
      } else if (type === 'point') {
        SCAN.importSelectedPoint = el.getAttribute('data-point');
        SCAN.importSelectedType = el.getAttribute('data-type') || 'station';
      }
    }
    window.selectChip = selectChip;
    window.toggleScanMode = toggleScanMode;
    window.closeImportSheet = closeImportSheet;
    window.openImportSheet = openImportSheet;
    window.submitImportLocal = submitImportLocal;

    // 提交导入本地 —— 调用 Storage.addLocalPackage，不走云端
    function submitImportLocal() {
      if (!SCAN.importCode) {
        App.toast('取件码为空，请重新扫描');
        return;
      }
      if (!SCAN.importSelectedCompany) {
        App.toast('请选择快递公司');
        return;
      }
      if (!SCAN.importSelectedPoint) {
        App.toast('请选择取件点');
        return;
      }
      var result = Storage.addLocalPackage({
        pickupCode: SCAN.importCode,
        company: SCAN.importSelectedCompany,
        shortName: SCAN.importSelectedShort,
        logoColor: SCAN.importSelectedColor,
        pickupPoint: SCAN.importSelectedPoint,
        type: SCAN.importSelectedType,
        sender: '扫描导入',
      });
      if (result.success) {
        // 关闭抽屉 → 显示沉浸式成功 overlay
        document.getElementById('importMask').classList.remove('show');
        document.getElementById('importSheet').classList.remove('show');
        stopCamera();
        showImportSuccessOverlay(result.pkg);
      } else {
        App.showModal({
          title: '导入失败',
          icon: 'warning',
          desc: result.message || '导入失败，请稍后重试',
          confirmText: '知道了',
          onConfirm: function () { App.closeModal(); closeImportSheet(); },
        });
      }
    }

    // 导入成功的沉浸式 overlay（复用 success-overlay 结构，但标题改为"已导入本地"）
    function showImportSuccessOverlay(pkg) {
      var overlay = document.getElementById('successOverlay');
      document.getElementById('successOverlayTitle').textContent = '已导入本地';
      document.getElementById('successCompany').textContent = pkg.company;
      document.getElementById('successTracking').textContent = pkg.trackingNo;
      document.getElementById('successCode').textContent = pkg.pickupCode;
      document.getElementById('successPoint').textContent = pkg.pickupPoint;
      var btn = document.getElementById('successOverlayBtn');
      btn.textContent = '去查看快递';
      btn.onclick = function () { location.href = 'packages.html'; };
      overlay.classList.add('show');
    }

    // 页面离开时释放摄像头（pagehide 统一处理：停识别链 + 停所有媒体轨 + 释放 OCR worker）
    window.addEventListener('pagehide', stopCamera);
  </script>
</body>
</html>
