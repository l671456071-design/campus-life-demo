<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>首页 - 校园智能生活</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== 生活门户首页 ===== */
    .home-hello { padding: 18px 16px 4px; }
    .home-hello .hello-title { font-size: 24px; font-weight: 800; color: var(--color-text); letter-spacing: 0.2px; }
    .home-hello .hello-date { font-size: 13px; color: var(--color-text-sub); margin-top: 4px; }

    .life-section { padding: 20px 16px 0; }
    .life-section .section-header { margin-bottom: 10px; }

    /* —— 热门应用：2×2 大卡 —— */
    .life-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .life-card {
      position: relative;
      background: var(--color-surface);
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      display: block;
      text-decoration: none;
    }
    .life-card:active { transform: scale(0.96); box-shadow: var(--shadow-md); }
    .life-card-icon {
      width: 44px; height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .life-card-title { font-size: 16px; font-weight: 700; color: var(--color-text); }
    .life-card-sub { font-size: 12px; color: var(--color-text-hint); margin-top: 3px; }
    .life-card-deco {
      position: absolute; right: -10px; bottom: -14px;
      width: 76px; height: 76px; opacity: 0.10;
    }
    /* 扫码取件：热门首位蓝底高亮 */
    .life-card--hero {
      background: linear-gradient(135deg, #2563EB, #3B82F6);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
    }
    .life-card--hero .life-card-title,
    .life-card--hero .life-card-sub { color: #fff; }
    .life-card--hero .life-card-sub { opacity: 0.82; }
    .life-card--hero .life-card-deco { opacity: 0.16; }

    /* —— 日常应用：横向小卡，每行两张 —— */
    .svc-row { display: flex; gap: 12px; }
    .svc-row + .svc-row { margin-top: 12px; }
    .svc-card {
      flex: 1; display: flex; align-items: center; gap: 12px;
      background: var(--color-surface);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
    }
    .svc-card:active { transform: scale(0.96); }
    .svc-icon {
      width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .svc-title { font-size: 15px; font-weight: 700; color: var(--color-text); }
    .svc-sub { font-size: 11px; color: var(--color-text-hint); margin-top: 2px; }

    /* —— 其余应用：四宫格紧凑入口 —— */
    .more-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    .more-item {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 4px 12px;
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .more-item:active { transform: scale(0.94); }
    .more-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .more-label { font-size: 12px; font-weight: 600; color: var(--color-text); }
    .more-dot {
      position: absolute; top: 9px; right: 11px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-danger); display: none;
    }
  </style>
</head>
<body data-page="home">

  <script>
    (function () {
      // 问候语 + 日期
      var user = Storage.getUser();
      var name = user && user.name && user.name !== '校园用户' ? user.name : '同学';
      document.getElementById('helloName').textContent = '你好，' + name;
      var d = new Date();
      var week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
      document.getElementById('helloDate').textContent =
        (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + week;

      // 未读消息红点（头部铃铛 + 其余应用「消息」入口）
      function renderBadges() {
        var has = Storage.getUnreadCount() > 0;
        var badge = document.getElementById('msgBadge');
        if (badge) badge.style.display = has ? 'block' : 'none';
        var dot = document.getElementById('msgDot');
        if (dot) dot.style.display = has ? 'block' : 'none';
      }
      renderBadges();

      // 下拉刷新（仅刷新红点）
      App.initPullToRefresh(document.getElementById('mainContent'), function () {
        renderBadges();
        App.toastSuccess('已刷新');
        return Promise.resolve();
      });
    })();
  </script>
