<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>首页 - 校园智能生活</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">

  <style>
    /* ===== 生活门户首页（单色调 · 大留白 · 每屏一个焦点：AI 搜索栏） ===== */
    .home-hello { padding: 16px 16px 12px; }
    .home-hello .hello-title { font-size: 22px; font-weight: 800; color: var(--color-text); letter-spacing: 0.2px; }
    .home-hello .hello-date { font-size: 13px; color: var(--color-text-sub); margin-top: 4px; }

    .life-section { padding: 18px 16px 0; }
    .life-section .section-header { margin-bottom: 12px; }

    /* —— AI 搜索栏：本页唯一视觉焦点 —— */
    .ai-search-bar {
      display: flex; align-items: center; gap: 10px;
      margin: 2px 16px 0;
      background: var(--color-surface);
      border-radius: 999px;
      padding: 12px 16px;
      box-shadow: var(--shadow-md);
      text-decoration: none;
      border: 1.5px solid rgba(37, 99, 235, 0.12);
      transition: transform 0.2s;
    }
    .ai-search-bar:active { transform: scale(0.98); }
    .ai-search-ic {
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #2563EB, #60A5FA);
      box-shadow: 0 3px 8px rgba(37, 99, 235, .3);
    }
    .ai-search-ic svg { width: 16px; height: 16px; }
    .ai-search-text { flex: 1; min-width: 0; }
    .ai-search-ph { font-size: 14px; color: var(--color-text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ai-search-tag {
      flex: none; font-size: 11px; font-weight: 700; color: var(--color-primary);
      background: var(--color-primary-lighter, #EFF6FF);
      border-radius: 999px; padding: 4px 10px;
    }

    /* —— 常用：4 个 —— */
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .quick-item {
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      text-decoration: none;
      padding: 6px 2px;
      transition: transform 0.2s;
    }
    .quick-item:active { transform: scale(0.93); }
    .quick-icon {
      width: 52px; height: 52px; border-radius: 17px;
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .quick-icon svg { width: 24px; height: 24px; }
    .quick-label { font-size: 12.5px; font-weight: 600; color: var(--color-text); }

    /* —— 全部应用：四宫格，默认折叠 —— */
    .all-apps-wrap {
      overflow: hidden;
      max-height: 340px;
      transition: max-height 0.35s ease;
      position: relative;
    }
    .all-apps-wrap.collapsed::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
      background: linear-gradient(180deg, rgba(248,250,252,0), var(--color-bg));
      pointer-events: none;
    }
    .more-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .more-item {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 4px 12px;
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      transition: transform 0.2s;
    }
    .more-item:active { transform: scale(0.94); }
    .more-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-primary-lighter, #EFF6FF);
    }
    .more-icon svg { width: 20px; height: 20px; }
    .more-label { font-size: 12px; font-weight: 600; color: var(--color-text); }
    .more-dot {
      position: absolute; top: 9px; right: 11px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-danger); display: none;
    }
    .apps-toggle {
      display: block;
      margin: 12px auto 0;
      background: var(--color-surface);
      border: none;
      border-radius: 999px;
      padding: 9px 22px;
      font-size: 13px; font-weight: 600;
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }
    .apps-toggle:active { transform: scale(0.96); }
    .apps-toggle svg { width: 14px; height: 14px; vertical-align: -2px; margin-left: 2px; transition: transform .3s; }
    .all-apps-wrap:not(.collapsed) + .apps-toggle svg { transform: rotate(180deg); }
  </style>
</head>

  <script>
    (function () {
      // 问候语 + 日期
      var user = Storage.getUser();
      var name = user && user.name && user.name !== '校园用户' ? user.name : '同学';
      document.getElementById('helloName').textContent = '你好，' + name;
      var d = new Date();
      var week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
      document.getElementById('helloDate').textContent =
        (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + week;

      // 未读消息红点（头部铃铛 + 全部应用「消息」入口）
      function renderBadges() {
        var has = Storage.getUnreadCount() > 0;
        var badge = document.getElementById('msgBadge');
        if (badge) badge.style.display = has ? 'block' : 'none';
        var dot = document.getElementById('msgDot');
        if (dot) dot.style.display = has ? 'block' : 'none';
      }
      renderBadges();

      // 全部应用折叠 / 展开
      var wrap = document.getElementById('allAppsWrap');
      var toggleBtn = document.getElementById('appsToggle');
      function syncHeight() {
        if (wrap.classList.contains('collapsed')) {
          wrap.style.maxHeight = '340px';
          toggleBtn.innerHTML = '展开全部应用<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
        } else {
          wrap.style.maxHeight = wrap.scrollHeight + 'px';
          toggleBtn.innerHTML = '收起<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
        }
      }
      toggleBtn.addEventListener('click', function () {
        wrap.classList.toggle('collapsed');
        syncHeight();
      });
      syncHeight();

      // 下拉刷新（仅刷新红点）
      App.initPullToRefresh(document.getElementById('mainContent'), function () {
        renderBadges();
        App.toastSuccess('已刷新');
        return Promise.resolve();
      });
    })();
  </script>
