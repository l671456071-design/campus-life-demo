<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>校园外卖 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== Food Page Styles ===== */
    .food-loc {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 20px 4px;
      font-size: 13px;
      color: var(--color-text-sub);
    }
    .food-loc svg { width: 15px; height: 15px; color: var(--color-primary); flex-shrink: 0; }
    .food-loc strong { color: var(--color-text); font-weight: 600; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 进行中订单条 */
    .food-active-order {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 16px 0;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: linear-gradient(90deg, var(--color-warning-light), var(--color-orange-light));
      cursor: pointer;
      transition: transform 0.15s;
    }
    .food-active-order:active { transform: scale(0.98); }
    .food-active-order .ao-emoji { font-size: 24px; line-height: 1; flex-shrink: 0; }
    .food-active-order .ao-body { flex: 1; min-width: 0; }
    .food-active-order .ao-title { font-size: 13px; font-weight: 600; color: var(--color-text); }
    .food-active-order .ao-sub { font-size: 12px; color: var(--color-text-sub); margin-top: 2px; }
    .food-active-order .ao-go {
      flex-shrink: 0; display: flex; align-items: center; gap: 2px;
      font-size: 12px; font-weight: 600; color: #B45309;
    }
    .food-active-order .ao-go svg { width: 14px; height: 14px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 4px 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text);
    }
    .section-title .more {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
      font-weight: 400;
      color: var(--color-text-sub);
      text-decoration: none;
    }
    .section-title .more svg { width: 13px; height: 13px; }

    /* 店铺卡片 */
    .shop-card {
      display: flex;
      gap: 12px;
      padding: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.15s;
      position: relative;
    }
    .shop-card:active { transform: scale(0.98); }
    .shop-card--closed { opacity: 0.55; }
    .shop-logo {
      width: 62px; height: 62px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; line-height: 1;
      flex-shrink: 0;
    }
    .shop-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .shop-head { display: flex; align-items: center; gap: 6px; }
    .shop-name { font-size: 15px; font-weight: 700; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shop-open-badge {
      font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: var(--radius-full);
      background: var(--color-success-light); color: var(--color-accent-hover); flex-shrink: 0;
    }
    .shop-open-badge.closed { background: var(--color-bg); color: var(--color-text-hint); }
    .shop-stats { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 12px; color: var(--color-text-sub); flex-wrap: wrap; }
    .shop-rating { color: #F59E0B; font-weight: 700; }
    .shop-notice { font-size: 12px; color: var(--color-text-hint); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shop-promos { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .shop-promo {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 600; color: #E4423A;
      border: 1px solid #FFD7D4; border-radius: 4px;
      padding: 1px 6px; background: #FFF7F6;
    }
    [data-theme="dark"] .shop-promo { background: #3B1D1A; border-color: #7C2D26; color: #FCA5A5; }
    .shop-tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .shop-tag { font-size: 11px; color: var(--color-primary); background: var(--color-primary-lighter); border-radius: 4px; padding: 1px 6px; }

    /* 校区切换 tabs */
    .campus-tabs {
      display: flex; gap: 6px; margin: 8px 16px 0;
      background: var(--color-surface-alt);
      border-radius: var(--radius-md); padding: 4px;
    }
    .campus-tab {
      flex: 1; padding: 8px 0; text-align: center;
      font-size: 13px; font-weight: 600; color: var(--color-text-sub);
      border-radius: var(--radius-sm); border: none; background: none;
      transition: all 0.2s; cursor: pointer;
    }
    .campus-tab.active {
      background: var(--color-surface); color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }
    .campus-tab:active { transform: scale(0.96); }

    /* 小程序合作入口 */
    .mp-section-title {
      display: flex; align-items: center; gap: 6px;
      margin: 20px 4px 10px;
      font-size: 14px; font-weight: 700; color: var(--color-text);
    }
    .mp-section-title::before { content: ''; display: block; width: 4px; height: 14px; border-radius: 2px; background: var(--color-primary); }
    .mp-section-title .mp-tip { font-size: 11px; font-weight: 400; color: var(--color-text-hint); margin-left: 4px; }

    .mp-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .mp-card {
      display: flex; gap: 12px; padding: 12px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      align-items: stretch;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .mp-card:active { transform: scale(0.98); }
    .mp-icon {
      width: 44px; height: 44px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; line-height: 1; flex-shrink: 0;
    }
    .mp-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .mp-name { font-size: 14px; font-weight: 700; color: var(--color-text); }
    .mp-desc { font-size: 11px; color: var(--color-text-sub); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
    .mp-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--color-primary-lighter); color: var(--color-primary); }
    .mp-qr {
      width: 60px; height: 60px; padding: 4px; flex-shrink: 0;
      background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .mp-qr svg { width: 100%; height: 100%; display: block; }
    [data-theme="dark"] .mp-qr { background: #fff; }

    /* QR 弹窗 */
    .qr-modal-body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0 4px; }
    .qr-modal-qr {
      width: 200px; height: 200px; padding: 10px;
      background: #fff; border: 1px solid var(--color-border);
      border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
    }
    .qr-modal-qr svg { width: 100%; height: 100%; }
    .qr-modal-tip { font-size: 12px; color: var(--color-text-sub); text-align: center; line-height: 1.5; }
    .qr-modal-actions { display: flex; gap: 8px; margin-top: 8px; width: 100%; }
    .qr-modal-actions .btn { flex: 1; }
  </style>
</head>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var mainContent = document.getElementById('mainContent');
      var listEl = document.getElementById('shopList');
      var searchInput = document.getElementById('searchInput');
      var catChipsEl = document.getElementById('catChips');
      var activeOrderBox = document.getElementById('activeOrderBox');
      var searchTimer = null;
      var isLoading = false;
      var state = { category: 'all', keyword: '' };

      function money(n) {
        var v = Math.round(n * 100) / 100;
        return v % 1 === 0 ? String(v) : v.toFixed(v * 10 % 1 === 0 ? 1 : 2);
      }

      // ---- 分类导航 ----
      function renderChips() {
        var cats = (typeof DB !== 'undefined' && DB.foodCategories) ? DB.foodCategories : [{ key: 'all', label: '全部' }];
        var html = '';
        cats.forEach(function (c) {
          var active = state.category === c.key ? ' active' : '';
          html += '<button class="chip' + active + '" data-cat="' + c.key + '">' + c.label + '</button>';
        });
        catChipsEl.innerHTML = html;
        catChipsEl.querySelectorAll('.chip[data-cat]').forEach(function (chip) {
          chip.addEventListener('click', function () {
            state.category = this.dataset.cat;
            catChipsEl.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
            this.classList.add('active');
            loadShops();
          });
        });
      }

      // ---- 进行中订单提示条 ----
      function renderActiveOrder() {
        var orders = Storage.syncOrderStatuses();
        var active = null;
        for (var i = 0; i < orders.length; i++) {
          if (orders[i].status === 'unpaid' || orders[i].status === 'preparing' || orders[i].status === 'delivering') {
            active = orders[i]; break;
          }
        }
        if (!active) { activeOrderBox.innerHTML = ''; return; }
        var statusText = Storage.ORDER_STATUS[active.status] || active.status;
        var sub = '';
        if (active.status === 'unpaid') sub = '合计 ¥' + money(active.total) + ' · 待支付';
        else if (active.status === 'preparing') sub = '商家正在备餐 · 约 ' + active.etaMinutes + ' 分钟送达';
        else sub = '骑手配送中 · 预计 ' + active.etaMinutes + ' 分钟送达';
        var goTarget = active.status === 'delivering'
          ? 'location.href=\'map.html?mode=delivery&orderId=' + active.id + '\''
          : 'location.href=\'order.html\'';
        activeOrderBox.innerHTML =
          '<div class="food-active-order anim-fade-in-up" onclick="' + goTarget + '">' +
            '<span class="ao-emoji">' + (active.restaurantEmoji || '🛵') + '</span>' +
            '<div class="ao-body">' +
              '<div class="ao-title">' + active.restaurantName + ' · ' + statusText + '</div>' +
              '<div class="ao-sub">' + sub + '</div>' +
            '</div>' +
            '<span class="ao-go">' + (active.status === 'delivering' ? '查看配送位置' : '查看订单') +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>' +
          '</div>';
      }

      // ---- 店铺卡片 ----
      function shopCard(r, index) {
        var stagger = index < 6 ? ' stagger-' + (index + 1) : '';
        var closed = r.isOpen ? '' : ' shop-card--closed';
        var openBadge = r.isOpen
          ? '<span class="shop-open-badge">营业中</span>'
          : '<span class="shop-open-badge closed">休息中</span>';
        var feeText = r.deliveryFee === 0 ? '免配送费' : '配送 ¥' + money(r.deliveryFee);
        var promos = '';
        if (r.promo) {
          promos += '<span class="shop-promo">满' + money(r.promo.full) + '减' + money(r.promo.cut) + '</span>';
        }
        (r.tags || []).forEach(function (t) {
          if (t !== '满' + money(r.promo ? r.promo.full : 0) + '减' + money(r.promo ? r.promo.cut : 0)) promos += '<span class="shop-promo">' + t + '</span>';
        });
        return '<div class="shop-card anim-fade-in-up' + stagger + closed + '" onclick="location.href=\'food-detail.html?id=' + r.id + '\'">' +
          '<div class="shop-logo" style="background:' + (r.color || '#FEF3C7') + '22;">' + (r.emoji || '🍽️') + '</div>' +
          '<div class="shop-body">' +
            '<div class="shop-head"><span class="shop-name">' + r.name + '</span>' + openBadge + '</div>' +
            '<div class="shop-stats">' +
              '<span class="shop-rating">★ ' + r.rating + '</span>' +
              '<span>月售 ' + r.monthlySales + '</span>' +
              '<span>约 ' + r.deliveryTime + ' 分钟</span>' +
              '<span>' + feeText + '</span>' +
              '<span>¥' + money(r.minOrder) + ' 起送</span>' +
            '</div>' +
            (r.notice ? '<div class="shop-notice">' + r.notice + '</div>' : '') +
            (promos ? '<div class="shop-promos">' + promos + '</div>' : '') +
          '</div>' +
        '</div>';
      }

      function loadShops() {
        if (isLoading) return;
        isLoading = true;
        listEl.innerHTML = App.skeletonList(4);

        API.fetchRestaurants({ category: state.category, keyword: state.keyword }).then(function (res) {
          isLoading = false;
          renderActiveOrder();
          var list = res.data || [];
          document.getElementById('listTitle').textContent = state.keyword ? '搜索结果' : (state.category === 'all' ? '推荐店铺' : '店铺列表');
          if (!list.length) {
            listEl.innerHTML = App.emptyState('暂无店铺', '没有符合条件的店铺，换个关键词试试');
            return;
          }
          // 大列表分片渲染（>50 条分帧追加，避免长任务与滚动掉帧）
          App.renderChunked(listEl, list, shopCard);
        }).catch(function () {
          isLoading = false;
          listEl.innerHTML = App.errorState('加载失败', '请稍后重试', 'loadShops');
        });
      }

      window.loadShops = loadShops;

      searchInput.addEventListener('input', function () {
        state.keyword = this.value.trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadShops, 300);
      });

      function refresh() {
        state.keyword = searchInput.value.trim();
        loadShops();
        renderMiniPrograms();
        return Promise.resolve();
      }

      // 位置：取用户资料中的校区
      try {
        var user = Storage.getUser();
        var campus = (user.campus || '涵江校区').split('·')[0].trim() || '涵江校区';
        document.getElementById('locText').textContent = campus;
      } catch (e) {}

      // ---- 校区切换 tabs ----
      function renderCampusTabs() {
        var campuses = Storage.getCampuses();
        var currentId = Storage.getCampusId();
        var html = '';
        campuses.forEach(function (c) {
          var active = c.id === currentId ? ' active' : '';
          html += '<button class="campus-tab' + active + '" data-campus="' + c.id + '" title="' + (c.desc || '') + '">' + c.name + '</button>';
        });
        var tabsEl = document.getElementById('campusTabs');
        tabsEl.innerHTML = html;
        tabsEl.querySelectorAll('.campus-tab').forEach(function (tab) {
          tab.addEventListener('click', function () {
            var cid = this.dataset.campus;
            Storage.setCampusId(cid);
            tabsEl.querySelectorAll('.campus-tab').forEach(function (t) { t.classList.remove('active'); });
            this.classList.add('active');
            // 同步位置显示
            var campuses = Storage.getCampuses();
            for (var i = 0; i < campuses.length; i++) {
              if (campuses[i].id === cid) {
                document.getElementById('locText').textContent = campuses[i].name;
                break;
              }
            }
            App.toast('已切换到 ' + (cid === 'xianyou' ? '仙游校区' : '涵江校区'));
            loadShops();
          });
        });
      }

      // ---- 小程序合作入口 ----
      // 生成一个简单的装饰性 QR 图案（视觉示意，非真实可识别二维码）
      // 真实扫码请使用微信扫一扫小程序码或搜索小程序名称
      function fakeQrSvg(seed) {
        // 基于 seed 字符串生成稳定的 6x6 模块矩阵，仅用于视觉示意
        var n = 0;
        for (var i = 0; i < seed.length; i++) n = (n * 31 + seed.charCodeAt(i)) >>> 0;
        function rand() { n = (n * 1103515245 + 12345) & 0x7fffffff; return n / 0x7fffffff; }
        var size = 7; // 7x7 模块
        var cell = 100 / size;
        var rects = '';
        // 三个定位角
        function corner(cx, cy) {
          return '<rect x="' + (cx * cell) + '" y="' + (cy * cell) + '" width="' + (3 * cell) + '" height="' + (3 * cell) + '" fill="#1E293B"/>' +
                 '<rect x="' + ((cx + 1) * cell) + '" y="' + ((cy + 1) * cell) + '" width="' + cell + '" height="' + cell + '" fill="#fff"/>';
        }
        rects += corner(0, 0) + corner(size - 3, 0) + corner(0, size - 3);
        // 中间随机点
        for (var y = 0; y < size; y++) {
          for (var x = 0; x < size; x++) {
            // 跳过三个定位角区域
            var inCorner = (x < 3 && y < 3) || (x >= size - 3 && y < 3) || (x < 3 && y >= size - 3);
            if (inCorner) continue;
            if (rand() < 0.5) {
              rects += '<rect x="' + (x * cell) + '" y="' + (y * cell) + '" width="' + cell + '" height="' + cell + '" fill="#1E293B"/>';
            }
          }
        }
        return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' + rects + '</svg>';
      }

      function copyText(text) {
        return new Promise(function (resolve) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(resolve, function () {
              fallbackCopy(text); resolve();
            });
          } else {
            fallbackCopy(text); resolve();
          }
        });
      }
      function fallbackCopy(text) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (e) {}
      }

      function renderMiniPrograms() {
        var mps = Storage.getMiniPrograms();
        var html = '';
        if (!mps.length) {
          document.getElementById('mpGrid').innerHTML = '';
          return;
        }
        mps.forEach(function (mp, i) {
          var tags = (mp.tags || []).map(function (t) {
            return '<span class="mp-tag">' + t + '</span>';
          }).join('');
          var qr = fakeQrSvg(mp.id + mp.shareKey);
          html += '<div class="mp-card anim-fade-in-up" onclick="showMpQr(\'' + mp.id + '\')">' +
            '<div class="mp-icon" style="background:' + (mp.color || '#2563EB') + '22;">' + (mp.emoji || '🔗') + '</div>' +
            '<div class="mp-body">' +
              '<div class="mp-name">' + mp.name + '</div>' +
              '<div class="mp-desc">' + (mp.desc || '') + '</div>' +
              (tags ? '<div class="mp-tags">' + tags + '</div>' : '') +
            '</div>' +
            '<div class="mp-qr">' + qr + '</div>' +
          '</div>';
        });
        document.getElementById('mpGrid').innerHTML = html;
      }

      window.showMpQr = function (id) {
        var mps = Storage.getMiniPrograms();
        var mp = null;
        for (var i = 0; i < mps.length; i++) { if (mps[i].id === id) { mp = mps[i]; break; } }
        if (!mp) return;
        var qr = fakeQrSvg(mp.id + mp.shareKey + '-big');
        App.showModal({
          title: mp.name,
          customBody: '<div class="qr-modal-body">' +
            '<div class="qr-modal-qr">' + qr + '</div>' +
            '<div class="qr-modal-tip">' + (mp.desc || '') + '<br/>点击下方按钮复制分享码，前往微信粘贴打开</div>' +
            '<div class="qr-modal-actions">' +
              '<button class="btn btn-outline" onclick="App.closeModal()">关闭</button>' +
              '<button class="btn btn-primary" onclick="copyMpShare(\'' + mp.id + '\')">复制分享码</button>' +
            '</div>' +
          '</div>',
        });
      };

      window.copyMpShare = function (id) {
        var mps = Storage.getMiniPrograms();
        var mp = null;
        for (var i = 0; i < mps.length; i++) { if (mps[i].id === id) { mp = mps[i]; break; } }
        if (!mp) return;
        copyText(mp.shareKey).then(function () {
          App.toastSuccess('已复制，前往微信粘贴打开');
          App.closeModal();
        });
      };

      renderCampusTabs();
      renderChips();
      loadShops();
      renderMiniPrograms();
      App.initPullToRefresh(mainContent, refresh);
    })();
  </script>
</body>
</html>
