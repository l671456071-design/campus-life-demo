<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>浴室详情 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== 浴室详情：单色调 · 留白充足 · 色块突出 ===== */
    .bath-hero {
      background: linear-gradient(135deg, #60A5FA, #2563EB);
      color: #fff;
      padding: 26px 20px 22px;
      border-radius: 0 0 20px 20px;
    }
    .bath-hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .bath-hero-name { font-size: 20px; font-weight: 700; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .bath-name-edit {
      flex-shrink:0; width:24px; height:24px; border-radius:50%;
      border:none; cursor:pointer;
      background:rgba(255,255,255,0.22); color:#fff;
      display:inline-flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    .bath-name-edit:active { background:rgba(255,255,255,0.4); }
    .bath-hero-floor { font-size: 13px; opacity: 0.9; margin-top: 5px; display:flex; align-items:center; gap:6px; }
    .bath-clock {
      font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
      font-family: var(--font-mono); font-weight:700; letter-spacing:1px;
      background:rgba(255,255,255,0.16); border-radius:7px; padding:1px 7px;
    }
    .bath-clock-pulse { width:6px; height:6px; border-radius:50%; background:#86EFAC; box-shadow:0 0 0 0 rgba(134,239,172,.7); animation: clockPulse 1s infinite; }
    @keyframes clockPulse { 70% { box-shadow:0 0 0 5px rgba(134,239,172,0); } 100% { box-shadow:0 0 0 0 rgba(134,239,172,0); } }
    .bath-chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .bath-chip {
      display:inline-flex; align-items:center; gap:5px;
      background: rgba(255,255,255,0.16); border-radius: 99px;
      padding: 6px 12px; font-size: 12px; color:#fff;
    }
    .bath-chip--btn { cursor:pointer; border:1px dashed rgba(255,255,255,0.5); }
    .bath-chip--btn:active { background: rgba(255,255,255,0.28); }
    .bath-chip b { font-weight:700; }

    .bath-sec { margin: 18px 16px 0; }
    .bath-sec-title { font-size: 14px; font-weight: 700; color: var(--color-text); margin-bottom: 10px; display:flex; align-items:center; justify-content:space-between; }
    .bath-sec-title .tip { font-size: 11.5px; font-weight: 400; color: var(--color-text-hint); }

    /* 今日状态色块 */
    .bath-today {
      border-radius: 18px; padding: 18px 16px;
      display:flex; align-items:center; gap:14px;
      background: var(--color-surface-alt);
      border: 1.5px dashed var(--color-border);
      color: var(--color-text-sub);
      transition: background .3s, color .3s;
    }
    .bath-today.done {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      border: none; color: #fff;
      box-shadow: 0 8px 20px rgba(37,99,235,0.25);
    }
    .bath-today-icon { font-size: 34px; line-height:1; }
    .bath-today-main { flex:1; }
    .bath-today-title { font-size: 17px; font-weight: 700; }
    .bath-today-sub { font-size: 12.5px; opacity: 0.82; margin-top: 4px; }
    .bath-today-cta {
      border:none; border-radius: 99px; padding: 10px 18px;
      font-size: 13.5px; font-weight: 700; cursor:pointer; font-family:inherit;
      background: var(--color-primary); color:#fff; flex-shrink:0;
      transition: transform .15s;
    }
    .bath-today-cta:active { transform: scale(0.94); }
    .bath-today.done .bath-today-cta { background: rgba(255,255,255,0.22); color:#fff; }

    /* 本月可视化 */
    .bath-month-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--color-border-light); }
    .bath-month-top { display:flex; align-items:baseline; gap:8px; }
    .bath-month-num { font-size: 34px; font-weight: 800; color: var(--color-primary); font-family: var(--font-mono); line-height:1; }
    .bath-month-unit { font-size: 13px; color: var(--color-text-sub); }
    .bath-month-avg { margin-left:auto; font-size: 12px; color: var(--color-text-hint); }
    .bath-bars { display:flex; align-items:flex-end; gap:8px; height: 72px; margin-top: 16px; padding-top: 6px; border-top: 1px dashed var(--color-border-light); }
    .bath-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
    .bath-bar { width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: var(--color-primary-lighter); min-height: 4px; transition: height .4s ease; }
    .bath-bar.hot { background: var(--color-primary); }
    .bath-bar-label { font-size: 10.5px; color: var(--color-text-hint); }
    .bath-bar-label.today { color: var(--color-primary); font-weight: 700; }

    /* 最近记录 */
    .bath-records { background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); overflow:hidden; }
    .bath-record-item { display:flex; align-items:center; gap:12px; padding: 13px 16px; border-bottom: 1px solid var(--color-border-light); }
    .bath-record-item:last-child { border-bottom:none; }
    .bath-record-dot { width:8px; height:8px; border-radius:50%; background: var(--color-primary); flex-shrink:0; }
    .bath-record-time { font-size: 14px; color: var(--color-text); font-family: var(--font-mono); }
    .bath-record-note { font-size: 12px; color: var(--color-text-hint); margin-left: 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bath-record-del { margin-left:auto; border:none; background:transparent; color: var(--color-text-hint); cursor:pointer; padding: 4px; border-radius: 8px; flex-shrink:0; display:flex; }
    .bath-record-del:active { background: var(--color-surface-alt); color: var(--color-danger); }
    .bath-empty { padding: 22px 16px; text-align:center; font-size: 12.5px; color: var(--color-text-hint); }

    /* 底部集中操作栏 */
    .bath-actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--color-surface);
      border-top: 1px solid var(--color-border-light);
      box-shadow: 0 -4px 16px rgba(15,23,42,0.06);
    }
    .bath-btn-main {
      flex: 1; display:flex; align-items:center; justify-content:center; gap:8px;
      padding: 13px; border: none; border-radius: 14px;
      background: var(--color-primary); color: #fff;
      font-size: 15px; font-weight: 700; cursor:pointer; font-family:inherit;
    }
    .bath-btn-main:active { background: var(--color-primary-hover); }
    .bath-act {
      width: 46px; height: 46px; border-radius: 14px; border: none; cursor:pointer;
      background: var(--color-surface-alt); color: var(--color-text-sub);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
      font-size: 9px; font-family:inherit; flex-shrink:0;
      text-decoration: none;
    }
    .bath-act svg { width: 19px; height: 19px; }
    .bath-act.active { background: var(--color-primary-lighter); color: var(--color-primary); }
    .bath-act:active { transform: scale(0.93); }

    /* 弹窗（mask + sheet） */
    .bath-mask { position:fixed; inset:0; background:rgba(15,23,42,0.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s; }
    .bath-mask.show { opacity:1; pointer-events:auto; }
    .bath-sheet {
      position:fixed; left:0; right:0; bottom:0; z-index:51;
      background: var(--color-surface); border-radius: 20px 20px 0 0;
      padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(105%); transition: transform .3s cubic-bezier(.32,.72,.32,1);
      max-height: 82vh; overflow-y: auto;
    }
    .bath-sheet.show { transform: none; }
    .bath-sheet-grabber { width:36px; height:4px; border-radius:99px; background:var(--color-border); margin:0 auto 14px; }
    .bath-sheet-title { font-size: 16px; font-weight: 700; color: var(--color-text); text-align:center; }
    .bath-sheet-sub { font-size: 12px; color: var(--color-text-hint); text-align:center; margin-top: 4px; }
    .bath-field-label { font-size: 12.5px; font-weight: 600; color: var(--color-text-sub); margin: 16px 0 8px; }
    .bath-chip-group { display:flex; flex-wrap:wrap; gap:8px; }
    .bath-opt {
      padding: 9px 16px; border-radius: 99px; font-size: 13.5px; cursor:pointer;
      background: var(--color-surface-alt); color: var(--color-text-sub);
      border: 1.5px solid transparent; transition: all .15s;
    }
    .bath-opt.active { background: var(--color-primary-lighter); color: var(--color-primary); border-color: var(--color-primary); font-weight: 700; }
    .bath-input {
      width:100%; box-sizing:border-box; border:1.5px solid var(--color-border); border-radius: 12px;
      padding: 12px 14px; font-size: 15px; font-family:inherit; color: var(--color-text);
      background: var(--color-surface-alt); outline:none;
    }
    .bath-input:focus { border-color: var(--color-primary); background: var(--color-surface); }
    .bath-sheet-confirm {
      width:100%; margin-top: 20px; border:none; border-radius: 14px; padding: 14px;
      background: var(--color-primary); color:#fff; font-size: 15px; font-weight: 700;
      cursor:pointer; font-family:inherit;
    }
    .bath-sheet-confirm:active { background: var(--color-primary-hover); }
    .bath-sheet-cancel {
      width:100%; margin-top: 10px; border:none; border-radius: 14px; padding: 13px;
      background: transparent; color: var(--color-text-hint); font-size: 14px; cursor:pointer; font-family:inherit;
    }
  </style>
</head>
<body data-page="bathroom">
  <div class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <a href="javascript:history.back()" class="header-back-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
      <div class="header-title">浴室详情</div>
      <div class="header-right" style="width:32px;"></div>
    </header>

    <main class="app-content" style="padding-bottom:calc(96px + env(safe-area-inset-bottom));">
      <div id="bathContent"></div>
    </main>

    <!-- 底部集中操作栏 -->
    <div class="bath-actions" id="bathActions" style="display:none;">
      <button class="bath-btn-main" id="navMainBtn"></button>
      <a class="bath-act" id="actLoc" title="查看位置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        位置
      </a>
      <button class="bath-act" id="actFav" onclick="toggleFav()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span id="actFavText">收藏</span>
      </button>
      <button class="bath-act" id="actDefault" onclick="setDefault()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span id="actDefaultText">常用</span>
      </button>
    </div>
  </div>

  <!-- 弹窗 1：修改绑定宿舍 -->
  <div class="bath-mask" id="dormMask" onclick="closeSheet('dorm')"></div>
  <div class="bath-sheet" id="dormSheet">
    <div class="bath-sheet-grabber"></div>
    <div class="bath-sheet-title">修改绑定宿舍</div>
    <div class="bath-sheet-sub">切换后自动匹配最近浴室</div>
    <div class="bath-field-label">校区</div>
    <div class="bath-chip-group" id="dormCampus"></div>
    <div class="bath-field-label" id="dormAreaLabel">苑区</div>
    <div class="bath-chip-group" id="dormArea"></div>
    <div class="bath-field-label">楼栋</div>
    <div class="bath-chip-group" id="dormBuilding"></div>
    <div class="bath-field-label">房间号（可选）</div>
    <input class="bath-input" id="dormRoom" type="text" inputmode="numeric" maxlength="8" placeholder="如 215">
    <button class="bath-sheet-confirm" onclick="saveDorm()">保存</button>
    <button class="bath-sheet-cancel" onclick="closeSheet('dorm')">取消</button>
  </div>

  <!-- 弹窗 2：快速录入洗澡记录 -->
  <div class="bath-mask" id="showerMask" onclick="closeSheet('shower')"></div>
  <div class="bath-sheet" id="showerSheet">
    <div class="bath-sheet-grabber"></div>
    <div class="bath-sheet-title">记一次洗澡</div>
    <div class="bath-sheet-sub">记录保存在本机，仅自己可见</div>
    <div class="bath-field-label">时间</div>
    <div style="font-size:20px;font-weight:800;color:var(--color-primary);font-family:var(--font-mono);text-align:center;padding:6px 0;" id="showerTime">--</div>
    <div class="bath-field-label">备注（可选）</div>
    <input class="bath-input" id="showerNote" type="text" maxlength="30" placeholder="如：运动后 / 睡前">
    <button class="bath-sheet-confirm" onclick="saveShower()">确认记录</button>
    <button class="bath-sheet-cancel" onclick="closeSheet('shower')">取消</button>
  </div>

  <script src="config.js"></script>
  <script src="campus-data.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    var BATH = null;          // 当前浴室
    var dormPick = { campusId: '', areaId: '', building: '' };
    var bathClockTimer = null;

    document.addEventListener('DOMContentLoaded', function () {
      App.initTheme();
      renderBathroom();
    });

    // ---------- 实时时钟（HH:MM:SS，单例 timer，离开页面释放） ----------
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function tickBathClock() {
      var el = document.getElementById('bathClock');
      if (!el) return;
      var d = new Date();
      el.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }
    function startBathClock() {
      if (bathClockTimer) clearInterval(bathClockTimer);
      tickBathClock();
      bathClockTimer = setInterval(tickBathClock, 1000);
    }
    window.addEventListener('pagehide', function () {
      if (bathClockTimer) { clearInterval(bathClockTimer); bathClockTimer = null; }
    });

    // ---------- 手动修改浴室名称（本地覆盖，仅本机生效） ----------
    function openBathNameEditor() {
      if (!BATH) return;
      var backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      var hasOverride = !!(Storage.bathGetOverride(BATH.id) || {}).name;
      backdrop.innerHTML =
        '<div class="modal">' +
          '<div class="modal-title">修改浴室名称</div>' +
          '<div class="modal-desc">新名称只保存在本机，用于替换「' + BATH.name + '」的显示</div>' +
          '<input id="bathNameInput" type="text" maxlength="20" value="' +
            String(BATH.name).replace(/"/g, '&quot;') +
            '" style="width:100%;box-sizing:border-box;border:1.5px solid var(--color-border);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--color-text);background:var(--color-surface-alt);outline:none;margin-top:12px;" />' +
          '<div id="bathNameErr" style="font-size:12px;color:var(--color-danger);margin-top:8px;display:none;">名称需 2-20 个字</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-outline" id="bathNameCancel">' + (hasOverride ? '恢复默认名' : '取消') + '</button>' +
            '<button class="btn btn-primary" id="bathNameOk">保存</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(backdrop);
      requestAnimationFrame(function () { backdrop.classList.add('show'); });
      function close() {
        backdrop.classList.remove('show');
        setTimeout(function () { backdrop.remove(); }, 250);
      }
      function fail(msg) {
        var err = backdrop.querySelector('#bathNameErr');
        err.textContent = msg;
        err.style.display = 'block';
      }
      backdrop.querySelector('#bathNameCancel').addEventListener('click', function () {
        if (hasOverride) {
          Storage.bathSaveOverride(BATH.id, { name: '' });
          // 空串不会写入；若覆盖里只剩空字段，整体清掉
          var ov = Storage.bathGetOverride(BATH.id);
          if (ov && !ov.name && !ov.floor && !ov.hours) Storage.bathSaveOverride(BATH.id, null);
          close();
          renderBathroom();
          App.toast('已恢复默认名称');
        } else {
          close();
        }
      });
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
      backdrop.querySelector('#bathNameOk').addEventListener('click', function () {
        var val = (backdrop.querySelector('#bathNameInput').value || '').trim();
        if (val.length < 2 || val.length > 20) { fail('名称需 2-20 个字'); return; }
        Storage.bathSaveOverride(BATH.id, { name: val });
        close();
        renderBathroom();
        App.toastSuccess('浴室名称已更新');
      });
      setTimeout(function () {
        var i = backdrop.querySelector('#bathNameInput');
        if (i) { i.focus(); i.select(); }
      }, 300);
    }
    window.openBathNameEditor = openBathNameEditor;

    // ---------- 渲染 ----------
    function renderBathroom() {
      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      BATH = id ? Storage.getBathroomById(id) : Storage.getDefaultBathroom();
      var container = document.getElementById('bathContent');

      if (!BATH) {
        document.getElementById('bathActions').style.display = 'none';
        container.innerHTML =
          '<div style="padding:60px 20px;text-align:center;color:var(--color-text-sub);">' +
          '<div style="font-size:40px;margin-bottom:12px;">🛁</div>' +
          '<p>未找到浴室信息</p>' +
          '<p style="font-size:13px;margin-top:8px;color:var(--color-text-hint);">请先在个人资料中设置宿舍</p>' +
          '<button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="openDormSheet()">去绑定宿舍</button></div>';
        return;
      }

      var navUrl = 'map.html?dest=' + encodeURIComponent(BATH.name);
      var user = Storage.getUser();
      var isFav = (user.favoriteBathrooms || []).indexOf(BATH.id) !== -1;
      var isDefault = user.defaultBathroomId === BATH.id;
      var dorm = Storage.getUserDorm();
      var dormText = dorm ? dorm.areaName + ' ' + dorm.building + (dorm.room ? ' ' + dorm.room : '') : '';

      // 距离（米）换算步行耗时：按校园步速 1.25 m/s，精确到秒
      var walkSec = Math.max(1, Math.round((BATH.distance || 0) / 1.25));
      var walkText = Math.floor(walkSec / 60) + '分' + (walkSec % 60 < 10 ? '0' : '') + (walkSec % 60) + '秒';

      // ---- Hero：位置信息 ----
      var html =
        '<div class="bath-hero anim-fade-in-up">' +
          '<div class="bath-hero-top">' +
            '<div>' +
              '<div class="bath-hero-name">' +
                '<span id="bathNameText">' + BATH.name + '</span>' +
                '<button type="button" class="bath-name-edit" onclick="openBathNameEditor()" title="手动修改浴室名称" aria-label="修改浴室名称">' +
                  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                '</button>' +
              '</div>' +
              // 固定营业时间改为「现在时间」实时钟（HH:MM:SS，每秒跳动）
              '<div class="bath-hero-floor">' +
                (BATH.floor ? '<span>' + BATH.floor + ' ·</span>' : '') +
                '<span class="bath-clock-pulse"></span><span>现在</span><span class="bath-clock" id="bathClock">--:--:--</span>' +
              '</div>' +
            '</div>' +
            '<div style="font-size:36px;line-height:1;">🚿</div>' +
          '</div>' +
          '<div class="bath-chip-row">' +
            '<span class="bath-chip">🚶 步行约 <b>' + walkText + '</b></span>' +
            '<span class="bath-chip">🕐 营业 <b>' + BATH.hours + '</b></span>' +
            '<span class="bath-chip bath-chip--btn" onclick="openDormSheet()">🏠 ' +
              (dormText ? dormText : '绑定宿舍') + ' · 修改</span>' +
          '</div>' +
        '</div>';

      // ---- 今日状态色块 ----
      var showers = Storage.bathGetShowers();
      var todayCount = countToday(showers);
      html +=
        '<div class="bath-sec anim-fade-in-up stagger-1">' +
          '<div class="bath-today' + (todayCount > 0 ? ' done' : '') + '">' +
            '<div class="bath-today-icon">' + (todayCount > 0 ? '✅' : '🛁') + '</div>' +
            '<div class="bath-today-main">' +
              '<div class="bath-today-title">' + (todayCount > 0 ? '今日已洗 ' + todayCount + ' 次' : '今天还没洗') + '</div>' +
              '<div class="bath-today-sub">' + (todayCount > 0 ? '保持清爽，状态不错' : '点击右侧按钮，快速记一笔') + '</div>' +
            '</div>' +
            '<button class="bath-today-cta" onclick="openShowerSheet()">记一次</button>' +
          '</div>' +
        '</div>';

      // ---- 本月可视化 ----
      html +=
        '<div class="bath-sec anim-fade-in-up stagger-2">' +
          '<div class="bath-sec-title">本月数据 <span class="tip">手动记录 · 全本机保存</span></div>' +
          '<div class="bath-month-card">' +
            monthCardHtml(showers) +
          '</div>' +
        '</div>';

      // ---- 最近记录 ----
      html +=
        '<div class="bath-sec anim-fade-in-up stagger-3" style="margin-bottom:20px;">' +
          '<div class="bath-sec-title">最近记录</div>' +
          '<div class="bath-records">' + recordsHtml(showers) + '</div>' +
        '</div>';

      container.innerHTML = html;
      startBathClock();

      // ---- 底部操作栏 ----
      var actions = document.getElementById('bathActions');
      actions.style.display = 'flex';
      document.getElementById('navMainBtn').innerHTML =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/></svg>3D地图导航';
      document.getElementById('navMainBtn').onclick = function () { location.href = navUrl; };
      var loc = document.getElementById('actLoc');
      loc.href = navUrl;
      loc.style.display = 'flex';
      document.getElementById('actFav').classList.toggle('active', isFav);
      document.getElementById('actFavText').textContent = isFav ? '已藏' : '收藏';
      var defBtn = document.getElementById('actDefault');
      defBtn.classList.toggle('active', isDefault);
      defBtn.style.opacity = isDefault ? '0.55' : '';
      defBtn.style.pointerEvents = isDefault ? 'none' : '';
      document.getElementById('actDefaultText').textContent = isDefault ? '常用' : '常用';
    }

    // ---- 统计：今日次数 / 本月次数 / 近 7 天柱状图 ----
    function countToday(showers) {
      var n = new Date(); var c = 0;
      for (var i = 0; i < showers.length; i++) {
        var d = new Date(showers[i].ts);
        if (d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate()) c++;
      }
      return c;
    }

    function monthCardHtml(showers) {
      var now = new Date();
      var monthCount = 0;
      for (var i = 0; i < showers.length; i++) {
        var d = new Date(showers[i].ts);
        if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) monthCount++;
      }
      var days = now.getDate();
      var avg = days > 0 ? (monthCount / days) : 0;

      // 近 7 天柱状图
      var bars = '';
      var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      var maxDay = 1;
      var counts = [];
      for (var k = 6; k >= 0; k--) {
        var day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - k);
        var c = 0;
        for (var j = 0; j < showers.length; j++) {
          var sd = new Date(showers[j].ts);
          if (sd.getFullYear() === day.getFullYear() && sd.getMonth() === day.getMonth() && sd.getDate() === day.getDate()) c++;
        }
        if (c > maxDay) maxDay = c;
        counts.push({ c: c, day: day, label: (7 - k) + '日', isToday: k === 0 });
      }
      counts.forEach(function (it) {
        var h = Math.max(8, Math.round(it.c / maxDay * 100));
        bars += '<div class="bath-bar-col">' +
          '<div class="bath-bar' + (it.c > 0 ? ' hot' : '') + '" style="height:' + h + '%;"></div>' +
          '<div class="bath-bar-label' + (it.isToday ? ' today' : '') + '">' + (it.isToday ? '今天' : it.label) + '</div>' +
        '</div>';
      });

      return '<div class="bath-month-top">' +
          '<span class="bath-month-num">' + monthCount + '</span>' +
          '<span class="bath-month-unit">次洗澡</span>' +
          '<span class="bath-month-avg">日均 ' + avg.toFixed(1) + ' 次</span>' +
        '</div>' +
        '<div class="bath-bars">' + bars + '</div>';
    }

    function recordsHtml(showers) {
      if (!showers.length) {
        return '<div class="bath-empty">还没有记录，点上方「记一次」开始</div>';
      }
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var html = '';
      var list = showers.slice(0, 5);
      for (var i = 0; i < list.length; i++) {
        var d = new Date(list[i].ts);
        var time = pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        html += '<div class="bath-record-item">' +
          '<span class="bath-record-dot"></span>' +
          '<span class="bath-record-time">' + time + '</span>' +
          (list[i].note ? '<span class="bath-record-note">' + list[i].note + '</span>' : '') +
          '<button class="bath-record-del" title="删除" onclick="removeShower(\'' + list[i].id + '\')">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
          '</button>' +
        '</div>';
      }
      return html;
    }

    // ---------- 弹窗开关 ----------
    function openSheet(key) {
      document.getElementById(key + 'Mask').classList.add('show');
      document.getElementById(key + 'Sheet').classList.add('show');
    }
    function closeSheet(key) {
      document.getElementById(key + 'Mask').classList.remove('show');
      document.getElementById(key + 'Sheet').classList.remove('show');
    }

    // ---------- 弹窗 1：宿舍选择 ----------
    function openDormSheet() {
      var campuses = Storage.getCampusAreas();
      var dorm = Storage.getUserDorm() || {};
      dormPick = {
        campusId: dorm.campusId || campuses[0].id,
        areaId: dorm.areaId || '',
        building: dorm.building || '',
      };
      document.getElementById('dormRoom').value = dorm.room || '';
      renderDormChips();
      openSheet('dorm');
    }

    function renderDormChips() {
      var campuses = Storage.getCampusAreas();
      var htmlC = '';
      campuses.forEach(function (c) {
        htmlC += '<span class="bath-opt' + (dormPick.campusId === c.id ? ' active' : '') + '" onclick="pickDorm(\'campus\',\'' + c.id + '\')">' + c.name + '</span>';
      });
      document.getElementById('dormCampus').innerHTML = htmlC;

      var areas = Storage.getAreasByCampus(dormPick.campusId);
      // 仙游校区只显示男生/女生宿舍，不显示具体苑区
      var isXianyou = dormPick.campusId === 'xianyou';
      document.getElementById('dormAreaLabel').textContent = isXianyou ? '宿舍类型' : '苑区';
      var htmlA = '';
      areas.forEach(function (a) {
        htmlA += '<span class="bath-opt' + (dormPick.areaId === a.id ? ' active' : '') + '" onclick="pickDorm(\'area\',\'' + a.id + '\')">' + a.name + '</span>';
      });
      document.getElementById('dormArea').innerHTML = htmlA;

      var buildings = dormPick.areaId ? Storage.getBuildingsByArea(dormPick.campusId, dormPick.areaId) : [];
      var htmlB = '';
      buildings.forEach(function (b) {
        htmlB += '<span class="bath-opt' + (dormPick.building === b ? ' active' : '') + '" onclick="pickDorm(\'building\',\'' + b + '\')">' + b + '</span>';
      });
      document.getElementById('dormBuilding').innerHTML = htmlB || '<span style="font-size:12.5px;color:var(--color-text-hint);">请先选择' + (isXianyou ? '宿舍类型' : '苑区') + '</span>';
    }

    function pickDorm(level, val) {
      if (level === 'campus') {
        if (dormPick.campusId !== val) { dormPick.campusId = val; dormPick.areaId = ''; dormPick.building = ''; }
      } else if (level === 'area') {
        if (dormPick.areaId !== val) { dormPick.areaId = val; dormPick.building = ''; }
      } else {
        dormPick.building = val;
      }
      renderDormChips();
    }

    function saveDorm() {
      if (!dormPick.campusId || !dormPick.areaId || !dormPick.building) {
        App.toast('请选择完整宿舍信息');
        return;
      }
      var areaName = '';
      var areas = Storage.getAreasByCampus(dormPick.campusId);
      for (var i = 0; i < areas.length; i++) {
        if (areas[i].id === dormPick.areaId) { areaName = areas[i].name; break; }
      }
      Storage.saveUserDorm({
        campusId: dormPick.campusId,
        areaId: dormPick.areaId,
        areaName: areaName,
        building: dormPick.building,
        room: document.getElementById('dormRoom').value.trim(),
      });
      closeSheet('dorm');
      App.toastSuccess('宿舍已更新');
      setTimeout(renderBathroom, 300);
    }

    // ---------- 弹窗 2：快速录入洗澡 ----------
    function openShowerSheet() {
      var d = new Date();
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      document.getElementById('showerTime').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
      document.getElementById('showerNote').value = '';
      openSheet('shower');
    }

    function saveShower() {
      var note = document.getElementById('showerNote').value.trim();
      Storage.bathAddShower(note);
      closeSheet('shower');
      App.toastSuccess('已记录 · 今天第 ' + (countToday(Storage.bathGetShowers())) + ' 次');
      setTimeout(renderBathroom, 300);
    }

    function removeShower(id) {
      Storage.bathRemoveShower(id);
      renderBathroom();
      App.toast('已删除该条记录');
    }

    // ---------- 收藏 / 常用 ----------
    function toggleFav() {
      var isFav = Storage.toggleFavoriteBathroom(BATH.id);
      document.getElementById('actFav').classList.toggle('active', isFav);
      document.getElementById('actFavText').textContent = isFav ? '已藏' : '收藏';
      App.toast(isFav ? '已收藏' : '已取消收藏');
    }

    function setDefault() {
      Storage.setDefaultBathroom(BATH.id);
      var btn = document.getElementById('actDefault');
      btn.classList.add('active');
      btn.style.opacity = '0.55';
      btn.style.pointerEvents = 'none';
      App.toastSuccess('已设为常用浴室');
    }
  </script>
</body>
</html>
