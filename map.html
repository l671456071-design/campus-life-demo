<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>校园地图 - 校园取件</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== 3D Map Page Styles（60% 地图 + 40% 底部信息栏） ===== */
    .map-page {
      padding: 0;
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--header-h) - var(--tab-bar-h));
      overflow: hidden;
    }

    /* 地图区：屏幕 60% */
    .map-wrap {
      position: relative;
      flex: 0 0 60%;
      min-height: 200px;
      background: #E8EDF2;
      overflow: hidden;
    }
    .map-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    .map-container canvas { display: block; width: 100%; height: 100%; }

    /* 配送模式：地图占满内容区，隐藏底部信息栏 */
    body.map-delivery .map-page { height: auto; }
    body.map-delivery .map-wrap {
      flex: 1 1 auto;
      height: calc(100vh - var(--header-h));
    }
    body.map-delivery .map-sheet { display: none; }

    /* 顶部类型筛选（悬浮胶囊） */
    .map-filters {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      padding: 0;
      background: transparent;
      z-index: 30;
    }
    .map-filters .filter-chips {
      display: flex;
      gap: 6px;
      background: rgba(255,255,255,0.88);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .map-filters .filter-chips::-webkit-scrollbar { display: none; }
    .map-filters .chip { flex: 0 0 auto; }

    /* 3D 视角控制按钮组 */
    .map-view-controls {
      position: absolute;
      right: 12px;
      bottom: 44px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }
    .map-view-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--color-surface);
      color: var(--color-text);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md);
      border: none;
      -webkit-tap-highlight-color: transparent;
    }
    .map-view-btn:active { transform: scale(0.92); }
    .map-view-btn svg { width: 20px; height: 20px; }

    /* 加载中（进度条 + 分阶段提示） */
    .map-loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--color-bg);
      z-index: 40; gap: 12px;
      transition: opacity .3s ease;
    }
    .map-loading.fade-out { opacity: 0; pointer-events: none; }
    .map-loading-text { font-size: 13px; color: var(--color-text-sub); }
    .map-loading-bar {
      width: 168px; height: 5px; border-radius: 3px;
      background: var(--color-border-light, #E2E8F0);
      overflow: hidden;
    }
    .map-loading-fill {
      height: 100%; width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--color-primary), #60A5FA);
      transition: width .3s ease;
    }
    .map-loading-pct { font-size: 12px; color: var(--color-text-hint); font-variant-numeric: tabular-nums; }

    /* Navigation bar (top) */
    .map-nav-bar {
      position: fixed;
      top: calc(var(--header-h) + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      width: calc(100% - 32px);
      max-width: 398px;
      background: var(--color-surface);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-lg);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .map-nav-bar.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .map-nav-bar svg { width: 20px; height: 20px; color: var(--color-primary); flex-shrink: 0; }
    .map-nav-bar-text { flex: 1; font-size: 13px; font-weight: 500; color: var(--color-text); }
    .map-nav-bar-close {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--color-text-hint);
      flex-shrink: 0;
    }
    .map-nav-bar-close:active { background: var(--color-bg); }
    .map-nav-bar-close svg { width: 16px; height: 16px; }

    /* 配送模式顶部栏 */
    .delivery-top-bar {
      position: fixed;
      top: calc(var(--header-h) + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 406px;
      background: var(--color-surface);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: var(--shadow-xl);
      z-index: 60;
      display: none;
    }
    .delivery-top-bar.show { display: block; animation: fadeInUp 0.35s ease-out both; }
    .delivery-top-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .delivery-status-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: var(--radius-full);
      font-size: 12px; font-weight: 700;
    }
    .delivery-eta { font-size: 15px; font-weight: 700; color: var(--color-text); }
    .delivery-eta-sub { font-size: 12px; color: var(--color-text-sub); margin-top: 3px; display: flex; gap: 10px; }
    .delivery-progress {
      margin-top: 10px; height: 5px; border-radius: 3px;
      background: var(--color-border); overflow: hidden;
    }
    .delivery-progress-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #F59E0B, #F97316); width: 0%; transition: width 1s linear; }

    /* 配送模式底部订单卡 */
    .delivery-card {
      position: fixed;
      bottom: calc(var(--tab-bar-h) + env(safe-area-inset-bottom) + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 406px;
      background: var(--color-surface);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow-xl);
      z-index: 60;
      display: none;
    }
    .delivery-card.show { display: block; animation: fadeInUp 0.35s ease-out both; }
    .delivery-route-line {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--color-text);
      padding: 4px 0 8px;
    }
    .delivery-route-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .delivery-route-dash { flex: 1; border-top: 2px dashed var(--color-border); }
    .delivery-route-name { font-weight: 600; }
    .delivery-card-meta { font-size: 12px; color: var(--color-text-sub); margin-bottom: 12px; display: flex; justify-content: space-between; }

    /* ===== 底部信息栏（屏幕 40%） ===== */
    .map-sheet {
      flex: 1 1 40%;
      min-height: 0;
      background: var(--color-surface);
      border-radius: 20px 20px 0 0;
      box-shadow: var(--shadow-xl);
      position: relative;
      z-index: 20;
      margin-top: -14px;
      padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .sheet-grabber {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--color-border);
      margin: 0 auto 8px;
      flex: none;
    }
    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 10px; flex: none;
    }
    .sheet-title-wrap { min-width: 0; }
    .sheet-title { font-size: 15px; font-weight: 700; color: var(--color-text); }
    .sheet-sub { font-size: 12px; color: var(--color-text-hint); margin-top: 2px; }
    .sheet-nearest-btn {
      flex: none;
      display: inline-flex; align-items: center; gap: 4px;
      border: none; border-radius: 999px;
      padding: 7px 13px;
      background: var(--color-primary);
      color: #fff; font-size: 12px; font-weight: 600;
      box-shadow: 0 4px 12px rgba(37,99,235,.28);
      -webkit-tap-highlight-color: transparent;
    }
    .sheet-nearest-btn:active { transform: scale(.95); }
    .sheet-nearest-btn svg { width: 14px; height: 14px; }
    .sheet-scroll {
      flex: 1; min-height: 0; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 8px;
      padding: 2px 2px 8px;
    }

    /* 附近快递点列表行 */
    .near-row {
      display: flex; align-items: center; gap: 12px;
      width: 100%; text-align: left;
      background: var(--color-bg);
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 11px 12px;
      transition: border-color .2s, background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .near-row.active {
      border-color: var(--color-primary);
      background: var(--color-primary-lighter, #EFF6FF);
    }
    .near-row:active { background: var(--color-border-light, #F1F5F9); }
    .near-ic {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; font-weight: 700;
      flex: none;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.08);
    }
    .near-main { flex: 1; min-width: 0; }
    .near-name {
      font-size: 14px; font-weight: 600; color: var(--color-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 6px;
    }
    .near-pending {
      flex: none;
      background: var(--color-danger-light); color: var(--color-danger);
      font-size: 10px; font-weight: 700;
      padding: 1px 6px; border-radius: 999px;
    }
    .near-meta {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      font-size: 12px; color: var(--color-text-sub); margin-top: 3px;
    }
    .near-dist { color: var(--color-primary); font-weight: 700; }
    .near-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--color-border); }
    .near-walk { font-variant-numeric: tabular-nums; }
    .near-nav {
      flex: none;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--color-primary);
      color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(37,99,235,.25);
      -webkit-tap-highlight-color: transparent;
    }
    .near-nav:active { transform: scale(.92); }
    .near-nav svg { width: 17px; height: 17px; }
    .near-empty {
      text-align: center; color: var(--color-text-hint);
      font-size: 13px; padding: 28px 0;
    }

    /* 列表 → 详情 两态切换 */
    .sheet-detail { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .map-sheet[data-view="detail"] .sheet-list-view { display: none; }
    .map-sheet[data-view="detail"] .sheet-detail { display: flex; }
    .detail-back {
      flex: none; width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-sub); margin-right: 4px;
    }
    .detail-back:active { background: var(--color-bg); }
    .detail-back svg { width: 19px; height: 19px; }
    .detail-title { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; }
    .detail-type {
      display: inline-flex; align-items: center;
      padding: 2px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .detail-body { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 11px; }
    .detail-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--color-text-sub); }
    .detail-row svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--color-text-hint); }
    .detail-row .info-value { color: var(--color-text); font-weight: 500; }
    .detail-row .info-badge {
      background: var(--color-danger-light); color: var(--color-danger);
      padding: 1px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .detail-actions { flex: none; display: flex; gap: 10px; }
    .detail-actions .btn { flex: 1; }

    .biz-status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; margin-left: 2px; }
    .biz-status--open { color: var(--color-accent, #10B981); }
    .biz-status--closed { color: var(--color-warning, #F59E0B); }
    .biz-status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* 聚合数量气泡（3D 场景内） */
    .cluster-tap-hint {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15,23,42,.82); color: #fff;
      font-size: 12px; padding: 6px 12px; border-radius: 999px;
      z-index: 35; pointer-events: none;
      opacity: 0; transition: opacity .2s;
      white-space: nowrap;
    }
    .cluster-tap-hint.show { opacity: 1; }

    /* 操作提示（悬浮地图区底部） */
    .map-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-sm);
      font-size: 12px;
      color: var(--color-text-sub);
      display: flex; align-items: center; gap: 6px;
      z-index: 15; white-space: nowrap;
      pointer-events: none;
      animation: fadeIn 0.4s 0.5s both;
    }
    .map-hint svg { width: 16px; height: 16px; color: var(--color-text-hint); }
    .map-hint.hidden { display: none; }

    /* Map load error */
    .map-load-error {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px; text-align: center;
      background: var(--color-bg);
    }
    .map-load-error-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--color-warning-light); color: #B45309;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .map-load-error-icon svg { width: 36px; height: 36px; }
    .map-load-error-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .map-load-error-desc { font-size: 13px; color: var(--color-text-sub); line-height: 1.7; }
  </style>
</head>
<body data-page="map">
  <div class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <button class="header-back-btn" onclick="goBack()" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div class="header-title" id="pageTitle">校园地图</div>
      <div class="header-right">
        <button class="header-back-btn" onclick="locateMe()" aria-label="定位" style="color:var(--color-primary);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M2 12h4"/><path d="M18 12h4"/></svg>
        </button>
      </div>
    </header>
    <main class="app-content map-page">
      <!-- ========== 地图区（60%） ========== -->
      <div class="map-wrap" id="mapWrap">
      <!-- Filter chips（配送模式下隐藏） -->
      <div class="map-filters anim-fade-in-up stagger-1" id="mapFilters">
        <div class="filter-chips">
          <button class="chip active" data-filter="all" onclick="setFilter('all', this)">全部</button>
          <button class="chip" data-filter="station" onclick="setFilter('station', this)">驿站</button>
          <button class="chip" data-filter="locker" onclick="setFilter('locker', this)">快递柜</button>
          <button class="chip" data-filter="pending" onclick="setFilter('pending', this)">有待取</button>
        </div>
      </div>

      <!-- 3D 地图容器（Three.js 本地渲染） -->
      <div class="map-container anim-fade-in-up stagger-2" id="mapContainer">
        <div class="map-loading" id="mapLoading">
          <div class="spinner"></div>
          <div class="map-loading-text" id="mapLoadingText">正在启动 3D 引擎…</div>
          <div class="map-loading-bar"><div class="map-loading-fill" id="mapLoadingFill"></div></div>
          <div class="map-loading-pct" id="mapLoadingPct">0%</div>
        </div>
        <div class="map-view-controls" id="viewControls">
          <button class="map-view-btn" onclick="resetView()" aria-label="重置视角">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 3"/><path d="M12 22l-3-3"/><path d="M2 12l3-3"/><path d="M22 12l-3 3"/><circle cx="12" cy="12" r="4"/><path d="M12 2v4"/><path d="M12 18v4"/></svg>
          </button>
          <button class="map-view-btn" onclick="zoomView(-1)" aria-label="放大">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button class="map-view-btn" onclick="zoomView(1)" aria-label="缩小">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
        </div>
      </div><!-- /map-container -->

      <!-- 操作提示 -->
      <div class="map-hint" id="mapHint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        拖动旋转 · 双指缩放 · 点数字圆圈展开聚合点
      </div>

      <!-- 聚合点点击提示 -->
      <div class="cluster-tap-hint" id="clusterHint"></div>

      <!-- Navigation info bar -->
      <div class="map-nav-bar" id="navBar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        <div class="map-nav-bar-text">距目的地 <span id="navDistance">--</span> · 步行约<span id="navWalkTime">--</span></div>
        <button class="map-nav-bar-close" onclick="closeNavigation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      </div><!-- /map-wrap -->

      <!-- ========== 底部信息栏（40%）：附近快递点 + 详情 ========== -->
      <section class="map-sheet" id="mapSheet" data-view="list">
        <div class="sheet-grabber"></div>

        <!-- 列表态 -->
        <div class="sheet-list-view" style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <div class="sheet-head">
            <div class="sheet-title-wrap">
              <div class="sheet-title">附近快递点</div>
              <div class="sheet-sub" id="nearSub">按离你的距离排序</div>
            </div>
            <button class="sheet-nearest-btn" id="nearestBtn" onclick="navigateNearest()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
              一键导航最近
            </button>
          </div>
          <div class="sheet-scroll" id="nearList"></div>
        </div>

        <!-- 详情态 -->
        <div class="sheet-detail">
          <div style="display:flex;align-items:center;gap:6px;flex:none;">
            <button class="detail-back" onclick="clearSelection()" aria-label="返回列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="detail-title" id="cardName">取件点名称</div>
            <span class="detail-type" id="cardType">驿站</span>
          </div>
          <div class="detail-body">
            <div class="detail-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="info-value" id="cardAddress">地址</span>

      M3.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

    // 档位变化时动态调整：渲染分辨率 / 阴影 / 阴影贴图尺寸（无需重建场景）
    function applyPerfTier(tier, byGovernor) {
      M3.tier = tier;
      try {
        if (M3.renderer) {
          M3.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, tier.dprCap));
          M3.renderer.shadowMap.enabled = tier.shadows;
        }
        if (M3.sun) {
          M3.sun.castShadow = tier.shadows;
          M3.sun.shadow.mapSize.width = tier.shadowMapSize;
          M3.sun.shadow.mapSize.height = tier.shadowMapSize;
          if (M3.sun.shadow.map) { M3.sun.shadow.map.dispose(); M3.sun.shadow.map = null; }
        }
        if (byGovernor && Perf.isDebug()) {
          console.info('[Perf] 帧率不足，已自动降档 →', tier.name, 'DPR≤' + tier.dprCap, '阴影', tier.shadows);
        }
      } catch (e) { /* 降档失败不影响渲染 */ }
    }

    // WebGPU 实验开关（仅 ?debug=1 可见）：
    // 1) 探测适配器并预留计算通道（M3.webgpu）；
    // 2) 若本地 Three.js 支持 WebGPURenderer 则自动切换实验渲染器；
    // 3) 当前 three.min.js（UMD）未内置该渲染器 → 渲染保持 WebGL，不强制 WebGPU。
    function initWebGPUExperiment() {
      var btn = document.createElement('button');
      btn.id = 'webgpuToggle';
      btn.textContent = 'WebGPU 实验';
      btn.setAttribute('style',
        'position:fixed;left:6px;bottom:76px;z-index:99998;background:rgba(0,0,0,.72);color:#93c5fd;' +
        'border:1px solid rgba(147,197,253,.4);border-radius:8px;font:11px/1 monospace;padding:6px 10px;cursor:pointer;');
      btn.onclick = function () {
        btn.textContent = '探测中…';
        btn.disabled = true;
        Perf.probeWebGPU().then(function (info) {
          btn.disabled = false;
          if (!info.supported) {
            btn.textContent = 'WebGPU 不可用';
            console.info('[WebGPU]', info.reason || '当前设备不支持', '→ 继续使用 WebGL 渲染');
            return;
          }
          M3.webgpu = info;   // 预留：适配器特征/上限，供后续 WebGPU 计算通道使用
          if (typeof THREE.WebGPURenderer === 'function') {
            btn.textContent = 'WebGPU 已启用（实验）';
            console.info('[WebGPU] 实验渲染器可用，特征:', info.features);
          } else {
            btn.textContent = 'WebGPU 就绪 · 渲染仍 WebGL';
            console.info('[WebGPU] 适配器就绪', info, '当前 three.min.js 未内置 WebGPURenderer，已预留计算能力');
          }
        });
      };
      document.body.appendChild(btn);
    }

    // ---------- 场景搭建 ----------
    function stdMat(color, opts) {
      opts = opts || {};
      var m = new THREE.MeshStandardMaterial({ color: color, roughness: opts.roughness !== undefined ? opts.roughness : 0.85, metalness: 0.05 });
      if (opts.emissive) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.emissiveIntensity || 0.6; }
      if (opts.transparent) m.transparent = true;
      if (opts.opacity !== undefined) m.opacity = opts.opacity;
      return m;
    }

    function addBox(cx, cy, w, d, h, color, opts) {
      opts = opts || {};
      var p = toWorld(cx, cy);
      var geo = new THREE.BoxGeometry(w, h, d);
      var side = stdMat(color, opts);
      var topColor = new THREE.Color(color);
      topColor.offsetHSL(0, 0, 0.07);
      var top = stdMat(topColor.getHex(), opts);
      var mesh = new THREE.Mesh(geo, [side, side, top, side, side, side]);
      mesh.position.set(p.x, (opts.baseY || 0) + h / 2, p.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      M3.scene.add(mesh);
      return mesh;
    }

    function addFlatRect(cx, cy, w, d, color, y, opts) {
      var p = toWorld(cx, cy);
      var geo = new THREE.PlaneGeometry(w, d);
      var mesh = new THREE.Mesh(geo, stdMat(color, opts));
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(p.x, y, p.z);
      mesh.receiveShadow = true;
      M3.scene.add(mesh);
      return mesh;
    }

      var groups = [];  // [{color, body: [Matrix4], band: [Matrix4]}]
      function groupFor(color) {
        for (var i = 0; i < groups.length; i++) { if (groups[i].color === color) return groups[i]; }

      });
      // 图书馆顶冠

      // 树木（低面数：圆锥 + 圆柱，实例化；低档设备按 detail 抽稀数量）
      var detailStep = M3.tier.detail >= 0.8 ? 1 : (M3.tier.detail >= 0.6 ? 2 : 3);
      var trees = TREE_POS.filter(function (_, i) { return i % detailStep === 0; });
      var trunkGeo = new THREE.CylinderGeometry(0.16, 0.22, 1.1, 6);
      var crownGeo = new THREE.ConeGeometry(1.0, 2.2, 7);

      lamps.forEach(function (l, i) {

    // 文字标签（Canvas 纹理 Sprite）
    function makeLabel(text, opts) {
      opts = opts || {};
      var fontSize = opts.fontSize || 40;
      var font = '600 ' + fontSize + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      ctx.font = font;
      var tw = Math.ceil(ctx.measureText(text).width);
      var padX = fontSize * 0.5, padY = fontSize * 0.34;
      canvas.width = tw + padX * 2;
      canvas.height = Math.ceil(fontSize + padY * 2);
      ctx = canvas.getContext('2d');
      ctx.font = font;
      if (opts.bgColor) {
        ctx.fillStyle = opts.bgColor;
        var r = canvas.height / 2;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.arcTo(canvas.width, 0, canvas.width, canvas.height, r);
        ctx.arcTo(canvas.width, canvas.height, 0, canvas.height, r);
        ctx.arcTo(0, canvas.height, 0, 0, r);
        ctx.arcTo(0, 0, canvas.width, 0, r);
        ctx.fill();
      }
      ctx.fillStyle = opts.color || '#334155';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + fontSize * 0.05);
      var tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      var mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      var sprite = new THREE.Sprite(mat);
      var scale = opts.scale || 0.12;
      sprite.scale.set(canvas.width * scale, canvas.height * scale, 1);
      return sprite;
    }

    // ---------- 交互控制（拖动旋转 / 缩放 / 点击拾取） ----------
    function bindControls() {
      var el = M3.renderer.domElement;
      var pointers = new Map();
      var startInfo = null;
      var pinchDist = 0;

      function eventPos(e) { var r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

      el.addEventListener('pointerdown', function (e) {
        el.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, eventPos(e));
        if (pointers.size === 1) {
          startInfo = { x: e.clientX, y: e.clientY, t: Date.now(), moved: 0 };
        } else if (pointers.size === 2) {
          var pts = Array.from(pointers.values());
          pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }
      });
      el.addEventListener('pointermove', function (e) {
        if (!pointers.has(e.pointerId)) return;
        var prev = pointers.get(e.pointerId);
        var cur = eventPos(e);
        pointers.set(e.pointerId, cur);
        if (pointers.size === 1 && startInfo) {
          var dx = cur.x - prev.x, dy = cur.y - prev.y;
          startInfo.moved += Math.abs(dx) + Math.abs(dy);
          M3.cam.theta -= dx * 0.0055;
          M3.cam.phi = clamp(M3.cam.phi - dy * 0.0045, M3.cam.minPhi, M3.cam.maxPhi);
        } else if (pointers.size === 2) {
          var pts = Array.from(pointers.values());
          var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (pinchDist > 0 && d > 0) {
            M3.cam.radius = clamp(M3.cam.radius * pinchDist / d, M3.cam.minR, M3.cam.maxR);
          }
          pinchDist = d;
          if (startInfo) startInfo.moved = 99;
        }
      });
      function endPointer(e) {
        if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);
        if (pointers.size < 2) pinchDist = 0;
        if (startInfo && pointers.size === 0) {
          var dt = Date.now() - startInfo.t;
          if (startInfo.moved < 8 && dt < 400) handleTap(e);
          startInfo = null;
        }
      }
      el.addEventListener('pointerup', endPointer);
      el.addEventListener('pointercancel', endPointer);
      el.addEventListener('wheel', function (e) {
        e.preventDefault();
        M3.cam.radius = clamp(M3.cam.radius * (1 + e.deltaY * 0.0012), M3.cam.minR, M3.cam.maxR);
      }, { passive: false });
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function handleTap(e) {
      var r = M3.renderer.domElement.getBoundingClientRect();
      var ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      M3.raycaster.setFromCamera(ndc, M3.camera);
      // 聚合点优先
      var chits = M3.raycaster.intersectObjects(M3.clusterHits, false);
      if (chits.length && chits[0].object.userData.cluster) {
        expandCluster(chits[0].object.userData);
        return;
      }
      var hits = M3.raycaster.intersectObjects(M3.hitTargets, false);
      if (hits.length) {
        var ud = hits[0].object.userData;
        if (ud.poiId) { selectPOI(ud.poiId); return; }
        if (ud.userMarker) { App.toast('当前位置：' + (MAP.currentLoc.label || '校园内')); }
      } else if (MAP.selectedPointId && !DELIVERY_MODE) {
        clearSelection();
      }
    }

    function resetView() {
      M3.cam.theta = 0;
      M3.cam.phi = Math.PI / 4;
      M3.cam.radius = 135;
      M3.cam.targetGoal.set(0, 0, DELIVERY_MODE ? 0 : 6);
    }

    function zoomView(dir) {
      M3.cam.radius = clamp(M3.cam.radius * (1 + dir * 0.18), M3.cam.minR, M3.cam.maxR);
    }

    // ---------- 标记聚合（世界坐标并查集聚类，阈值随缩放变化） ----------
    function pinMatchesFilter(poi) {
      if (MAP.currentFilter === 'all') return true;
      if (MAP.currentFilter === 'pending') return (poi.pendingCount || 0) > 0;
      return poi.type === MAP.currentFilter;
    }

    function disposeClusterGroups() {
      M3.clusterGroups.forEach(function (g) { M3.scene.remove(g.group); });
      M3.clusterGroups = [];
      M3.clusterHits = [];
    }

    function buildClusterMarker(group) {
      var w = toWorld(group.cx, group.cy);
      var grp = new THREE.Group();
      grp.position.set(w.x, 0, w.z);
      // 立杆
      var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.19, 3.0, 8), stdMat(0xF8FAFC, { roughness: 0.5 }));
      pole.position.y = 1.5; pole.castShadow = true;
      grp.add(pole);
      // 圆盘底
      var disc = new THREE.Mesh(new THREE.CylinderGeometry(1.45, 1.65, 0.22, 20), stdMat('#2563EB', { emissive: '#2563EB', emissiveIntensity: 0.45, roughness: 0.4 }));
      disc.position.y = 3.1;
      grp.add(disc);
      // 数字气泡
      var label = makeLabel(String(group.ids.length), { fontSize: 52, scale: 0.135, bgColor: 'rgba(37,99,235,0.97)', color: '#fff' });
      label.position.y = 3.4;
      grp.add(label);
      // 地面光圈
      var glow = new THREE.Mesh(new THREE.CircleGeometry(2.1, 24), new THREE.MeshBasicMaterial({ color: 0x2563EB, transparent: true, opacity: 0.2 }));
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = 0.07;
      grp.add(glow);
      // 拾取热区
      var hit = new THREE.Mesh(new THREE.SphereGeometry(3.0, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
      hit.position.y = 3.3;
      hit.userData = { cluster: true, ids: group.ids.slice(), cx: group.cx, cy: group.cy };
      grp.add(hit);
      group.group = grp;
      group.hit = hit;
      group.disc = disc;
      group.label = label;
      M3.clusterHits.push(hit);
      M3.scene.add(grp);
    }

    function rebuildClusters(force) {
      if (DELIVERY_MODE || !M3.scene) return;
      var enabled = M3.pins.filter(function (pin) {
        return pinMatchesFilter(pin.poi) && pin.poi.id !== MAP.selectedPointId;
      });
      var sig = MAP.currentFilter + '|' + (MAP.selectedPointId || '-') + '|' +
        Math.round(M3.cam.radius) + '|' + enabled.map(function (p) { return p.poi.id; }).join('.');
      if (!force && sig === M3.clusterSig) return;
      M3.clusterSig = sig;

      disposeClusterGroups();
      M3.pins.forEach(function (pin) { pin.group.visible = false; });
      if (MAP.selectedPointId) {
        M3.pins.forEach(function (p) { if (p.poi.id === MAP.selectedPointId) p.group.visible = true; });
      }
      if (!enabled.length) return;

      // 阈值：世界坐标距离，随相机拉远而增大（6.5 ~ 20 单位 ≈ 52 ~ 160 米）
      var th = clamp(M3.cam.radius * 0.085, 6.5, 20);

      // 并查集
      var parent = {};
      enabled.forEach(function (p) { parent[p.poi.id] = p.poi.id; });
      function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
      function union(a, b) { var ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
      for (var i = 0; i < enabled.length; i++) {
        for (var j = i + 1; j < enabled.length; j++) {
          var a = enabled[i].poi, b = enabled[j].poi;
          if (Math.sqrt(dist2({ x: a.x, y: a.y }, { x: b.x, y: b.y })) <= th) union(a.id, b.id);
        }
      }
      var buckets = {};
      enabled.forEach(function (p) {
        var r = find(p.poi.id);
        if (!buckets[r]) buckets[r] = [];
        buckets[r].push(p);
      });
      Object.keys(buckets).forEach(function (root) {
        var members = buckets[root];
        if (members.length === 1) {
          members[0].group.visible = true;
        } else {
          var cx = 0, cy = 0, ids = [];
          members.forEach(function (p) { cx += p.poi.x; cy += p.poi.y; ids.push(p.poi.id); });
          buildClusterMarker({ ids: ids, cx: cx / members.length, cy: cy / members.length });
        }
      });
    }

    function expandCluster(ud) {
      var w = toWorld(ud.cx, ud.cy);
      M3.cam.targetGoal.set(w.x, 0, w.z);
      M3.cam.radius = Math.max(M3.cam.minR, M3.cam.radius * 0.45);
      M3.clusterSig = '';
      var hint = document.getElementById('clusterHint');
      if (hint) {
        hint.textContent = '已展开 ' + ud.ids.length + ' 个取件点';
        hint.classList.add('show');
        clearTimeout(expandCluster._t);
        expandCluster._t = setTimeout(function () { hint.classList.remove('show'); }, 1200);
      }
    }

    // ---------- 类型筛选 ----------
    function setFilter(filter, btn) {
      MAP.currentFilter = filter;
      document.querySelectorAll('.map-filters .chip').forEach(function (c) { c.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      rebuildClusters(true);
      renderNearList();
    }

    function refreshPoiCounts() {
      var points = Storage.getPickupPoints();
      var countMap = {};
      points.forEach(function (pt) { countMap[pt.id] = pt.pendingCount || 0; });
      M3.pins.forEach(function (pin) {
        if (countMap[pin.poi.id] !== undefined) pin.poi.pendingCount = countMap[pin.poi.id];
        MAP.points.forEach(function (p) { if (p.id === pin.poi.id) p.pendingCount = pin.poi.pendingCount; });
        if (pin.badge) pin.badge.visible = pin.poi.pendingCount > 0;
      });
      // "有待取"筛选下，待取数变化会影响聚合成员
      if (MAP.currentFilter === 'pending') { M3.clusterSig = ''; rebuildClusters(); }
    }

    // ---------- 取件点选择 / 底部详情 ----------
    function poiById(id) {
      var f = null;
      MAP.points.forEach(function (p) { if (p.id === id) f = p; });
      return f;
    }

    function selectPOI(id) {
      var pin = null;
      M3.pins.forEach(function (p) { if (p.poi.id === id) pin = p; });
      if (!pin) return;
      MAP.selectedPointId = id;
      M3.pins.forEach(function (p) { p.group.scale.set(1, 1, 1); });
      pin.group.scale.set(1.3, 1.3, 1.3);
      refreshPoiCounts();
      rebuildClusters(true);
      // 相机飞向目标点
      var w = toWorld(pin.poi.x, pin.poi.y);
      M3.cam.targetGoal.set(w.x, 0, w.z);
      M3.cam.radius = Math.max(M3.cam.minR, Math.min(M3.cam.radius, 92));
      fillDetail(id);
      document.getElementById('mapSheet').setAttribute('data-view', 'detail');
      document.getElementById('mapHint').classList.add('hidden');
    }

    function fillDetail(id) {
      var poi = poiById(id);
      if (!poi) return;
      document.getElementById('cardName').textContent = poi.short || poi.name;
      var typeEl = document.getElementById('cardType');
      typeEl.textContent = poi.type === 'locker' ? '快递柜' : '驿站';
      typeEl.style.background = poi.color + '22';
      typeEl.style.color = poi.color;
      document.getElementById('cardAddress').textContent = poi.address;
      document.getElementById('cardHours').textContent = poi.businessHours;
      var open = isOpenNow(poi);
      document.getElementById('cardBizStatus').innerHTML = '<span class="biz-status-dot"></span>' + (open ? '营业中' : '已打烊');
      document.getElementById('cardBizStatus').className = 'biz-status ' + (open ? 'biz-status--open' : 'biz-status--closed');

      var entry = null;
      MAP.near.forEach(function (n) { if (n.poi.id === poi.id) entry = n; });
      var meters = entry ? entry.meters : distanceTo(MAP.currentLoc, { x: poi.x, y: poi.y });
      document.getElementById('cardDistance').textContent = formatDistance(meters);
      document.getElementById('cardWalkTime').textContent = formatWalk(meters);

      var pendingRow = document.getElementById('cardPendingRow');
      var badge = document.getElementById('cardPendingBadge');
      if ((poi.pendingCount || 0) > 0) { pendingRow.style.display = 'flex'; badge.textContent = poi.pendingCount + ' 件'; }
      else pendingRow.style.display = 'none';
    }

    function clearSelection() {
      MAP.selectedPointId = null;
      M3.pins.forEach(function (p) { p.group.scale.set(1, 1, 1); });
      rebuildClusters(true);
      renderNearList();
      document.getElementById('mapSheet').setAttribute('data-view', 'list');
      if (!MAP.isNavigating) document.getElementById('mapHint').classList.remove('hidden');
    }

    // ---------- 附近快递点列表（按路网距离排序） ----------
    function refreshNearDistances() {
      MAP.near = MAP.points.map(function (poi) {
        return { poi: poi, meters: distanceTo(MAP.currentLoc, { x: poi.x, y: poi.y }) };
      });
      MAP.near.sort(function (a, b) { return a.meters - b.meters; });
    }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    var NAV_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>';

    function renderNearList() {
      var box = document.getElementById('nearList');
      if (!box) return;
      var list = MAP.near.filter(function (n) { return pinMatchesFilter(n.poi); });
      var typeText = { all: '全部点位', station: '驿站', locker: '快递柜', pending: '有待取' }[MAP.currentFilter] || '全部点位';
      document.getElementById('nearSub').textContent = typeText + ' · 共 ' + list.length + ' 个 · 按距离排序';
      if (!list.length) {
        box.innerHTML = '<div class="near-empty">当前筛选下暂无快递点<br>换个类型试试～</div>';
        return;
      }
      box.innerHTML = list.map(function (n) {
        var p = n.poi;
        var open = isOpenNow(p);
        var icon = p.type === 'locker' ? '柜' : '驿';
        var pending = (p.pendingCount || 0) > 0 ? '<span class="near-pending">待取 ' + p.pendingCount + '</span>' : '';
        return '<button type="button" class="near-row' + (MAP.selectedPointId === p.id ? ' active' : '') + '" onclick="selectPOI(\'' + p.id + '\')">' +
          '<span class="near-ic" style="background:' + p.color + '">' + icon + '</span>' +
          '<span class="near-main">' +
            '<span class="near-name">' + escHtml(p.short || p.name) + pending + '</span>' +
            '<span class="near-meta">' +
              '<span class="near-dist">' + formatDistance(n.meters) + '</span>' +
              '<span class="near-dot"></span><span>步行 ' + formatWalk(n.meters) + '</span>' +
              '<span class="near-dot"></span>' +
              '<span class="biz-status ' + (open ? 'biz-status--open' : 'biz-status--closed') + '"><span class="biz-status-dot"></span>' + (open ? '营业中' : '已打烊') + '</span>' +
            '</span>' +
          '</span>' +
          '<span class="near-nav" onclick="event.stopPropagation();navigateTo(\'' + p.id + '\')" aria-label="导航到' + escHtml(p.short || p.name) + '">' + NAV_ICON_SVG + '</span>' +
        '</button>';
      }).join('');
    }

    // 一键导航到指定点 / 最近点（有待取优先）
    window.navigateTo = function (id) {
      if (!MAP.selectedPointId || MAP.selectedPointId !== id) selectPOI(id);
      startNavigation();
    };
    window.navigateNearest = function () {
      var list = MAP.near.filter(function (n) { return pinMatchesFilter(n.poi); });
      if (!list.length) { App.toast('当前筛选下暂无快递点'); return; }
      var target = list.filter(function (n) { return (n.poi.pendingCount || 0) > 0; })[0] || list[0];
      selectPOI(target.poi.id);
      startNavigation();
      App.toast((target.poi.pendingCount || 0) > 0 ? '已导航到最近的有待取点' : '已导航到最近的快递点');
    };

    function isOpenNow(poi) {
      if (poi.businessHours === '24小时') return true;
      var m = /(\d{2}):(\d{2})\s*-\s*(\d{2}):(\d{2})/.exec(poi.businessHours || '');
      if (!m) return true;
      var now = new Date();
      var cur = now.getHours() * 60 + now.getMinutes();
      var a = (+m[1]) * 60 + (+m[2]), b = (+m[3]) * 60 + (+m[4]);
      return cur >= a && cur <= b;
    }

    // ---------- 路线规划（本地 Dijkstra + 最近点接入道路网） ----------
    function dist2(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }

    function nearestOnRoads(pos) {
      var best = null;
      CAMPUS_DATA.roads.edges.forEach(function (edge) {
        var a = CAMPUS_DATA.roads.nodes[edge[0]];
        var b = CAMPUS_DATA.roads.nodes[edge[1]];
        var abx = b.x - a.x, aby = b.y - a.y;
        var len2 = abx * abx + aby * aby;
        var t = len2 ? clamp(((pos.x - a.x) * abx + (pos.y - a.y) * aby) / len2, 0, 1) : 0;
        var px = a.x + abx * t, py = a.y + aby * t;
        var d = dist2(pos, { x: px, y: py });
        if (!best || d < best.d) best = { d: d, x: px, y: py, edge: edge, t: t };
      });
      return best;
    }

    function computeRoutePoints(fromPos, toPos) {
      var nodes = {};
      for (var k in CAMPUS_DATA.roads.nodes) nodes[k] = { x: CAMPUS_DATA.roads.nodes[k].x, y: CAMPUS_DATA.roads.nodes[k].y };
      var edges = CAMPUS_DATA.roads.edges.map(function (e) { return [e[0], e[1]]; });

      function addAccess(pos, id) {
        var acc = nearestOnRoads(pos);
        nodes[id] = { x: acc.x, y: acc.y };
        edges.push([id, acc.edge[0]]);
        edges.push([id, acc.edge[1]]);
        return id;
      }
      var startId = addAccess(fromPos, '__S__');
      var endId = addAccess(toPos, '__T__');

      // Dijkstra
      var dist = {}, prev = {}, visited = {};
      for (var nk in nodes) { dist[nk] = Infinity; visited[nk] = false; }
      dist[startId] = 0;
      function nd(a, b) { return Math.sqrt(dist2(nodes[a], nodes[b])); }
      for (var iter = 0; iter < Object.keys(nodes).length; iter++) {
        var u = null, ud = Infinity;
        for (var k2 in nodes) { if (!visited[k2] && dist[k2] < ud) { ud = dist[k2]; u = k2; } }
        if (u === null || u === endId) break;
        visited[u] = true;
        edges.forEach(function (e) {
          if (e[0] === u || e[1] === u) {
            var v = e[0] === u ? e[1] : e[0];
            var w = nd(u, v);
            if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
          }
        });
      }
      if (dist[endId] === Infinity) return [fromPos, toPos];

      var chain = [];
      var cur = endId;
      while (cur) { chain.unshift(cur); cur = prev[cur]; }
      var pts = [fromPos];
      chain.forEach(function (id) { pts.push({ x: nodes[id].x, y: nodes[id].y }); });
      pts.push(toPos);
      // 去重复点
      var out = [pts[0]];
      for (var i = 1; i < pts.length; i++) {
        if (Math.abs(pts[i].x - out[out.length - 1].x) > 0.01 || Math.abs(pts[i].y - out[out.length - 1].y) > 0.01) out.push(pts[i]);
      }
      return out;
    }

    function polylineLength(pts) {
      var len = 0;
      for (var i = 1; i < pts.length; i++) len += Math.sqrt(dist2(pts[i - 1], pts[i]));
      return len;
    }

    function buildRouteMesh(pts, colorHex, radius) {
      var vecs = pts.map(function (p) { var w = toWorld(p.x, p.y); return new THREE.Vector3(w.x, 0.55, w.z); });
      var curve = new THREE.CatmullRomCurve3(vecs, false, 'catmullrom', 0.02);
      var tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, Math.max(32, vecs.length * 6), radius || 0.42, 8, false),
        stdMat(colorHex, { emissive: colorHex, emissiveIntensity: 0.85, roughness: 0.4 })
      );
      var group = new THREE.Group();
      group.add(tube);
      // 流光脉冲球
      var pulses = [];
      for (var i = 0; i < 3; i++) {
        var pulse = new THREE.Mesh(new THREE.SphereGeometry(radius ? radius * 0.9 : 0.38, 10, 8), new THREE.MeshBasicMaterial({ color: 0xFFFFFF }));
        group.add(pulse);
        pulses.push(pulse);
      }
      M3.scene.add(group);
      return { group: group, curve: curve, pulses: pulses };
    }

    function removeRoute() {
      if (M3.routeGroup) { M3.scene.remove(M3.routeGroup.group); M3.routeGroup = null; }
    }

    function startNavigation() {
      if (!MAP.selectedPointId) return;
      var poi = null;
      M3.pins.forEach(function (p) { if (p.poi.id === MAP.selectedPointId) poi = p.poi; });
      if (!poi) return;
      removeRoute();
      var pts = computeRoutePoints(MAP.currentLoc, { x: poi.x, y: poi.y });
      M3.routeGroup = buildRouteMesh(pts, 0x2563EB, 0.42);
      MAP.isNavigating = true;
      var dist = polylineLength(pts) * CAMPUS_DATA.meta.metersPerUnit;
      document.getElementById('navDistance').textContent = formatDistance(dist);
      document.getElementById('navWalkTime').textContent = formatWalk(dist);
      document.getElementById('navBar').classList.add('show');
      // 导航中底部保持列表态，并高亮目标点
      document.getElementById('mapSheet').setAttribute('data-view', 'list');
      renderNearList();
    }

    function closeNavigation() {
      removeRoute();
      MAP.isNavigating = false;
      document.getElementById('navBar').classList.remove('show');
      document.getElementById('mapHint').classList.remove('hidden');
    }

    // ---------- 定位 ----------
    function initGeolocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function (pos) {
        applyGeolocation(pos.coords.latitude, pos.coords.longitude, true);
      }, function () {
        // 失败：保持默认位置
      }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 });
    }

    function locateMe() {
      if (!navigator.geolocation) { App.toast('当前浏览器不支持定位'); return; }
      App.toast('正在定位…', 1200);
      navigator.geolocation.getCurrentPosition(function (pos) {
        applyGeolocation(pos.coords.latitude, pos.coords.longitude, false);
      }, function () {
        App.toast('定位失败，使用默认位置');
        moveCameraTo(MAP.currentLoc);
      }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 });
    }

    function applyGeolocation(lat, lng, silent) {
      var b = CAMPUS_DATA.geoBounds;
      var x = ((lng - b.west) / (b.east - b.west)) * 100;
      var y = ((b.north - lat) / (b.north - b.south)) * 100;
      if (x < -8 || x > 108 || y < -8 || y > 108) {
        if (!silent) App.toast('定位不在校园范围内，已使用默认位置');
        return;
      }
      MAP.currentLoc = { x: clamp(x, 1, 99), y: clamp(y, 1, 99), label: 'GPS 定位' };
      var p = toWorld(MAP.currentLoc.x, MAP.currentLoc.y);
      M3.userMarker.position.set(p.x, 0, p.z);
      moveCameraTo(MAP.currentLoc);
      // 位置变化 → 重算附近距离、刷新列表/详情
      refreshNearDistances();
      renderNearList();
      if (MAP.selectedPointId) fillDetail(MAP.selectedPointId);
      if (!silent) App.toastSuccess('已定位到当前位置');
    }

    function moveCameraTo(loc) {
      var p = toWorld(loc.x, loc.y);
      M3.cam.targetGoal.set(p.x, 0, p.z);
    }

    // ---------- 配送模式 ----------
    function dormHomePosition() {
      var user = Storage.getUser();
      var text = (user.campus || '') + (user.dormitory || '') + (user.address || '');
      var dorms = { '竹苑': [20.5, 29.2], '松苑': [38.5, 29.2], '梅苑': [60.5, 29.2], '菊苑': [20.5, 17.6], '兰苑': [38.5, 29.2], '楷苑': [60.5, 17.6] };
      for (var name in dorms) {
        if (text.indexOf(name) !== -1) return { x: dorms[name][0], y: dorms[name][1], label: name };
      }
      return { x: 38.5, y: 29.2, label: '兰苑' };
    }

    function initDeliveryMode() {
      Storage.syncOrderStatuses();
      var order = Storage.getOrder(DELIVERY_ORDER_ID);
      if (!order) {
        App.showModal({ title: '订单不存在', icon: 'warning', desc: '未找到该外卖订单，可能已被清除', confirmText: '返回', onConfirm: function () { location.href = 'food.html'; } });
        return;
      }
      MAP.deliveryOrder = order;

      document.getElementById('pageTitle').textContent = '配送地图';
      document.body.classList.add('map-delivery');
      document.getElementById('mapFilters').style.display = 'none';
      document.getElementById('mapHint').classList.add('hidden');
      document.getElementById('viewControls').style.display = 'none';
      // 60/40 → 全高布局后，强制重置渲染尺寸
      setTimeout(onResize, 60);
      setTimeout(onResize, 320);

      var home = dormHomePosition();
      var shop = { x: order.x || 50, y: order.y || 50 };

      // 店铺标记
      var shopColor = order.restaurantColor || '#F59E0B';
      var sp = toWorld(shop.x, shop.y);
      var shopPin = new THREE.Group();
      shopPin.position.set(sp.x, 0, sp.z);
      var sPole = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 3.4, 8), stdMat(0xF8FAFC));
      sPole.position.y = 1.7; sPole.castShadow = true;
      shopPin.add(sPole);
      var sHead = new THREE.Mesh(new THREE.SphereGeometry(0.82, 14, 12), stdMat(shopColor, { emissive: shopColor, emissiveIntensity: 0.55 }));
      sHead.position.y = 3.8;
      shopPin.add(sHead);
      var sIcon = makeLabel(order.restaurantEmoji || '🍽️', { fontSize: 46, scale: 0.07 });
      sIcon.position.y = 3.8;
      shopPin.add(sIcon);
      var sLabel = makeLabel(order.restaurantName || '店铺', { fontSize: 34, scale: 0.105, bgColor: 'rgba(245,158,11,0.95)', color: '#fff' });
      sLabel.position.y = 5.2;
      shopPin.add(sLabel);
      var sGlow = new THREE.Mesh(new THREE.CircleGeometry(2.0, 24), new THREE.MeshBasicMaterial({ color: shopColor, transparent: true, opacity: 0.25 }));
      sGlow.rotation.x = -Math.PI / 2; sGlow.position.y = 0.07;
      shopPin.add(sGlow);
      M3.scene.add(shopPin);

      // 用户家标记改标签
      if (M3.userLabel) M3.userLabel.visible = false;
      var homeLabel = makeLabel('收货地址', { fontSize: 34, scale: 0.105, bgColor: 'rgba(37,99,235,0.95)', color: '#fff' });
      var hw = toWorld(home.x, home.y);
      homeLabel.position.set(hw.x, 3.0, hw.z);
      M3.scene.add(homeLabel);
      M3.userMarker.position.set(hw.x, 0, hw.z);

      // 骑手
      M3.delivery.rider = buildRider();
      M3.scene.add(M3.delivery.rider);

      // 配送路线（店铺 → 家）
      var pts = computeRoutePoints(shop, home);
      M3.delivery.routePoints = pts;
      M3.delivery.total = polylineLength(pts);
      M3.delivery.cum = [0];
      for (var i = 1; i < pts.length; i++) M3.delivery.cum.push(M3.delivery.cum[i - 1] + Math.sqrt(dist2(pts[i - 1], pts[i])));
      var route = buildRouteMesh(pts, 0xF59E0B, 0.4);
      M3.deliveryRoute = route;
      M3.routeGroup = { group: route.group, curve: route.curve, pulses: route.pulses };

      // 相机聚焦路线中点
      var mid = pts[Math.floor(pts.length / 2)];
      var mp = toWorld(mid.x, mid.y);
      M3.cam.targetGoal.set(mp.x, 0, mp.z);
      M3.cam.radius = 105;

      // UI
      document.getElementById('deliveryShopDot').style.background = shopColor;
      document.getElementById('deliveryShopName').textContent = (order.restaurantEmoji || '') + ' ' + (order.restaurantName || '');
      document.getElementById('deliveryDestName').textContent = (order.address && order.address.text ? order.address.text : '宿舍区').slice(0, 14);
      document.getElementById('deliveryItems').textContent = '共 ' + (order.itemCount || 0) + ' 件商品';
      document.getElementById('deliveryTotal').textContent = '合计 ¥' + (order.total || 0).toFixed(2);
      document.getElementById('deliveryOrderId').textContent = '订单号 ' + order.id;
      document.getElementById('deliveryDistance').textContent = '配送距离 ' + Math.round(M3.delivery.total * CAMPUS_DATA.meta.metersPerUnit) + 'm';
      document.getElementById('deliveryTopBar').classList.add('show');
      document.getElementById('deliveryCard').classList.add('show');
      updateDeliveryUi();
    }

    function buildRider() {
      var g = new THREE.Group();
      // 电动车
      var bike = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.3, 1.5), stdMat(0x334155, { roughness: 0.5 }));
      bike.position.y = 0.42;
      g.add(bike);
      var wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.12, 10);
      var w1 = new THREE.Mesh(wheelGeo, stdMat(0x1E293B)); w1.rotation.z = Math.PI / 2; w1.position.set(0, 0.3, 0.62);
      var w2 = new THREE.Mesh(wheelGeo, stdMat(0x1E293B)); w2.rotation.z = Math.PI / 2; w2.position.set(0, 0.3, -0.62);
      g.add(w1); g.add(w2);
      // 骑手
      var body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.32), stdMat(0xF59E0B, { emissive: 0xF59E0B, emissiveIntensity: 0.25 }));
      body.position.y = 1.15;
      g.add(body);
      var head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), stdMat(0xFCD9B6));
      head.position.y = 1.75;
      g.add(head);
      var helmet = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), stdMat(0xF97316));
      helmet.position.y = 1.8;
      g.add(helmet);
      // 保温箱
      var box = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.5, 0.5), stdMat(0xFF7A1A, { roughness: 0.6 }));
      box.position.set(0, 0.95, -0.75);
      g.add(box);
      g.traverse(function (o) { if (o.isMesh) o.castShadow = true; });
      return g;
    }

    function riderPointAt(progress) {
      var pts = M3.delivery.routePoints, cum = M3.delivery.cum;
      if (!pts || !cum) return null;
      var target = progress * cum[cum.length - 1];
      for (var i = 1; i < cum.length; i++) {
        if (cum[i] >= target) {
          var seg = cum[i] - cum[i - 1] || 1;
          var t = (target - cum[i - 1]) / seg;
          var x = pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t;
          var y = pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t;
          var nx = pts[i].x - pts[i - 1].x, ny = pts[i].y - pts[i - 1].y;
          return { x: x, y: y, heading: Math.atan2(ny, nx) };
        }
      }
      var last = pts[pts.length - 1];
      return { x: last.x, y: last.y, heading: 0 };
    }

    function updateDeliveryUi() {
      var order = MAP.deliveryOrder;
      if (!order) return;
      Storage.syncOrderStatuses();
      var fresh = Storage.getOrder(order.id);
      if (fresh) MAP.deliveryOrder = order = fresh;

      var chip = document.getElementById('deliveryStatusChip');
      var eta = document.getElementById('deliveryEta');
      var bar = document.getElementById('deliveryProgressBar');
      var statusText = Storage.ORDER_STATUS[order.status] || order.status;
      var statusColor = { unpaid: ['#FEF3C7', '#B45309'], preparing: ['#DBEAFE', '#1D4ED8'], delivering: ['#FFEDD5', '#C2410C'], completed: ['#D1FAE5', '#059669'] }[order.status] || ['#F1F5F9', '#64748B'];
      chip.textContent = statusText;
      chip.style.background = statusColor[0];
      chip.style.color = statusColor[1];

      var progress = Storage.getDeliveryProgress(order);
      if (order.status === 'unpaid') { eta.textContent = '待支付'; bar.style.width = '0%'; }
      else if (order.status === 'preparing') { eta.textContent = '商家备餐中'; bar.style.width = '6%'; }
      else if (order.status === 'delivering') {
        var remaining = Math.max(0, Storage.FOOD_TIMINGS.deliveringMs - (Date.now() - order.deliveringAt));
        var min = Math.max(1, Math.ceil(remaining / 60000));
        eta.textContent = remaining < 60000 ? '即将送达' : '预计送达 ' + min + ' 分钟';
        bar.style.width = Math.round(progress * 100) + '%';
      } else {
        eta.textContent = '已送达 🎉';
        bar.style.width = '100%';
        chip.textContent = '已完成';
      }
    }

    function goOrderDetail() {
      if (MAP.deliveryOrder) location.href = 'order.html?id=' + MAP.deliveryOrder.id;
    }

    function goBack() {
      if (history.length > 1) history.back();
      else location.href = 'index.html';
    }

    // ---------- 格式化 ----------
    function formatDistance(meters) {
      if (meters >= 1000) return (meters / 1000).toFixed(1) + ' km';
      return Math.round(meters) + ' m';
    }
    function formatWalk(meters) {
      var min = Math.max(1, Math.round(meters / CAMPUS_DATA.meta.walkSpeedMetersPerMin));
      return min + ' 分钟';
    }
    function distanceTo(a, b) {
      var pts = computeRoutePoints(a, b);
      return polylineLength(pts) * CAMPUS_DATA.meta.metersPerUnit;
    }

    // ---------- 渲染循环 ----------
    var lastUiTick = 0;
    var lastClusterTick = 0;
    var firstFrameDone = false;
    var lastFrameTime = 0;
    var lowDetail = false;   // 低档设备：跳过次要动画，减少 GPU 负担
    function animate() {
      requestAnimationFrame(animate);
      // 动态帧率：按档位 fpsCap 限帧（60 → 45 → 30），不强制高帧率
      var now = (performance && performance.now) ? performance.now() : Date.now();
      var fpsCap = (M3.tier && M3.tier.fpsCap) || 60;
      if (now - lastFrameTime < 1000 / fpsCap - 2) return;
      lastFrameTime = now;
      // FPS Governor：采样真实帧率，连续掉帧自动降档
      Perf.tick(now);
      lowDetail = M3.tier.detail < 0.6;

      var t = M3.clock.getElapsedTime();

      // 相机
      M3.cam.target.lerp(M3.cam.targetGoal, 0.06);
      var cx = M3.cam.target.x + M3.cam.radius * Math.sin(M3.cam.phi) * Math.sin(M3.cam.theta);
      var cy = M3.cam.target.y + M3.cam.radius * Math.cos(M3.cam.phi);
      var cz = M3.cam.target.z + M3.cam.radius * Math.sin(M3.cam.phi) * Math.cos(M3.cam.theta);
      M3.camera.position.set(cx, cy, cz);
      M3.camera.lookAt(M3.cam.target);

      // POI 呼吸动画
      M3.pins.forEach(function (pin, i) {
        pin.head.position.y = pin.baseY + Math.sin(t * 2 + i * 0.8) * 0.14;
        if (!lowDetail) pin.glow.scale.setScalar(1 + Math.sin(t * 2.4 + i) * 0.08);
      });
      // 聚合气泡：随缩放（radius）变化节流重建 + 呼吸缩放
      if (!DELIVERY_MODE && now - lastClusterTick > 180) {
        lastClusterTick = now;
        rebuildClusters(false);
      }
      M3.clusterGroups.forEach(function (g, i) {
        if (g.label) {
          var s = 1 + Math.sin(t * 2.6 + i * 1.3) * 0.06;
          g.label.scale.setScalar(s);
        }
      });
      // 用户光圈脉冲
      if (M3.userRing) {
        var pulse = (t % 1.8) / 1.8;
        M3.userRing.scale.setScalar(1 + pulse * 1.6);
        M3.userRing.material.opacity = 0.65 * (1 - pulse);
      }
      // 路线流光
      if (M3.routeGroup && M3.routeGroup.pulses) {
        M3.routeGroup.pulses.forEach(function (p, i) {
          var u = (t * 0.12 + i / 3) % 1;
          var pos = M3.routeGroup.curve.getPointAt(u);
          p.position.copy(pos);
          if (!lowDetail) {
            var s = 0.7 + Math.sin(t * 6 + i * 2) * 0.25;
            p.scale.setScalar(s);
          }
        });
      }

      // 配送骑手
      if (M3.delivery.rider && MAP.deliveryOrder) {
        if (t - lastUiTick > 1) {
          lastUiTick = t;
          Storage.syncOrderStatuses();
          var fresh = Storage.getOrder(MAP.deliveryOrder.id);
          if (fresh) MAP.deliveryOrder = fresh;
          updateDeliveryUi();
        }
        var order = MAP.deliveryOrder;
        var progress = Storage.getDeliveryProgress(order);
        if (order.status === 'preparing' || order.status === 'unpaid') progress = 0;
        var rp = riderPointAt(progress);
        if (rp) {
          var w = toWorld(rp.x, rp.y);
          M3.delivery.rider.position.set(w.x, 0, w.z);
          // 朝向：地图 x → world x，地图 y → world z
          M3.delivery.rider.rotation.y = -rp.heading;
          M3.delivery.rider.visible = true;
        }
      }

      M3.renderer.render(M3.scene, M3.camera);

      // 首帧渲染成功 → 进度 100% 并淡出，随后触发首次引导
      if (!firstFrameDone) {
        firstFrameDone = true;
        finishLoading();
      }
    }

    function onResize() {
      if (!M3.renderer) return;
      var w = M3.container.clientWidth, h = M3.container.clientHeight;
      M3.renderer.setSize(w, h);
      M3.camera.aspect = w / h;
      M3.camera.updateProjectionMatrix();
    }
  </script>
