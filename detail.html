  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var pkgId = params.get('id') || 'PK001';
      var contentEl = document.getElementById('detailContent');

      function statusBanner(pkg) {
        var config = {
          pending: { bg: '#FEF3C7', color: '#B45309', icon: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>', label: '待取件' },
          picked: { bg: '#D1FAE5', color: '#059669', icon: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>', label: '已取件' },
          expired: { bg: '#FEE2E2', color: '#EF4444', icon: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>', label: '已逾期' },
          incoming: { bg: '#DBEAFE', color: '#2563EB', icon: '<rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>', label: '运输中' }
        };
        var c = config[pkg.status] || config.pending;
        var html = '<div class="card anim-fade-in-up" style="background:' + c.bg + ';padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;">' +
          '<div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
            '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="' + c.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + c.icon + '</svg>' +
          '</div>' +
          '<div>' +
            '<div style="font-size:18px;font-weight:700;color:' + c.color + ';">' + c.label + '</div>';
        if (pkg.status === 'picked' && pkg.pickedAt) {
          html += '<div style="font-size:13px;color:' + c.color + ';opacity:0.8;margin-top:4px;">取件时间：' + pkg.pickedAt + '</div>';
        } else if (pkg.status === 'pending' && pkg.expiresIn) {
          html += '<div style="font-size:13px;color:' + c.color + ';opacity:0.8;margin-top:4px;">剩余 ' + pkg.expiresIn + '，请尽快取件</div>';
        } else if (pkg.status === 'incoming' && pkg.estimatedTime) {
          html += '<div style="font-size:13px;color:' + c.color + ';opacity:0.8;margin-top:4px;">' + pkg.estimatedTime + '</div>';
        } else if (pkg.status === 'expired') {
          html += '<div style="font-size:13px;color:' + c.color + ';opacity:0.8;margin-top:4px;">' + (pkg.remark || '包裹已退回') + '</div>';
        }
        html += '</div></div>';
        return html;
      }

      // 取件身份码卡（用户级身份凭证，替代原按件生成的取件码；支持本地导入）
      function identityCodeCard() {
        var user = Storage.getUser();
        var idc = Storage.getIdentityCode();
        var code = idc.code;
        var grouped = code.replace(/(.{4})/g, '$1 ').trim();
        var sourcePill = idc.source === 'imported'
          ? '<span style="font-size:11px;background:rgba(255,255,255,0.22);color:#fff;border-radius:999px;padding:3px 10px;">已本地导入</span>'
          : '<span style="font-size:11px;background:rgba(255,255,255,0.16);color:#fff;border-radius:999px;padding:3px 10px;">系统生成</span>';
        var avatar = App.avatarHtml(user, 40, 'rgba(255,255,255,0.28)', '#fff');
        var importBtn = idc.source === 'imported'
          ? '<button class="btn btn-outline btn-sm" style="flex:1;gap:5px;padding:9px 0;" onclick="openImportIdentity()">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
              '重新导入' +
            '</button>'
          : '<button class="btn btn-outline btn-sm" style="flex:1;gap:5px;padding:9px 0;" onclick="openImportIdentity()">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>' +
              '本地导入' +
            '</button>';
        return '<div class="anim-fade-in-up stagger-1" style="margin-bottom:16px;">' +
          '<div style="border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow-sm,var(--card-shadow));">' +
            '<div style="display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));padding:14px 16px;color:#fff;">' +
              avatar +
              '<div style="flex:1;min-width:0;">' +
                '<div style="display:flex;align-items:center;gap:8px;">' +
                  '<span style="font-size:15px;font-weight:700;">' + (user.name || '用户') + '</span>' +
                  sourcePill +
                '</div>' +
                '<div style="font-size:11px;opacity:0.85;margin-top:2px;">取件身份码 · 向工作人员出示即可</div>' +
              '</div>' +
            '</div>' +
            '<div style="padding:18px 16px 16px;text-align:center;">' +
              '<div id="detailQrBox" onclick="App.showIdentityCode()" style="width:148px;height:148px;margin:0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-border-light);border-radius:14px;padding:8px;box-sizing:border-box;cursor:pointer;background:#fff;">' +
                '<div class="spinner" style="width:26px;height:26px;border-width:3px;"></div>' +
              '</div>' +
              '<div style="font-size:12px;color:var(--color-text-hint);margin-top:8px;">点击二维码可放大查看</div>' +
              '<div style="font-size:22px;font-weight:800;letter-spacing:3px;font-family:var(--font-mono);color:var(--color-text);margin-top:6px;">' + grouped + '</div>' +
              '<div style="display:flex;gap:10px;margin-top:14px;">' +
                '<button class="btn btn-outline btn-sm" style="flex:1;gap:5px;padding:9px 0;" onclick="copyCode(\'' + code + '\')">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
                  '复制' +
                '</button>' +
                importBtn +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }

      // 本地导入身份码弹窗：手动录入快递 App / 纸质卡片上的身份码
      window.openImportIdentity = function () {
        var current = Storage.getIdentityCode();
        var backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        var clearBtn = current.source === 'imported'
          ? '<button type="button" id="idcClear" style="border:none;background:none;font-size:13px;color:var(--color-text-hint);padding:4px 2px;">恢复系统码</button>'
          : '<span style="width:1px;"></span>';
        backdrop.innerHTML =
          '<div class="modal">' +
            '<div class="modal-title">本地导入身份码</div>' +
            '<div class="modal-desc">录入你的取件身份码（4-24 位字母或数字，可含短横线），仅保存在本机</div>' +
            '<input id="idcInput" type="text" maxlength="24" placeholder="例如：A8K2-9921-03" style="width:100%;box-sizing:border-box;border:1.5px solid var(--color-border);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;letter-spacing:2px;font-family:var(--font-mono);color:var(--color-text);background:var(--color-surface-alt);outline:none;text-transform:uppercase;" />' +
            '<div id="idcErr" style="font-size:12px;color:var(--color-danger);margin-top:8px;display:none;">格式不正确，请输入 4-24 位字母/数字/短横线</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">' + clearBtn + '<span></span></div>' +
            '<button type="button" class="btn btn-outline btn-block" id="idcAlbum" style="margin-top:10px;gap:6px;">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>' +
              '从相册图片识别' +
            '</button>' +
            '<div id="idcOcrStatus" style="display:none;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--color-primary);margin-top:9px;">' +
              '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span><span id="idcOcrStatusText">正在本地识别…</span>' +
            '</div>' +
            '<input id="idcPhotoInput" type="file" accept="image/*" style="display:none;" />' +
            '<div class="modal-actions">' +
              '<button class="btn btn-outline" id="idcCancel">取消</button>' +
              '<button class="btn btn-primary" id="idcOk">保存</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () {
          backdrop.classList.add('show');
          var input = backdrop.querySelector('#idcInput');
          if (input) { input.focus(); input.value = current.source === 'imported' ? current.code : ''; }
        });
        function close() {
          backdrop.classList.remove('show');
          setTimeout(function () { backdrop.remove(); }, 250);
        }
        backdrop.querySelector('#idcCancel').addEventListener('click', close);
        backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
        var clearEl = backdrop.querySelector('#idcClear');
        if (clearEl) {
          clearEl.addEventListener('click', function () {
            Storage.clearIdentityCode();
            close();
            App.toastSuccess('已恢复系统身份码');
            rerenderIdentity();
          });
        }
        backdrop.querySelector('#idcOk').addEventListener('click', function () {
          var val = (backdrop.querySelector('#idcInput').value || '').trim();
          var err = backdrop.querySelector('#idcErr');
          var r = Storage.saveIdentityCode(val);
          if (!r.success) { err.textContent = r.message; err.style.display = 'block'; return; }
          close();
          App.toastSuccess('身份码已导入');
          rerenderIdentity();
        });

        // —— 相册图片识别：先本地解二维码，未命中再走本地 OCR，全程不上传 ——
        var albumBtn = backdrop.querySelector('#idcAlbum');
        var photoInput = backdrop.querySelector('#idcPhotoInput');
        var ocrStatus = backdrop.querySelector('#idcOcrStatus');
        var ocrStatusText = backdrop.querySelector('#idcOcrStatusText');
        var inputEl2 = backdrop.querySelector('#idcInput');
        var ocrBusy = false;
        function setOcrBusy(busy, text) {
          ocrBusy = busy;
          albumBtn.disabled = busy;
          albumBtn.style.opacity = busy ? '.6' : '';
          ocrStatus.style.display = busy ? 'flex' : 'none';
          if (text) ocrStatusText.textContent = text;
        }
        albumBtn.addEventListener('click', function () {
          if (!ocrBusy) photoInput.click();
        });
        photoInput.addEventListener('change', function () {
          var file = photoInput.files && photoInput.files[0];
          photoInput.value = '';
          if (!file || ocrBusy) return;
          setOcrBusy(true, '正在本地识别图片…');
          recognizeIdentityFromImage(file).then(function (code) {
            setOcrBusy(false);
            if (code) {
              inputEl2.value = code;
              var err2 = backdrop.querySelector('#idcErr');
              err2.style.display = 'none';
              App.toastSuccess('识别到身份码，请确认后保存');
            } else {
              App.toast('没认出身份码，请换张清晰截图或手动输入', 2400);
            }
          }).catch(function () {
            setOcrBusy(false);
            App.toast('图片识别失败，请手动输入', 2200);
          });
        });
      };

      // ---------- 相册身份码本地识别（二维码优先 → Tesseract OCR 兜底） ----------
      var _idcOcrWorker = null;
      function loadImageSource(file) {
        if (typeof createImageBitmap === 'function') return createImageBitmap(file);
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function () { resolve(img); };
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image load error')); };
          img.src = url;
        });
      }
      function imageToCanvas(src, maxSide) {
        var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * scale));
        c.height = Math.max(1, Math.round(h * scale));
        c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
        return c;
      }
      function decodeQrCanvas(c) {
        if (typeof jsQR !== 'function') return Promise.resolve(null);
        try {
          var ctx = c.getContext('2d', { willReadFrequently: true });
          var img = ctx.getImageData(0, 0, c.width, c.height);
          var r = jsQR(img.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
          return Promise.resolve(r && r.data ? r.data : null);
        } catch (e) { return Promise.resolve(null); }
      }
      // 放大 2 倍 + 灰度二值化，提升截图小字识别率
      function enhanceCanvas(c) {
        var out = document.createElement('canvas');
        out.width = c.width * 2;
        out.height = c.height * 2;
        var ctx = out.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(c, 0, 0, out.width, out.height);
        var img = ctx.getImageData(0, 0, out.width, out.height);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var g = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
          g = g < 140 ? 0 : 255;
          d[i] = d[i + 1] = d[i + 2] = g;
        }
        ctx.putImageData(img, 0, 0);
        return out;
      }
      async function ensureIdcOcrWorker() {
        if (_idcOcrWorker) return _idcOcrWorker;
        if (typeof Tesseract === 'undefined') throw new Error('ocr unavailable');
        // workerPath 必须是绝对 URL（blob Worker 内相对 importScripts 会 invalid）
        var libUrl = function (p) { return new URL(p, location.href).href; };
        // tesseract.js v4：一步创建就绪 worker（v2 的 load/loadLanguage 已不存在）
        var worker = await Tesseract.createWorker('eng', 1, {
          workerPath: libUrl('libs/tesseract/worker.min.js'),
          corePath: libUrl('libs/tesseract/core'),
          langPath: libUrl('libs/tesseract/lang'),
          gzip: true,
          logger: function () {},
        });
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-',
          tessedit_pageseg_mode: '6',
        });
        _idcOcrWorker = worker;
        return worker;
      }
      // OCR 文本 → 身份码候选：取最长的 4-24 位字母/数字/短横线串
      function pickIdentityCode(text) {
        if (!text) return '';
        var norm = String(text).toUpperCase().replace(/[^A-Z0-9-\n]/g, ' ');
        var matches = norm.match(/[A-Z0-9][A-Z0-9-]{2,22}[A-Z0-9]/g) || [];
        var best = '';
        matches.forEach(function (m) {
          var clean = m.replace(/-+/g, '-');
          if (clean.length >= 4 && clean.length <= 24 && /[A-Z0-9]{4}/.test(clean.replace(/-/g, '')) && clean.length > best.length) {
            best = clean;
          }
        });
        return best;
      }
      async function recognizeIdentityFromImage(file) {
        var src = await loadImageSource(file);
        var c;
        try {
          c = imageToCanvas(src, 900);
        } finally {
          if (src && src.close) { try { src.close(); } catch (e) {} }
        }
        // 1) 二维码直接解析（部分身份码以二维码形式展示）
        var qr = await decodeQrCanvas(c);
        if (qr) {
          var qText = qr;
          if (qText.charAt(0) === '{') {
            try { var obj = JSON.parse(qText); qText = (obj && (obj.code || obj.identityCode || obj.qrCode)) || qText; } catch (e) {}
          }
          var qCode = pickIdentityCode(qText);
          if (qCode) return qCode;
        }
        // 2) 本地 OCR
        var worker = await ensureIdcOcrWorker();
        var processed = enhanceCanvas(c);
        var result = await worker.recognize(processed);
        var text = result && result.data && result.data.text ? result.data.text : '';
        return pickIdentityCode(text);
      }

      // 只重绘身份码卡，避免整页刷新造成的闪烁
      function rerenderIdentity() {
        var slot = document.getElementById('identityCardSlot');
        if (!slot) return;
        slot.innerHTML = identityCodeCard();
        App.mountQr('detailQrBox', Storage.getIdentityCode().code, { cellSize: 6 });
      }

      function infoCard(pkg) {
        var rows = [
          { label: '快递公司', value: pkg.company, hasLogo: true },
          { label: '物流单号', value: pkg.trackingNo, copyable: true },
          { label: '寄件人', value: pkg.sender, badge: App.platformBadge(pkg.sender) },
          { label: '包裹类型', value: pkg.type },
          { label: '包裹大小', value: pkg.size },
          { label: '到达时间', value: pkg.arrivedAt || '尚未到达' }
        ];
        var html = '<div class="card anim-fade-in-up stagger-2" style="margin-bottom:16px;">' +
          '<div style="font-size:15px;font-weight:700;margin-bottom:12px;">快递信息</div>';
        rows.forEach(function (row) {
          html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--color-border-light);">';
          if (row.last) html = html.replace(/border-bottom:1px solid var\(--color-border-light\);">$/, '">');
          html += '<span style="font-size:13px;color:var(--color-text-sub);">' + row.label + '</span>';
          html += '<div style="display:flex;align-items:center;gap:6px;">';
          if (row.hasLogo) {
            html += '<div class="pkg-logo" style="width:20px;height:20px;border-radius:4px;font-size:10px;background:' + pkg.logoColor + ';">' + pkg.shortName + '</div>';
          }
          html += '<span style="font-size:13px;font-weight:500;color:var(--color-text);">' + row.value + '</span>';
          if (row.badge) {
            html += '<span style="margin-left:2px;">' + row.badge + '</span>';
          }
          if (row.copyable) {
            html += '<button class="header-back-btn" style="width:24px;height:24px;" onclick="copyCode(\'' + pkg.trackingNo + '\')">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-hint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
            '</button>';
          }
          html += '</div></div>';
        });
        html += '</div>';
        return html;
      }

      function addressCard(pkg) {
        var navIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>';
        var poiId = '';
        var points = Storage.getPickupPoints();
        for (var i = 0; i < points.length; i++) {
          if (points[i].name === pkg.pickupPoint) { poiId = points[i].id; break; }
        }
        var escapedName = pkg.pickupPoint.replace(/'/g, "\\'");
        var escapedAddr = (pkg.pickupAddress || '').replace(/'/g, "\\'");
        return '<div class="card anim-fade-in-up stagger-3" style="margin-bottom:16px;position:relative;">' +
          '<a href="javascript:void(0)" onclick="App.showMapNav(\'' + poiId + '\',\'' + escapedName + '\',\'' + escapedAddr + '\')" class="header-back-btn" style="position:absolute;top:12px;right:12px;width:36px;height:36px;background:var(--color-primary-lighter);color:var(--color-primary);">' + navIcon + '</a>' +
          '<div style="font-size:15px;font-weight:700;margin-bottom:12px;">取件地址</div>' +
          '<div style="display:flex;flex-direction:column;gap:10px;padding-right:40px;">' +
            '<div style="display:flex;align-items:baseline;gap:8px;">' +
              '<span style="font-size:13px;color:var(--color-text-sub);flex-shrink:0;width:64px;">取件点</span>' +
              '<span style="font-size:14px;font-weight:600;">' + pkg.pickupPoint + '</span>' +
            '</div>' +
            '<div style="display:flex;align-items:baseline;gap:8px;">' +
              '<span style="font-size:13px;color:var(--color-text-sub);flex-shrink:0;width:64px;">详细地址</span>' +
              '<span style="font-size:13px;color:var(--color-text);line-height:1.6;">' + pkg.pickupAddress + '</span>' +
            '</div>' +
            '<div style="display:flex;align-items:baseline;gap:8px;">' +
              '<span style="font-size:13px;color:var(--color-text-sub);flex-shrink:0;width:64px;">营业时间</span>' +
              '<span style="font-size:13px;color:var(--color-text);">' + pkg.businessHours + '</span>' +
            '</div>' +
            '<div style="display:flex;align-items:baseline;gap:8px;">' +
              '<span style="font-size:13px;color:var(--color-text-sub);flex-shrink:0;width:64px;">预计取件</span>' +
              '<span style="font-size:13px;color:var(--color-primary);font-weight:500;">' + pkg.estimatedTime + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }

      function timelineCard(pkg) {
        var steps = [
          { label: '已揽收', desc: '商家已将包裹交给快递', done: true },
          { label: '运输中', desc: '包裹正在运往校园', done: true },
          { label: '到达分拣中心', desc: '包裹已到达校园分拣中心', done: true },
          { label: '待取件', desc: '包裹到达取件点，等待取件', done: false, current: true }
        ];
        var html = '<div class="card anim-fade-in-up stagger-4" id="timelineCard" style="margin-bottom:16px;">' +
          '<div style="font-size:15px;font-weight:700;margin-bottom:16px;">物流时间线</div>' +
          '<div style="position:relative;">';
        steps.forEach(function (s, i) {
          var isLast = i === steps.length - 1;
          var lineColor = s.done ? 'var(--color-accent)' : 'var(--color-border)';
          var dotBg = s.current ? 'var(--color-primary)' : (s.done ? 'var(--color-accent)' : 'var(--color-border)');
          var textColor = s.current ? 'var(--color-primary)' : (s.done ? 'var(--color-text)' : 'var(--color-text-hint)');
          var fontWeight = s.current ? '700' : '500';
          html += '<div style="display:flex;gap:12px;position:relative;' + (isLast ? '' : 'min-height:56px;') + '">';
          html += '<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">';
          html += '<div style="width:12px;height:12px;border-radius:50%;background:' + dotBg + ';' + (s.current ? 'box-shadow:0 0 0 4px var(--color-primary-light);' : '') + '"></div>';
          if (!isLast) {
            html += '<div style="width:2px;flex:1;background:' + (s.done ? 'var(--color-accent)' : 'var(--color-border)') + ';margin-top:4px;min-height:24px;"></div>';
          }
          html += '</div>';
          html += '<div style="padding-bottom:' + (isLast ? '0' : '16px') + ';">';
          html += '<div style="font-size:14px;font-weight:' + fontWeight + ';color:' + textColor + ';">' + s.label + '</div>';
          html += '<div style="font-size:12px;color:var(--color-text-hint);margin-top:2px;">' + s.desc + '</div>';
          if (s.current) {
            html += '<div style="font-size:12px;color:var(--color-primary);margin-top:4px;">' + (pkg.estimatedTime || '') + '</div>';
          }
          html += '</div></div>';
        });
        html += '</div></div>';
        return html;
      }

      function actionButtons(pkg) {
        if (pkg.status === 'pending') {
          return '<div class="anim-fade-in-up stagger-5" style="display:flex;gap:12px;margin-top:8px;">' +
            '<a href="scan.html" class="btn btn-primary" style="flex:1;gap:6px;">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>' +
              '扫码取件' +
            '</a>' +
            '<a href="javascript:void(0)" class="btn btn-outline" style="flex:1;gap:6px;" onclick="App.showIdentityCode()">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><circle cx="8" cy="10" r="2"/><path d="M14 8h6"/><path d="M14 12h6"/><path d="M5 16h14"/></svg>' +
              '身份码' +
            '</a>' +
          '</div>';
        } else if (pkg.status === 'incoming') {
          return '<div class="anim-fade-in-up stagger-5" style="margin-top:8px;">' +
            '<button class="btn btn-outline btn-block" style="gap:6px;" onclick="scrollToTimeline()">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
              '查看物流' +
            '</button>' +
          '</div>';
        }
        return '';
      }

      function renderDetail(pkg) {
        if (!pkg) {
          contentEl.innerHTML = App.errorState('未找到快递', '该快递信息不存在或已删除', 'loadDetail');
          return;
        }
        var html = '';
        html += statusBanner(pkg);
        html += '<div id="identityCardSlot">' + identityCodeCard() + '</div>';
        html += infoCard(pkg);
        html += addressCard(pkg);
        if (pkg.status === 'incoming') {
          html += timelineCard(pkg);
        }
        html += actionButtons(pkg);
        contentEl.innerHTML = html;
        App.mountQr('detailQrBox', Storage.getIdentityCode().code, { cellSize: 6 });
      }

      function loadDetail() {
        contentEl.innerHTML = '<div class="skeleton" style="width:100%;height:80px;border-radius:16px;margin-bottom:16px;"></div>' +
          '<div class="skeleton" style="width:100%;height:120px;border-radius:16px;margin-bottom:16px;"></div>' +
          '<div class="skeleton" style="width:100%;height:200px;border-radius:16px;"></div>';

        // 先从本地加载
        var localPkg = Storage.getPackage(pkgId);
        if (localPkg) {
          renderDetail(localPkg);
        }

        // 如果已登录，从 API 加载最新数据（含物流轨迹）
        if (ApiClient.isLoggedIn()) {
          ApiClient.getPackage(pkgId).then(function (res) {
            if (res.code === 0 && res.data) {
              var apiPkg = res.data;
              // 合并 API 数据到本地
              if (localPkg) {
                Storage.updatePackage(pkgId, {
                  status: apiPkg.status,
                  company: apiPkg.company || localPkg.company,
                  pickupCode: apiPkg.pickupCode || localPkg.pickupCode,
                  pickupPoint: apiPkg.pickupPoint || localPkg.pickupPoint,
                  sender: apiPkg.sender || localPkg.sender,
                  trackingNo: apiPkg.trackingNo || localPkg.trackingNo,
                });
              }
              // 用 API 返回的数据（含 tracking）重新渲染
              var merged = Storage.getPackage(pkgId) || apiPkg;
              if (apiPkg.tracking && apiPkg.tracking.length > 0) {
                merged.tracking = apiPkg.tracking;
                merged.status = apiPkg.status || merged.status;
              }
              renderDetail(merged);
            }
          });
        } else if (!localPkg) {
          // 未登录且本地也没有数据，用 API 模拟加载
          API.fetchPackage(pkgId).then(function (res) {
            renderDetail(res.data);
          }).catch(function () {
            contentEl.innerHTML = App.errorState('加载失败', '请检查网络后重试', 'loadDetail');
          });
        }
      }

      // 全局函数
      window.copyCode = function (code) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(code).then(function () {
            App.toastSuccess('已复制：' + code);
          }).catch(function () {
            App.toastSuccess('已复制：' + code);
          });
        } else {
          var ta = document.createElement('textarea');
          ta.value = code;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          App.toastSuccess('已复制：' + code);
        }
      };

      window.scrollToTimeline = function () {
        var el = document.getElementById('timelineCard');
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.style.transition = 'box-shadow 0.3s';
          el.style.boxShadow = '0 0 0 2px var(--color-primary)';
          setTimeout(function () { el.style.boxShadow = ''; }, 2000);
        }
      };

      window.loadDetail = loadDetail;

      loadDetail();
    })();
  </script>
</body>
</html>
