<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>实习工作 - 校园生活</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    .job-card { padding:14px 16px; display:block; }
    .job-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .job-name { font-size:16px; font-weight:700; color:var(--color-text); line-height:1.4; }
    .job-salary { font-size:15px; font-weight:800; color:#EA580C; font-family:var(--font-mono); flex-shrink:0; }
    .job-company { font-size:13px; color:var(--color-text-sub); margin-top:5px; }
    .job-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .job-tag { font-size:11px; padding:3px 9px; border-radius:99px; background:var(--color-surface-alt); color:var(--color-text-sub); }
    .job-foot { display:flex; align-items:center; justify-content:space-between; margin-top:11px; padding-top:10px; border-top:1px solid var(--color-border-light); }
    .job-loc { font-size:12px; color:var(--color-text-hint); display:inline-flex; align-items:center; gap:4px; }
    .job-applied-tag { font-size:11px; color:#16A34A; background:#DCFCE7; padding:3px 10px; border-radius:99px; font-weight:600; }

    .fab { position:fixed; right:18px; bottom:calc(24px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#F97316,#EA580C); color:#fff; border:none; box-shadow:0 8px 20px rgba(234,88,12,.4); z-index:20; display:flex; align-items:center; justify-content:center; transition:transform .2s; }
    .fab:active { transform:scale(.9); }

    /* 分区 tab */
    .sec-tabs { display:flex; gap:8px; padding:12px 16px 0; }
    .sec-tab { flex:1; border:none; background:var(--color-surface); color:var(--color-text-sub); font-size:13.5px; font-weight:600; padding:10px 0; border-radius:14px; box-shadow:var(--shadow-sm); cursor:pointer; transition:all .18s; }
    .sec-tab.active { background:linear-gradient(135deg,#F97316,#EA580C); color:#fff; box-shadow:0 6px 14px rgba(234,88,12,.3); }
    .sec-tab .cnt { font-size:11px; opacity:.85; margin-left:3px; }

    /* 简历分步向导 */
    .rz-progress { display:flex; align-items:center; margin:4px 6px 18px; }
    .rz-dot { width:26px; height:26px; border-radius:50%; background:var(--color-surface-alt); color:var(--color-text-hint); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
    .rz-dot.on { background:#F97316; color:#fff; }
    .rz-dot.done { background:#FFEDD5; color:#EA580C; }
    .rz-line { flex:1; height:3px; border-radius:2px; background:var(--color-surface-alt); margin:0 4px; }
    .rz-line.done { background:#FB923C; }
    .rz-page { display:none; }
    .rz-page.show { display:block; }
    .rz-row { display:flex; gap:10px; }
    .rz-row .field { flex:1; }
    .rz-foot { display:flex; gap:10px; margin-top:8px; }
    .rz-foot .btn { flex:1; }

    /* 投递状态 */
    .app-card { padding:14px 16px; }
    .app-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .app-title { font-size:15px; font-weight:700; color:var(--color-text); }
    .app-company { font-size:12.5px; color:var(--color-text-sub); margin-top:3px; }
    .app-badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; flex-shrink:0; }
    .st-submitted { color:#52525B; background:var(--color-surface-alt); }
    .st-viewed { color:#1D4ED8; background:#DBEAFE; }
    .st-interview { color:#B45309; background:#FEF3C7; }
    .st-offer { color:#15803D; background:#DCFCE7; }
    .st-rejected { color:#DC2626; background:#FEE2E2; }
    .st-withdrawn { color:#71717A; background:#E4E4E7; }
    .app-timeline { margin-top:12px; padding:10px 12px; background:var(--color-surface-alt); border-radius:12px; }
    .app-tl-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--color-text-sub); padding:3px 0; }
    .app-tl-dot { width:7px; height:7px; border-radius:50%; background:#FB923C; flex-shrink:0; }
    .app-tl-item time { margin-left:auto; color:var(--color-text-hint); font-size:11px; }
    .app-withdraw { margin-top:10px; width:100%; border:1.5px solid var(--color-border); background:none; color:var(--color-text-sub); font-size:12.5px; padding:8px 0; border-radius:10px; cursor:pointer; }
    .app-withdraw:active { background:var(--color-surface-alt); }

    .sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .25s; z-index:100; }
    .sheet-mask.show { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; left:0; right:0; bottom:0; background:var(--color-surface); border-radius:22px 22px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); z-index:101; max-height:88vh; overflow-y:auto; }
    .sheet.show { transform:translateY(0); }
    .sheet-title { font-size:17px; font-weight:800; text-align:center; margin-bottom:16px; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:13px; color:var(--color-text-sub); margin-bottom:6px; }
    .field input, .field select, .field textarea { width:100%; box-sizing:border-box; border:1.5px solid var(--color-border); border-radius:12px; padding:11px 13px; font-size:14px; background:var(--color-surface); color:var(--color-text); outline:none; font-family:inherit; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:#F97316; }
    .field textarea { resize:vertical; min-height:90px; }

    .detail-name { font-size:20px; font-weight:800; color:var(--color-text); }
    .detail-salary { font-size:18px; font-weight:800; color:#EA580C; font-family:var(--font-mono); margin-top:6px; }
    .detail-company { font-size:14px; color:var(--color-text-sub); margin-top:8px; }
    .detail-sec-title { font-size:14px; font-weight:700; color:var(--color-text); margin:18px 0 8px; }
    .detail-sec { font-size:13.5px; color:var(--color-text-sub); line-height:1.75; }
    .detail-sec li { margin-bottom:4px; }

    .resume-card { padding:13px 16px; }
    .resume-top { display:flex; justify-content:space-between; align-items:center; }
    .resume-name { font-size:15px; font-weight:700; color:var(--color-text); }
    .resume-intent { font-size:12px; color:#F97316; background:#FFEDD5; padding:3px 10px; border-radius:99px; }
    .resume-info { font-size:12px; color:var(--color-text-sub); margin-top:7px; line-height:1.6; }
  </style>
</head>
<body data-page="jobs">
  <div class="app-shell">
    <header class="app-header header--left">
      <div class="header-left">
        <a href="index.html" class="header-back-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
      <div class="header-title">实习工作</div>
      <div class="header-spacer"></div>
      <div class="header-right" style="width:32px;"></div>
    </header>

    <main class="app-content" id="mainContent" style="padding-bottom:32px;">
      <div class="sec-tabs anim-fade-in-up" id="secTabs">
        <button class="sec-tab active" data-sec="jobs">职位</button>
        <button class="sec-tab" data-sec="applied">我的投递<span class="cnt" id="appliedCnt"></span></button>
        <button class="sec-tab" data-sec="resume">我的简历</button>
      </div>
      <div id="jobsSection">
        <div style="padding:12px 16px 0;">
          <div class="search-bar anim-fade-in-up">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="搜索岗位 / 公司 / 城市">
          </div>
        </div>
        <div class="filter-chips" id="typeChips" style="padding:12px 16px 0;"></div>
        <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;" id="jobList"></div>
      </div>
      <div id="appliedSection" style="display:none;">
        <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;" id="appList"></div>
      </div>
      <div id="resumeSection" style="display:none;">
        <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;" id="resumeBody"></div>
      </div>
    </main>

    <button class="fab" id="btnResume" title="我的简历">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </button>
  </div>

  <div class="sheet-mask" id="sheetMask"></div>

  <!-- 职位详情 -->
  <div class="sheet" id="detailSheet">
    <div id="detailBody"></div>
  </div>

  <!-- 我的简历 · 分步向导（参照真实简历流程：基本信息 → 求职意向 → 教育经历 → 实践经历 → 技能自评） -->
  <div class="sheet" id="resumeSheet">
    <div class="sheet-title" id="rzTitle">创建我的简历</div>
    <div class="rz-progress" id="rzProgress"></div>

    <div class="rz-page show" data-page="1">
      <div class="field"><label>姓名 *</label><input type="text" id="rzName" placeholder="真实姓名" maxlength="12"></div>
      <div class="rz-row">
        <div class="field"><label>性别</label><select id="rzGender"><option value="">不填</option><option>男</option><option>女</option></select></div>
        <div class="field"><label>手机号</label><input type="tel" id="rzPhone" placeholder="方便 HR 联系" maxlength="11"></div>
      </div>
      <div class="field"><label>邮箱</label><input type="email" id="rzEmail" placeholder="example@mail.com" maxlength="40"></div>
    </div>

    <div class="rz-page" data-page="2">
      <div class="field"><label>意向岗位 *</label><input type="text" id="rzIntent" placeholder="例如：前端开发实习生" maxlength="20"></div>
      <div class="rz-row">
        <div class="field"><label>意向城市</label><input type="text" id="rzCity" placeholder="例如：厦门" maxlength="12"></div>
        <div class="field"><label>期望薪资</label><input type="text" id="rzSalary" placeholder="例如：150-200/天" maxlength="15"></div>
      </div>
    </div>

    <div class="rz-page" data-page="3">
      <div class="field"><label>学校</label><input type="text" id="rzSchool" placeholder="学校名称" maxlength="20"></div>
      <div class="rz-row">
        <div class="field"><label>专业</label><input type="text" id="rzMajor" placeholder="所学专业" maxlength="20"></div>
        <div class="field"><label>学历</label><select id="rzDegree"><option value="">不填</option><option>大专</option><option>本科</option><option>硕士</option><option>博士</option></select></div>
      </div>
      <div class="rz-row">
        <div class="field"><label>入学年份</label><input type="text" id="rzEduStart" placeholder="2022" maxlength="6"></div>
        <div class="field"><label>毕业年份</label><input type="text" id="rzEduEnd" placeholder="2026" maxlength="6"></div>
      </div>
    </div>

    <div class="rz-page" data-page="4">
      <div class="field"><label>实践 / 项目经历</label><textarea id="rzExperience" placeholder="按「时间 + 做了什么 + 结果」写 1-2 段最有代表性的经历" maxlength="600" style="min-height:140px;"></textarea></div>
    </div>

    <div class="rz-page" data-page="5">
      <div class="field"><label>技能特长</label><input type="text" id="rzSkills" placeholder="用顿号分隔，如：JavaScript、Figma、剪辑" maxlength="60"></div>
      <div class="field"><label>自我评价</label><textarea id="rzIntro" placeholder="两三句话概括你的优势与性格特点" maxlength="200" style="min-height:90px;"></textarea></div>
    </div>

    <div class="rz-foot">
      <button class="btn btn-lg" id="rzPrev" style="background:var(--color-surface-alt);color:var(--color-text-sub);display:none;">上一步</button>
      <button class="btn btn-primary btn-lg" id="rzNext" style="background:linear-gradient(135deg,#F97316,#EA580C);">下一步</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      // 内置虚拟岗位（演示数据，本地浏览）
      var JOBS = [
        { id: 'J1', type: 'intern', name: '前端开发实习生', company: '云图科技（厦门）', city: '厦门 · 思明区', salary: '150-200/天', tags: ['React', 'Vue', '每周3天', '可转正'], desc: '参与校园产品 Web 端功能开发，与设计、后端同学配合完成需求迭代；表现优秀可获转正 offer。', req: ['熟悉 HTML/CSS/JavaScript', '了解 Vue 或 React 任一框架', '每周可到岗 3 天及以上，持续 3 个月'] },
        { id: 'J2', type: 'intern', name: 'Java 后端实习生', company: '海翼软件', city: '厦门 · 软件园', salary: '180-220/天', tags: ['Java', 'MySQL', '餐补'], desc: '负责业务系统后端接口开发与维护，参与代码评审与技术方案讨论。', req: ['Java 基础扎实，了解 Spring Boot', '熟悉 MySQL 基本操作', '有项目经验者优先'] },
        { id: 'J3', type: 'campus', name: '2025 校园招聘 · 运营管培生', company: '澜庭电商集团', city: '福州 · 仓山区', salary: '6-9K/月', tags: ['校招', '五险一金', '应届生'], desc: '校招管培生项目，轮岗电商运营各环节，1 年培养为业务骨干。', req: ['2025 届本科及以上', '对电商运营有热情', '接受轮岗与挑战'] },
        { id: 'J4', type: 'parttime', name: '周末门店兼职', company: '甜茶奶茶（校园店）', city: '校内 · 三食堂旁', salary: '18/小时', tags: ['周末班', '日结', '就近'], desc: '负责点单、饮品制作与店内清洁，周末两天可排班。', req: ['认真负责，手脚麻利', '能连续排班一个月以上优先'] },
        { id: 'J5', type: 'intern', name: 'UI 设计实习生', company: '蓝鲸设计工作室', city: '远程 / 厦门', salary: '120-160/天', tags: ['可远程', 'Figma', '作品集'], desc: '参与 App 与小程序界面设计，输出高保真稿与设计规范。', req: ['熟练使用 Figma / Sketch', '投递请附作品集', '审美在线，关注细节'] },
        { id: 'J6', type: 'parttime', name: '图书馆学生助理', company: '校图书馆', city: '校内 · 中心图书馆', salary: '15/小时', tags: ['环境安静', '工时灵活', '可看书'], desc: '负责图书上架、秩序维护与咨询引导，排班灵活，适合想边工作边学习的同学。', req: ['在校生，无挂科', '每周可提供 2 个半天'] },
        { id: 'J7', type: 'campus', name: '财务助理（校招）', company: '恒信会计师事务所', city: '莆田 · 城厢区', salary: '5.5-7K/月', tags: ['校招', '财会专业', '带薪培训'], desc: '协助审计项目组完成底稿编制、凭证抽查等工作，系统培训后独立带项目。', req: ['财会相关专业 2025 届', '细心、有责任心', '有初级会计证优先'] },
        { id: 'J8', type: 'intern', name: '新媒体运营实习生', company: '橙子校园 MCN', city: '厦门 · 集美区', salary: '100-150/天', tags: ['小红书', '文案', '弹性'], desc: '负责校园账号内容策划、文案撰写与数据复盘。', req: ['网感好，常刷小红书/抖音', '文字表达流畅', '会简单剪辑优先'] },
      ];
      var TYPES = [
        { key: 'all', label: '全部' },
        { key: 'intern', label: '实习' },
        { key: 'campus', label: '校招' },
        { key: 'parttime', label: '兼职' },
      ];
      var currentSec = 'jobs';
      var currentType = 'all';
      var keyword = '';
      var detailId = null;
      var searchTimer = null;

      var mask = document.getElementById('sheetMask');
      var detailSheet = document.getElementById('detailSheet');
      var resumeSheet = document.getElementById('resumeSheet');
      function openSheet(s) { mask.classList.add('show'); s.classList.add('show'); }
      function closeAll() { mask.classList.remove('show'); detailSheet.classList.remove('show'); resumeSheet.classList.remove('show'); }
      mask.addEventListener('click', closeAll);

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // ---- 分区切换 ----
      function switchSec(sec) {
        currentSec = sec;
        document.querySelectorAll('.sec-tab').forEach(function (el) {
          el.classList.toggle('active', el.dataset.sec === sec);
        });
        document.getElementById('jobsSection').style.display = sec === 'jobs' ? '' : 'none';
        document.getElementById('appliedSection').style.display = sec === 'applied' ? '' : 'none';
        document.getElementById('resumeSection').style.display = sec === 'resume' ? '' : 'none';
        if (sec === 'jobs') renderList();
        if (sec === 'applied') renderApplications();
        if (sec === 'resume') renderResume();
      }
      document.querySelectorAll('.sec-tab').forEach(function (el) {
        el.addEventListener('click', function () { switchSec(this.dataset.sec); });
      });

      // ---- 职位列表 ----
      function renderChips() {
        document.getElementById('typeChips').innerHTML = TYPES.map(function (t) {
          return '<button class="chip' + (t.key === currentType ? ' active' : '') + '" data-type="' + t.key + '">' + t.label + '</button>';
        }).join('');
        document.querySelectorAll('[data-type]').forEach(function (el) {
          el.addEventListener('click', function () { currentType = this.dataset.type; renderList(); this.classList.add('active'); });
        });
      }

      function renderList() {
        document.querySelectorAll('[data-type]').forEach(function (el) {
          el.classList.toggle('active', el.dataset.type === currentType);
        });
        var state = Storage.lifeGetJobsState();
        var listEl = document.getElementById('jobList');
        var jobs = JOBS.filter(function (j) {
          if (currentType !== 'all' && j.type !== currentType) return false;
          if (keyword) {
            var hay = (j.name + j.company + j.city + j.tags.join('')).toLowerCase();
            if (hay.indexOf(keyword.toLowerCase()) === -1) return false;
          }
          return true;
        });

        var html = '';
        if (!jobs.length) html = App.emptyState('没有匹配的岗位', '换个关键词或筛选试试');
        jobs.forEach(function (j, i) {
          var applied = state.applied.indexOf(j.id) !== -1;
          html += '<a href="javascript:void(0)" class="card card--clickable job-card anim-fade-in-up stagger-' + Math.min(i + 1, 5) + '" data-job="' + j.id + '">' +
            '<div class="job-top"><div class="job-name">' + esc(j.name) + '</div>' +
            '<div class="job-salary">' + esc(j.salary) + '</div></div>' +
            '<div class="job-company">' + esc(j.company) + '</div>' +
            '<div class="job-meta">' + j.tags.map(function (t) { return '<span class="job-tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
            '<div class="job-foot"><span class="job-loc">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
            esc(j.city) + '</span>' +
            (applied ? '<span class="job-applied-tag">✓ 已投递</span>' : '') +
            '</div></a>';
        });
        listEl.innerHTML = html;

        document.querySelectorAll('[data-job]').forEach(function (el) {
          el.addEventListener('click', function () { openDetail(this.dataset.job); });
        });
      }

      // ---- 职位详情 & 投递 ----
      function openDetail(id) {
        detailId = id;
        var j = JOBS.find(function (x) { return x.id === id; });
        if (!j) return;
        var applied = Storage.lifeGetJobsState().applied.indexOf(id) !== -1;
        document.getElementById('detailBody').innerHTML =
          '<div class="detail-name">' + esc(j.name) + '</div>' +
          '<div class="detail-salary">' + esc(j.salary) + '</div>' +
          '<div class="detail-company">' + esc(j.company) + ' · ' + esc(j.city) + '</div>' +
          '<div class="job-meta" style="margin-top:12px;">' + j.tags.map(function (t) { return '<span class="job-tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
          '<div class="detail-sec-title">岗位描述</div><div class="detail-sec">' + esc(j.desc) + '</div>' +
          '<div class="detail-sec-title">任职要求</div><ul class="detail-sec" style="padding-left:18px;">' +
            j.req.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
          '<button class="btn btn-block btn-lg" style="margin-top:20px;background:' + (applied ? '#16A34A' : '#F97316') + ';" id="applyBtn">' +
            (applied ? '✓ 已投递（可在「我的投递」查看进度）' : '立即投递') + '</button>' +
          '<div style="font-size:11px;color:var(--color-text-hint);text-align:center;margin-top:10px;">投递前需先完成我的简历，投递后 HR 将依次查看简历、邀约面试</div>';
        openSheet(detailSheet);
        document.getElementById('applyBtn').addEventListener('click', function () {
          var res = Storage.lifeApplyJobMeta(detailId, j.name, j.company);
          if (res.success) {
            App.toastSuccess('投递成功，可在「我的投递」查看');
            renderApplications();
            renderList();
            this.textContent = '✓ 已投递（可在「我的投递」查看进度）';
            this.style.background = '#16A34A';
          } else if (res.needResume) {
            App.toast(res.message || '请先完成我的简历');
            closeAll();
            openResumeWizard();
          } else App.toast(res.message || '投递失败');
        });
      }

      // ---- 我的投递 ----
      function statusBadge(st) {
        var label = (Storage.APPLICATION_STATUS[st]) || st;
        return '<span class="app-badge st-' + esc(st) + '">' + esc(label) + '</span>';
      }

      function renderApplications() {
        var apps = Storage.lifeSyncApplications();
        var el = document.getElementById('appList');
        document.getElementById('appliedCnt').textContent = apps.length ? '(' + apps.length + ')' : '';
        if (!apps.length) {
          el.innerHTML = App.emptyState('还没有投递记录', '看到合适的岗位就投出去吧');
          return;
        }
        var html = '';
        apps.forEach(function (a, i) {
          var canWithdraw = ['submitted', 'viewed', 'interview'].indexOf(a.status) !== -1;
          html += '<div class="card app-card anim-fade-in-up stagger-' + Math.min(i + 1, 5) + '">' +
            '<div class="app-top"><div><div class="app-title">' + esc(a.title || a.jobId) + '</div>' +
            (a.company ? '<div class="app-company">' + esc(a.company) + '</div>' : '') + '</div>' +
            statusBadge(a.status) + '</div>' +
            '<div class="app-timeline">' + (a.timeline || []).map(function (t) {
              return '<div class="app-tl-item"><span class="app-tl-dot"></span>' + esc(Storage.APPLICATION_STATUS[t.status] || t.status) +
                '<time>' + esc(t.time) + '</time></div>';
            }).join('') + '</div>' +
            (canWithdraw ? '<button class="app-withdraw" data-app="' + esc(a.id) + '">撤回投递</button>' : '') +
            '</div>';
        });
        el.innerHTML = html;
        document.querySelectorAll('[data-app]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var app = this.dataset.app;
            if (!window.confirm('撤回后该岗位可重新投递，确定撤回吗？')) return;
            var res = Storage.lifeWithdrawApplication(app);
            if (res.success) { App.toastSuccess('已撤回'); renderApplications(); renderList(); }
            else App.toast(res.message || '撤回失败');
          });
        });
      }

      // ---- 我的简历（分步向导）----
      var RZ_STEPS = ['基本', '意向', '教育', '实践', '自评'];
      var rzStep = 1;
      var RZ_FIELDS = [
        ['rzName', 'rzGender', 'rzPhone', 'rzEmail'],
        ['rzIntent', 'rzCity', 'rzSalary'],
        ['rzSchool', 'rzMajor', 'rzDegree', 'rzEduStart', 'rzEduEnd'],
        ['rzExperience'],
        ['rzSkills', 'rzIntro'],
      ];
      var RZ_REQUIRED = { rzName: '请填写姓名', rzIntent: '请填写意向岗位' };

      function renderRzProgress() {
        var html = '';
        for (var i = 1; i <= 5; i++) {
          if (i > 1) html += '<div class="rz-line' + (i - 1 < rzStep ? ' done' : '') + '"></div>';
          html += '<div class="rz-dot' + (i === rzStep ? ' on' : (i < rzStep ? ' done' : '')) + '">' + (i < rzStep ? '✓' : i) + '</div>';
        }
        document.getElementById('rzProgress').innerHTML = html;
      }

      function showRzStep(n) {
        rzStep = n;
        document.querySelectorAll('.rz-page').forEach(function (p) {
          p.classList.toggle('show', parseInt(p.dataset.page, 10) === n);
        });
        document.getElementById('rzPrev').style.display = n > 1 ? '' : 'none';
        document.getElementById('rzNext').textContent = n === 5 ? '完成简历' : '下一步';
        document.getElementById('rzTitle').textContent = '我的简历 · ' + RZ_STEPS[n - 1];
        renderRzProgress();
      }

      function openResumeWizard() {
        var r = Storage.lifeGetResume();
        var vals = {
          rzName: r && r.name, rzGender: r && r.gender, rzPhone: r && r.phone, rzEmail: r && r.email,
          rzIntent: r && r.intent, rzCity: r && r.city, rzSalary: r && r.salary,
          rzSchool: r && r.school, rzMajor: r && r.major, rzDegree: r && r.degree,
          rzEduStart: r && r.eduStart, rzEduEnd: r && r.eduEnd,
          rzExperience: r && r.experience, rzSkills: r && r.skills, rzIntro: r && r.intro,
        };
        Object.keys(vals).forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          el.value = vals[id] || '';
          if (el.tagName === 'SELECT' && !vals[id]) el.selectedIndex = 0;
        });
        document.getElementById('rzTitle').textContent = r ? '编辑我的简历' : '创建我的简历';
        showRzStep(1);
        openSheet(resumeSheet);
      }

      function collectResume() {
        var get = function (id) { return document.getElementById(id).value.trim(); };
        return {
          name: get('rzName'), gender: get('rzGender'), phone: get('rzPhone'), email: get('rzEmail'),
          intent: get('rzIntent'), city: get('rzCity'), salary: get('rzSalary'),
          school: get('rzSchool'), major: get('rzMajor'), degree: get('rzDegree'),
          eduStart: get('rzEduStart'), eduEnd: get('rzEduEnd'),
          experience: get('rzExperience'), skills: get('rzSkills'), intro: get('rzIntro'),
        };
      }

      document.getElementById('btnResume').addEventListener('click', openResumeWizard);
      document.getElementById('rzPrev').addEventListener('click', function () {
        if (rzStep > 1) showRzStep(rzStep - 1);
      });
      document.getElementById('rzNext').addEventListener('click', function () {
        if (rzStep < 5) {
          for (var i = 0; i < RZ_FIELDS[rzStep - 1].length; i++) {
            var fid = RZ_FIELDS[rzStep - 1][i];
            if (RZ_REQUIRED[fid] && !document.getElementById(fid).value.trim()) {
              App.toast(RZ_REQUIRED[fid]);
              return;
            }
          }
          showRzStep(rzStep + 1);
          return;
        }
        var res = Storage.lifeSaveResume(collectResume());
        if (res.success) {
          closeAll();
          App.toastSuccess('简历已保存，可以去投递了');
          switchSec('resume');
        } else App.toast(res.message || '保存失败');
      });

      function renderResume() {
        var el = document.getElementById('resumeBody');
        var r = Storage.lifeGetResume();
        var wall = Storage.lifeGetJobsState().resumes || [];
        var html = '';
        if (!r) {
          html += '<div class="card" style="padding:22px 16px;text-align:center;">' +
            '<div style="font-size:34px;">📄</div>' +
            '<div style="font-size:15px;font-weight:700;margin-top:8px;">还没有简历</div>' +
            '<div style="font-size:12.5px;color:var(--color-text-sub);margin:6px 0 14px;">参照真实求职流程，先写好简历再投递<br>分 5 步即可完成，数据仅保存在本机</div>' +
            '<button class="btn btn-primary btn-block" id="btnGoResume" style="background:linear-gradient(135deg,#F97316,#EA580C);">去创建简历</button></div>';
        } else {
          var row = function (label, v) { return v ? '<div class="app-tl-item" style="padding:4px 0;"><span style="color:var(--color-text-hint);width:64px;flex-shrink:0;">' + label + '</span><span>' + esc(v) + '</span></div>' : ''; };
          html += '<div class="card" style="padding:16px;">' +
            '<div style="display:flex;align-items:center;gap:10px;">' +
              '<div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#F97316,#EA580C);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;">' + esc((r.name || '?').slice(0, 1)) + '</div>' +
              '<div style="flex:1;min-width:0;"><div style="font-size:16px;font-weight:800;">' + esc(r.name) + '</div>' +
              '<div style="font-size:12px;color:var(--color-text-sub);margin-top:2px;">求职意向：' + esc(r.intent) + (r.salary ? ' · ' + esc(r.salary) : '') + '</div></div>' +
              '<button class="btn btn-sm" id="btnEditResume" style="background:var(--color-surface-alt);color:var(--color-text-sub);">编辑</button>' +
            '</div>' +
            '<div style="margin-top:12px;border-top:1px solid var(--color-border-light);padding-top:8px;">' +
              row('电话', r.phone) + row('邮箱', r.email) + row('城市', r.city) +
              row('教育', [r.school, r.major, r.degree].filter(Boolean).join(' · ') + ((r.eduStart || r.eduEnd) ? '（' + [r.eduStart, r.eduEnd].filter(Boolean).join('-') + '）' : '')) +
            '</div>' +
            (r.experience ? '<div style="margin-top:10px;"><div style="font-size:13px;font-weight:700;">实践经历</div><div style="font-size:12.5px;color:var(--color-text-sub);line-height:1.7;margin-top:4px;white-space:pre-wrap;">' + esc(r.experience) + '</div></div>' : '') +
            (r.skills ? '<div style="margin-top:10px;"><div style="font-size:13px;font-weight:700;">技能特长</div><div style="font-size:12.5px;color:var(--color-text-sub);margin-top:4px;">' + esc(r.skills) + '</div></div>' : '') +
            (r.intro ? '<div style="margin-top:10px;"><div style="font-size:13px;font-weight:700;">自我评价</div><div style="font-size:12.5px;color:var(--color-text-sub);line-height:1.7;margin-top:4px;">' + esc(r.intro) + '</div></div>' : '') +
            '</div>';
        }
        if (wall.length) {
          html += '<div class="section-header" style="margin-top:6px;"><span class="section-title">校园求职墙</span></div>';
          wall.forEach(function (w) {
            html += '<div class="card resume-card"><div class="resume-top"><span class="resume-name">' + esc(w.name) + '</span>' +
              '<span class="resume-intent">' + esc(w.intent) + '</span></div>' +
              '<div class="resume-info">' + (w.contact ? '📞 ' + esc(w.contact) : '') +
              (w.note ? '<br>' + esc(w.note) : '') + '<br><span style="color:var(--color-text-hint);">发布于 ' + esc(w.time) + '</span></div></div>';
          });
        }
        el.innerHTML = html;
        var go = document.getElementById('btnGoResume');
        if (go) go.addEventListener('click', openResumeWizard);
        var edit = document.getElementById('btnEditResume');
        if (edit) edit.addEventListener('click', openResumeWizard);
      }

      document.getElementById('searchInput').addEventListener('input', function () {
        keyword = this.value.trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(renderList, 250);
      });

      App.initPullToRefresh(document.getElementById('mainContent'), function () {
        if (currentSec === 'applied') renderApplications();
        else if (currentSec === 'resume') renderResume();
        else renderList();
        App.toastSuccess('已刷新'); return Promise.resolve();
      });

      // 投递状态随时间自动推进
      setInterval(function () {
        if (currentSec === 'applied') renderApplications();
      }, 15000);

      renderChips();
      renderList();
      App.showGuide('jobs', {
        emoji: '💼',
        title: '实习工作 · 新手指引',
        items: [
          '第一步：点右下角简历图标，分 5 步创建我的简历',
          '第二步：在「职位」里挑岗位，点「立即投递」',
          '「我的投递」里可查看查看简历 / 面试邀约 / 录用结果',
          '所有数据仅保存在本机，不上传云端',
        ],
      });
    })();
  </script>
</body>
</html>
