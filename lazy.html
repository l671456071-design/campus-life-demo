<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>懒人模式 - 校园生活</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    body[data-page="lazy"] .tab-bar { display:none !important; }
    body[data-page="lazy"] .app-content { padding-bottom:calc(28px + env(safe-area-inset-bottom)) !important; }

    .lz-tabs { display:flex; margin:10px 16px 0; background:var(--color-surface-alt); border-radius:99px; padding:3px; }
    .lz-tabs button { flex:1; border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600;
      color:var(--color-text-sub); padding:8px 0; border-radius:99px; transition:all .2s; }
    .lz-tabs button.on { background:var(--color-surface); color:#7C3AED; box-shadow:var(--shadow-sm); font-weight:700; }

    /* ---- 游戏大厅 ---- */
    .lz-games { padding:14px 16px 0; display:flex; flex-direction:column; gap:11px; }
    .lz-game-card { display:flex; align-items:center; gap:13px; background:var(--color-surface);
      border:1px solid var(--color-border-light); border-radius:18px; box-shadow:var(--shadow-sm);
      padding:15px; text-align:left; font-family:inherit; width:100%; }
    .lz-game-card:active { transform:scale(.985); }
    .lz-game-card .ic { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
      font-size:24px; flex-shrink:0; }
    .lz-game-card .tx { flex:1; min-width:0; }
    .lz-game-card .tt { font-size:15px; font-weight:800; color:var(--color-text); }
    .lz-game-card .dd { font-size:12px; color:var(--color-text-hint); margin-top:2px; }
    .lz-game-card .go { color:var(--color-text-hint); font-size:18px; }

    .lz-boss { margin:14px 16px 0; border-radius:18px; padding:16px; text-align:center;
      background:linear-gradient(135deg,#FEF2F2,#FFE4E6); border:1.5px solid #FECDD3; }
    .lz-boss b { display:block; font-size:14px; color:#BE123C; margin-bottom:3px; }
    .lz-boss span { font-size:12px; color:#9F1239; }
    .lz-boss button { margin-top:10px; border:none; border-radius:99px; background:#E11D48; color:#fff;
      font-family:inherit; font-size:14px; font-weight:800; padding:11px 26px; box-shadow:0 8px 18px rgba(225,29,72,.3); }

    /* 游戏弹层 */
    .lz-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; z-index:100; }
    .lz-mask.show { opacity:1; pointer-events:auto; }
    .lz-layer { position:fixed; left:0; right:0; top:0; bottom:0; z-index:101; transform:translateY(100%);
      transition:transform .28s cubic-bezier(.32,.72,0,1); background:var(--color-bg); display:flex; flex-direction:column; }
    .lz-layer.show { transform:translateY(0); }
    .lz-layer-h { display:flex; align-items:center; padding:12px 14px; gap:10px; background:var(--color-surface);
      border-bottom:1px solid var(--color-border-light); padding-top:calc(12px + env(safe-area-inset-top)); }
    .lz-layer-h .x { border:none; background:var(--color-surface-alt); width:34px; height:34px; border-radius:50%; font-size:15px; color:var(--color-text); }
    .lz-layer-h .t { font-size:16px; font-weight:800; flex:1; text-align:center; padding-right:34px; }
    .lz-game-body { flex:1; overflow-y:auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); }

    /* 反应测试 */
    .rt-box { height:300px; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:20px; background:#DDD6FE; transition:background .15s; }
    .rt-box.wait { background:#FDE68A; }
    .rt-box.go { background:#86EFAC; }
    .rt-box.early { background:#FCA5A5; }
    .rt-box .big { font-size:26px; font-weight:800; color:#312E81; }
    .rt-box .sm { font-size:13px; color:#5B21B6; margin-top:8px; line-height:1.7; }
    .rt-best { text-align:center; margin-top:14px; font-size:13px; color:var(--color-text-sub); }

    /* 打地鼠 */
    .wh-info { display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px; font-weight:700; }
    .wh-info span { background:var(--color-surface); border-radius:99px; padding:7px 16px; box-shadow:var(--shadow-sm); }
    .wh-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .wh-cell { aspect-ratio:1; border-radius:18px; background:var(--color-surface); border:1px solid var(--color-border-light);
      box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; font-size:38px;
      user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
    .wh-cell.up { background:linear-gradient(135deg,#FEF3C7,#FDE68A); }
    .wh-btn { width:100%; margin-top:14px; border:none; border-radius:15px; padding:13px 0; background:#7C3AED; color:#fff;
      font-family:inherit; font-size:15px; font-weight:800; }

    /* 贪吃蛇 */
    .sn-wrap { display:flex; flex-direction:column; align-items:center; }
    .sn-info { display:flex; gap:20px; margin-bottom:10px; font-size:14px; font-weight:700; }
    #snCanvas { background:var(--color-surface); border-radius:16px; border:1px solid var(--color-border-light); box-shadow:var(--shadow-sm); touch-action:none; }
    .sn-dpad { margin-top:14px; display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,52px); gap:6px; justify-content:center; }
    .sn-dpad button { border:none; border-radius:14px; background:var(--color-surface); box-shadow:var(--shadow-sm); font-size:20px; color:#7C3AED; }
    .sn-dpad .up { grid-column:2; grid-row:1; } .sn-dpad .left { grid-column:1; grid-row:2; }
    .sn-dpad .right { grid-column:3; grid-row:2; } .sn-dpad .down { grid-column:2; grid-row:3; }
    .sn-btn { margin-top:12px; width:200px; border:none; border-radius:15px; padding:12px 0; background:#7C3AED; color:#fff;
      font-family:inherit; font-size:15px; font-weight:800; }

    /* 老板键伪装层 */
    .lz-fake { position:fixed; inset:0; z-index:300; background:#F8FAFC; display:none; flex-direction:column;
      padding:calc(20px + env(safe-area-inset-top)) 22px 40px; color:#1E293B; }
    .lz-fake.show { display:flex; }
    .lz-fake h2 { font-size:19px; font-weight:800; margin-bottom:14px; }
    .lz-fake .ln { height:13px; border-radius:6px; background:#E2E8F0; margin-bottom:13px; }
    .lz-fake .ln.w80 { width:80%; } .lz-fake .ln.w60 { width:60%; } .lz-fake .ln.w90 { width:90%; } .lz-fake .ln.w45 { width:45%; }
    .lz-fake .quit { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom)); right:18px; font-size:11px; color:#CBD5E1; }

    /* ---- 录音整理 ---- */
    .lz-rec-card { margin:14px 16px 0; background:var(--color-surface); border-radius:20px; border:1px solid var(--color-border-light);
      box-shadow:var(--shadow-sm); padding:20px 16px; text-align:center; }
    .lz-rec-dot { width:76px; height:76px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center;
      font-size:32px; background:#F1F5F9; transition:all .2s; }
    .lz-rec-dot.rec { background:#FEE2E2; animation:lzPulse 1.2s infinite; }
    @keyframes lzPulse { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,.35);} 50% { box-shadow:0 0 0 16px rgba(239,68,68,0);} }
    .lz-rec-time { font-size:30px; font-weight:800; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; margin-top:12px; color:var(--color-text); }
    .lz-rec-hint { font-size:12.5px; color:var(--color-text-hint); margin-top:7px; line-height:1.7; }
    .lz-rec-btns { display:flex; gap:10px; margin-top:16px; }
    .lz-rec-btns button { flex:1; border:none; border-radius:14px; padding:13px 0; font-family:inherit; font-size:14px; font-weight:700; }
    #lzRecBtn { background:linear-gradient(135deg,#DC2626,#EF4444); color:#fff; }
    #lzNoteBtn { background:var(--color-surface-alt); color:var(--color-text); }
    .lz-live { margin-top:13px; font-size:12px; color:#7C3AED; min-height:17px; line-height:1.6; }

    .lz-section-title { margin:18px 16px 8px; font-size:13px; font-weight:800; color:var(--color-text-sub); }

    /* 记录列表 */
    .lz-list { padding:0 16px; display:flex; flex-direction:column; gap:10px; }
    .lz-rec { background:var(--color-surface); border-radius:16px; border:1px solid var(--color-border-light); box-shadow:var(--shadow-sm); padding:13px 15px; }
    .lz-rec .h { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .lz-rec .nm { font-size:14.5px; font-weight:800; color:var(--color-text); }
    .lz-rec .tm { font-size:11.5px; color:var(--color-text-hint); flex-shrink:0; }
    .lz-rec .sm2 { font-size:12.5px; color:var(--color-text-sub); line-height:1.65; margin-top:6px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .lz-rec .ops { display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
    .lz-rec .ops button { border:1px solid var(--color-border); background:var(--color-surface); border-radius:99px;
      font-size:12px; font-weight:600; padding:6px 12px; font-family:inherit; color:var(--color-text-sub); }
    .lz-rec .ops button.del { color:var(--color-danger); border-color:var(--color-danger-light); }

    /* 整理 sheet */
    .lz-sheet { position:fixed; left:0; right:0; bottom:0; z-index:120; background:var(--color-surface);
      border-radius:22px 22px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); max-height:90vh;
      transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); display:flex; flex-direction:column; }
    .lz-sheet.show { transform:translateY(0); }
    .lz-sheet .st { font-size:16px; font-weight:800; text-align:center; margin-bottom:12px; }
    .lz-sheet input { width:100%; box-sizing:border-box; border:1.5px solid var(--color-border); border-radius:12px;
      padding:10px 13px; font-size:14px; outline:none; font-family:inherit; background:var(--color-surface); color:var(--color-text); }
    .lz-sheet textarea { width:100%; box-sizing:border-box; border:1.5px solid var(--color-border); border-radius:12px;
      padding:11px 13px; font-size:13.5px; line-height:1.7; outline:none; font-family:inherit; resize:none;
      background:var(--color-surface); color:var(--color-text); min-height:150px; margin-top:10px; }
    .lz-sheet textarea:focus, .lz-sheet input:focus { border-color:#7C3AED; }
    .lz-sheet .row { display:flex; gap:8px; margin-top:10px; flex-shrink:0; }
    .lz-sheet .row button { flex:1; border:none; border-radius:13px; padding:12px 0; font-family:inherit; font-size:14px; font-weight:700; }
    #lzAiBtn { background:linear-gradient(135deg,#7C3AED,#A855F7); color:#fff; }
    #lzSaveRec { background:#059669; color:#fff; }
    .lz-sheet .exports { display:none; gap:8px; margin-top:8px; }
    .lz-sheet .exports.show { display:flex; }
    .lz-sheet .exports button { flex:1; border:1.5px solid var(--color-border); background:var(--color-surface);
      border-radius:13px; padding:11px 0; font-family:inherit; font-size:13px; font-weight:700; color:var(--color-text); }
    .lz-scroll { overflow-y:auto; flex:1; }
  </style>
</head>
<body data-page="lazy">
  <div class="app-shell">
    <header class="app-header header--left">
      <div class="header-left">
        <a href="index.html" class="header-back-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
      <div class="header-title">懒人模式</div>
      <div class="header-spacer"></div>
      <div class="header-right"></div>
    </header>

    <main class="app-content">
      <div class="lz-tabs">
        <button data-t="games" class="on">小游戏</button>
        <button data-t="rec">录音整理</button>
        <button data-t="list">我的记录</button>
      </div>

      <!-- 小游戏 -->
      <div id="paneGames">
        <div class="lz-games">
          <button class="lz-game-card" data-g="react">
            <span class="ic" style="background:#EDE9FE;">⚡</span>
            <span class="tx"><span class="tt">反应速度测试</span><br><span class="dd">等屏幕变绿立刻点，测测你的手速</span></span>
            <span class="go">›</span>
          </button>
          <button class="lz-game-card" data-g="whack">
            <span class="ic" style="background:#FEF3C7;">🔨</span>
            <span class="tx"><span class="tt">极限打地鼠</span><br><span class="dd">30 秒挑战，冒头就敲</span></span>
            <span class="go">›</span>
          </button>
          <button class="lz-game-card" data-g="snake">
            <span class="ic" style="background:#DCFCE7;">🐍</span>
            <span class="tx"><span class="tt">课堂贪吃蛇</span><br><span class="dd">经典街机，支持方向键和滑动</span></span>
            <span class="go">›</span>
          </button>
        </div>
        <div class="lz-boss">
          <b>🚨 一键防抓（老板键）</b>
          <span>老师走过来？点这里立刻伪装成「课堂笔记」界面，点屏幕底部小字恢复</span><br>
          <button id="lzBossBtn">老师来了！</button>
        </div>
      </div>

      <!-- 录音 -->
      <div id="paneRec" style="display:none;">
        <div class="lz-rec-card">
          <div class="lz-rec-dot" id="lzRecDot">🎙️</div>
          <div class="lz-rec-time" id="lzRecTime">00:00</div>
          <div class="lz-rec-hint" id="lzRecHint">点下方按钮开始录音，同时尝试语音转文字<br>音频只在内存中，不保存、不上传</div>
          <div class="lz-live" id="lzLive"></div>
          <div class="lz-rec-btns">
            <button id="lzRecBtn">开始录音</button>
            <button id="lzNoteBtn">直接写笔记</button>
          </div>
        </div>
        <div class="lz-section-title">使用说明</div>
        <div style="margin:0 16px; background:var(--color-surface); border:1px solid var(--color-border-light); border-radius:16px; padding:13px 16px; font-size:12.5px; color:var(--color-text-sub); line-height:1.9; box-shadow:var(--shadow-sm);">
          1. 录下老师讲课内容，支持边录边转写（部分浏览器需 Chrome）<br>
          2. 结束后点「AI 整理」，自动去口头禅、提取关键词、分点摘要<br>
          3. 整理稿可导出 Markdown / Word / PDF，也可只打字不录音
        </div>
      </div>

      <!-- 记录 -->
      <div id="paneList" style="display:none;">
        <div class="lz-section-title">课堂录音整理记录</div>
        <div class="lz-list" id="lzList"></div>
      </div>
    </main>

    <!-- 游戏全屏层 -->
    <div class="lz-mask" id="lzMask"></div>
    <div class="lz-layer" id="lzLayer">
      <div class="lz-layer-h">
        <button class="x" id="lzCloseLayer">✕</button>
        <span class="t" id="lzLayerTitle">游戏</span>
      </div>
      <div class="lz-game-body" id="lzLayerBody"></div>
    </div>

    <!-- 整理 sheet -->
    <div class="lz-sheet" id="lzSheet">
      <div class="st" style="display:flex;align-items:center;">
        <span style="flex:1;text-align:left;">课堂内容整理</span>
        <button id="lzSheetClose" style="border:none;background:var(--color-surface-alt);width:32px;height:32px;border-radius:50%;font-size:14px;color:var(--color-text);">✕</button>
      </div>
      <input type="text" id="lzTitle" placeholder="标题（如：高数·第三章 不定积分）" maxlength="30">
      <div class="lz-scroll">
        <textarea id="lzTranscript" placeholder="语音转写内容，或直接在这里输入 / 粘贴老师讲的内容…"></textarea>
        <textarea id="lzSummary" placeholder="点下方「AI 一键整理」后，这里会生成关键词和分点摘要" style="min-height:180px;"></textarea>
      </div>
      <div class="row">
        <button id="lzAiBtn">✨ AI 一键整理</button>
        <button id="lzSaveRec">保存记录</button>
      </div>
      <div class="exports" id="lzExports">
        <button data-f="md">Markdown</button>
        <button data-f="doc">Word</button>
        <button data-f="pdf">PDF</button>
      </div>
    </div>

    <!-- 老板键伪装层 -->
    <div class="lz-fake" id="lzFake">
      <h2>📒 课堂笔记</h2>
      <div class="ln w90"></div><div class="ln w80"></div><div class="ln w60"></div>
      <div class="ln w90"></div><div class="ln w45"></div><div class="ln w80"></div>
      <div class="ln w60"></div><div class="ln w90"></div><div class="ln w80"></div>
      <div class="ln w45"></div><div class="ln w90"></div><div class="ln w60"></div>
      <div class="ln w80"></div><div class="ln w90"></div>
      <h2 style="margin-top:18px;">重点回顾</h2>
      <div class="ln w80"></div><div class="ln w60"></div><div class="ln w90"></div><div class="ln w45"></div>
      <div class="quit" id="lzFakeQuit">●</div>
    </div>

    <!-- 固定 tab bar —— 以下代码完全不可修改 -->
    <nav class="tab-bar">
      <a href="index.html" class="tab-item" data-nav="home">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 0 0 0-1 1v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1m-6 0h6"/></svg>
        <span class="tab-label">首页</span>
      </a>
      <a href="packages.html" class="tab-item" data-nav="packages">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span class="tab-label">快递</span>
      </a>
      <a href="scan.html" class="tab-item tab-item--center" data-nav="scan">
        <div class="tab-scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </div>
        <span class="tab-label">扫码</span>
      </a>
      <a href="food.html" class="tab-item" data-nav="food">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        <span class="tab-label">外卖</span>
      </a>
      <a href="profile.html" class="tab-item" data-nav="profile">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      /* ============ Tab 切换 ============ */
      var panes = { games: document.getElementById('paneGames'), rec: document.getElementById('paneRec'), list: document.getElementById('paneList') };
      document.querySelectorAll('.lz-tabs button').forEach(function (b) {

      /* ============ 游戏：打地鼠 ============ */
      function startWhack(body) {
        body.innerHTML =
          '<div class="wh-info"><span id="whScore">得分 0</span><span id="whTime">30.0s</span></div>' +
          '<div class="wh-grid" id="whGrid"></div>' +
          '<button class="wh-btn" id="whStart">开始游戏</button>';
        var grid = body.querySelector('#whGrid');
        var scoreEl = body.querySelector('#whScore');
        var timeEl = body.querySelector('#whTime');
        var btn = body.querySelector('#whStart');
        var cells = [];
        for (var i = 0; i < 9; i++) {
          var c = document.createElement('div');
          c.className = 'wh-cell';
          (function (idx) {
            c.addEventListener('click', function () {
              if (!running || !cells[idx].classList.contains('up')) return;
              if (cells[idx].textContent === '💣') return; // 炸弹交给扣分监听
              score++;
              cells[idx].classList.remove('up');
              cells[idx].textContent = '';
              scoreEl.textContent = '得分 ' + score;
              if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
            });
          })(i);
          grid.appendChild(c);
          cells.push(c);
        }
        var running = false, score = 0, endAt = 0, spawnT = null, tickT = null, upIdx = -1;
        function spawn() {
          if (!running) return;
          if (upIdx >= 0) { cells[upIdx].classList.remove('up'); cells[upIdx].textContent = ''; }
          upIdx = Math.floor(Math.random() * 9);
          cells[upIdx].classList.add('up');
          cells[upIdx].textContent = Math.random() < 0.18 ? '💣' : '🐹';
          spawnT = setTimeout(spawn, 520 + Math.random() * 620);
        }
        // 炸弹点击扣分（事件委托式重绑）
        cells.forEach(function (cell, idx) {
          cell.addEventListener('click', function () {
            if (running && cell.classList.contains('up') && cell.textContent === '💣') {
              score = Math.max(0, score - 2);
              scoreEl.textContent = '得分 ' + score;
              cell.classList.remove('up'); cell.textContent = '';
            }
          });
        });
        function tick() {
          var left = Math.max(0, endAt - Date.now());
          timeEl.textContent = (left / 1000).toFixed(1) + 's';
          if (left <= 0) {
            running = false;
            clearTimeout(spawnT); clearInterval(tickT);
            cells.forEach(function (c) { c.classList.remove('up'); c.textContent = ''; });
            upIdx = -1;
            btn.textContent = '再来一局';
            btn.style.display = 'block';
            App.showModal({

      /* ============ 游戏：贪吃蛇 ============ */
      function startSnake(body) {
        body.innerHTML =
          '<div class="sn-wrap"><div class="sn-info"><span id="snScore">得分 0</span><span id="snBest">最高 0</span></div>' +
          '<canvas id="snCanvas" width="300" height="300"></canvas>' +
          '<div class="sn-dpad">' +
          '<button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button>' +
          '<button class="right" data-d="right">▶</button><button class="down" data-d="down">▼</button></div>' +
          '<button class="sn-btn" id="snBtn">开始游戏</button></div>';
        var cv = body.querySelector('#snCanvas');
        var ctx = cv.getContext('2d');
        var N = 12, CELL = 300 / N;
        var best = parseInt(localStorage.getItem('life_lazy_best_snake') || '0', 10);
        body.querySelector('#snBest').textContent = '最高 ' + best;
        var snake, dir, nextDir, food, score, timer = null, running = false;

        function reset() {
          snake = [{ x: 5, y: 6 }, { x: 4, y: 6 }, { x: 3, y: 6 }];
          dir = 'right'; nextDir = 'right'; score = 0;
          placeFood();
          body.querySelector('#snScore').textContent = '得分 0';
        }
        function placeFood() {
          do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
          while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
        }
        function draw() {
          ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--color-surface') || '#fff';
          ctx.fillRect(0, 0, 300, 300);
          ctx.strokeStyle = 'rgba(124,58,237,.07)';
          for (var i = 1; i < N; i++) {
            ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 300); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(300, i * CELL); ctx.stroke();
          }
          ctx.fillStyle = '#EF4444';
          ctx.beginPath();
          ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2.6, 0, Math.PI * 2);
          ctx.fill();
          snake.forEach(function (s, k) {
            ctx.fillStyle = k === 0 ? '#7C3AED' : '#A78BFA';
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 7)
                          : ctx.rect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
            ctx.fill();
          });
        }
        function step() {
          dir = nextDir;
          var head = { x: snake[0].x, y: snake[0].y };
          if (dir === 'up') head.y--; else if (dir === 'down') head.y++;
          else if (dir === 'left') head.x--; else head.x++;
          if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N ||
              snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
            gameOver(); return;
          }
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score++;
            body.querySelector('#snScore').textContent = '得分 ' + score;
            placeFood();
          } else { snake.pop(); }
          draw();
        }
        function gameOver() {
          running = false;
          clearInterval(timer);
          if (score > best) { best = score; localStorage.setItem('life_lazy_best_snake', String(score)); }
          body.querySelector('#snBest').textContent = '最高 ' + best;
          body.querySelector('#snBtn').textContent = '再来一局';
          draw();
          App.showModal({
            title: '游戏结束',
            desc: '本局得分 ' + score + '，最高纪录 ' + best,
            confirmText: '好的',
            onConfirm: function () { App.closeModal(); },
          });
        }
        function setDir(d) {
          var opp = { up: 'down', down: 'up', left: 'right', right: 'left' };
          if (opp[d] !== dir) nextDir = d;
        }
        body.querySelectorAll('.sn-dpad button').forEach(function (b) {
          b.addEventListener('click', function () { setDir(b.dataset.d); });
        });
        cv.addEventListener('touchstart', function (e) {
          if (!running) return;
          var t0 = e.touches[0], sx = t0.clientX, sy = t0.clientY, moved = false;
          function move(ev) {
            var t = ev.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
            if (!moved && Math.abs(dx) + Math.abs(dy) > 24) {
              moved = true;
              setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
            }
          }
          function end() { cv.removeEventListener('touchmove', move); cv.removeEventListener('touchend', end); }
          cv.addEventListener('touchmove', move, { passive: true });
          cv.addEventListener('touchend', end);
        }, { passive: true });
        body.querySelector('#snBtn').addEventListener('click', function () {
          if (running) return;
          reset(); draw();
          running = true;
          this.textContent = '游戏中…';
          clearInterval(timer);
          timer = setInterval(step, 200);
        });
        reset(); draw();
      }

      /* ============ 录音 + 转写 ============ */
      var mediaRecorder = null, recStream = null, recChunks = [], recStart = 0, recTimer = null;
      var recognition = null, recognizedText = '', recDuration = 0;

      function fmtRec(sec) {
        var m = Math.floor(sec / 60), s = sec % 60;
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }
      function setRecUI(on) {
        document.getElementById('lzRecBtn').textContent = on ? '停止并整理' : '开始录音';
        document.getElementById('lzRecDot').classList.toggle('rec', on);
        document.getElementById('lzRecDot').textContent = on ? '🔴' : '🎙️';
      }

      function startRecognition() {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          document.getElementById('lzLive').textContent = '⚠️ 当前浏览器不支持语音转文字，录音结束后可手动输入';
          return null;
        }
        var r = new SR();
        r.lang = 'zh-CN';
        r.continuous = true;
        r.interimResults = true;
        r.onresult = function (e) {
          var interim = '';
          for (var i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) recognizedText += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
          }
          document.getElementById('lzLive').textContent = '正在识别：' + (interim || '…');
        };
        r.onerror = function () { document.getElementById('lzLive').textContent = '转写中断，仍可手动补充内容'; };
        try { r.start(); } catch (e) { return null; }
        return r;
      }

      async function beginRec() {
        try {
          recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          App.showModal({
            title: '需要麦克风权限',
            desc: '请允许浏览器使用麦克风；本地页面（file://）无法录音，需通过 https 访问。',
            confirmText: '知道了',
            onConfirm: function () { App.closeModal(); },
          });
          return;
        }
        recognizedText = '';
        recDuration = 0;
        recognition = startRecognition();
        try {
          mediaRecorder = new MediaRecorder(recStream);
        } catch (e) {
          recStream.getTracks().forEach(function (t) { t.stop(); });
          recStream = null;
          App.toast('当前浏览器不支持录音');
          return;
        }
        recChunks = [];
        mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
        mediaRecorder.onstop = function () {
          // 音频仅内存，不保存；直接丢弃 chunks，避免占用 localStorage
          recChunks = [];
          openSheet(recognizedText);
        };
        mediaRecorder.start();
        recStart = Date.now();
        setRecUI(true);
        document.getElementById('lzRecHint').innerHTML = '录音中…再次点击按钮停止<br>识别内容将自动带入整理稿';
        recTimer = setInterval(function () {
          recDuration = Math.floor((Date.now() - recStart) / 1000);
          document.getElementById('lzRecTime').textContent = fmtRec(recDuration);
        }, 300);
      }

      function endRec() {
        clearInterval(recTimer);
        setRecUI(false);
        document.getElementById('lzRecTime').textContent = '00:00';
        document.getElementById('lzRecHint').innerHTML = '点下方按钮开始录音，同时尝试语音转文字<br>音频只在内存中，不保存、不上传';
        document.getElementById('lzLive').textContent = '';
        try { if (recognition) recognition.stop(); } catch (e) {}
        recognition = null;
        try { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } catch (e) {}
        if (recStream) { recStream.getTracks().forEach(function (t) { t.stop(); }); recStream = null; }
        // onstop 回调负责打开 sheet；若 recorder 不可用兜底
        setTimeout(function () {
          if (!sheet.classList.contains('show')) openSheet(recognizedText);
        }, 400);
      }

      document.getElementById('lzRecBtn').addEventListener('click', function () {
        if (mediaRecorder && mediaRecorder.state === 'recording') endRec(); else beginRec();
      });
      document.getElementById('lzNoteBtn').addEventListener('click', function () { recDuration = 0; openSheet(''); });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && mediaRecorder && mediaRecorder.state === 'recording') endRec();
      });

      /* ============ 本地「AI」整理 ============ */
      var FILLERS = ['那个', '然后', '就是', '这个', '怎么说', '对吧', '是吧', '嗯', '啊', '呃', '呀', '嘛', '哦', '哈'];
      var STOPWORDS = ['我们', '你们', '他们', '这个', '那个', '什么', '怎么', '可以', '因为', '所以', '如果', '就是', '然后', '一下', '一个', '需要', '进行', '大家', '同学', '老师', '今天', '这里', '那边', '知道', '觉得', '应该', '比较', '一些', '不是', '没有'];

      function cleanText(t) {
        var s = String(t || '');
        FILLERS.forEach(function (f) {
          // 只清口头禅独立重复（句首/连续出现）
          s = s.split(f).join('');
        });
        s = s.replace(/[ \t]+/g, ' ').replace(/\s*([，。！？；,.!?;])\s*/g, '$1').replace(/(.)\1{2,}/g, '$1$1');
        return s.trim();
      }
      function splitSentences(t) {
        var raw = String(t || '').split(/[。！？!?；;\n]+/);
        var out = [];
        raw.forEach(function (s) {
          s = s.replace(/^[\s，,、]+/, '').trim();
          if (s.length >= 4) out.push(s);
        });
        return out;
      }
      function extractKeywords(t) {
        var freq = {};
        for (var i = 0; i < t.length - 1; i++) {
          var g = t.substr(i, 2);
          if (/[\u4e00-\u9fa5]{2}/.test(g) && STOPWORDS.indexOf(g) === -1 && FILLERS.indexOf(g) === -1) {
            freq[g] = (freq[g] || 0) + 1;
          }
        }
        var arr = Object.keys(freq).map(function (k) { return [k, freq[k]]; })
          .filter(function (x) { return x[1] >= 2; })
          .sort(function (a, b) { return b[1] - a[1]; });
        var kw = [];
        arr.forEach(function (x) {
          if (kw.length >= 6) return;
          // 避免包含已选关键词子串
          for (var i = 0; i < kw.length; i++) {
            if (kw[i].indexOf(x[0]) !== -1 || x[0].indexOf(kw[i]) !== -1) return;
          }
          kw.push(x[0]);
        });
        return kw;
      }
      function aiOrganize(text) {
        var cleaned = cleanText(text);
        var sentences = splitSentences(cleaned);
        if (!sentences.length) return '';
        var kw = extractKeywords(cleaned);
        // 句子打分：含关键词多 + 长度适中 优先
        var scored = sentences.map(function (s, idx) {
          var score = 0;
          kw.forEach(function (k) { if (s.indexOf(k) !== -1) score += 2; });
          if (s.length >= 12 && s.length <= 60) score += 1;
          return { s: s, score: score, idx: idx };
        }).sort(function (a, b) { return b.score - a.score; });
        var picked = scored.slice(0, Math.min(5, Math.max(3, Math.ceil(sentences.length / 3))));
        picked.sort(function (a, b) { return a.idx - b.idx; });
        var lines = [];
        lines.push('## 关键词');
        lines.push(kw.length ? kw.join('、') : '（内容较短，未提取到高频关键词）');
        lines.push('');
        lines.push('## 课堂要点');
        picked.forEach(function (p) {
          var s = p.s;
          if (!/[。！？]$/.test(s)) s += '。';
          lines.push('- ' + s);
        });
        lines.push('');
        lines.push('## 完整记录');
        var full = sentences.map(function (s) {
          return (/[。！？]$/.test(s) ? s : s + '。');
        }).join('');
        lines.push(full);
        return lines.join('\n');
      }

      /* ============ 整理 sheet ============ */
      var sheet = document.getElementById('lzSheet');
      var savedRecId = null;
      function openSheet(text) {
        savedRecId = null;
        document.getElementById('lzTitle').value = '';

      function closeSheet() { sheet.classList.remove('show'); }
      document.getElementById('lzSheetClose').addEventListener('click', closeSheet);
      // 点 sheet 外部不关，防止误触丢失；下滑/返回可用底部 tab

      document.getElementById('lzAiBtn').addEventListener('click', function () {
        var raw = document.getElementById('lzTranscript').value.trim();
        if (!raw) { App.toast('先输入或录下课堂内容'); return; }

      /* ============ 导出 md / Word / PDF ============ */
      function currentDoc() {
        var title = document.getElementById('lzTitle').value.trim() || ('课堂记录 ' + new Date().toLocaleString('zh-CN'));
        var transcript = document.getElementById('lzTranscript').value.trim();
        var summary = document.getElementById('lzSummary').value.trim();
        return { title: title, transcript: transcript, summary: summary, time: new Date().toLocaleString('zh-CN') };
      }
      function buildMarkdown(doc) {
        var md = '# ' + doc.title + '\n\n> 整理时间：' + doc.time + '\n\n';
        if (doc.summary) md += doc.summary + '\n\n';
        if (doc.transcript) md += '## 原始记录\n\n' + doc.transcript + '\n';
        return md;
      }
      function mdToHtml(md) {
        var esc = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return esc
          .replace(/^### (.*)$/gm, '<h3>$1</h3>')
          .replace(/^## (.*)$/gm, '<h2>$1</h2>')
          .replace(/^# (.*)$/gm, '<h1>$1</h1>')
          .replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>')
          .replace(/^- (.*)$/gm, '<li>$1</li>')
          .replace(/(<li>.*<\/li>\n?)+/g, function (m) { return '<ul>' + m + '</ul>'; })
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/^(?!<[huob])/gm, '');
      }
      function downloadBlob(blob, name) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
      }
      function safeName(t) { return t.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40) || '课堂记录'; }

      function exportMd(doc) {
        var blob = new Blob(['\ufeff' + buildMarkdown(doc)], { type: 'text/markdown;charset=utf-8' });
        downloadBlob(blob, safeName(doc.title) + '.md');
      }
      function exportWord(doc) {
        var bodyHtml = mdToHtml(buildMarkdown(doc));
        var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" ' +
          'xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>' + doc.title + '</title>' +
          '<style>body{font-family:"宋体",SimSun,serif;font-size:12pt;line-height:1.8;}h1{font-size:18pt;}h2{font-size:15pt;}h3{font-size:13pt;}' +
          'blockquote{color:#666;border-left:3px solid #ccc;padding-left:10px;}li{margin:4px 0;}</style></head><body><p>' +
          bodyHtml + '</p></body></html>';
        var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
        downloadBlob(blob, safeName(doc.title) + '.doc');
      }
      function exportPdf(doc) {
        var bodyHtml = mdToHtml(buildMarkdown(doc));
        var w = window.open('', '_blank');
        if (!w) { App.toast('浏览器拦截了打印窗口，请允许弹窗'); return; }
        w.document.write(
          '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + doc.title + '</title><style>' +
          'body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px;line-height:1.9;color:#1f2937;}' +
          'h1{font-size:22px;}h2{font-size:17px;border-bottom:2px solid #edeef2;padding-bottom:6px;margin-top:22px;}' +
          'blockquote{color:#6b7280;border-left:3px solid #c7d2fe;padding-left:12px;margin:10px 0;}' +
          'ul{padding-left:22px;}li{margin:5px 0;}' +
          '@media print{body{padding:0;}}</style></head><body>' + bodyHtml +
          '<script>window.onload=function(){setTimeout(function(){window.print();},350);};<\/script>' +
          '</body></html>'
        );
        w.document.close();
      }

      document.getElementById('lzExports').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-f]');
        if (!btn) return;
        var doc = currentDoc();
        if (btn.dataset.f === 'md') exportMd(doc);
        else if (btn.dataset.f === 'doc') exportWord(doc);
        else exportPdf(doc);
      });

      /* ============ 记录列表 ============ */
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function renderList() {
        var list = Storage.lazyGetRecordings();
        var el = document.getElementById('lzList');
        if (!list.length) {
          el.innerHTML = App.emptyState('还没有课堂记录', '录一段老师讲课，AI 帮你整理成笔记');
          return;
        }
        el.innerHTML = list.map(function (r) {
          var preview = r.summary || r.transcript || '';
          var dur = r.duration ? ' · ' + fmtRec(r.duration) : '';
          return '<div class="lz-rec anim-fade-in-up"><div class="h"><span class="nm">' + esc(r.title) + '</span>' +
            '<span class="tm">' + esc(r.time || '') + dur + '</span></div>' +
            (preview ? '<div class="sm2">' + esc(preview).replace(/\n/g, '<br>') + '</div>' : '') +
            '<div class="ops">' +
            '<button data-act="md" data-id="' + r.id + '">Markdown</button>' +
            '<button data-act="doc" data-id="' + r.id + '">Word</button>' +
            '<button data-act="pdf" data-id="' + r.id + '">PDF</button>' +
            '<button class="del" data-act="del" data-id="' + r.id + '">删除</button></div></div>';
        }).join('');
      }
      document.getElementById('lzList').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) return;
        var r = Storage.lazyGetRecordings().filter(function (x) { return x.id === btn.dataset.id; })[0];
        if (!r) return;
        var doc = { title: r.title, time: r.time, transcript: r.transcript, summary: r.summary };
        if (btn.dataset.act === 'md') exportMd(doc);
        else if (btn.dataset.act === 'doc') exportWord(doc);
        else if (btn.dataset.act === 'pdf') exportPdf(doc);
        else if (btn.dataset.act === 'del') {
          App.showModal({
            title: '删除记录',
            desc: '「' + r.title + '」删除后不可恢复',
            confirmText: '删除',
            onConfirm: function () {
              Storage.lazyRemoveRecording(r.id);
              App.closeModal();
              renderList();
              App.toast('已删除');
            },
          });
        }
      });

      App.showGuide('lazy', {
        emoji: '🐟',
        title: '懒人模式 · 摸鱼指南',
        items: [
          '三个小游戏随时开玩，「老师来了！」一键伪装成课堂笔记',
          '录音页可边录边转文字（建议 Chrome），结束后 AI 自动去口头禅、提关键词、分点摘要',
          '整理稿能保存并导出 Markdown / Word / PDF，音频不留存',
        ],
      });
    })();
  </script>
</body>
</html>
