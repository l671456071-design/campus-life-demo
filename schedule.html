<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>课程表 - 校园生活</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* 顶部分段切换 */
    .sch-toggle { display:flex; margin:10px 16px 0; background:var(--color-surface-alt); border-radius:99px; padding:3px; }
    .sch-toggle button {
      flex:1; border:none; background:transparent; font-family:inherit;
      font-size:13.5px; font-weight:600; color:var(--color-text-sub);
      padding:8px 0; border-radius:99px; transition:all .2s;
    }
    .sch-toggle button.on { background:var(--color-surface); color:var(--color-primary); box-shadow:var(--shadow-sm); font-weight:700; }

    /* 周日期条 */
    .day-chips { display:flex; gap:7px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none; }
    .day-chip { flex-shrink:0; width:42px; padding:7px 0 8px; border-radius:14px; text-align:center; border:1.5px solid var(--color-border-light); background:var(--color-surface); color:var(--color-text-sub); font-size:13px; cursor:pointer; transition:all .2s; font-family:inherit; }
    .day-chip .d { font-size:11px; }
    .day-chip .n { display:block; font-size:15px; font-weight:700; margin-top:2px; }
    .day-chip.on { background:var(--color-primary); border-color:var(--color-primary); color:#fff; }
    .day-chip.today:not(.on) { border-color:var(--color-primary); color:var(--color-primary); }
    .day-chip:active { transform:scale(.94); }
    .week-bar { display:flex; align-items:center; justify-content:space-between; padding:6px 18px 0; }
    .week-bar .range { font-size:12.5px; color:var(--color-text-hint); }
    .week-bar .back-today { border:none; background:none; color:var(--color-primary); font-size:12.5px; font-weight:700; font-family:inherit; padding:2px 4px; }

    /* 进行中 / 下一节 状态卡 */
    .sch-now { margin:12px 16px 2px; border-radius:16px; padding:14px 16px; color:#fff; display:flex; align-items:center; gap:12px; }
    .sch-now.live { background:linear-gradient(135deg,#2563EB,#3B82F6); box-shadow:0 8px 20px rgba(37,99,235,.22); }
    .sch-now.next { background:linear-gradient(135deg,#0F766E,#14B8A6); box-shadow:0 8px 20px rgba(20,184,166,.2); }
    .sch-now.done { background:var(--color-surface-alt); color:var(--color-text-sub); border:1.5px dashed var(--color-border); }
    .sch-now .ico { font-size:26px; line-height:1; }
    .sch-now .t1 { font-size:12.5px; opacity:.85; }
    .sch-now .t2 { font-size:16px; font-weight:800; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sch-now .t3 { font-size:11.5px; opacity:.82; margin-top:2px; }

    .day-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 0; }
    .day-head .section-title { margin:0; }

    .lesson-card { position:relative; display:flex; gap:12px; background:var(--color-surface); border-radius:16px; padding:13px 14px 13px 16px; box-shadow:var(--shadow-sm); overflow:hidden; cursor:pointer; }
    .lesson-card.ongoing { box-shadow:0 0 0 2px var(--color-primary); }
    .lesson-strip { position:absolute; left:0; top:0; bottom:0; width:5px; }
    .lesson-time { flex-shrink:0; width:58px; text-align:center; }
    .lesson-no { font-size:14px; font-weight:800; color:var(--color-text); }
    .lesson-clock { font-size:10.5px; color:var(--color-text-hint); margin-top:3px; line-height:1.45; }
    .lesson-body { flex:1; min-width:0; }
    .lesson-name { font-size:15px; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:6px; }
    .lesson-live { font-size:10px; font-weight:700; color:#fff; background:var(--color-primary); border-radius:99px; padding:1px 7px; flex-shrink:0; }
    .lesson-meta { font-size:12px; color:var(--color-text-sub); margin-top:5px; display:flex; flex-direction:column; gap:3px; }
    .lesson-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lesson-remark {
      margin-top:7px;
      font-size:11.5px; color:#92610B;
      background:#FEF6E4; border:1px solid #F5E6BF;
      border-radius:9px; padding:5px 9px;
      line-height:1.5;
      word-break:break-word;
    }
    .lesson-dur { font-size:10.5px; color:var(--color-text-hint); margin-top:3px; }

    /* 月历 */
    .sch-cal { margin:12px 16px 0; background:var(--color-surface); border-radius:18px; border:1px solid var(--color-border-light); padding:14px 14px 12px; }
    .sch-cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .sch-cal-month { font-size:15px; font-weight:700; color:var(--color-text); }
    .sch-cal-nav { width:30px; height:30px; border-radius:10px; border:none; background:var(--color-surface-alt); color:var(--color-text-sub); display:flex; align-items:center; justify-content:center; }
    .sch-cal-nav:active { background:var(--color-primary-lighter); color:var(--color-primary); }
    .sch-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .sch-cal-wd { text-align:center; font-size:11px; color:var(--color-text-hint); padding:6px 0 4px; }
    .sch-cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:12px; cursor:pointer; }
    .sch-cal-day span { font-size:13.5px; color:var(--color-text); line-height:1; }
    .sch-cal-day.muted span { color:var(--color-text-hint); opacity:.45; }
    .sch-cal-day.today { background:var(--color-primary-lighter); }
    .sch-cal-day.today span { color:var(--color-primary); font-weight:800; }
    .sch-cal-day.selected { background:var(--color-primary); }
    .sch-cal-day.selected span { color:#fff; font-weight:700; }
    .sch-cal-dots { display:flex; gap:2px; height:4px; }
    .sch-cal-dots i { width:4px; height:4px; border-radius:50%; background:var(--color-primary); }
    .sch-cal-day.selected .sch-cal-dots i { background:#fff; }
    .sch-cal-tip { margin-top:10px; border-top:1px dashed var(--color-border-light); padding-top:10px; font-size:12.5px; color:var(--color-text-sub); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .sch-cal-tip b { color:var(--color-text); }

    /* 抽屉 */
    .sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .25s; z-index:100; }
    .sheet-mask.show { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; left:0; right:0; bottom:0; background:var(--color-surface); border-radius:22px 22px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); z-index:101; max-height:88vh; overflow-y:auto; }
    .sheet.show { transform:translateY(0); }
    .sheet-title { font-size:17px; font-weight:800; text-align:center; margin-bottom:6px; }
    .sheet-sub { font-size:12px; color:var(--color-text-hint); text-align:center; margin-bottom:16px; line-height:1.6; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:13px; color:var(--color-text-sub); margin-bottom:6px; }
    .field input, .field select, .field textarea { width:100%; box-sizing:border-box; border:1.5px solid var(--color-border); border-radius:12px; padding:11px 13px; font-size:14px; background:var(--color-surface); color:var(--color-text); outline:none; font-family:inherit; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--color-primary); }
    .field textarea { resize:vertical; min-height:96px; font-family:var(--font-mono); font-size:12px; }
    .field-row { display:flex; gap:10px; }
    .field-row .field { flex:1; }
    .import-preview { font-size:12px; color:var(--color-primary); background:var(--color-primary-lighter); border-radius:10px; padding:9px 12px; margin-bottom:12px; display:none; }
    .sch-clear { display:block; margin:10px auto 0; border:none; background:none; color:var(--color-text-hint); font-size:12.5px; font-family:inherit; text-decoration:underline; }
    .sch-del { width:100%; margin-top:10px; border:none; border-radius:14px; padding:12px; background:transparent; color:var(--color-danger); font-size:14px; cursor:pointer; font-family:inherit; }
  </style>
</head>
<body data-page="schedule">
  <div class="app-shell">
    <header class="app-header header--left">
      <div class="header-left">
        <a href="index.html" class="header-back-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
      <div class="header-title">课程表</div>
      <div class="header-spacer"></div>
      <div class="header-right">
        <button class="header-back-btn" id="btnImport" title="导入课程表" style="border:none;background:none;cursor:pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="header-back-btn" id="btnAdd" title="手动加课" style="border:none;background:none;cursor:pointer;font-size:22px;font-weight:300;line-height:1;padding:0 2px;">＋</button>
      </div>
    </header>

    <main class="app-content" id="mainContent" style="padding-bottom:32px;">
      <div class="sch-toggle">
        <button id="viewDay" class="on">日视图</button>
        <button id="viewMonth">月历</button>
      </div>

      <!-- 日视图 -->
      <div id="paneDay">
        <div class="day-chips" id="dayChips"></div>
        <div class="week-bar">
          <span class="range" id="weekRange"></span>
          <button class="back-today" id="btnBackToday">回到今天</button>
        </div>
        <div id="nowCard"></div>
        <div class="day-head">
          <span class="section-title" id="dayTitle">今日课程</span>
          <span class="section-link" id="courseCount"></span>
        </div>
        <div style="padding:10px 16px;">
          <div id="lessonList" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>
      </div>

      <!-- 月视图 -->
      <div id="paneMonth" style="display:none;">
        <div class="sch-cal">
          <div class="sch-cal-head">
            <button class="sch-cal-nav" id="calPrev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <div class="sch-cal-month" id="calMonth"></div>
            <button class="sch-cal-nav" id="calNext"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
          <div class="sch-cal-grid" id="calGrid"></div>
          <div class="sch-cal-tip" id="calTip"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 导入课程表抽屉（贝蒂 JSON / XLS 表格） -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="importSheet">
    <div class="sheet-title">导入课程表</div>
    <div class="sheet-sub">Excel 课表（XLS / XLSX）与贝蒂 JSON 自动识别导入，将覆盖当前课表。按「星期 × 节次」匹配，与今天真实日期联动。</div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
    <input type="file" id="importXlsFile" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
    <button class="btn btn-primary btn-block btn-lg" id="btnPickXls" style="margin-bottom:10px;">选择 XLS / XLSX 表格课表</button>
    <button class="btn btn-outline btn-block" id="btnPickFile" style="margin-bottom:12px;">选择 JSON 文件（贝蒂课程表）</button>
    <div class="field">
      <label>或粘贴课表 JSON</label>
      <textarea id="importText" placeholder='[{"courseName":"高等数学","weekday":1,"start":1,"end":2,"room":"文201","teacher":"王老师"}]'></textarea>
    </div>
    <div class="import-preview" id="importPreview"></div>
    <button class="btn btn-primary btn-block btn-lg" id="importSubmit">开始导入</button>
    <button class="sch-clear" id="btnClearAll">清空当前课表</button>
  </div>

  <!-- 手动加课 / 编辑抽屉 -->
  <div class="sheet" id="addSheet">
    <div class="sheet-title" id="addSheetTitle">手动添加课程</div>
    <div class="field">
      <label>课程名称</label>
      <input type="text" id="addName" placeholder="例如：高等数学" maxlength="20">
    </div>
    <div class="field-row">
      <div class="field">
        <label>星期</label>
        <select id="addWeekday">
          <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
          <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
        </select>
      </div>
      <div class="field"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>开始节次</label>
        <select id="addStart"></select>
      </div>
      <div class="field">
        <label>结束节次</label>
        <select id="addEnd"></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>教室</label>
        <input type="text" id="addRoom" placeholder="文201" maxlength="20">
      </div>
      <div class="field">
        <label>教师</label>
        <input type="text" id="addTeacher" placeholder="王老师" maxlength="10">
      </div>
    </div>
    <div class="field">
      <label>备注（选填）</label>
      <input type="text" id="addRemark" placeholder="例如：带电脑 / 第8周随堂测验" maxlength="30">
    </div>
    <button class="btn btn-primary btn-block btn-lg" id="addSubmit">保存课程</button>
    <button class="sch-del" id="addDelete" style="display:none;">删除这门课</button>
  </div>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var DAYS = ['一', '二', '三', '四', '五', '六', '日'];
      var COLORS = ['#0A6EFF', '#16A34A', '#F59E0B', '#7C3AED', '#EF4444', '#0891B2', '#DB2777', '#65A30D'];
      // 节次作息（开始-结束），按真实时钟判断「正在上 / 下一节」
      var LESSON_TIMES = [
        ['08:00', '08:45'], ['08:55', '09:40'], ['10:00', '10:45'], ['10:55', '11:40'],
        ['14:00', '14:45'], ['14:55', '15:40'], ['16:00', '16:45'], ['16:55', '17:40'],
        ['19:00', '19:45'], ['19:55', '20:40'],
      ];
      var CN_NUM = { '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10, '十一': 11, '十二': 12 };

      function midnight(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
      function mondayOf(d) { var x = midnight(d); var wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
      // 周一=1 ... 周日=7
      function weekdayOf(d) { return d.getDay() === 0 ? 7 : d.getDay(); }
      function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
      function cn2num(s) {
        if (/^\d+$/.test(s)) return parseInt(s, 10);
        if (s === '十') return 10;
        return CN_NUM[s] !== undefined ? CN_NUM[s] : NaN;
      }
      function escHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
        });
      }

      var today = midnight(new Date());
      var selectedDate = midnight(new Date());
      var calCursor = { y: today.getFullYear(), m: today.getMonth() };
      var viewMode = 'day';
      var pendingImport = null;
      var editingId = null;
      var nowTimer = null;

      var mask = document.getElementById('sheetMask');
      var importSheet = document.getElementById('importSheet');
      var addSheet = document.getElementById('addSheet');
      function openSheet(s) { mask.classList.add('show'); s.classList.add('show'); }
      function closeAll() { mask.classList.remove('show'); importSheet.classList.remove('show'); addSheet.classList.remove('show'); }
      mask.addEventListener('click', closeAll);

      // =========================================================
      // 课程归一化（模型不含周次）
      // =========================================================
      function makeCourse(c) {
        var st = clamp(parseInt(c.start, 10) || 1, 1, 10);
        var en = clamp(parseInt(c.end, 10) || st, st, 10);
        return {
          id: c.id || ('C' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)),
          name: String(c.name || '').trim().slice(0, 20),
          teacher: String(c.teacher || '').trim().slice(0, 10),
          position: String(c.position || '').trim().slice(0, 20),
          remark: String(c.remark || '').trim().slice(0, 30),
          weekday: clamp(parseInt(c.weekday, 10) || 1, 1, 7),
          start: st, end: en,
          color: c.color || '',
        };
      }

      function dedupeCourses(list) {
        var seen = {}, out = [];
        list.forEach(function (c) {
          var key = [c.name, c.weekday, c.start, c.end, c.position, c.teacher, c.remark].join('|');
          if (!seen[key]) { seen[key] = 1; out.push(c); }
        });
        out.forEach(function (c, i) { if (!c.color) c.color = COLORS[i % COLORS.length]; });
        return out;
      }

      // 合并同天同名且节次相邻/重叠的课（消除合并单元格重复行）
      function mergeAdjacent(list) {
        var groups = {};
        list.forEach(function (c) {
          var key = c.weekday + '|' + c.name + '|' + c.teacher + '|' + c.position;
          if (!groups[key]) groups[key] = [];
          groups[key].push(c);
        });
        var out = [];
        Object.keys(groups).forEach(function (k) {
          var iv = groups[k].map(function (c) { return [c.start, c.end, c]; })
            .sort(function (a, b) { return a[0] - b[0]; });
          var merged = [];
          iv.forEach(function (seg) {
            if (merged.length && seg[0] <= merged[merged.length - 1][1] + 1) {
              merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], seg[1]);
            } else {
              merged.push([seg[0], seg[1], seg[2]]);
            }
          });
          merged.forEach(function (seg) {
            out.push(makeCourse({
              name: seg[2].name, teacher: seg[2].teacher, position: seg[2].position,
              remark: seg[2].remark,
              weekday: seg[2].weekday, start: seg[0], end: seg[1], color: seg[2].color,
            }));
          });
        });
        return out;
      }

      // =========================================================
      // 节次识别（严格：必须带「节」语境，绝不吞「1-16周」）
      // =========================================================
      function extractSections(line) {
        var t = String(line == null ? '' : line);
        var hit, a, b;
        // 1-2节 / 1-2小节（显式带节）
        hit = t.match(/(\d{1,2})\s*[-–~至到、,，]\s*(\d{1,2})\s*节/);
        if (hit) { a = +hit[1]; b = +hit[2]; if (a >= 1 && b >= 1 && b <= 10 && Math.abs(b - a) <= 6) return normRange(a, b); }
        // 第一-二节（中文）
        hit = t.match(/第?\s*([一二两三四五六七八九十]{1,3})\s*[-–~至到、,，]\s*([一二两三四五六七八九十]{1,3})\s*节/);
        if (hit) { a = cn2num(hit[1]); b = cn2num(hit[2]); if (a >= 1 && b >= 1) return normRange(a, b); }
        // (1-2) 括号内纯节次：同行不能出现「周」
        if (!/周/.test(t)) {
          hit = t.match(/[（(]\s*(\d{1,2})\s*[-–~]\s*(\d{1,2})\s*[)）]/);
          if (hit) { a = +hit[1]; b = +hit[2]; if (a >= 1 && b >= 1 && b <= 10 && Math.abs(b - a) <= 6) return normRange(a, b); }
        }
        // 第1节 / 1节（单节）；排除「周」在同一数字后
        hit = t.match(/第?\s*(\d{1,2})\s*节(?!\s*周)/);
        if (hit) { a = +hit[1]; if (a >= 1 && a <= 10) return { start: a, end: a }; }
        hit = t.match(/第\s*([一二三四五六七八九十]{1,3})\s*节/);
        if (hit) { a = cn2num(hit[1]); if (a >= 1 && a <= 10) return { start: a, end: a }; }
        return null;
      }
      function normRange(a, b) {
        if (b < a) { var t = a; a = b; b = t; }
        return { start: a, end: b };
      }

      // 是否为「周次」行（如 1-16周 / 第5周）——新课程模型忽略，但不能当成节次
      function isWeekLine(t) {
        return /\d{1,2}\s*[-–~至到]?\s*\d{0,2}\s*周/.test(String(t == null ? '' : t)) || /第?\s*[一二三四五六七八九十]+\s*周/.test(String(t || ''));
      }

      var GROUP_ROW_RE = /^(上午|下午|晚上|早晨|早上|中午|午休|傍晚|夜间)/;
      var LABEL_RE = /^(星期[一二三四五六日天]?|周[一二三四五六日天]?|礼拜[一二三四五六日天]?|节次|小节|时间|备注|课程名?称?|周一|周二|周三|周四|周五|周六|周日|上午|下午|晚上|午休)$/;

      // 行首（节次列）→ 节次序号
      function rowSection(raw) {
        var t = String(raw == null ? '' : raw).trim();
        if (!t) return null;
        var n = t.match(/^第?\s*(\d{1,2})\s*节?/);
        if (n && +n[1] >= 1 && +n[1] <= 10) return +n[1];
        var cn = t.match(/^第?\s*([一二三四五六七八九十]{1,3})\s*节?/);
        if (cn) { var c = cn2num(cn[1]); if (c >= 1 && c <= 10) return c; }
        var tm = t.match(/(\d{1,2}):(\d{2})/);
        if (tm) {
          var mins = (+tm[1]) * 60 + (+tm[2]);
          for (var i = 0; i < LESSON_TIMES.length; i++) {
            var p = LESSON_TIMES[i][0].split(':');
            var pm = (+p[0]) * 60 + (+p[1]);
            if (mins >= pm - 25 && mins <= pm + 20) return i + 1;
          }
        }
        if (/^\d{1,2}$/.test(t) && +t >= 1 && +t <= 10) return +t;
        return null;
      }

      // 一行文本里拆「教室 + 老师」（如 文201张三 / 教1-301 王老师）
      function splitRoomTeacher(line) {
        var out = { room: '', teacher: '' };
        var t = String(line == null ? '' : line).trim();
        if (!t) return out;
        var roomHit = t.match(/([A-Za-z]?[\u4e00-\u9fa5]{0,4}?\d{1,4}\s*[-]\s*\d{2,4}(?:室|教室)?|[A-Za-z]?[\u4e00-\u9fa5]{0,4}?\d{2,4}(?:号)?(?:室|教室|楼)?)/);
        if (roomHit) {
          out.room = roomHit[1].replace(/教室$/, '');
          var rest = (t.slice(0, roomHit.index) + t.slice(roomHit.index + roomHit[0].length)).trim();
          if (looksLikeTeacher(rest)) out.teacher = rest.replace(/老师$/, '');
        } else if (looksLikeTeacher(t)) {
          out.teacher = t.replace(/老师$/, '');
        }
        return out;
      }

      function looksLikeTeacher(s) {
        s = String(s == null ? '' : s).trim().replace(/老师$/, '').replace(/教授$/, '');
        return /^[\u4e00-\u9fa5A-Za-z·]{2,5}$/.test(s);
      }
      function looksLikeRoom(s) {
        s = String(s == null ? '' : s).trim();
        if (!s) return false;
        if (/[楼室馆栋苑阶]/.test(s)) return true;
        if (/\d{2,4}/.test(s) && /[\u4e00-\u9fa5A-Za-z]/.test(s)) return true;
        if (/^[A-Za-z]\d{2,4}$/.test(s)) return true;
        return false;
      }

      // 单元格 → 多门课文本块（以节次行为锚点切分同一格内多门课）
      function splitCellCourses(text) {
        var lines = String(text == null ? '' : text).replace(/\r/g, '\n')
          .split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        if (!lines.length) return [];
        var anchors = [];
        lines.forEach(function (ln, i) { if (extractSections(ln)) anchors.push(i); });
        if (!anchors.length) return [lines.join('\n')];
        var blocks = [];
        anchors.forEach(function (ai, k) {
          var nameLine = ai - 1 >= 0 ? lines[ai - 1] : '';
          var tailEnd = k + 1 < anchors.length ? Math.min(anchors[k + 1] - 1, ai + 3) : ai + 3;
          var tail = lines.slice(ai + 1, tailEnd + 1);
          blocks.push([nameLine, lines[ai]].concat(tail).filter(Boolean).join('\n'));
        });
        return blocks;
      }

      // 单门课块解析：名称 / 节次 / 教室 / 老师（周次信息忽略）
      function parseCourseBlock(block, day, fallbackSec) {
        var raw = String(block || '').trim();
        if (!raw || raw.length < 2) return null;

        // 拆片段：换行 + 斜杠
        var parts = raw.replace(/／/g, '/').split(/[\n/]+/)
          .map(function (s) { return s.trim(); })
          .filter(Boolean);
        if (!parts.length) return null;

        // 找名称行：第一个有意义、非标签的片段
        var nameIdx = -1, name = '';
        for (var i = 0; i < parts.length; i++) {
          var cand = parts[i]
            .split('@')[0]
            .replace(/[【\[][^\]】]*[】\]]/g, '')
            .replace(/[（(][^）)]*[)）]\s*$/, '')
            .replace(/(第?)?\d{1,2}\s*[-–~至到、,，]?\s*\d{0,2}\s*节.*$/, '')
            .trim();
          if (cand.length < 2) continue;
          if (/星期|礼拜|^周[一二三四五六日天]?$|节次|周次|课程名?称?|^上午$|^下午$|^晚上$|^早晨$|^早上$|备注|^\d{1,2}$/.test(cand)) continue;
          if (isWeekLine(cand)) continue;
          nameIdx = i;
          name = cand;
          break;
        }
        if (!name) return null;

        // 节次：扫描全部片段（严格带节），找不到用行节次兜底
        var sec = null, secIdx = -1;
        for (var j = 0; j < parts.length; j++) {
          var hit = extractSections(parts[j]);
          if (hit) { sec = hit; secIdx = j; break; }
        }
        // 名称行内嵌 (1-2节)
        if (!sec) {
          var inline = extractSections(parts[nameIdx] || '');
          if (inline) sec = inline;
        }
        if (!sec && fallbackSec) sec = { start: fallbackSec, end: fallbackSec };
        if (!sec) return null;

        // 教室 / 老师：扫描其余片段
        var room = '', teacher = '';
        for (var k = 0; k < parts.length; k++) {
          if (k === nameIdx || k === secIdx) continue;
          var p = parts[k];
          if (isWeekLine(p)) continue;
          if (LABEL_RE.test(p)) continue;
          // 片段内同时含节次/周次描述则跳过
          if (extractSections(p) && k !== secIdx) { /* 可能第二个节次锚点，忽略 */ continue; }
          if (!room && looksLikeRoom(p)) {
            var rt = splitRoomTeacher(p);
            room = rt.room;
            if (!teacher && rt.teacher) teacher = rt.teacher;
            continue;
          }
          if (!teacher && looksLikeTeacher(p)) {
            teacher = p.replace(/老师$/, '').replace(/教授$/, '');
            continue;
          }
          // 兜底：含楼/室关键词
          if (!room && /[楼室馆栋苑]/.test(p)) room = p;
        }

        return makeCourse({
          name: name, teacher: teacher, position: room,
          weekday: day, start: sec.start, end: sec.end,
        });
      }

      // =========================================================
      // JSON 解析（贝蒂/常见课表）
      // =========================================================
      function pick(obj, keys) {
        for (var i = 0; i < keys.length; i++) {
          if (obj[keys[i]] !== undefined && obj[keys[i]] !== null && obj[keys[i]] !== '') return obj[keys[i]];
        }
        return '';
      }
      function parseDay(v) {
        if (typeof v === 'number') return clamp(v === 0 ? 7 : v, 1, 7);
        var m = String(v).match(/[一二三四五六日天1-7]/);
        if (!m) return 1;
        var map = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7, '天': 7 };
        if (map[m[0]]) return map[m[0]];
        var n = parseInt(m[0], 10);
        return n === 0 ? 7 : clamp(n, 1, 7);
      }
      function parseSectionsItem(item) {
        var start = pick(item, ['start', 'startSection', 'startNode', 'beginSection', 'ksjc', 'section', 'sections']);
        var end = pick(item, ['end', 'endSection', 'endNode', 'jsjc']);
        var range = String(start).match(/(\d+)\s*[-~至,，]\s*(\d+)/);
        if (range) { start = parseInt(range[1], 10); end = parseInt(range[2], 10); }
        start = parseInt(start, 10);
        end = parseInt(end, 10);
        if (!(start >= 1)) start = 1;
        if (!(end >= start)) end = start;
        return { start: Math.min(start, 10), end: Math.min(end, 10) };
      }
      function parseSchedule(jsonText) {
        var raw;
        try { raw = JSON.parse(jsonText); } catch (e) { return { error: 'JSON 格式不正确，无法解析' }; }
        var arr = null;
        if (Array.isArray(raw)) arr = raw;
        else if (raw && typeof raw === 'object') {
          ['courses', 'courseList', 'kebiao', 'kbList', 'list', 'data', 'rows'].forEach(function (k) {
            if (arr === null && Array.isArray(raw[k])) arr = raw[k];
          });
          if (arr === null) {
            arr = [];
            Object.keys(raw).forEach(function (k) { if (Array.isArray(raw[k])) arr = arr.concat(raw[k]); });
          }
        }
        if (!arr || !arr.length) return { error: '没有在文件里找到课程数据' };
        var courses = [];
        arr.forEach(function (c) {
          if (!c || typeof c !== 'object') return;
          var name = pick(c, ['courseName', 'name', 'course', 'kcmc', 'title', 'course_name']);
          if (!name) return;
          var sec = parseSectionsItem(c);
          courses.push(makeCourse({
            name: name,
            teacher: pick(c, ['teacher', 'teacherName', 'jsxm', 'teacher_name']),
            position: pick(c, ['room', 'position', 'classroom', 'jasm', 'jddm', 'location', 'address']),
            weekday: parseDay(pick(c, ['weekday', 'day', 'week', 'xqj', 'dayOfWeek']) || 1),
            start: sec.start, end: sec.end,
          }));
        });
        courses = dedupeCourses(courses);
        if (!courses.length) return { error: '课程字段无法识别，请检查文件内容' };
        return { courses: courses, mode: 'JSON' };
      }

      // =========================================================
      // XLS / XLSX 解析
      // =========================================================
      function isJunkCell(text) {
        var t = String(text == null ? '' : text).trim();
        if (!t || t.length < 2) return true;
        if (LABEL_RE.test(t)) return true;
        if (GROUP_ROW_RE.test(t) && t.length <= 3) return true;
        return false;
      }
      function parseDayHeaderCell(txt) {
        var t = String(txt == null ? '' : txt);
        var m = t.match(/(?:星期|礼拜|周)\s*([一二三四五六日天1-7])/);
        if (m) {
          var map = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7, '天': 7 };
          if (map[m[1]]) return map[m[1]];
          var n = parseInt(m[1], 10);
          return n === 0 ? 7 : n;
        }
        if (/mon/i.test(t)) return 1;
        if (/tue/i.test(t)) return 2;
        if (/wed/i.test(t)) return 3;
        if (/thu/i.test(t)) return 4;
        if (/fri/i.test(t)) return 5;
        if (/sat/i.test(t)) return 6;
        if (/sun/i.test(t)) return 7;
        return 0;
      }
      function findDayHeader(rows) {
        for (var r = 0; r < Math.min(rows.length, 12); r++) {
          var row = rows[r] || [], map = {};
          for (var c = 0; c < row.length; c++) {
            var d = parseDayHeaderCell(row[c]);
            if (d && map[d] === undefined) map[d] = c;
          }
          if (Object.keys(map).length >= 3) return { row: r, colDay: map };
        }
        return null;
      }
      // 探测节次列：统计每列被识别为节次的次数，取最高
      function findSectionCol(rows, hdr) {
        var maxCols = 0;
        rows.forEach(function (r) { if (r && r.length > maxCols) maxCols = r.length; });
        var best = { col: 0, score: -1 };
        for (var c = 0; c < Math.min(maxCols, 6); c++) {
          var score = 0;
          for (var r = hdr.row + 1; r < rows.length; r++) {
            if (rowSection((rows[r] || [])[c])) score += c === 0 ? 2 : 1; // 优先首列
          }
          if (score > best.score) best = { col: c, score: score };
        }
        return best.score > 0 ? best.col : 0;
      }

      function parseMatrix(rows, hdr) {
        var courses = [];
        var cols = hdr.colDay;
        var secCol = findSectionCol(rows, hdr);
        for (var r = hdr.row + 1; r < rows.length; r++) {
          var row = rows[r] || [];
          var hasText = row.some(function (x, ci) {
            // 节次列本身不算文本
            if (ci === secCol) return false;
            return String(x == null ? '' : x).trim() !== '';
          });
          if (!hasText) continue;
          var firstVal = String(row[secCol] == null ? '' : row[secCol]).trim();
          var secFromRow = rowSection(firstVal);
          var isGroup = GROUP_ROW_RE.test(firstVal);
          if (isGroup) continue; // 上午/下午分组行跳过（不再自增序号导致错位）
          Object.keys(cols).forEach(function (day) {
            var text = String(row[cols[day]] == null ? '' : row[cols[day]]).trim();
            if (isJunkCell(text)) return;
            splitCellCourses(text).forEach(function (b) {
              var course = parseCourseBlock(b, parseInt(day, 10), secFromRow);
              if (course) courses.push(course);
            });
          });
        }
        return courses;
      }

      function findHeaderRow(rows) {
        for (var i = 0; i < Math.min(rows.length, 8); i++) {
          var joined = (rows[i] || []).map(function (c) { return String(c == null ? '' : c); }).join('|');
          if (/课程|名称|科目|星期|节次|地点|教室|教师|老师/.test(joined)) return i;
        }
        return -1;
      }
      function colIdx(header, keys) {
        for (var i = 0; i < header.length; i++) {
          var h = String(header[i] == null ? '' : header[i]);
          for (var k = 0; k < keys.length; k++) {
            if (h.indexOf(keys[k]) !== -1) return i;
          }
        }
        return -1;
      }
      function parseListRows(rows) {
        var hRow = findHeaderRow(rows);
        var header = hRow >= 0 ? rows[hRow] : [];
        var dataStart = hRow >= 0 ? hRow + 1 : 0;
        var iName = hRow >= 0 ? colIdx(header, ['课程名', '课程', '名称', '课名', '科目']) : 0;
        var iDay = hRow >= 0 ? colIdx(header, ['星期', '礼拜', '周几', '星期几']) : 1;
        var iSec = hRow >= 0 ? colIdx(header, ['开始节', '节次', '上课节', '节']) : 2;
        var iTime = hRow >= 0 ? colIdx(header, ['上课时间', '开始时间', '时间']) : -1;
        var iEnd = hRow >= 0 ? colIdx(header, ['结束节', '下课节']) : -1;
        var iRoom = hRow >= 0 ? colIdx(header, ['教室', '上课地点', '地点', '位置', '地址']) : 3;
        var iTch = hRow >= 0 ? colIdx(header, ['教师', '老师', '授课', '任课']) : 4;
        if (iName < 0) iName = 0;
        if (hRow >= 0 && !/课程|名称|科目|课名/.test(String(header[iName] || ''))) return [];
        var courses = [];
        for (var r = dataStart; r < rows.length; r++) {
          var row = rows[r] || [];
          var name = String(row[iName] == null ? '' : row[iName]).trim();
          if (!name || /^(课程名?称?|科目|星期|礼拜|周几|节次|时间|地点|教室|位置|教师|老师|周次|上午|下午|晚上|备注)$/.test(name)) continue;
          var day = iDay >= 0 ? parseDay(row[iDay] || 1) : 1;
          var sec = iSec >= 0 ? extractSections(String(row[iSec] || '')) : null;
          if (!sec && iTime >= 0) {
            var tm = String(row[iTime] || '').match(/(\d{1,2}):(\d{2})/);
            if (tm) {
              var mins = (+tm[1]) * 60 + (+tm[2]);
              for (var t = 0; t < LESSON_TIMES.length; t++) {
                var p = LESSON_TIMES[t][0].split(':');
                var pm = (+p[0]) * 60 + (+p[1]);
                if (mins >= pm - 20 && mins <= pm + 20) { sec = { start: t + 1, end: t + 1 }; break; }
              }
            }
          }
          if (!sec) sec = iSec >= 0 ? extractSections(String(row[iSec] || '')) : { start: 1, end: 1 };
          if (!sec) sec = { start: 1, end: 1 };
          var endVal = (iEnd >= 0 && parseInt(row[iEnd], 10) >= sec.start) ? parseInt(row[iEnd], 10) : sec.end;
          courses.push(makeCourse({
            name: name,
            teacher: iTch >= 0 ? String(row[iTch] || '').trim() : '',
            position: iRoom >= 0 ? String(row[iRoom] || '').trim() : '',
            weekday: day, start: sec.start, end: endVal,
          }));
        }
        return courses;
      }

      function parseXlsxRows(rows) {
        if (!rows || !rows.length) return { error: '表格是空的' };
        var hdr = findDayHeader(rows);
        var courses = hdr ? parseMatrix(rows, hdr) : parseListRows(rows);
        courses = mergeAdjacent(courses);
        courses = dedupeCourses(courses);
        if (!courses.length) {
          return { error: '未识别到真实课程：请确认是「节次×星期」矩阵课表，或含课程名/星期/节次列的列表' };
        }
        return { courses: courses, matrix: !!hdr };
      }

      var sheetJsLoading = false;
      function loadSheetJs(cb) {
        if (typeof XLSX !== 'undefined') { cb(); return; }
        if (sheetJsLoading) return;
        sheetJsLoading = true;
        var s = document.createElement('script');
        s.src = 'libs/xlsx/xlsx.full.min.js';
        s.onload = function () { cb(); };
        s.onerror = function () {
          sheetJsLoading = false;
          App.toast('表格解析库加载失败，请检查 libs/xlsx 目录');
        };
        document.head.appendChild(s);
      }

      function showPreview(res, sourceLabel) {
        var pv = document.getElementById('importPreview');
        if (res.error) {
          pv.style.display = 'block';
          pv.style.background = '#FEE2E2';
          pv.style.color = '#DC2626';
          pv.textContent = '⚠ ' + res.error;
          pendingImport = null;
        } else {
          pendingImport = res.courses;
          var dist = [0, 0, 0, 0, 0, 0, 0];
          res.courses.forEach(function (c) { dist[c.weekday - 1]++; });
          var distText = dist.map(function (n, i) { return n ? ('周' + DAYS[i] + ' ' + n + '门') : ''; })
            .filter(Boolean).join(' · ');
          var sample = res.courses.slice(0, 3).map(function (c) {
            return c.name + (c.position ? '(' + c.position + ')' : '');
          }).join('、');
          var modeText = res.matrix ? '矩阵课表' : (res.mode === 'JSON' ? 'JSON 课表' : '列表课表');
          pv.style.display = 'block';
          pv.style.background = 'var(--color-primary-lighter)';
          pv.style.color = 'var(--color-text)';
          pv.innerHTML =
            '<div style="font-weight:700;color:var(--color-primary);">✓ ' + sourceLabel +
              '识别到 ' + res.courses.length + ' 门课程（' + modeText + '）</div>' +
            '<div style="margin-top:4px;line-height:1.7;color:var(--color-text-sub);">' + distText + '</div>' +
            '<div style="margin-top:2px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
              sample + (res.courses.length > 3 ? ' 等' : '') + '</div>';
        }
      }

      // =========================================================
      // 渲染
      // =========================================================
      function coursesOfDay(date) {
        var wd = weekdayOf(date);
        return Storage.lifeGetCourses()
          .filter(function (c) { return c.weekday === wd; })
          .sort(function (a, b) { return a.start - b.start; });
      }

      function renderDayChips() {
        var mon = mondayOf(selectedDate);
        var html = '';
        for (var i = 0; i < 7; i++) {
          var d = new Date(mon);
          d.setDate(mon.getDate() + i);
          var cls = 'day-chip' + (sameDay(d, selectedDate) ? ' on' : '') + (sameDay(d, today) ? ' today' : '');
          html += '<button class="' + cls + '" data-i="' + i + '"><span class="d">周' + DAYS[i] + '</span><span class="n">' + d.getDate() + '</span></button>';
        }
        document.getElementById('dayChips').innerHTML = html;
        var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
        document.getElementById('weekRange').textContent =
          (mon.getMonth() + 1) + '月' + mon.getDate() + '日 - ' + (sun.getMonth() + 1) + '月' + sun.getDate() + '日';
        document.getElementById('btnBackToday').style.visibility = sameDay(selectedDate, today) ? 'hidden' : 'visible';
        document.querySelectorAll('.day-chip').forEach(function (el) {
          el.addEventListener('click', function () {
            var nd = new Date(mon);
            nd.setDate(mon.getDate() + parseInt(this.dataset.i, 10));
            selectedDate = midnight(nd);
            renderDay();
          });
        });
      }

      // 正在上 / 下一节（按真实时钟）
      function renderNowCard() {
        var el = document.getElementById('nowCard');
        if (!sameDay(selectedDate, today)) { el.innerHTML = ''; return; }
        var now = new Date();
        var curMin = now.getHours() * 60 + now.getMinutes();
        var courses = coursesOfDay(today);
        var ongoing = null, next = null;
        courses.forEach(function (c) {
          var s = LESSON_TIMES[c.start - 1];
          var e = LESSON_TIMES[c.end - 1];
          var sm = (+s[0].split(':')[0]) * 60 + (+s[0].split(':')[1]);
          var em = (+e[1].split(':')[0]) * 60 + (+e[1].split(':')[1]);
          if (curMin >= sm && curMin <= em) ongoing = c;
          if (!ongoing && sm > curMin && !next) next = c;
        });
        if (ongoing) {
          el.innerHTML = '<div class="sch-now live anim-fade-in-up"><span class="ico">📘</span><div style="min-width:0;flex:1;">' +
            '<div class="t1">正在上 · 第' + ongoing.start + (ongoing.end > ongoing.start ? '-' + ongoing.end : '') + '节</div>' +
            '<div class="t2">' + ongoing.name + '</div>' +
            '<div class="t3">' + (ongoing.position || '') + (ongoing.teacher ? ' · ' + ongoing.teacher : '') + '</div></div></div>';
        } else if (next) {
          el.innerHTML = '<div class="sch-now next anim-fade-in-up"><span class="ico">⏭️</span><div style="min-width:0;flex:1;">' +
            '<div class="t1">下一节 · ' + LESSON_TIMES[next.start - 1][0] + ' 开始</div>' +
            '<div class="t2">第' + next.start + (next.end > next.start ? '-' + next.end : '') + '节 ' + next.name + '</div>' +
            '<div class="t3">' + (next.position || '') + (next.teacher ? ' · ' + next.teacher : '') + '</div></div></div>';
        } else if (courses.length) {
          el.innerHTML = '<div class="sch-now done anim-fade-in-up"><span class="ico">🌙</span><div style="flex:1;">' +
            '<div class="t1" style="color:var(--color-text-sub);">今天的课已结束</div>' +
            '<div class="t3" style="color:var(--color-text-hint);">共 ' + courses.length + ' 节，辛苦啦</div></div></div>';
        } else {
          el.innerHTML = '';
        }
      }

      function renderLessons() {
        var courses = coursesOfDay(selectedDate);
        var isToday = sameDay(selectedDate, today);
        var curMin = isToday ? (new Date().getHours() * 60 + new Date().getMinutes()) : -1;
        var title;
        if (isToday) title = '今日课程';
        else title = (selectedDate.getMonth() + 1) + '月' + selectedDate.getDate() + '日 周' + DAYS[weekdayOf(selectedDate) - 1] + '课程';
        document.getElementById('dayTitle').textContent = title;
        document.getElementById('courseCount').textContent = courses.length ? courses.length + ' 门课' : '';

        var html = '';
        if (!courses.length) {
          html = App.emptyState('这天没有课', '享受空闲时光，或点右上角＋加课');
        }
        courses.forEach(function (c, i) {
          var s = LESSON_TIMES[c.start - 1], e = LESSON_TIMES[c.end - 1];
          var sm = (+s[0].split(':')[0]) * 60 + (+s[0].split(':')[1]);
          var em = (+e[1].split(':')[0]) * 60 + (+e[1].split(':')[1]);
          var ongoing = isToday && curMin >= sm && curMin <= em;
          var lessonCount = c.end - c.start + 1;
          var metaHtml = '';
          if (c.position) metaHtml += '<span>📍 ' + escHtml(c.position) + '</span>';
          if (c.teacher) metaHtml += '<span>🧑‍🏫 ' + escHtml(c.teacher) + '老师' + (/老师|教授$/.test(c.teacher) ? '' : '') + '</span>';
          if (!metaHtml) metaHtml = '<span style="opacity:.55;">教室 / 教师信息待补充，点卡片编辑</span>';
          html += '<div class="lesson-card' + (ongoing ? ' ongoing' : '') + ' anim-fade-in-up stagger-' + Math.min(i + 1, 5) + '" data-id="' + c.id + '">' +
            '<div class="lesson-strip" style="background:' + (c.color || '#0A6EFF') + ';"></div>' +
            '<div class="lesson-time"><div class="lesson-no">第' + c.start + (c.end > c.start ? '-' + c.end : '') + '节</div>' +
            '<div class="lesson-clock">' + s[0] + '<br>' + e[1] + '</div>' +
            (c.end > c.start ? '<div class="lesson-dur">共' + lessonCount + '节</div>' : '') +
            '</div>' +
            '<div class="lesson-body"><div class="lesson-name">' + escHtml(c.name) + (ongoing ? '<span class="lesson-live">进行中</span>' : '') + '</div>' +
            '<div class="lesson-meta">' + metaHtml + '</div>' +
            (c.remark ? '<div class="lesson-remark">📝 ' + escHtml(c.remark) + '</div>' : '') +
            '</div></div>';
        });
        document.getElementById('lessonList').innerHTML = html;
        document.querySelectorAll('.lesson-card').forEach(function (card) {
          card.addEventListener('click', function () { openEdit(this.dataset.id); });
        });
      }

      function renderDay() {
        renderDayChips();
        renderNowCard();
        renderLessons();
      }

      // ---- 月历 ----
      function renderCalendar() {
        var y = calCursor.y, m = calCursor.m;
        document.getElementById('calMonth').textContent = y + ' 年 ' + (m + 1) + ' 月';
        var wd = ['日', '一', '二', '三', '四', '五', '六'];
        var html = '';
        wd.forEach(function (w) { html += '<div class="sch-cal-wd">' + w + '</div>'; });
        var firstWd = new Date(y, m, 1).getDay();
        var daysInMonth = new Date(y, m + 1, 0).getDate();
        var prevDays = new Date(y, m, 0).getDate();
        var total = firstWd + daysInMonth;
        var cells = Math.ceil(total / 7) * 7;
        var allCourses = Storage.lifeGetCourses();
        var busyWeekdays = {};
        allCourses.forEach(function (c) { busyWeekdays[c.weekday] = true; });

        for (var i = 0; i < cells; i++) {
          var dayNum, muted = false, cellY = y, cellM = m;
          if (i < firstWd) {
            dayNum = prevDays - firstWd + i + 1;
            cellM = m - 1; if (cellM < 0) { cellM = 11; cellY = y - 1; }
            muted = true;
          } else if (i >= total) {
            dayNum = i - total + 1;
            cellM = m + 1; if (cellM > 11) { cellM = 0; cellY = y + 1; }
            muted = true;
          } else {
            dayNum = i - firstWd + 1;
          }
          var dObj = new Date(cellY, cellM, dayNum);
          var isToday = sameDay(dObj, today);
          var isSel = sameDay(dObj, selectedDate);
          var busy = !muted && busyWeekdays[weekdayOf(dObj)];
          html += '<div class="sch-cal-day' + (muted ? ' muted' : '') + (isToday ? ' today' : '') + (isSel ? ' selected' : '') + '" data-y="' + cellY + '" data-m="' + cellM + '" data-d="' + dayNum + '">' +
            '<span>' + dayNum + '</span><div class="sch-cal-dots">' + (busy ? '<i></i>' : '') + '</div></div>';
        }
        document.getElementById('calGrid').innerHTML = html;
        document.querySelectorAll('.sch-cal-day').forEach(function (el) {
          el.addEventListener('click', function () {
            selectedDate = midnight(new Date(+this.dataset.y, +this.dataset.m, +this.dataset.d));
            calCursor = { y: selectedDate.getFullYear(), m: selectedDate.getMonth() };
            switchView('day');
            renderDay();
          });
        });
        var n = coursesOfDay(selectedDate).length;
        document.getElementById('calTip').innerHTML =
          '<span><b>' + (selectedDate.getMonth() + 1) + '月' + selectedDate.getDate() + '日</b> · 周' + DAYS[weekdayOf(selectedDate) - 1] + (n ? ' 有 ' + n + ' 门课' : ' 无课') + '</span>' +
          '<span style="color:var(--color-text-hint);">点日期跳到当天</span>';
      }

      function switchView(mode) {
        viewMode = mode;
        document.getElementById('viewDay').classList.toggle('on', mode === 'day');
        document.getElementById('viewMonth').classList.toggle('on', mode === 'month');
        document.getElementById('paneDay').style.display = mode === 'day' ? 'block' : 'none';
        document.getElementById('paneMonth').style.display = mode === 'month' ? 'block' : 'none';
        if (mode === 'month') renderCalendar();
      }
      document.getElementById('viewDay').addEventListener('click', function () { switchView('day'); });
      document.getElementById('viewMonth').addEventListener('click', function () { switchView('month'); });
      document.getElementById('calPrev').addEventListener('click', function () {
        var d = new Date(calCursor.y, calCursor.m - 1, 1); calCursor = { y: d.getFullYear(), m: d.getMonth() }; renderCalendar();
      });
      document.getElementById('calNext').addEventListener('click', function () {
        var d = new Date(calCursor.y, calCursor.m + 1, 1); calCursor = { y: d.getFullYear(), m: d.getMonth() }; renderCalendar();
      });
      document.getElementById('btnBackToday').addEventListener('click', function () {
        selectedDate = midnight(new Date());
        calCursor = { y: selectedDate.getFullYear(), m: selectedDate.getMonth() };
        renderDay();
      });

      // =========================================================
      // 导入
      // =========================================================
      document.getElementById('btnImport').addEventListener('click', function () {
        document.getElementById('importText').value = '';
        document.getElementById('importXlsFile').value = '';
        document.getElementById('importPreview').style.display = 'none';
        pendingImport = null;
        openSheet(importSheet);
      });
      document.getElementById('btnPickFile').addEventListener('click', function () {
        document.getElementById('importFile').click();
      });
      document.getElementById('importFile').addEventListener('change', function () {
        var file = this.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          document.getElementById('importText').value = String(reader.result || '').slice(0, 20000);
          previewImport();
        };
        reader.readAsText(file, 'utf-8');
      });
      document.getElementById('importText').addEventListener('input', previewImport);
      function previewImport() {
        var text = document.getElementById('importText').value.trim();
        var pv = document.getElementById('importPreview');
        if (!text) { pv.style.display = 'none'; pendingImport = null; return; }
        showPreview(parseSchedule(text), 'JSON ');
      }
      document.getElementById('btnPickXls').addEventListener('click', function () {
        document.getElementById('importXlsFile').click();
      });
      document.getElementById('importXlsFile').addEventListener('change', function () {
        var file = this.files[0];
        if (!file) return;
        var btn = document.getElementById('btnPickXls');
        var oldText = btn.textContent;
        btn.textContent = '解析中…';
        loadSheetJs(function () {
          var reader = new FileReader();
          reader.onload = function (e) {
            try {
              var wb = XLSX.read(e.target.result, { type: 'array' });
              var ws = wb.Sheets[wb.SheetNames[0]];
              var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
              showPreview(parseXlsxRows(rows), '表格 ');
            } catch (err) {
              showPreview({ error: '文件解析失败：' + (err && err.message ? err.message : '格式不正确') });
            }
            btn.textContent = oldText;
            document.getElementById('importXlsFile').value = '';
          };
          reader.onerror = function () {
            btn.textContent = oldText;
            document.getElementById('importXlsFile').value = '';
            App.toast('文件读取失败，请重试');
          };
          reader.readAsArrayBuffer(file);
        });
      });
      document.getElementById('importSubmit').addEventListener('click', function () {
        if (!pendingImport) { App.toast('请先选择文件或粘贴 JSON'); return; }
        Storage.lifeSaveCourses(pendingImport);
        closeAll();
        App.toastSuccess('成功导入 ' + pendingImport.length + ' 门课程');
        selectedDate = today;
        calCursor = { y: today.getFullYear(), m: today.getMonth() };
        renderDay();
      });
      document.getElementById('btnClearAll').addEventListener('click', function () {
        App.showModal({
          title: '清空课表',
          desc: '将删除本机全部课程，且不可恢复',
          confirmText: '清空',
          onConfirm: function () {
            Storage.lifeSaveCourses([]);
            closeAll();
            App.toast('课表已清空');
            renderDay();
            if (viewMode === 'month') renderCalendar();
          },
        });
      });

      // =========================================================
      // 手动加课 / 编辑 / 删除
      // =========================================================
      var secOpts = '';
      for (var i = 1; i <= 10; i++) secOpts += '<option value="' + i + '">第' + i + '节</option>';
      document.getElementById('addStart').innerHTML = secOpts;
      document.getElementById('addEnd').innerHTML = secOpts;

      function resetAddForm(weekday) {
        editingId = null;
        document.getElementById('addSheetTitle').textContent = '手动添加课程';
        document.getElementById('addName').value = '';
        document.getElementById('addRoom').value = '';
        document.getElementById('addTeacher').value = '';
        document.getElementById('addRemark').value = '';
        document.getElementById('addWeekday').value = String(weekday || weekdayOf(selectedDate));
        document.getElementById('addStart').value = '1';
        document.getElementById('addEnd').value = '2';
        document.getElementById('addDelete').style.display = 'none';
      }

      document.getElementById('btnAdd').addEventListener('click', function () {
        resetAddForm();
        openSheet(addSheet);
      });

      window.openEdit = function (id) {
        var c = Storage.lifeGetCourses().filter(function (x) { return x.id === id; })[0];
        if (!c) return;
        editingId = id;
        document.getElementById('addSheetTitle').textContent = '编辑课程';
        document.getElementById('addName').value = c.name;
        document.getElementById('addRoom').value = c.position || '';
        document.getElementById('addTeacher').value = c.teacher || '';
        document.getElementById('addRemark').value = c.remark || '';
        document.getElementById('addWeekday').value = String(c.weekday);
        document.getElementById('addStart').value = String(c.start);
        document.getElementById('addEnd').value = String(c.end);
        document.getElementById('addDelete').style.display = 'block';
        openSheet(addSheet);
      };

      document.getElementById('addSubmit').addEventListener('click', function () {
        var name = document.getElementById('addName').value.trim();
        if (!name) { App.toast('请填写课程名称'); return; }
        var start = parseInt(document.getElementById('addStart').value, 10);
        var end = parseInt(document.getElementById('addEnd').value, 10);
        if (end < start) end = start;
        var data = {
          name: name,
          weekday: parseInt(document.getElementById('addWeekday').value, 10),
          start: start, end: end,
          position: document.getElementById('addRoom').value.trim(),
          teacher: document.getElementById('addTeacher').value.trim(),
          remark: document.getElementById('addRemark').value.trim(),
        };
        if (editingId) {
          var list = Storage.lifeGetCourses();
          list.forEach(function (c) {
            if (c.id === editingId) {
              c.name = data.name.slice(0, 20);
              c.weekday = data.weekday;
              c.start = data.start;
              c.end = data.end;
              c.position = data.position;
              c.teacher = data.teacher;
              c.remark = data.remark.slice(0, 30);
            }
          });
          Storage.lifeSaveCourses(list);
          closeAll();
          App.toastSuccess('已保存修改');
        } else {
          var existing = Storage.lifeGetCourses().length;
          data.color = COLORS[existing % COLORS.length];
          var res = Storage.lifeAddCourse(data);
          if (!res.success) { App.toast(res.message || '添加失败'); return; }
          closeAll();
          App.toastSuccess('课程已添加');
        }
        selectedDate = (function () {
          var d = midnight(new Date());
          // 跳到所选星期的本周日期
          var mon = mondayOf(today);
          mon.setDate(mon.getDate() + (data.weekday - 1));
          return mon;
        })();
        calCursor = { y: selectedDate.getFullYear(), m: selectedDate.getMonth() };
        if (viewMode === 'month') renderCalendar(); else renderDay();
      });

      document.getElementById('addDelete').addEventListener('click', function () {
        if (!editingId) return;
        var list = Storage.lifeGetCourses().filter(function (c) { return c.id !== editingId; });
        Storage.lifeSaveCourses(list);
        closeAll();
        App.toast('已删除这门课');
        renderDay();
        if (viewMode === 'month') renderCalendar();
      });

      App.initPullToRefresh(document.getElementById('mainContent'), function () {
        if (viewMode === 'month') renderCalendar(); else renderDay();
        App.toastSuccess('已刷新');
        return Promise.resolve();
      });

      renderDay();
      // 每 30 秒刷新「正在上 / 下一节」
      nowTimer = setInterval(function () { if (viewMode === 'day' && sameDay(selectedDate, today)) { renderNowCard(); renderLessons(); } }, 30000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && viewMode === 'day') { renderNowCard(); renderLessons(); }
      });

      App.showGuide('schedule', {
        emoji: '📅',
        title: '课程表 · 新手指引',
        items: [
          '课程按星期与今天真实日期自动匹配，不再有第 1-15 周',
          '顶部可切换「日视图 / 月历」，月历里点日期直达当天',
          '支持 XLS / XLSX 矩阵课表与贝蒂 JSON 导入',
          '点课程卡片可编辑或删除',
        ],
      });
    })();
  </script>
</body>
</html>
