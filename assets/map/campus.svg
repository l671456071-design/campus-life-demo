<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <!-- ===== Clean campus map ===== -->
  <!-- Background -->
  <rect width="100" height="100" fill="#EEF0F3"/>

  <!-- Roads (clean white) -->
  <rect x="0" y="47" width="100" height="6" fill="#FFFFFF"/>
  <rect x="53" y="0" width="6" height="100" fill="#FFFFFF"/>
  <rect x="0" y="22" width="53" height="4" fill="#FFFFFF"/>
  <rect x="19" y="22" width="4" height="25" fill="#FFFFFF"/>
  <rect x="73" y="53" width="4" height="25" fill="#FFFFFF"/>
  <rect x="0" y="76" width="100" height="4" fill="#FFFFFF"/>
  <rect x="53" y="80" width="6" height="20" fill="#FFFFFF"/>

  <!-- Road center lines (subtle dashed) -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#DDE2E8" stroke-width="0.15" stroke-dasharray="0.8 1"/>
  <line x1="56" y1="0" x2="56" y2="100" stroke="#DDE2E8" stroke-width="0.15" stroke-dasharray="0.8 1"/>

  <!-- ===== Buildings (gray-blue rounded rectangles) ===== -->
  <!-- 教学楼A -->
  <rect x="5" y="5" width="16" height="13" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="13" y="13" font-size="2.6" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">教学楼A</text>

  <!-- 图书馆 -->
  <rect x="28" y="5" width="18" height="14" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="37" y="13" font-size="2.8" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">图书馆</text>

  <!-- 北区宿舍 -->
  <rect x="65" y="6" width="22" height="14" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="76" y="14" font-size="2.6" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">北区宿舍</text>

  <!-- 教学楼B -->
  <rect x="88" y="5" width="10" height="12" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="93" y="12" font-size="2.2" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">教学楼B</text>

  <!-- 紫荆公寓 -->
  <rect x="41" y="27" width="18" height="14" rx="1.2" fill="#BAC6D2" stroke="#8B9BB0" stroke-width="0.2"/>
  <text x="50" y="35" font-size="2.6" text-anchor="middle" fill="#334155" font-family="sans-serif" font-weight="600">紫荆公寓</text>

  <!-- 西门服务区 -->
  <rect x="9" y="35" width="18" height="11" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="18" y="42" font-size="2.6" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">西门服务区</text>

  <!-- 东门服务区 -->
  <rect x="62" y="50" width="18" height="13" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="71" y="58" font-size="2.6" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">东门服务区</text>

  <!-- 食堂 -->
  <rect x="62" y="63" width="18" height="11" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="71" y="70" font-size="3" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">食堂</text>

  <!-- 丁香公寓 -->
  <rect x="26" y="64" width="18" height="13" rx="1.2" fill="#BAC6D2" stroke="#8B9BB0" stroke-width="0.2"/>
  <text x="35" y="72" font-size="2.6" text-anchor="middle" fill="#334155" font-family="sans-serif" font-weight="600">丁香公寓</text>

  <!-- 体育馆 -->
  <rect x="5" y="82" width="14" height="12" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="12" y="89" font-size="2.4" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">体育馆</text>

  <!-- 南门商业街 -->
  <rect x="46" y="82" width="14" height="11" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="53" y="89" font-size="2.4" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">南门商业街</text>

  <!-- 行政楼 -->
  <rect x="62" y="82" width="14" height="12" rx="1.2" fill="#CDD5DF" stroke="#9CA8B8" stroke-width="0.2"/>
  <text x="69" y="89" font-size="2.4" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="500">行政楼</text>

  <!-- ===== Static location pins ===== -->
  <!-- Red pin on 教学楼A -->
  <g transform="translate(13,5)">
    <ellipse cx="0" cy="1.3" rx="1" ry="0.3" fill="#000" opacity="0.08"/>
    <path d="M0,-2.5 C-1.2,-2.5 -1.2,-0.3 0,1 C1.2,-0.3 1.2,-2.5 0,-2.5 Z" fill="#EF4444" stroke="#fff" stroke-width="0.2"/>
    <circle cx="0" cy="-1.2" r="0.5" fill="#fff"/>
  </g>

  <!-- Blue pin on 图书馆 -->
  <g transform="translate(37,5)">
    <ellipse cx="0" cy="1.3" rx="1" ry="0.3" fill="#000" opacity="0.08"/>
    <path d="M0,-2.5 C-1.2,-2.5 -1.2,-0.3 0,1 C1.2,-0.3 1.2,-2.5 0,-2.5 Z" fill="#2563EB" stroke="#fff" stroke-width="0.2"/>
    <circle cx="0" cy="-1.2" r="0.5" fill="#fff"/>
  </g>

  <!-- Blue pin on 食堂 -->
  <g transform="translate(71,63)">
    <ellipse cx="0" cy="1.3" rx="1" ry="0.3" fill="#000" opacity="0.08"/>
    <path d="M0,-2.5 C-1.2,-2.5 -1.2,-0.3 0,1 C1.2,-0.3 1.2,-2.5 0,-2.5 Z" fill="#2563EB" stroke="#fff" stroke-width="0.2"/>
    <circle cx="0" cy="-1.2" r="0.5" fill="#fff"/>
  </g>

  <!-- Gate labels -->
  <text x="1.5" y="49" font-size="2" fill="#94A3B8" font-family="sans-serif">西门</text>
  <text x="95" y="49" font-size="2" fill="#94A3B8" font-family="sans-serif">东门</text>
  <text x="54" y="3" font-size="2" fill="#94A3B8" font-family="sans-serif">北门</text>
  <text x="54" y="99" font-size="2" fill="#94A3B8" font-family="sans-serif">南门</text>
</svg>
