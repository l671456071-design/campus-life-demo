<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>个人主页 - 校园生活</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== 极简纯展示型主页：单焦点 · 大留白 · 单色调 ===== */
    .mh-hero { text-align:center; padding:34px 16px 8px; }
    .mh-hero-avatar { width:96px; height:96px; margin:0 auto; }
    .mh-hero-name { font-size:22px; font-weight:800; color:var(--color-text); margin-top:16px; letter-spacing:.5px; }
    .mh-hero-id { font-size:12px; color:var(--color-text-hint); margin-top:5px; font-family:var(--font-mono); }
    .mh-hero-dorm { font-size:12.5px; color:var(--color-text-sub); margin-top:6px; }
    .mh-edit-btn { display:inline-flex; align-items:center; gap:6px; margin-top:20px; border:1px solid var(--color-primary); color:var(--jb-edit,var(--color-primary)); background:transparent; border-radius:99px; padding:9px 26px; font-size:14px; font-weight:600; transition:all .2s; }
    .mh-edit-btn:active { background:rgba(59,130,246,.1); }

    .mh-wrap { padding:0 16px; }
    .mh-section { margin-top:26px; }

    /* 快递动态：两列大数字，无框呼吸感 */
    .mh-stat { display:flex; align-items:stretch; padding:20px 8px; }
    .mh-stat-cell { flex:1; text-align:center; text-decoration:none; display:block; }
    .mh-stat-cell + .mh-stat-cell { border-left:1px solid var(--color-border-light); }
    .mh-stat-num { font-size:32px; font-weight:800; color:var(--color-primary); line-height:1.1; font-family:var(--font-mono); }
    .mh-stat-label { font-size:12.5px; color:var(--color-text-sub); margin-top:7px; }
    .mh-stat-cell:active .mh-stat-num { opacity:.65; }

    /* 相册入口：单行，点进编辑页管理 */
    .mh-album { display:flex; align-items:center; gap:12px; padding:14px 16px; text-decoration:none; }
    .mh-album:active { background:var(--color-surface-alt); }
    .mh-album-cover { width:52px; height:52px; border-radius:14px; object-fit:cover; background:var(--color-surface-alt); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; overflow:hidden; }
    .mh-album-cover img { width:100%; height:100%; object-fit:cover; }
    .mh-album-main { flex:1; min-width:0; }
    .mh-album-title { font-size:15px; font-weight:700; color:var(--color-text); }
    .mh-album-sub { font-size:12px; color:var(--color-text-hint); margin-top:3px; }
    .mh-album-arrow { color:var(--color-text-hint); flex-shrink:0; }
  </style>
</head>
<body data-page="myhome">
  <div class="app-shell">
    <header class="app-header header--left">
      <div class="header-left">
        <a href="profile.html" class="header-back-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
      <div class="header-title">个人主页</div>
      <div class="header-spacer"></div>
      <div class="header-right" style="width:32px;"></div>
    </header>

    <main class="app-content" style="padding-bottom:calc(32px + env(safe-area-inset-bottom));">
      <!-- 本屏唯一视觉焦点：身份 -->
      <section class="mh-hero anim-fade-in-up">
        <div class="mh-hero-avatar" id="avatarPreview"></div>
        <div class="mh-hero-name" id="mhName">校园用户</div>
        <div class="mh-hero-id" id="mhId">ID：--</div>
        <div class="mh-hero-dorm" id="mhDorm"></div>
        <a href="profile-edit.html" class="mh-edit-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          编辑资料
        </a>
      </section>

      <div class="mh-wrap">
        <!-- 快递动态：数据化 -->
        <section class="mh-section anim-fade-in-up stagger-1">
          <div class="section-header"><span class="section-title">快递动态</span></div>
          <div class="card mh-stat">
            <a class="mh-stat-cell" href="packages.html">
              <div class="mh-stat-num" id="statPending">0</div>
              <div class="mh-stat-label">待取件</div>
            </a>
            <a class="mh-stat-cell" href="packages.html?filter=incoming">
              <div class="mh-stat-num" id="statIncoming">0</div>
              <div class="mh-stat-label">运输中</div>
            </a>
          </div>
        </section>

        <!-- 相册入口（管理功能在编辑页） -->
        <section class="mh-section anim-fade-in-up stagger-2">
          <div class="section-header"><span class="section-title">我的相册</span></div>
          <a class="card mh-album" href="profile-edit.html#album">
            <div class="mh-album-cover" id="albumCover">🖼️</div>
            <div class="mh-album-main">
              <div class="mh-album-title">照片墙</div>
              <div class="mh-album-sub" id="albumSub">还没有照片</div>
            </div>
            <svg class="mh-album-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
        </section>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    // ---- 纯展示渲染：头像 / 名字 / ID / 宿舍 ----
    function renderIdentity() {
      var user = Storage.getUser();
      document.getElementById('avatarPreview').innerHTML = App.avatarHtml(user, 96);
      document.getElementById('mhName').textContent = user.name || '校园用户';
      document.getElementById('mhId').textContent = 'ID：' + Storage.getUserId();
      var dorm = Storage.getUserDorm();
      var parts = [];
      if (dorm) {
        if (dorm.areaName) parts.push(dorm.areaName);
        if (dorm.building) parts.push(dorm.building);
        if (dorm.room) parts.push(dorm.room + '室');
      }
      document.getElementById('mhDorm').textContent = parts.join(' · ');
    }

    // ---- 快递动态数字 ----
    function renderStats() {
      var pkgs = Storage.getPackages();
      var pending = pkgs.filter(function (p) { return p.status === 'pending'; }).length;
      var incoming = pkgs.filter(function (p) { return p.status === 'incoming'; }).length;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statIncoming').textContent = incoming;
    }

    // ---- 相册入口：首图 + 数量 ----
    function renderAlbumEntry() {
      var album = Storage.lifeGetAlbum();
      var cover = document.getElementById('albumCover');
      var sub = document.getElementById('albumSub');
      if (album.length) {
        cover.innerHTML = '<img src="' + album[0].src + '" alt="相册封面" loading="lazy">';
        sub.textContent = album.length + ' / 30 张照片';
      } else {
        cover.innerHTML = '🖼️';
        sub.textContent = '还没有照片';
      }
    }

    renderIdentity();
    renderStats();
    renderAlbumEntry();
    App.showGuide('myhome', {
      emoji: '🏠',
      title: '个人空间 · 新手指引',
      items: [
        '这里是纯展示主页，点「编辑资料」修改头像与信息',
        '快递动态实时统计待取件与运输中数量，点数字可直达',
        '相册只保留入口，照片管理在编辑页中进行',
      ],
    });
  </script>
</body>
</html>
