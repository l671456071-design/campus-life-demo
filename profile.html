<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>个人中心 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    .stat-link {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s;
      padding: 4px 0;
    }
    .stat-link:active { transform: scale(0.92); }
    .fav-points {
      display: none;
    }
    .fav-points.show { display: block; }
    .fav-point-item {
      padding: 12px 16px;
      border-top: 1px solid var(--color-border-light);
    }
    .fav-point-item:active { background: var(--color-surface-alt); }
    .logout-btn {
      color: var(--color-danger);
      border-color: var(--color-danger-light);
    }
    .logout-btn:active {
      background: var(--color-danger-light);
    }
    .menu-divider {
      height: 8px;
      background: var(--color-bg);
    }
    .fav-arrow {
      transition: transform 0.3s ease;
    }
    .fav-arrow.rotated {
      transform: rotate(180deg);
    }
    .nav-btn-sm {
      flex-shrink: 0;
    }
    .nav-btn-sm:active { transform: scale(0.95); }
  </style>
</head>
<body data-page="profile">
  <div class="app-shell">
    <header class="app-header">
      <div class="header-left" style="width:32px;"></div>
      <div class="header-title">个人中心</div>
      <div class="header-right" style="width:32px;"></div>
    </header>
    <main class="app-content" id="mainContent">
      <div style="padding: 16px;">
        <!-- 用户信息卡片 -->
        <div class="card anim-fade-in-up" style="background: linear-gradient(135deg, #2563EB, #1D4ED8); color:#fff; margin-bottom:16px; position:relative; overflow:hidden;">
          <svg style="position:absolute; right:-20px; top:-20px; width:120px; height:120px; opacity:0.1;" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
          <div style="display:flex; align-items:center; gap:12px;">
            <div id="userAvatarBox" style="flex-shrink:0;"></div>
            <div style="flex:1; min-width:0;">
              <div style="font-size:18px; font-weight:700;" id="userName">校园用户</div>
              <div style="font-size:13px; opacity:0.85; margin-top:2px;" id="userStudentId">学号：--</div>
              <div style="font-size:13px; opacity:0.85;" id="userCampus">&nbsp;</div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-around; margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.15);">
            <a href="packages.html" class="stat-link">
              <div style="font-size:24px; font-weight:800;" id="statPending">0</div>
              <div style="font-size:12px; opacity:0.85;">待取</div>
            </a>
            <a href="records.html" class="stat-link">
              <div style="font-size:24px; font-weight:800;" id="statPicked">0</div>
              <div style="font-size:12px; opacity:0.85;">已取</div>
            </a>
            <a href="messages.html" class="stat-link">
              <div style="font-size:24px; font-weight:800;" id="statUnread">0</div>
              <div style="font-size:12px; opacity:0.85;">未读</div>
            </a>
          </div>
        </div>

        <!-- 功能菜单列表 -->
        <div class="card" style="padding:0; overflow:hidden; margin-bottom:16px;">
          <div class="list-item anim-fade-in-up stagger-1" onclick="location.href='packages.html'">
            <div class="list-item-icon" style="background:var(--color-primary-light);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">我的快递</div>
            </div>
            <span class="text-sub text-sm" id="menuPending">0件待取</span>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-2" onclick="location.href='records.html'">
            <div class="list-item-icon" style="background:var(--color-accent-light);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">取件记录</div>
            </div>
            <span class="text-sub text-sm" id="menuPicked">0件</span>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-3" onclick="location.href='messages.html'">
            <div class="list-item-icon" style="background:var(--color-warning-light);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">消息通知</div>
            </div>
            <span class="badge badge-danger" id="menuUnread">0</span>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>

        <div class="card" style="padding:0; overflow:hidden; margin-bottom:16px;">
          <div class="list-item anim-fade-in-up stagger-1" onclick="toggleFavoritePoints()">
            <div class="list-item-icon" style="background:var(--color-success-light);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">常用取件点</div>
            </div>
            <div class="list-item-arrow fav-arrow" id="favArrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
          <div class="fav-points" id="favPoints"></div>
          <div class="list-item anim-fade-in-up stagger-2" style="border-top:1px solid var(--color-border-light);" onclick="location.href='profile-edit.html'">
            <div class="list-item-icon" style="background:var(--color-primary-light);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">个人信息</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-3" onclick="location.href='settings.html'">
            <div class="list-item-icon" style="background:var(--color-surface-alt);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-sub)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">设置</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-4" style="border-top:1px solid var(--color-border-light);" onclick="showShareModal()">
            <div class="list-item-icon" style="background:var(--color-primary-light);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">分享我的作品</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>

        <!-- 退出登录按钮 -->
        <button class="btn btn-block btn-outline logout-btn anim-fade-in-up stagger-4" onclick="showLogoutModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          退出登录
        </button>
      </div>
    </main>
    <nav class="tab-bar">
      <a href="index.html" class="tab-item" data-nav="home">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1m-6 0h6"/></svg>
        <span class="tab-label">首页</span>
      </a>
      <a href="packages.html" class="tab-item" data-nav="packages">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span class="tab-label">快递</span>
      </a>
      <a href="scan.html" class="tab-item tab-item--center" data-nav="scan">
        <div class="tab-scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </div>
        <span class="tab-label">扫码</span>
      </a>
      <a href="food.html" class="tab-item" data-nav="food">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        <span class="tab-label">外卖</span>
      </a>
      <a href="profile.html" class="tab-item" data-nav="profile">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>
  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    var favExpanded = false;

    function initProfilePage() {
      renderUserInfo();
      renderStats();
      renderFavoritePoints();
    }

    // 用户信息与统计全部来自 localStorage（Storage 数据层）
    function renderUserInfo() {
      var user = Storage.getUser();
      document.getElementById('userAvatarBox').innerHTML = App.avatarHtml(user, 48, 'rgba(255,255,255,0.25)', '#fff');
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userStudentId').textContent = '学号：' + user.studentId;
      document.getElementById('userCampus').textContent = user.campus;
    }

    function renderStats() {
      var pending = Storage.getPackages().filter(function (p) { return p.status === 'pending'; }).length;
      var user = Storage.getUser();
      var unread = Storage.getUnreadCount();
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statPicked').textContent = user.pickedCount || 0;
      document.getElementById('statUnread').textContent = unread;
      document.getElementById('menuPending').textContent = pending + '件待取';
      document.getElementById('menuPicked').textContent = (user.pickedCount || 0) + '件';
      var menuUnread = document.getElementById('menuUnread');
      menuUnread.textContent = unread;
      menuUnread.style.display = unread > 0 ? '' : 'none';
    }

    function renderFavoritePoints() {
      var html = '';
      DB.favoritePoints.forEach(function (p) {
        html += '<div class="fav-point-item">' +
          '<div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">' +
            '<div style="flex:1; min-width:0;">' +
              '<div class="font-semibold text-sm">' + p.name + '</div>' +
              '<div class="text-sub text-sm" style="margin-top:2px;">' + p.address + ' · ' + p.distance + '</div>' +
            '</div>' +
            '<a href="map.html" class="btn btn-outline btn-sm nav-btn-sm">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>' +
              '导航' +
            '</a>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('favPoints').innerHTML = html;
    }

    function toggleFavoritePoints() {
      favExpanded = !favExpanded;
      var list = document.getElementById('favPoints');
      var arrow = document.getElementById('favArrow');
      if (favExpanded) {
        list.classList.add('show');
        arrow.classList.add('rotated');
      } else {
        list.classList.remove('show');
        arrow.classList.remove('rotated');
      }
    }

    function showLogoutModal() {
      // demo 模式：退出登录改为“重置演示数据”
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        App.showModal({
          title: '重置演示数据',
          desc: '将清空您在本浏览器中的演示操作记录（取件、订单等），恢复初始演示数据。不会影响其他访问者。',
          icon: 'warning',
          confirmText: '确认重置',
          cancelText: '取消',
          onConfirm: function () {
            var settings = Storage.getSettings();
            Storage.resetAll();
            Storage.saveSettings(settings);
            location.href = 'index.html';
          }
        });
        return;
      }
      App.showModal({
        title: '退出登录',
        desc: '确定要退出登录吗？退出后需要重新验证身份。',
        icon: 'warning',
        confirmText: '确认退出',
        cancelText: '取消',
        onConfirm: function () {
          if (typeof ApiClient !== 'undefined' && ApiClient.getToken()) {
            ApiClient.logout();
          }
          // 清除用户数据和快递数据，但保留设置（主题/通知）
          var settings = Storage.getSettings();
          Storage.resetAll();
          Storage.saveSettings(settings);
          location.href = 'login.html';
        }
      });
    }

    // ---- 分享我的作品 ----
    function getShareUrl() {
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.shareUrl) return APP_CONFIG.shareUrl;
      return location.origin + location.pathname;
    }

    function showShareModal() {
      var url = getShareUrl();
      var name = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.productName) || '校园智能生活 App';
      var intro = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.productIntro) || '校园快递 + 扫码取件 + 外卖 + 3D 地图';
      var desc = '<div style="text-align:left;line-height:1.9;">' +
        '<div style="font-weight:700;font-size:16px;color:var(--color-text);">' + name + '</div>' +
        '<div style="font-size:13px;color:var(--color-text-sub);margin-top:4px;">' + intro + '</div>' +
        '<div style="font-size:12px;color:var(--color-text-hint);margin-top:10px;word-break:break-all;background:var(--color-surface-alt);border-radius:8px;padding:8px 10px;">' + url + '</div>' +
        '</div>';
      if (navigator.share) {
        App.showModal({
          title: '分享我的作品',
          desc: desc,
          actions: [
            { label: '分享给好友', style: 'btn-outline', onClick: function () { App.closeModal(); shareToFriend(url, name, intro); } },
            { label: '复制体验链接', style: 'btn-primary', onClick: function () { App.closeModal(); copyShareLink(url); } },
          ]
        });
      } else {
        App.showModal({
          title: '分享我的作品',
          desc: desc,
          confirmText: '复制体验链接',
          cancelText: '关闭',
          onConfirm: function () { copyShareLink(url); }
        });
      }
    }

    function copyShareLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          App.toastSuccess('体验链接已复制，快去分享吧');
        }).catch(function () { fallbackCopy(url); });
      } else {
        fallbackCopy(url);
      }
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); App.toastSuccess('体验链接已复制，快去分享吧'); }
      catch (e) { App.toast('复制失败，请长按链接手动复制'); }
      document.body.removeChild(ta);
    }

    function shareToFriend(url, title, text) {
      if (navigator.share) {
        navigator.share({ title: title, text: text, url: url }).catch(function () { /* 用户取消分享 */ });
      } else {
        copyShareLink(url);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      initProfilePage();
      // demo 模式：退出登录按钮改为重置演示数据
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        var btn = document.querySelector('.logout-btn');
        if (btn) btn.lastChild.textContent = ' 重置演示数据';
      }
    });
  </script>
</body>
</html>
