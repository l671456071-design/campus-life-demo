<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>个人中心 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    .stat-link {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s;
      padding: 4px 0;
    }
    .stat-link:active { transform: scale(0.92); }
    .logout-btn {
      color: var(--color-danger);
      border-color: var(--color-danger-light);
    }
    .logout-btn:active {
      background: var(--color-danger-light);
    }
    .menu-divider {
      height: 8px;
      background: var(--color-bg);
    }

    /* 个人卡片：背景图交叉淡入 + 头像过渡 */
    .profile-bg-layer {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity .55s ease;
      border-radius: inherit;
    }
    .profile-content-slot { position: relative; z-index: 1; }
    #userAvatarBox, #userAvatarBox img { transition: opacity .35s ease, transform .35s ease; }
    #userAvatarBox { display: inline-block; }
    .profile-foot span { overflow: hidden; text-overflow: ellipsis; }

    /* v7 个人中心：120px 居中头像 · 数据卡片 · AI 入口（单色调大留白） */
    .hero-card {
      background: linear-gradient(140deg, #2563EB, #1D4ED8);
      color: #fff;
      border-radius: 24px;
      padding: 24px 16px 20px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(37, 99, 235, .24);
      text-align: center;
    }
    .hero-avatar-wrap {
      position: relative;
      display: inline-block;
      width: 120px; height: 120px;
      border-radius: 50%;
      text-decoration: none;
      padding: 0; border: none; background: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-avatar-wrap:active { transform: scale(.96); }
    .hero-avatar-wrap::before {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, .55);
      pointer-events: none;
    }
    #userAvatarBox { display: block; width: 120px; height: 120px; }
    #userAvatarBox img, #userAvatarBox > div { width: 120px !important; height: 120px !important; }
    /* 右下角相机角标：点明「点头像直接换」 */
    .hero-avatar-chevron {
      position: absolute; right: 2px; bottom: 2px;
      width: 30px; height: 30px; border-radius: 50%;
      background: #fff; color: #2563EB;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .25);
      pointer-events: none;
    }
    .hero-name { font-size: 20px; font-weight: 800; margin-top: 14px; }
    .hero-id { font-size: 11.5px; opacity: .85; margin-top: 4px; font-family: var(--font-mono); }
    .hero-foot {
      margin: 10px auto 0;
      max-width: 100%;
      font-size: 12.5px; opacity: .92;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      white-space: nowrap; overflow: hidden;
      text-decoration: none; color: inherit;
    }
    .hero-foot:active { opacity: .75; }
    .hero-foot span { overflow: hidden; text-overflow: ellipsis; }

    /* 作者二维码弹窗 */
    .qr-modal { text-align: center; }
    .qr-modal-img {
      width: 220px; height: 220px;
      margin: 4px auto 10px; border-radius: 14px;
      border: 1px solid var(--color-border-light);
      display: block; object-fit: contain; background: #fff;
    }
    .qr-modal-tip { font-size: 12.5px; color: var(--color-text-sub); line-height: 1.7; }
    .qr-modal-fallback {
      width: 220px; height: 220px; margin: 4px auto 10px;
      border-radius: 14px; border: 1px dashed var(--color-border);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; color: var(--color-text-hint); font-size: 12.5px; line-height: 1.7;
      background: var(--color-surface-alt);
    }

    /* 数据统计卡片 */
    .stat-card {
      display: flex;
      background: var(--color-surface);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 16px 4px;
      margin-bottom: 12px;
    }
    .stat-link {
      flex: 1; text-align: center; text-decoration: none;
      color: var(--color-text);
      transition: transform 0.15s;
    }
    .stat-link + .stat-link { border-left: 1px solid var(--color-border-light); }
    .stat-link:active { transform: scale(0.94); }
    .stat-num { font-size: 22px; font-weight: 800; color: var(--color-primary); line-height: 1.2; }
    .stat-num .stat-unit { font-size: 12px; font-weight: 600; color: var(--color-text-sub); margin-left: 1px; }
    .stat-label { font-size: 12px; color: var(--color-text-sub); margin-top: 3px; }
    .stat-badge {
      display: none;
      position: absolute; top: -4px; right: calc(50% - 34px);
      min-width: 17px; height: 17px; padding: 0 5px;
      border-radius: 999px; background: var(--color-danger); color: #fff;
      font-size: 10.5px; font-weight: 700; line-height: 17px;
    }
    .stat-link { position: relative; }
    .stat-badge.show { display: inline-block; }

    /* AI 助手入口 */
    .ai-entry {
      display: flex; align-items: center; gap: 12px;
      background: var(--color-primary-lighter, #EFF6FF);
      border: 1.5px solid rgba(37, 99, 235, .18);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      text-decoration: none;
      transition: transform .15s;
    }
    .ai-entry:active { transform: scale(0.98); }
    .ai-entry-ic {
      width: 42px; height: 42px; border-radius: 14px; flex: none;
      background: linear-gradient(135deg, #2563EB, #60A5FA);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(37, 99, 235, .3);
    }
    .ai-entry-ic svg { width: 21px; height: 21px; }
    .ai-entry-main { flex: 1; min-width: 0; }
    .ai-entry-title { font-size: 15px; font-weight: 700; color: var(--color-primary); }
    .ai-entry-sub { font-size: 12px; color: #3B6FC4; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ai-entry-arrow { color: var(--color-primary); flex: none; }
  </style>
</head>
<body data-page="profile">
  <div class="app-shell">
    <header class="app-header header--left">
      <div class="header-title">个人中心</div>
      <div class="header-spacer"></div>
      <div class="header-right" style="width:32px;"></div>
    </header>
    <main class="app-content" id="mainContent">
      <div style="padding: 16px;">
        <!-- 用户信息卡片：120px 头像居中（每个用户数据ID唯一，用于甄别数据） -->
        <div class="hero-card anim-fade-in-up" id="profileCard">
          <!-- 背景图层：切换相册背景时与默认渐变交叉淡入 -->
          <div class="profile-bg-layer" id="profileBgLayer"></div>
          <svg style="position:absolute; right:-20px; top:-20px; width:110px; height:110px; opacity:0.09; z-index:0;" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
          <!-- DIY 背景入口：从相册选图自定义卡片背景 -->
          <button id="bgEditBtn" style="position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; border:none; z-index:2;" title="自定义卡片背景">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <div class="profile-content-slot">
            <button type="button" class="hero-avatar-wrap" onclick="openAvatarSheet()" title="更换头像" aria-label="更换头像">
              <div id="userAvatarBox"></div>
              <span class="hero-avatar-chevron">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </span>
            </button>
            <div class="hero-name" id="userName">校园用户</div>
            <div class="hero-id" id="userIdRow">ID：--</div>
            <a class="hero-foot" href="profile-edit.html" title="编辑校区与宿舍">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span id="userFoot">校区 / 宿舍未设置，点击填写</span>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.8;"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
        </div>

        <!-- DIY 背景相册选择（隐藏 input） -->
        <input type="file" id="cardBgInput" accept="image/*" style="display:none;">
        <!-- 头像相册选择（隐藏 input，个人卡片直接换，不用再进个人空间） -->
        <input type="file" id="avatarInput" accept="image/*" style="display:none;">

        <!-- 数据统计卡片：待取 / 已取 / 未读 -->
        <div class="stat-card anim-fade-in-up stagger-1">
          <a href="packages.html" class="stat-link">
            <span class="stat-badge" id="statPendingBadge"></span>
            <div class="stat-num"><span id="statPending">0</span><span class="stat-unit">件</span></div>
            <div class="stat-label">待取快递</div>
          </a>
          <a href="records.html" class="stat-link">
            <div class="stat-num"><span id="statPicked">0</span><span class="stat-unit">件</span></div>
            <div class="stat-label">累计已取</div>
          </a>
          <a href="messages.html" class="stat-link">
            <span class="stat-badge" id="statUnreadBadge"></span>
            <div class="stat-num"><span id="statUnread">0</span><span class="stat-unit">条</span></div>
            <div class="stat-label">未读消息</div>
          </a>
        </div>

        <!-- AI 校园助手入口 -->
        <a href="ai.html" class="ai-entry anim-fade-in-up stagger-2">
          <span class="ai-entry-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.7 5.1L19 10l-5.3 1.9L12 17l-1.7-5.1L5 10l5.3-1.9z"/><path d="M19 15l.7 2.1L22 18l-2.3.9L19 21l-.7-2.1L16 18l2.3-.9z"/></svg>
          </span>
          <span class="ai-entry-main">
            <span class="ai-entry-title" style="display:block;">AI 校园助手</span>
            <span class="ai-entry-sub" style="display:block;">查快递 · 问路线 · 课程提醒，一问便知</span>
          </span>
          <span class="ai-entry-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
        </a>

        <div class="card" style="padding:0; overflow:hidden; margin-bottom:16px;">
          <div class="list-item anim-fade-in-up stagger-1" onclick="location.href='profile-edit.html'">
            <div class="list-item-icon" style="background:var(--color-primary-light);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">编辑资料</div>
              <div class="text-sub" style="font-size:11px;">姓名 · 校区 · 宿舍 · 头像相册</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-2" style="border-top:1px solid var(--color-border-light);" onclick="location.href='settings.html'">
            <div class="list-item-icon" style="background:var(--color-surface-alt);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-sub)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">设置</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>

        <!-- 联系作者 / 关于 / 反馈 -->
        <div class="card" style="padding:0; overflow:hidden; margin-bottom:16px;">
          <div class="list-item anim-fade-in-up stagger-1" onclick="showWechatModal()">
            <div class="list-item-icon" style="background:#DCFCE7;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">加作者微信</div>
              <div class="text-sub" style="font-size:11px;">探讨这个项目的问题，直接私聊我</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-2" style="border-top:1px solid var(--color-border-light);" onclick="showDonateModal()">
            <div class="list-item-icon" style="background:#FEF3C7;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">请作者喝咖啡</div>
              <div class="text-sub" style="font-size:11px;">这个 App 帮到你的话，请我喝杯 ☕</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-3" style="border-top:1px solid var(--color-border-light);" onclick="location.href='about.html'">
            <div class="list-item-icon" style="background:#DBEAFE;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">关于我们</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="list-item anim-fade-in-up stagger-4" style="border-top:1px solid var(--color-border-light);" onclick="location.href='feedback.html'">
            <div class="list-item-icon" style="background:#FEE2E2;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div class="list-item-body">
              <div class="list-item-title">反馈建议</div>
            </div>
            <div class="list-item-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>

        <!-- 退出登录按钮 -->
        <button class="btn btn-block btn-outline logout-btn anim-fade-in-up stagger-4" onclick="showLogoutModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          退出登录
        </button>
      </div>
    </main>
    <nav class="tab-bar">
      <a href="index.html" class="tab-item" data-nav="home">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1m-6 0h6"/></svg>
        <span class="tab-label">首页</span>
      </a>
      <a href="packages.html" class="tab-item" data-nav="packages">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span class="tab-label">快递</span>
      </a>
      <a href="scan.html" class="tab-item tab-item--center" data-nav="scan">
        <div class="tab-scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </div>
        <span class="tab-label">扫码</span>
      </a>
      <a href="food.html" class="tab-item" data-nav="food">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        <span class="tab-label">外卖</span>

      <a href="profile.html" class="tab-item" data-nav="profile">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

  <script src="config.js"></script>
  <script src="campus-data.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    function initProfilePage() {
      renderUserInfo();
      renderStats();
      initCardBg();
      initAvatarPicker();
    }

    // —— 个人卡片 DIY 背景（相册选图，压缩后存 user.cardBg）——
    // 背景通过独立图层 opacity 交叉淡入，避免直接切 background 生硬跳变
    function renderCardBg() {
      var user = Storage.getUser();
      var layer = document.getElementById('profileBgLayer');
      if (user.cardBg) {
        layer.style.backgroundImage = 'linear-gradient(rgba(15,23,42,.42), rgba(15,23,42,.62)), url("' + user.cardBg + '")';
        layer.style.opacity = '1';
      } else {
        layer.style.opacity = '0';
      }
    }

    function showCardBgModal() {
      var user = Storage.getUser();
      var actions = [
        { label: '从相册选择', style: 'btn-primary', onClick: function () { document.getElementById('cardBgInput').click(); } }
      ];
      if (user.cardBg) {
        actions.push({ label: '恢复默认', style: 'btn-outline', onClick: function () {
          var u = Storage.getUser(); delete u.cardBg; Storage.saveUser(u); renderCardBg(); App.toastSuccess('已恢复默认背景');
        } });
      }
      App.showModal({
        title: '自定义卡片背景',
        desc: '从相册选择一张喜欢的照片作为个人卡片背景，图片会压缩后保存在本机。',
        actions: actions
      });
    }

    function initCardBg() {
      renderCardBg();
      document.getElementById('bgEditBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        showCardBgModal();
      });
      document.getElementById('cardBgInput').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        App.compressImage(file, 1080, 0.72).then(function (dataUrl) {
          var u = Storage.getUser();
          u.cardBg = dataUrl;
          try {
            Storage.saveUser(u);
            renderCardBg();
            App.toastSuccess('背景已更新');
          } catch (err) {
            App.toast('存储空间不足，请换一张小一点的图片');
          }
        }).catch(function () { App.toast('图片处理失败，请换一张试试'); });
        e.target.value = '';
      });
    }

    // 用户信息与统计全部来自 localStorage（Storage 数据层）
    function renderUserInfo() {
      var user = Storage.getUser();
      // 120px 居中大头像（点相机角标直接在本卡更换），替换时淡出淡入平滑过渡
      var box = document.getElementById('userAvatarBox');
      box.style.opacity = '0';
      setTimeout(function () {
        box.innerHTML = App.avatarHtml(user, 120, 'rgba(255,255,255,0.35)', '#fff');
        box.style.opacity = '1';
      }, 140);
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userIdRow').textContent = 'ID：' + Storage.getUserId();
      // 宿舍信息全个人中心只保留这一处（点击进编辑资料修改），避免多处重复
      var parts = [];
      if (user.campus) parts.push(user.campus);
      var dorm = Storage.getUserDorm();
      if (dorm) parts.push('宿舍 ' + dorm.areaName + ' ' + dorm.building + (dorm.room ? ' ' + dorm.room : ''));
      document.getElementById('userFoot').textContent = parts.length
        ? parts.join(' · ')
        : '校区 / 宿舍未设置，点击填写';
    }

    // —— 头像直接在个人卡片更换（相册选图 → 压缩 400px → 本机保存）——
    function openAvatarSheet() {
      var user = Storage.getUser();
      var actions = [
        { label: '从相册选择头像', style: 'btn-primary', onClick: function () { document.getElementById('avatarInput').click(); } }
      ];
      if (user.avatar) {
        actions.push({ label: '恢复默认头像', style: 'btn-outline', onClick: function () {
          var u = Storage.getUser();
          u.avatar = null;
          Storage.saveUser(u);
          renderUserInfo();
          App.toastSuccess('已恢复默认头像');
        } });
      }
      App.showModal({
        title: '更换头像',
        desc: '从相册选一张照片，自动压缩成 400px 头像，只保存在本机。',
        actions: actions
      });
    }

    function initAvatarPicker() {
      document.getElementById('avatarInput').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (file.type.indexOf('image/') !== 0) { App.toast('请选择图片文件'); return; }
        App.compressImage(file, 400, 0.82).then(function (dataUrl) {
          var u = Storage.getUser();
          u.avatar = { type: 'image', data: dataUrl };
          try {
            Storage.saveUser(u);
            renderUserInfo();
            App.toastSuccess('头像已更换');
          } catch (err) {
            App.toast('存储空间不足，请换一张小一点的图片');
          }
        }).catch(function () { App.toast('图片处理失败，请换一张试试'); });
      });
    }

    // —— 作者二维码弹窗（微信私聊 / 微信收款）——
    // 图片由作者手动放入 assets/images/，缺失时显示兜底卡片，不出现裂图
    function showQrModal(cfg) {
      App.showModal({
        title: cfg.title,
        confirmText: '保存二维码到相册',
        cancelText: '关闭',
        desc:
          '<div class="qr-modal">' +
            '<img class="qr-modal-img" src="' + cfg.src + '" alt="二维码" ' +
              'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
            '<div class="qr-modal-fallback">📷<div>二维码图片还没放入项目目录<br>' + cfg.src + '</div></div>' +
            '<div class="qr-modal-tip">' + cfg.tip + '</div>' +
          '</div>',
        onConfirm: function () {
          // 同源静态图：触发浏览器下载/保存；移动端也可直接在弹窗里长按图片保存
          var a = document.createElement('a');
          a.href = cfg.src;
          a.download = cfg.file;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { App.toast('若未弹出保存，请长按二维码图片保存'); }, 400);
        },
      });
    }
    function showWechatModal() {
      showQrModal({
        title: '加作者微信私聊',
        src: 'assets/images/wechat-qr.png',
        file: 'wechat-qr.png',
        tip: '想探讨这个项目的问题、报 bug 或提想法？<br>微信扫码加我，直接私聊 🛠️<br>（手机端也可长按二维码 → 识别图中二维码）',
      });
    }
    function showDonateModal() {
      showQrModal({
        title: '请作者喝咖啡',
        src: 'assets/images/donate-qr.png',
        file: 'donate-qr.png',
        tip: '如果这个 App 帮你省下了排队找件的时间，<br>欢迎微信扫码请我喝杯咖啡 ☕ 谢谢支持！<br>（手机端也可长按二维码 → 识别图中二维码）',
      });
    }

    function renderStats() {
      var pending = Storage.getPackages().filter(function (p) { return p.status === 'pending'; }).length;
      var user = Storage.getUser();
      var unread = Storage.getUnreadCount();
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statPicked').textContent = user.pickedCount || 0;
      document.getElementById('statUnread').textContent = unread;
      var pBadge = document.getElementById('statPendingBadge');
      var uBadge = document.getElementById('statUnreadBadge');
      if (pending > 0) { pBadge.textContent = pending; pBadge.classList.add('show'); }
      if (unread > 0) { uBadge.textContent = unread; uBadge.classList.add('show'); }
    }

    function showLogoutModal() {
      // demo 模式：退出登录改为“重置演示数据”
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        App.showModal({
          title: '重置演示数据',
          desc: '将清空您在本浏览器中的演示操作记录（取件、订单等），恢复初始演示数据。不会影响其他访问者。',
          icon: 'warning',
          confirmText: '确认重置',
          cancelText: '取消',
          onConfirm: function () {
            var settings = Storage.getSettings();
            Storage.resetAll();
            Storage.saveSettings(settings);
            location.href = 'index.html';
          }
        });
        return;
      }
      App.showModal({
        title: '退出登录',
        desc: '确定要退出登录吗？退出后需要重新验证身份。',
        icon: 'warning',
        confirmText: '确认退出',
        cancelText: '取消',
        onConfirm: function () {
          if (typeof ApiClient !== 'undefined' && ApiClient.getToken()) {
            ApiClient.logout();
          }
          // 清除用户数据和快递数据，但保留设置（主题/通知）
          var settings = Storage.getSettings();
          Storage.resetAll();
          Storage.saveSettings(settings);
          location.href = 'login.html';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      initProfilePage();
      // demo 模式：退出登录按钮改为重置演示数据
      if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.isDemo) {
        var btn = document.querySelector('.logout-btn');
        if (btn) btn.lastChild.textContent = ' 重置演示数据';
      }
    });
  </script>
</body>
</html>
