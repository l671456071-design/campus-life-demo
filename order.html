<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>我的订单 - 校园外卖</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* ===== Order Page Styles ===== */
    .mode-tabs {
      display: flex; gap: 6px; margin: 12px 16px 0;
      background: var(--color-surface-alt);
      border-radius: var(--radius-md); padding: 4px;
    }
    .mode-tab {
      flex: 1; padding: 8px 0; text-align: center;
      font-size: 13px; font-weight: 600; color: var(--color-text-sub);
      border-radius: var(--radius-sm); border: none;
      transition: all 0.2s;
    }
    .mode-tab.active { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); }

    .panel { display: none; }
    .panel.active { display: block; }

    .order-card {
      padding: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .order-head { display: flex; align-items: center; gap: 10px; }
    .order-shop-logo {
      width: 40px; height: 40px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .order-shop-name { font-size: 15px; font-weight: 700; color: var(--color-text); }
    .order-time { font-size: 11px; color: var(--color-text-hint); margin-top: 2px; }
    .order-status {
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .order-status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .st-unpaid { color: #B45309; }
    .st-preparing { color: var(--color-warning); }
    .st-delivering { color: var(--color-primary); }
    .st-completed { color: var(--color-accent); }
    .order-items { display: flex; gap: 6px; margin: 10px 0 2px; flex-wrap: wrap; }
    .order-items .it-emoji {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: var(--color-surface-alt);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .order-items-text { font-size: 12px; color: var(--color-text-sub); margin-top: 6px; }
    .order-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--color-border);
    }
    .order-total { font-size: 15px; font-weight: 800; color: var(--color-text); }
    .order-total .n { font-family: var(--font-mono); color: #E4423A; }
    .order-actions { display: flex; gap: 8px; }
    .order-actions .btn { padding: 7px 14px; font-size: 12px; }

    /* 配送进度条 */
    .order-progress { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
    .op-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--color-text-hint); }
    .op-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-border); }
    .op-step.done .op-dot { background: var(--color-accent); }
    .op-step.done { color: var(--color-accent); font-weight: 600; }
    .op-line { flex: 1.5; height: 2px; background: var(--color-border); border-radius: 1px; margin-bottom: 14px; }
    .op-line.done { background: var(--color-accent); }

    /* ===== 结算面板 ===== */
    .addr-card {
      display: flex; align-items: center; gap: 10px;
      padding: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }
    .addr-card:active { transform: scale(0.99); }
    .addr-card svg { width: 18px; height: 18px; color: var(--color-primary); flex-shrink: 0; }
    .addr-card .a-body { flex: 1; min-width: 0; }
    .addr-card .a-line1 { font-size: 14px; font-weight: 700; color: var(--color-text); }
    .addr-card .a-line2 { font-size: 12px; color: var(--color-text-sub); margin-top: 2px; }
    .addr-card .a-arrow { color: var(--color-text-hint); flex-shrink: 0; }

    .co-section-title {
      display: flex; align-items: center; gap: 6px;
      margin: 18px 4px 10px;
      font-size: 14px; font-weight: 700; color: var(--color-text);
    }
    .co-section-title::before { content: ''; display: block; width: 4px; height: 14px; border-radius: 2px; background: var(--color-primary); }

    .co-card {
      padding: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .co-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
    .co-item + .co-item { border-top: 1px solid var(--color-border-light); }
    .co-item .it-emoji { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--color-surface-alt); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
    .co-item .it-name { flex: 1; min-width: 0; font-size: 13px; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .co-item .it-qty { font-size: 12px; color: var(--color-text-hint); flex-shrink: 0; font-family: var(--font-mono); }
    .co-item .it-price { font-size: 13px; font-weight: 700; color: var(--color-text); flex-shrink: 0; font-family: var(--font-mono); }

    .fee-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--color-text-sub); padding: 6px 0; }
    .fee-row.cut span:last-child { color: #E4423A; font-weight: 600; }
    .fee-row.total { border-top: 1px dashed var(--color-border); margin-top: 6px; padding-top: 10px; font-size: 15px; font-weight: 800; color: var(--color-text); }
    .fee-row.total .n { color: #E4423A; font-family: var(--font-mono); font-size: 18px; }

    .ship-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .ship-row + .ship-row { border-top: 1px solid var(--color-border-light); }
    .ship-icon { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--color-primary-lighter); color: var(--color-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ship-icon svg { width: 17px; height: 17px; }
    .ship-body { flex: 1; }
    .ship-name { font-size: 13px; font-weight: 600; color: var(--color-text); }
    .ship-sub { font-size: 11px; color: var(--color-text-sub); margin-top: 1px; }
    .ship-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--color-border); flex-shrink: 0; position: relative; }
    .ship-row.selected .ship-check { border-color: var(--color-primary); background: var(--color-primary); }
    .ship-row.selected .ship-check::after {
      content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #fff;
    }

    /* 支付方式 */
    .pay-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; }
    .pay-row + .pay-row { border-top: 1px solid var(--color-border-light); }
    .pay-icon {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; color: #fff;
    }
    .pay-icon--wechat { background: #1AAD19; }
    .pay-icon--alipay { background: #1677FF; }
    .pay-icon--cod { background: var(--color-text-hint); }
    .pay-body { flex: 1; }
    .pay-name { font-size: 13px; font-weight: 600; color: var(--color-text); }
    .pay-sub { font-size: 11px; color: var(--color-text-sub); margin-top: 1px; }
    .pay-row.selected .pay-check { border-color: var(--color-primary); background: var(--color-primary); }
    .pay-check {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--color-border); flex-shrink: 0; position: relative;
    }
    .pay-row.selected .pay-check::after {
      content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #fff;
    }

    .note-input {
      width: 100%; border: none; outline: none;
      background: var(--color-surface-alt);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      font-size: 13px; color: var(--color-text);
      font-family: var(--font-body);
    }
    .note-input::placeholder { color: var(--color-text-hint); }

    /* 底部提交栏 */
    .submit-bar {
      position: fixed; left: 12px; right: 12px;
      bottom: calc(var(--tab-bar-h) + env(safe-area-inset-bottom, 0px) + 10px);
      height: 52px;
      background: var(--color-text);
      border-radius: var(--radius-full);
      display: flex; align-items: center;
      padding: 0 6px 0 18px; gap: 10px;
      z-index: 90;
      box-shadow: var(--shadow-xl);
    }
    .submit-bar .sum { flex: 1; color: #fff; }
    .submit-bar .sum .t { font-size: 17px; font-weight: 800; font-family: var(--font-mono); }
    .submit-bar .sum .t::before { content: '¥'; font-size: 12px; }
    .submit-bar .sum .s { font-size: 10px; color: rgba(255,255,255,0.55); margin-top: 1px; }
    .submit-bar .go-submit {
      height: 40px; padding: 0 24px; border: none; border-radius: var(--radius-full);
      background: var(--color-warning); color: #fff;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .submit-bar .go-submit:active { transform: scale(0.95); }
  </style>
</head>
<body data-page="food">

  </div>

  <!-- 结算提交栏 -->
  <div class="submit-bar" id="submitBar" style="display:none;">
    <div class="sum">
      <div class="t" id="submitTotal">0</div>
      <div class="s" id="submitSub">合计</div>
    </div>
    <button class="go-submit" onclick="submitOrder()">提交订单</button>
  </div>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var initialCheckout = params.get('checkout') === '1';
      var syncTimer = null;

      function money(n) {
        var v = Math.round(n * 100) / 100;
        return v % 1 === 0 ? String(v) : v.toFixed(v * 10 % 1 === 0 ? 1 : 2);
      }

      function fmtTime(ts) {
        var d = new Date(ts);
        var pad = function (n) { return (n < 10 ? '0' : '') + n; };
        return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      // ---------- 模式切换 ----------
      window.switchMode = function (mode) {
        var isCheckout = mode === 'checkout';
        document.getElementById('tabOrders').classList.toggle('active', !isCheckout);
        document.getElementById('tabCheckout').classList.toggle('active', isCheckout);
        document.getElementById('panelOrders').classList.toggle('active', !isCheckout);
        document.getElementById('panelCheckout').classList.toggle('active', isCheckout);
        document.getElementById('submitBar').style.display = isCheckout ? 'flex' : 'none';
        if (isCheckout) renderCheckout(); else renderOrders();
      };

      // ---------- 订单列表 ----------
      function orderCard(o, index) {
        var stagger = index < 6 ? ' stagger-' + (index + 1) : '';
        var statusText = Storage.ORDER_STATUS[o.status] || o.status;
        var itemsText = (o.items || []).map(function (it) { return it.name + '×' + it.qty; }).join('、');
        var emojis = (o.items || []).slice(0, 4).map(function (it) {
          return '<span class="it-emoji">' + (it.emoji || '🍽️') + '</span>';
        }).join('');

        // 进度：待支付(0) → 制作中(1) → 配送中(2) → 已完成(3)
        var stepIdx = { unpaid: 0, preparing: 1, delivering: 2, completed: 3 }[o.status] || 0;
        var progressHtml =
          '<div class="order-progress">' +
            '<span class="op-step' + (stepIdx >= 0 && o.status !== 'unpaid' ? ' done' : '') + '"><span class="op-dot"></span>已下单</span>' +
            '<span class="op-line' + (stepIdx >= 1 ? ' done' : '') + '"></span>' +
            '<span class="op-step' + (stepIdx >= 1 ? ' done' : '') + '"><span class="op-dot"></span>制作中</span>' +
            '<span class="op-line' + (stepIdx >= 2 ? ' done' : '') + '"></span>' +
            '<span class="op-step' + (stepIdx >= 2 ? ' done' : '') + '"><span class="op-dot"></span>配送中</span>' +
            '<span class="op-line' + (stepIdx >= 3 ? ' done' : '') + '"></span>' +
            '<span class="op-step' + (stepIdx >= 3 ? ' done' : '') + '"><span class="op-dot"></span>已完成</span>' +
          '</div>';

        var actionsHtml = '';
        if (o.status === 'unpaid') {
          actionsHtml += '<button class="btn btn-primary" onclick="payNow(\'' + o.id + '\')">去支付</button>';
        }
        if (o.status === 'preparing') {
          actionsHtml += '<button class="btn btn-outline" onclick="showProgressToast(\'' + o.id + '\')">制作中 · ' + (o.etaMinutes || 20) + '分钟送达</button>';
        }
        if (o.status === 'delivering') {
          actionsHtml += '<button class="btn btn-outline" onclick="showProgressToast(\'' + o.id + '\')">预计 ' + (o.etaMinutes || 20) + ' 分钟送达</button>' +
                        '<button class="btn btn-primary" onclick="location.href=\'map.html?mode=delivery&orderId=' + o.id + '\'">查看配送位置</button>';
        }

        return '<div class="order-card anim-fade-in-up' + stagger + '">' +
          '<div class="order-head">' +
            '<div class="order-shop-logo" style="background:' + (o.restaurantColor || '#FEF3C7') + '22;">' + (o.restaurantEmoji || '🍽️') + '</div>' +
            '<div style="flex:1;min-width:0;">' +
              '<div class="order-shop-name">' + o.restaurantName + '</div>' +
              '<div class="order-time">' + fmtTime(o.createdAt) + ' · ' + (o.itemCount || 0) + ' 件商品' + (o.payMethodLabel ? ' · ' + o.payMethodLabel : '') + '</div>' +
            '</div>' +
            '<span class="order-status st-' + o.status + '"><span class="dot"></span>' + statusText + '</span>' +
          '</div>' +
          (emojis ? '<div class="order-items">' + emojis + '</div>' : '') +
          (itemsText ? '<div class="order-items-text">' + itemsText + '</div>' : '') +
          (o.note ? '<div class="order-items-text">备注：' + o.note + '</div>' : '') +
          progressHtml +
          '<div class="order-foot">' +
            '<span class="order-total">合计 <span class="n">¥' + money(o.total) + '</span></span>' +
            '<div class="order-actions">' + actionsHtml + '</div>' +
          '</div>' +
        '</div>';
      }

      function renderOrders() {
        var orders = Storage.syncOrderStatuses();
        var listEl = document.getElementById('orderList');
        if (!orders.length) {
          listEl.innerHTML = App.emptyState('暂无外卖订单', '去外卖页逛逛，发现校园美味');
          return;
        }
        var html = '';
        orders.forEach(function (o, i) { html += orderCard(o, i); });
        listEl.innerHTML = html;
        scheduleSync();
      }

      // 有进行中订单时每 5 秒刷新一次状态
      function scheduleSync() {
        clearTimeout(syncTimer);
        var orders = Storage.getOrders();
        var hasActive = orders.some(function (o) { return o.status !== 'completed'; });
        if (hasActive) {
          syncTimer = setTimeout(renderOrders, 5000);
        }
      }

      window.showProgressToast = function (id) {
        var o = Storage.getOrder(id);
        if (!o) return;
        var labels = { preparing: '商家正在制作中，请稍候', delivering: '骑手配送中，预计 ' + (o.etaMinutes || 20) + ' 分钟送达' };
        App.toast(labels[o.status] || '订单处理中');
      };

      // ---------- 模拟支付 ----------
      window.payNow = function (id) {
        var payMethod = 'wechat'; // 订单列表中支付时默认微信支付
        var order = Storage.getOrder(id);
        if (order && order.payMethod) payMethod = order.payMethod;
        var label = { wechat: '微信支付', alipay: '支付宝', cod: '货到付款' }[payMethod] || '微信支付';
        App.showLoading(label + '中...');
        API.payOrder(id, payMethod).then(function (res) {
          App.hideLoading();
          if (res.data.success) {
            App.toastSuccess(label + '成功，商家开始备餐');
            renderOrders();
          } else {
            App.toast(res.data.message || '支付失败');
          }
        });
      };

      // ---------- 结算面板 ----------
      function renderCheckout() {
        var summary = Storage.getCartSummary();
        var body = document.getElementById('checkoutBody');
        var bar = document.getElementById('submitBar');
        if (!summary.itemCount || !summary.restaurant) {
          body.innerHTML = App.emptyState('购物车是空的', '先去挑点好吃的吧');
          bar.style.display = 'none';
          return;
        }
        bar.style.display = 'flex';
        var r = summary.restaurant;
        var addr = Storage.getDefaultAddress();
        var itemsHtml = '';
        Storage.getCart().items.forEach(function (it) {
          itemsHtml += '<div class="co-item">' +
            '<span class="it-emoji">' + (it.emoji || '🍽️') + '</span>' +
            '<span class="it-name">' + it.name + '</span>' +
            '<span class="it-qty">x' + it.qty + '</span>' +
            '<span class="it-price">¥' + money(it.price * it.qty) + '</span>' +
          '</div>';
        });
        body.innerHTML =
          // 收货地址
          '<div class="addr-card anim-fade-in-up">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
            '<div class="a-body">' +
              '<div class="a-line1">' + addr.name + ' ' + addr.phone + '</div>' +
              '<div class="a-line2">' + addr.text + '</div>' +
            '</div>' +
            '<svg class="a-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</div>' +

          // 店铺 + 商品
          '<div class="co-section-title anim-fade-in-up">' + (r.emoji || '🍽️') + ' ' + r.name + ' · 商品清单</div>' +
          '<div class="co-card anim-fade-in-up">' + itemsHtml + '</div>' +

          // 配送方式
          '<div class="co-section-title anim-fade-in-up">配送方式</div>' +
          '<div class="co-card anim-fade-in-up">' +
            '<div class="ship-row selected">' +
              '<div class="ship-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/><path d="M5 18H3a2 2 0 0 1-2-2v-2h18l-2.34-6.34A2 2 0 0 0 14.76 6H3v4h13"/></svg></div>' +
              '<div class="ship-body"><div class="ship-name">校园骑手配送</div><div class="ship-sub">约 ' + r.deliveryTime + ' 分钟送达 · 配送费 ' + (summary.deliveryFee === 0 ? '免配送费' : '¥' + money(summary.deliveryFee)) + '</div></div>' +
              '<div class="ship-check"></div>' +
            '</div>' +
            '<div class="ship-row" style="opacity:0.45;">' +
              '<div class="ship-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>' +
              '<div class="ship-body"><div class="ship-name">到店自取</div><div class="ship-sub">开发中 · 敬请期待</div></div>' +
              '<div class="ship-check"></div>' +
            '</div>' +
          '</div>' +

          // 备注
          '<div class="co-section-title anim-fade-in-up">订单备注</div>' +
          '<input class="note-input anim-fade-in-up" id="noteInput" maxlength="50" placeholder="口味偏好、放行位置等（选填）">' +

          // 支付方式
          '<div class="co-section-title anim-fade-in-up">支付方式</div>' +
          '<div class="co-card anim-fade-in-up" style="margin-bottom:8px;">' +
            '<div class="pay-row selected" data-pay="wechat" onclick="selectPayMethod(\'wechat\')">' +
              '<div class="pay-icon pay-icon--wechat">' +
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.1 3.56 2.82 4.63L4 17l2.76-1.46c.84.21 1.74.32 2.74.32l.51-.01a4.55 4.55 0 0 1-.21-1.34c0-3.04 2.91-5.5 6.5-5.5l.5.01C16.13 6.13 13.16 4 9.5 4zm-2.27 4.7a.94.94 0 1 1 0-1.88.94.94 0 0 1 0 1.88zm4.55 0a.94.94 0 1 1 0-1.88.94.94 0 0 1 0 1.88zM22 14.5c0-2.49-2.49-4.5-5.5-4.5S11 12.01 11 14.5 13.49 19 16.5 19c.71 0 1.42-.13 2.07-.37L20.5 20l-.55-1.62C21.21 17.41 22 16.02 22 14.5zm-7-1.06a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4zm3.5 0a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4z"/></svg>' +
              '</div>' +
              '<div class="pay-body"><div class="pay-name">微信支付</div><div class="pay-sub">推荐 · 模拟支付</div></div>' +
              '<div class="pay-check"></div>' +
            '</div>' +
            '<div class="pay-row" data-pay="alipay" onclick="selectPayMethod(\'alipay\')">' +
              '<div class="pay-icon pay-icon--alipay">' +
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14a3 3 0 0 1 3 3v8.6c-2.2.86-4.65 1.45-6.6 1.65.34.55.5 1.04.7 1.6.13.4.27.8.43 1.13 2.36-.46 4.4-1.15 5.47-1.78V18a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm3.13 7.65c0 1.62 1.43 2.95 3.18 2.95 1.46 0 2.55-.74 3.36-2.06.55.94 1.07 1.46 1.6 1.46.43 0 .88-.27.88-.7 0-.3-.27-.55-.6-.7-.4-.16-.85-.18-1.3-.18.3-.7.5-1.43.55-2.07h.9c.4 0 .55-.18.55-.45 0-.32-.18-.5-.55-.5h-.85c-.07-.85-.55-1.4-1.4-1.4-1.02 0-1.85.85-2.36 2.13-.4.93-.65 1.85-.65 2.7 0 .07 0 .14.02.21-.43.07-.86.1-1.3.1-1.27 0-2.16-.85-2.16-2.1 0-1.06.6-2.05 1.62-2.94.07.07.13.13.2.18.55.55 1.06.85 1.62.85.36 0 .7-.13.7-.46 0-.32-.32-.5-.78-.5-.4 0-.85.18-1.32.18-.43 0-.83-.18-1.27-.83-.07-.13-.13-.18-.13-.32 0-.32.27-.55.7-.55.18 0 .36.07.55.18.27.13.5.18.7.18.4 0 .78-.13.78-.55 0-.32-.32-.55-.78-.55-.36 0-.7.13-1.07.13-.5 0-.85-.18-1.13-.55-.07-.13-.13-.27-.13-.4 0-.32.27-.55.7-.55.18 0 .36.07.55.18.27.13.5.18.7.18.4 0 .78-.13.78-.55 0-.32-.32-.55-.78-.55-.36 0-.7.13-1.07.13-.5 0-.85-.18-1.13-.55-.07-.13-.13-.27-.13-.4 0-.32.27-.55.7-.55.18 0 .36.07.55.18.27.13.5.18.7.18.4 0 .78-.13.78-.55 0-.32-.32-.55-.78-.55z"/></svg>' +
              '</div>' +
              '<div class="pay-body"><div class="pay-name">支付宝</div><div class="pay-sub">模拟支付</div></div>' +
              '<div class="pay-check"></div>' +
            '</div>' +
            '<div class="pay-row" data-pay="cod" onclick="selectPayMethod(\'cod\')">' +
              '<div class="pay-icon pay-icon--cod">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
              '</div>' +
              '<div class="pay-body"><div class="pay-name">货到付款</div><div class="pay-sub">骑手送达后付款（模拟）</div></div>' +
              '<div class="pay-check"></div>' +
            '</div>' +
          '</div>' +

          // 费用明细
          '<div class="co-section-title anim-fade-in-up">费用明细</div>' +
          '<div class="co-card anim-fade-in-up" style="margin-bottom:80px;">' +
            '<div class="fee-row"><span>商品总价</span><span>¥' + money(summary.subtotal) + '</span></div>' +
            '<div class="fee-row"><span>配送费</span><span>' + (summary.deliveryFee === 0 ? '免配送费' : '¥' + money(summary.deliveryFee)) + '</span></div>' +
            (summary.discount ? '<div class="fee-row cut"><span>满减优惠</span><span>-¥' + money(summary.discount) + '</span></div>' : '') +
            '<div class="fee-row total"><span>应付合计</span><span class="n">¥' + money(summary.total) + '</span></div>' +
          '</div>';

        document.getElementById('submitTotal').textContent = money(summary.total);
        document.getElementById('submitSub').textContent = '共 ' + summary.itemCount + ' 件 · ' + r.name;
      }

      // ---- 支付方式选择 ----
      window.selectPayMethod = function (method) {
        var rows = document.querySelectorAll('.pay-row[data-pay]');
        rows.forEach(function (row) {
          if (row.dataset.pay === method) row.classList.add('selected');
          else row.classList.remove('selected');
        });
      };

      // 获取当前选中的支付方式（默认 wechat）
      function getSelectedPayMethod() {
        var sel = document.querySelector('.pay-row.selected[data-pay]');
        return sel ? sel.dataset.pay : 'wechat';
      }

      // ---------- 提交订单 ----------
      window.submitOrder = function () {
        var note = '';
        var noteEl = document.getElementById('noteInput');
        if (noteEl) note = noteEl.value.trim();
        var payMethod = getSelectedPayMethod();
        var payLabel = { wechat: '微信支付', alipay: '支付宝', cod: '货到付款' }[payMethod] || '微信支付';
        App.showLoading('提交订单中...');
        API.createOrder(null, note, { payMethod: payMethod }).then(function (res) {
          App.hideLoading();
          if (!res.data.success) {
            App.toast(res.data.message || '提交失败');
            return;
          }
          var order = res.data.order;
          App.showModal({
            icon: 'success',
            title: '下单成功',
            desc: '支付方式：' + payLabel + '\n订单已生成，可在订单列表中模拟支付',
            actions: [
              { label: '继续逛逛', style: 'btn-outline' },
              { label: '查看订单', style: 'btn-primary', onClick: function () { location.href = 'order.html'; } },
            ],
          });
        });
      };

      // ---------- 初始化 ----------
      if (initialCheckout) {
        var summary = Storage.getCartSummary();
        switchMode(summary.itemCount ? 'checkout' : 'orders');
        if (!summary.itemCount) App.toast('购物车是空的');
      } else {
        renderOrders();
      }

      // 页面从后台切回时刷新状态
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && document.getElementById('panelOrders').classList.contains('active')) {
          renderOrders();
        }
      });
    })();
  </script>
</body>
</html>
