<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>全部快递 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <style>
    /* 极简快递页：单色调 · 无框呼吸感 · 卡片只留决策信息 */
    .quick-action-icon.is-neutral { background:var(--color-surface-alt); color:var(--color-text-sub); }
    .pk-point { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--color-text-sub); margin-top:12px; }
    .pk-code-row { margin-top:12px; display:flex; align-items:center; gap:8px; }
    .pk-code-row .lab { font-size:12px; color:var(--color-text-hint); }
    /* 取件码高亮：蓝底圆角 pill，一眼锁定关键信息 */
    .pk-code-row .code {
      margin-left:auto; font-size:17px; font-weight:800; letter-spacing:2px;
      color:var(--color-primary-text, var(--color-primary)); font-family:var(--font-mono);
      background:var(--color-primary-light, rgba(37,99,235,.10));
      padding:4px 12px; border-radius:10px;
    }
    .pk-quick-btn { margin-top:12px; width:100%; border:none; border-radius:12px; background:var(--color-primary); color:#fff; font-size:14px; font-weight:700; padding:11px 0; cursor:pointer; transition:background .2s; }
    .pk-quick-btn:active { background:var(--color-primary-hover); }
    .pk-eta { margin-top:10px; font-size:12px; color:var(--color-text-sub); display:flex; gap:6px; align-items:center; }
    .pk-eta.warn { color:var(--color-warning); font-weight:600; }
    /* 手动录入表单：紧凑分组输入 */
    .imp-form { margin-top:12px; display:flex; flex-direction:column; gap:10px; text-align:left; }
    .imp-field { display:flex; flex-direction:column; gap:5px; }
    .imp-field > label { font-size:12px; color:var(--color-text-sub); font-weight:600; padding-left:2px; }
    .imp-field > label .req { color:var(--color-danger); margin-left:2px; }
    .imp-field input {
      width:100%; box-sizing:border-box;
      border:1.5px solid var(--color-border); border-radius:11px;
      padding:10px 12px; font-size:14.5px; color:var(--color-text);
      background:var(--color-surface-alt); outline:none;
      transition:border-color .15s;
    }
    .imp-field input:focus { border-color:var(--color-primary); }
    .imp-field input.code-input { font-weight:800; letter-spacing:1.5px; font-family:var(--font-mono); }
    .imp-err { font-size:12px; color:var(--color-danger); display:none; line-height:1.5; }
    .modal .imp-actions { margin-top:14px; }
  </style>
</head>
<body data-page="packages">
  <div class="app-shell">
    <header class="app-header header--left">
      <div class="header-title">全部快递</div>
      <div class="header-spacer"></div>
      <div class="header-right">
        <a href="messages.html" class="header-back-btn" style="position:relative;margin-right:6px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-dot" id="msgBadge" style="position:absolute;top:6px;right:6px;background:var(--color-danger);width:8px;height:8px;display:none;"></span>
        </a>
        <a href="scan.html" class="header-back-btn">

    <main class="app-content" id="mainContent">

        <div class="search-bar anim-fade-in-up" style="margin-bottom:14px;">

        </div>

        <!-- 快捷操作网格（原首页「校园取件」功能迁入） -->
        <div class="quick-grid">
          <a href="scan.html" class="quick-action quick-action--primary anim-fade-in-up stagger-1">
            <div class="quick-action-icon quick-action-icon--primary">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
            </div>
            <span class="quick-action-label quick-action-label--primary">扫码取件</span>
          </a>
          <a href="javascript:void(0)" class="quick-action anim-fade-in-up stagger-2" onclick="openImportPackage()">
            <div class="quick-action-icon is-neutral">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </div>
            <span class="quick-action-label">手动录入</span>
          </a>
          <a href="track.html" class="quick-action anim-fade-in-up stagger-3">
            <div class="quick-action-icon is-neutral">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            <span class="quick-action-label">查快递</span>
          </a>
          <a href="records.html" class="quick-action anim-fade-in-up stagger-4">
            <div class="quick-action-icon is-neutral">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <span class="quick-action-label">取件记录</span>
          </a>
        </div>

        <!-- 常用取件点（原首页区块迁入） -->
        <div style="margin-top:24px;" class="anim-fade-in-up stagger-3">
          <div class="section-header">
            <span class="section-title">常用取件点</span>
            <a href="map.html" class="section-link">查看地图
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
          <div id="pointsList" style="display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;"></div>
        </div>

        <!-- 全部快递 -->
        <div style="margin-top:24px;" class="anim-fade-in-up stagger-4">
          <div class="section-header">
            <span class="section-title">全部快递</span>
            <a href="javascript:void(0)" class="section-link" id="clearAllBtn" style="color:var(--color-danger);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              全部清零
            </a>
          </div>

          <!-- 筛选 chips -->
          <div class="filter-chips" id="filterChips" style="margin-top:12px;"></div>
        </div>

        <!-- 快递列表 -->
        <div id="pkgList" style="margin-top:16px;display:flex;flex-direction:column;gap:14px;"></div>
      </div>
    </main>
    <!-- 固定 tab bar —— 以下代码完全不可修改 -->
    <nav class="tab-bar">

        <span class="tab-label">首页</span>

      <a href="packages.html" class="tab-item" data-nav="packages">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </div>
        <span class="tab-label">扫码</span>

      <a href="food.html" class="tab-item" data-nav="food">

        <span class="tab-label">外卖</span>
      </a>
      <a href="profile.html" class="tab-item" data-nav="profile">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>
  <script src="config.js"></script>
  <script src="campus-data.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var mainContent = document.getElementById('mainContent');
      var listEl = document.getElementById('pkgList');
      var searchInput = document.getElementById('searchInput');
      var searchTimer = null;
      var isLoading = false;

      // 登录检查 + 从 API 加载真实快递数据
      if (ApiClient.isLoggedIn()) {
        ApiClient.getPackages().then(function (res) {
          if (res.code === 0 && res.data && res.data.length > 0) {
            var localList = Storage.getPackages();
            res.data.forEach(function (apiPkg) {
              var existing = localList.find(function (p) { return p.trackingNo === apiPkg.trackingNo; });
              if (existing) {
                Storage.updatePackage(existing.id, {
                  status: apiPkg.status,
                  company: apiPkg.company || existing.company,
                  pickupCode: apiPkg.pickupCode || existing.pickupCode,
                  pickupPoint: apiPkg.pickupPoint || existing.pickupPoint,
                  sender: apiPkg.sender || existing.sender,
                });
              } else {
                var newPkg = Object.assign({}, apiPkg);
                newPkg.id = apiPkg.id;
                localList.unshift(newPkg);
                Storage._write(Storage.KEYS.packages, localList);
              }
            });
            loadPackages();
            renderBanner();
            renderPoints();
          }
        });
      }

      // ---- 待取横幅（原首页逻辑迁入） ----
      function renderBanner() {
        var pending = Storage.getPackages().filter(function (p) { return p.status === 'pending'; });
        document.getElementById('pendingCount').textContent = pending.length;
        var urgent = pending.filter(function (p) {
          if (!p.expiresIn) return false;
          var m = p.expiresIn.match(/(\d+)/);
          return m && parseInt(m[1]) <= 24;
        });
        var hint = document.getElementById('pendingHint');
        if (urgent.length > 0) {
          hint.textContent = '其中 ' + urgent.length + ' 件将在 24 小时内到期';
        } else if (pending.length > 0) {
          hint.textContent = '暂无紧急待取件，可安排时间取件';
        } else {
          hint.textContent = '当前没有待取快递，放松一下吧';
        }
      }

      // 横幅 CTA：切到「待取」筛选
      document.getElementById('heroCta').addEventListener('click', function () {
        App.state.filter = 'pending';
        document.querySelectorAll('.chip[data-filter]').forEach(function (c) {
          c.classList.toggle('active', c.dataset.filter === 'pending');
        });
        loadPackages();
        listEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      // ---- 常用取件点（极简：只保留名称 + 距离；有待取才显示数字） ----
      function renderPoints() {
        var points = Storage.getPickupPoints().slice(0, 3);
        var html = '';
        points.forEach(function (pp, i) {
          var typeLabel = pp.type === 'station' ? '驿站' : '快递柜';
          html += '<a href="map.html" class="card card--clickable anim-fade-in-up stagger-' + (i + 1) + '" style="min-width:160px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;">' +
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">' +
              '<span style="font-size:14px;font-weight:600;line-height:1.4;">' + pp.name + '</span>' +
              '<span class="badge" style="background:var(--color-surface-alt);color:var(--color-text-sub);flex-shrink:0;">' + typeLabel + '</span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-hint);">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
              '<span>' + pp.distance + ' · ' + pp.walkTime + '</span>' +
              (pp.pendingCount > 0 ? '<span style="margin-left:auto;font-size:12px;color:var(--color-primary);font-weight:700;">' + pp.pendingCount + ' 件待取</span>' : '') +
            '</div>' +
          '</a>';
        });
        document.getElementById('pointsList').innerHTML = html;
      }

      // 未读消息红点
      function renderBadge() {
        var badge = document.getElementById('msgBadge');
        if (badge) badge.style.display = Storage.getUnreadCount() > 0 ? 'block' : 'none';
      }

      // 渲染筛选 chips
      function renderChips() {
        var html = '';
        DB.packageTypes.forEach(function (t) {
          var active = App.state.filter === t.key ? ' active' : '';
          html += '<button class="chip' + active + '" data-filter="' + t.key + '">' + t.label + '</button>';
        });
        document.getElementById('filterChips').innerHTML = html;
        document.querySelectorAll('.chip[data-filter]').forEach(function (chip) {
          chip.addEventListener('click', function () {
            App.state.filter = this.dataset.filter;
            document.querySelectorAll('.chip[data-filter]').forEach(function (c) { c.classList.remove('active'); });
            this.classList.add('active');
            loadPackages();
          });
        });
      }

      // 极简卡片：公司/状态 + 取件点 +（待取）取件码与一键取件；单号等次级信息收进详情页
      function renderPkgCard(pkg, index) {
        var stagger = index < 6 ? ' stagger-' + (index + 1) : '';
        var html = '<div class="pkg-card card--clickable anim-fade-in-up' + stagger + '" onclick="location.href=\'detail.html?id=' + pkg.id + '\'">' +
          '<div class="pkg-card-header">' +
            '<div class="pkg-company">' + App.pkgLogo(pkg) + '<span class="pkg-company-name">' + pkg.company + '</span></div>' +
            '<span class="status-badge ' + App.statusClass(pkg.status) + '">' + App.statusLabel(pkg.status) + '</span>' +
          '</div>' +
          '<div class="pk-point">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
            '<span class="truncate">' + pkg.pickupPoint + '</span>' +
          '</div>';
        if (pkg.status === 'pending' && pkg.pickupCode) {
          html += '<div class="pk-code-row"><span class="lab">取件码</span><span class="code">' + pkg.pickupCode + '</span></div>' +
            '<button type="button" class="pk-quick-btn" onclick="event.stopPropagation();window.quickPickup(\'' + pkg.id + '\')">一键取件</button>';
        }
        if (pkg.status === 'incoming' && pkg.estimatedTime) {
          html += '<div class="pk-eta">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
            '<span>' + pkg.estimatedTime + '</span></div>';
        }
        if (pkg.status === 'pending' && pkg.expiresIn) {
          var hrs = parseInt((pkg.expiresIn.match(/(\d+)/) || [0, 999])[1], 10);
          var urgent = hrs <= 24;
          html += '<div class="pk-eta' + (urgent ? ' warn' : '') + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
            '<span>' + (urgent ? '临期提醒 · 剩余 ' : '剩余 ') + pkg.expiresIn + '</span></div>';
        }
        html += '</div>';
        return html;
      }

      // 3 步内完成取件：看码 → 一键取件 → 完成反馈
      window.quickPickup = function (id) {
        API.confirmPickup(id).then(function (res) {
          if (res.code === 0) {
            App.toastSuccess('取件成功，已记入取件记录');
            loadPackages();
            renderBanner();
            renderPoints();
          } else {
            App.toast(res.message || '取件失败，请稍后再试');
          }
        }).catch(function () { App.toast('取件失败，请稍后再试'); });
      };

      // —— 手动录入快递：完整字段表单（只产生本地记录，不调任何第三方查件）——
      var COMPANIES = ['顺丰速运', '圆通速递', '中通快递', '韵达快递', '申通快递', '京东快递', '邮政EMS', '极兔速递', '菜鸟裹裹', '丹鸟快递'];

      function escAttr(s) {
        return String(s == null ? '' : s).replace(/"/g, '&quot;');
      }

      window.openImportPackage = function () {
        var pointNames = Storage.getPickupPoints().map(function (p) { return p.name; });
        var companyOpts = COMPANIES.map(function (c) { return '<option value="' + escAttr(c) + '">'; }).join('');
        var pointOpts = pointNames.map(function (n) { return '<option value="' + escAttr(n) + '">'; }).join('');
        var backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML =
          '<div class="modal">' +
            '<div class="modal-title">手动录入快递</div>' +
            '<div class="modal-desc">填写面单信息，记录只保存在本机；取件码必填，其余可留空</div>' +
            '<div class="imp-form">' +
              '<div class="imp-field">' +
                '<label>快递公司</label>' +
                '<input id="impCompany" type="text" list="impCompanyList" maxlength="12" placeholder="如：顺丰速运 / 圆通速递">' +
                '<datalist id="impCompanyList">' + companyOpts + '</datalist>' +
              '</div>' +
              '<div class="imp-field">' +
                '<label>快递单号</label>' +
                '<input id="impTracking" type="text" maxlength="30" autocomplete="off" placeholder="面单上的运单号（选填）">' +
              '</div>' +
              '<div class="imp-field">' +
                '<label>取件码<span class="req">*</span></label>' +
                '<input id="impCode" class="code-input" type="text" maxlength="24" autocomplete="off" placeholder="如 8-3-267 / A12-99">' +
              '</div>' +
              '<div class="imp-field">' +
                '<label>取件点</label>' +
                '<input id="impPoint" type="text" list="impPointList" maxlength="20" placeholder="如：菜鸟驿站（楷苑）">' +
                '<datalist id="impPointList">' + pointOpts + '</datalist>' +
              '</div>' +
              '<div class="imp-field">' +
                '<label>寄件人 / 备注</label>' +
                '<input id="impSender" type="text" maxlength="12" placeholder="如：妈妈 / 拼多多（选填）">' +
              '</div>' +
              '<div class="imp-err" id="impErr"></div>' +
            '</div>' +
            '<div class="modal-actions imp-actions">' +
              '<button class="btn btn-outline" id="impCancel">取消</button>' +
              '<button class="btn btn-primary" id="impOk">添加</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('show'); });
        function close() {
          backdrop.classList.remove('show');
          setTimeout(function () { backdrop.remove(); }, 250);
        }
        function showErr(msg) {
          var err = backdrop.querySelector('#impErr');
          err.textContent = msg;
          err.style.display = 'block';
        }
        backdrop.querySelector('#impCancel').addEventListener('click', close);
        backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
        function submit() {
          var code = (backdrop.querySelector('#impCode').value || '').trim().toUpperCase().replace(/\s+/g, '');
          if (!code) { showErr('请填写取件码'); return; }
          if (!/^[A-Z0-9\-#]{3,24}$/.test(code)) { showErr('取件码格式不对，支持数字、字母、短横线（3-24 位）'); return; }
          var payload = {
            source: 'manual',
            pickupCode: code,
            company: (backdrop.querySelector('#impCompany').value || '').trim(),
            trackingNo: (backdrop.querySelector('#impTracking').value || '').trim().toUpperCase(),
            pickupPoint: (backdrop.querySelector('#impPoint').value || '').trim(),
            sender: (backdrop.querySelector('#impSender').value || '').trim(),
          };
          var r = Storage.addLocalPackage(payload);
          if (r && r.success) {
            close();
            App.toastSuccess('已添加 ' + (payload.company || '快递') + ' · ' + code);
            loadPackages();
            renderBanner();
            renderPoints();
            renderBadge();
          } else {
            showErr((r && r.message) || '添加失败，请稍后重试');
          }
        }
        backdrop.querySelector('#impOk').addEventListener('click', submit);
        setTimeout(function () {
          var i = backdrop.querySelector('#impCompany');
          if (i) i.focus();
        }, 300);
      };

      // —— 全部快递清零：包裹列表 + 取件记录 + 快递类消息，demo 数据不再复活 ——
      window.openClearAllPackages = function () {
        var count = Storage.getPackages().length + Storage.getRecords().length;
        App.showModal({
          title: '全部快递清零',
          icon: 'warning',
          desc: count
            ? '将清空 <b>' + count + '</b> 条快递数据：全部包裹、取件记录和快递通知都会归零，且演示数据不会再恢复。清空后只能通过「手动录入」新增。此操作不可撤销。'
            : '当前没有快递数据。清零后演示数据不会再恢复，列表只保留你手动录入的记录。',
          confirmText: '确认清零',
          cancelText: '再想想',
          onConfirm: function () {
            Storage.clearAllPackages();
            loadPackages();
            renderBanner();
            renderPoints();
            renderBadge();
            App.toastSuccess('快递数据已全部清零');
          },
        });
      };

      function loadPackages() {
        if (isLoading) return;
        isLoading = true;
        listEl.innerHTML = App.skeletonList(4);

        API.fetchPackages({ status: App.state.filter, keyword: App.state.keyword }).then(function (res) {
          isLoading = false;
          if (!res.data || res.data.length === 0) {
            listEl.innerHTML = App.emptyState('暂无快递', '没有符合条件的快递记录');
            return;
          }
          // 大列表分片渲染（>50 条分帧追加，避免长任务与滚动掉帧）
          App.renderChunked(listEl, res.data, renderPkgCard);
        }).catch(function () {
          isLoading = false;
          listEl.innerHTML = App.errorState('加载失败', '请检查网络后重试', 'loadPackages');
        });
      }
      // 搜索
      searchInput.addEventListener('input', function () {
        App.state.keyword = this.value.trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          loadPackages();
        }, 300);
      });

      // 下拉刷新
      function refresh() {
        App.state.keyword = searchInput.value.trim();
        loadPackages();
        renderBanner();
        renderPoints();
        renderBadge();
        App.toastSuccess('已刷新');
        return Promise.resolve();
      }

      // 支持 ?filter=xxx 深链（如个人主页"运输中"入口）
      var urlFilter = new URLSearchParams(location.search).get('filter');
      if (urlFilter && DB.packageTypes.some(function (t) { return t.key === urlFilter; })) {
        App.state.filter = urlFilter;
      }

      renderChips();
      loadPackages();
      renderBanner();
      renderPoints();
      renderBadge();
      document.getElementById('clearAllBtn').addEventListener('click', function () { openClearAllPackages(); });
      App.initPullToRefresh(mainContent, refresh);
    })();
  </script>
</body>
</html>
