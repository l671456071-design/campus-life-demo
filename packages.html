<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>全部快递 - 校园取件</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
</head>
<body data-page="packages">
  <div class="app-shell">
    <header class="app-header header--left">
      <div class="header-title">全部快递</div>
      <div class="header-spacer"></div>
      <div class="header-right">
        <a href="messages.html" class="header-back-btn" style="position:relative;margin-right:6px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-dot" id="msgBadge" style="position:absolute;top:6px;right:6px;background:var(--color-danger);width:8px;height:8px;display:none;"></span>
        </a>
        <a href="scan.html" class="header-back-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </a>
      </div>
    </header>
    <main class="app-content" id="mainContent">
      <div class="px-4" style="padding-top:12px;">
        <!-- 待取快递横幅（原首页区块迁入） -->
        <div class="hero-card anim-fade-in-up">
          <div class="hero-card-main">
            <div class="hero-card-row">
              <span class="hero-card-num" id="pendingCount">0</span>
              <span class="hero-card-unit">件待取</span>
            </div>
            <p class="hero-card-sub" id="pendingHint">暂无待取快递</p>
            <a href="javascript:void(0)" class="hero-card-cta" id="heroCta">
              查看待取
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
          <svg class="hero-card-deco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>

        <!-- 快捷操作网格（原首页「校园取件」功能迁入） -->
        <div class="quick-grid">
          <a href="scan.html" class="quick-action quick-action--primary anim-fade-in-up stagger-1">
            <div class="quick-action-icon quick-action-icon--primary">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
            </div>
            <span class="quick-action-label quick-action-label--primary">扫码取件</span>
          </a>
          <a href="scan.html" class="quick-action anim-fade-in-up stagger-2">
            <div class="quick-action-icon" style="background:#DCFCE7;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <span class="quick-action-label">本地导入</span>
          </a>
          <a href="track.html" class="quick-action anim-fade-in-up stagger-3">
            <div class="quick-action-icon" style="background:#FFEDD5;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            <span class="quick-action-label">查快递</span>
          </a>
          <a href="records.html" class="quick-action anim-fade-in-up stagger-4">
            <div class="quick-action-icon" style="background:#EDE9FE;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <span class="quick-action-label">取件记录</span>
          </a>
        </div>

        <!-- 常用取件点（原首页区块迁入） -->
        <div style="margin-top:20px;" class="anim-fade-in-up stagger-3">
          <div class="section-header">
            <span class="section-title">常用取件点</span>
            <a href="map.html" class="section-link">查看地图
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
          <div id="pointsList" style="display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;"></div>
        </div>

        <!-- 全部快递 -->
        <div style="margin-top:20px;" class="anim-fade-in-up stagger-4">
          <div class="section-header">
            <span class="section-title">全部快递</span>
          </div>
          <!-- 搜索栏 -->
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="搜索快递公司/单号/取件点">
          </div>

          <!-- 筛选 chips -->
          <div class="filter-chips" id="filterChips" style="margin-top:12px;"></div>
        </div>

        <!-- 快递列表 -->
        <div id="pkgList" style="margin-top:14px;display:flex;flex-direction:column;gap:12px;"></div>
      </div>
    </main>
    <!-- 固定 tab bar —— 以下代码完全不可修改 -->
    <nav class="tab-bar">
      <a href="index.html" class="tab-item" data-nav="home">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1m-6 0h6"/></svg>
        <span class="tab-label">首页</span>
      </a>
      <a href="packages.html" class="tab-item" data-nav="packages">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span class="tab-label">快递</span>
      </a>
      <a href="scan.html" class="tab-item tab-item--center" data-nav="scan">
        <div class="tab-scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </div>
        <span class="tab-label">扫码</span>
      </a>
      <a href="food.html" class="tab-item" data-nav="food">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        <span class="tab-label">外卖</span>
      </a>
      <a href="profile.html" class="tab-item" data-nav="profile">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>
  <script src="config.js"></script>
  <script src="campus-data.js"></script>
  <script src="mock.js"></script>
  <script src="demo-data.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var mainContent = document.getElementById('mainContent');
      var listEl = document.getElementById('pkgList');
      var searchInput = document.getElementById('searchInput');
      var searchTimer = null;
      var isLoading = false;

      // 登录检查 + 从 API 加载真实快递数据
      if (ApiClient.isLoggedIn()) {
        ApiClient.getPackages().then(function (res) {
          if (res.code === 0 && res.data && res.data.length > 0) {
            var localList = Storage.getPackages();
            res.data.forEach(function (apiPkg) {
              var existing = localList.find(function (p) { return p.trackingNo === apiPkg.trackingNo; });
              if (existing) {
                Storage.updatePackage(existing.id, {
                  status: apiPkg.status,
                  company: apiPkg.company || existing.company,
                  pickupCode: apiPkg.pickupCode || existing.pickupCode,
                  pickupPoint: apiPkg.pickupPoint || existing.pickupPoint,
                  sender: apiPkg.sender || existing.sender,
                });
              } else {
                var newPkg = Object.assign({}, apiPkg);
                newPkg.id = apiPkg.id;
                localList.unshift(newPkg);
                Storage._write(Storage.KEYS.packages, localList);
              }
            });
            loadPackages();
            renderBanner();
            renderPoints();
          }
        });
      }

      // ---- 待取横幅（原首页逻辑迁入） ----
      function renderBanner() {
        var pending = Storage.getPackages().filter(function (p) { return p.status === 'pending'; });
        document.getElementById('pendingCount').textContent = pending.length;
        var urgent = pending.filter(function (p) {
          if (!p.expiresIn) return false;
          var m = p.expiresIn.match(/(\d+)/);
          return m && parseInt(m[1]) <= 24;
        });
        var hint = document.getElementById('pendingHint');
        if (urgent.length > 0) {
          hint.textContent = '其中 ' + urgent.length + ' 件将在 24 小时内到期';
        } else if (pending.length > 0) {
          hint.textContent = '暂无紧急待取件，可安排时间取件';
        } else {
          hint.textContent = '当前没有待取快递，放松一下吧';
        }
      }

      // 横幅 CTA：切到「待取」筛选
      document.getElementById('heroCta').addEventListener('click', function () {
        App.state.filter = 'pending';
        document.querySelectorAll('.chip[data-filter]').forEach(function (c) {
          c.classList.toggle('active', c.dataset.filter === 'pending');
        });
        loadPackages();
        listEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      // ---- 常用取件点（原首页逻辑迁入） ----
      function renderPoints() {
        var points = Storage.getPickupPoints().slice(0, 3);
        var html = '';
        points.forEach(function (pp, i) {
          var typeLabel = pp.type === 'station' ? '驿站' : '快递柜';
          var typeColor = pp.type === 'station' ? 'var(--color-primary)' : 'var(--color-accent)';
          var typeBg = pp.type === 'station' ? 'var(--color-primary-light)' : 'var(--color-accent-light)';
          html += '<a href="map.html" class="card card--clickable anim-fade-in-up stagger-' + (i + 1) + '" style="min-width:160px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;">' +
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">' +
              '<span style="font-size:14px;font-weight:600;line-height:1.4;">' + pp.name + '</span>' +
              '<span class="badge" style="background:' + typeBg + ';color:' + typeColor + ';flex-shrink:0;">' + typeLabel + '</span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-sub);">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
              '<span>' + pp.distance + ' · ' + pp.walkTime + '</span>' +
            '</div>';
          if (pp.pendingCount > 0) {
            html += '<div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--color-warning);font-weight:600;">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>' +
              '<span>' + pp.pendingCount + ' 件待取</span>' +
            '</div>';
          } else {
            html += '<div style="font-size:12px;color:var(--color-text-hint);">暂无待取件</div>';
          }
          html += '</a>';
        });
        document.getElementById('pointsList').innerHTML = html;
      }

      // 未读消息红点
      function renderBadge() {
        var badge = document.getElementById('msgBadge');
        if (badge) badge.style.display = Storage.getUnreadCount() > 0 ? 'block' : 'none';
      }

      // 渲染筛选 chips
      function renderChips() {
        var html = '';
        DB.packageTypes.forEach(function (t) {
          var active = App.state.filter === t.key ? ' active' : '';
          html += '<button class="chip' + active + '" data-filter="' + t.key + '">' + t.label + '</button>';
        });
        document.getElementById('filterChips').innerHTML = html;
        document.querySelectorAll('.chip[data-filter]').forEach(function (chip) {
          chip.addEventListener('click', function () {
            App.state.filter = this.dataset.filter;
            document.querySelectorAll('.chip[data-filter]').forEach(function (c) { c.classList.remove('active'); });
            this.classList.add('active');
            loadPackages();
          });
        });
      }

      function renderPkgCard(pkg, index) {
        var stagger = index < 6 ? ' stagger-' + (index + 1) : '';
        var html = '<div class="pkg-card card--clickable anim-fade-in-up' + stagger + '" onclick="location.href=\'detail.html?id=' + pkg.id + '\'">' +
          '<div class="pkg-card-header">' +
            '<div class="pkg-company">' + App.pkgLogo(pkg) + '<span class="pkg-company-name">' + pkg.company + '</span>' + App.platformBadge(pkg.sender) + '</div>' +
            '<span class="status-badge ' + App.statusClass(pkg.status) + '">' + App.statusLabel(pkg.status) + '</span>' +
          '</div>' +
          '<div class="pkg-info">' +
            '<div class="pkg-info-item"><span class="pkg-info-label">物流单号</span><span class="pkg-info-value truncate" style="max-width:130px;">' + pkg.trackingNo + '</span></div>' +
            '<div class="pkg-info-item"><span class="pkg-info-label">取件点</span><span class="pkg-info-value truncate" style="max-width:120px;">' + pkg.pickupPoint + '</span></div>' +
          '</div>';
        if (pkg.pickupCode) {
          html += '<div style="margin-top:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-primary-lighter);border-radius:var(--radius-sm);">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
            '<span style="font-size:12px;color:var(--color-text-sub);">取件码</span>' +
            '<span style="font-size:14px;font-weight:700;color:var(--color-primary);font-family:var(--font-mono);margin-left:auto;">' + pkg.pickupCode + '</span>' +
          '</div>';
        }
        if (pkg.status === 'incoming' && pkg.estimatedTime) {
          html += '<div style="margin-top:10px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-primary);">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
            '<span>' + pkg.estimatedTime + '</span>' +
          '</div>';
        }
        if (pkg.status === 'pending' && pkg.expiresIn) {
          html += '<div style="margin-top:10px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-warning);">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
            '<span>剩余 ' + pkg.expiresIn + '</span>' +
          '</div>';
        }
        html += '</div>';
        return html;
      }

      function loadPackages() {
        if (isLoading) return;
        isLoading = true;
        listEl.innerHTML = App.skeletonList(4);

        API.fetchPackages({ status: App.state.filter, keyword: App.state.keyword }).then(function (res) {
          isLoading = false;
          if (!res.data || res.data.length === 0) {
            listEl.innerHTML = App.emptyState('暂无快递', '没有符合条件的快递记录');
            return;
          }
          // 大列表分片渲染（>50 条分帧追加，避免长任务与滚动掉帧）
          App.renderChunked(listEl, res.data, renderPkgCard);
        }).catch(function () {
          isLoading = false;
          listEl.innerHTML = App.errorState('加载失败', '请检查网络后重试', 'loadPackages');
        });
      }
      // 搜索
      searchInput.addEventListener('input', function () {
        App.state.keyword = this.value.trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          loadPackages();
        }, 300);
      });

      // 下拉刷新
      function refresh() {
        App.state.keyword = searchInput.value.trim();
        loadPackages();
        renderBanner();
        renderPoints();
        renderBadge();
        App.toastSuccess('已刷新');
        return Promise.resolve();
      }

      renderChips();
      loadPackages();
      renderBanner();
      renderPoints();
      renderBadge();
      App.initPullToRefresh(mainContent, refresh);
    })();
  </script>
</body>
</html>
